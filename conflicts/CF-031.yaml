id: CF-031
rules:
- A11Y-001
against: KRDS 긴급 공지(아이콘에 대체 텍스트를 제공하지 않는다)
summary: KRDS 긴급 공지는 아이콘에 대체 텍스트를 넣지 말라고 하는데 A11Y-001은 비텍스트 콘텐츠에 대체 텍스트를 요구한다.
principle: 1
decision: 같은 정보를 바로 옆 텍스트가 전하면 아이콘은 장식으로 보고, <img>는 alt="", 인라인 SVG와 아이콘 글꼴 요소는 aria-hidden="true"로 처리한다. 아이콘만 정보를
  전하면 대체 텍스트를 제공한다.
reason: WCAG 1.1.1의 장식 예외와 KRDS 요구가 같은 상황을 말한다. 중복 낭독을 막는다(원칙 1).
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'A11Y-001: 예외 추가'
- 'A11Y-001: 예외·측정 기준 (3)의 장식 처리 방법을 요소별로 분리(<img> alt="", 인라인 SVG·아이콘 글꼴 aria-hidden="true") (2026-10-18 독립 검토)'
- 'A11Y-001: 측정 기준 (3) 장식 SVG·아이콘 글꼴의 aria-hidden 을 ''요소 자신 또는 조상''으로 (2026-10-18 재검증)'
