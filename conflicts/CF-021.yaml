id: CF-021
rules:
- A11Y-009
against: KWCAG 2.2 5.4.2(자동 재생 금지)
summary: 'WCAG 1.4.2는 3초를 넘는 자동 재생 오디오에 제어 수단을 요구한다. KWCAG 5.4.2도 ''3초 미만의 소리는 허용''하고 3초 이상이면 멈춤·일시정지·음량 조절 수단을
  요구하며, 자동 재생음은 3초 내에 멈추거나 지정 키(예: Esc)로 멈추게 하라고 한다.'
principle: 1
decision: '두 기준을 합친다: 자동 재생하는 소리는 (1) 3초 안에 끝나거나, (2) 3초 이상 이어지면 시스템 음량과 별개인 멈춤·일시정지·음량 조절 수단과 지정 키(Esc) 멈춤을 함께
  제공한다.'
reason: '두 기준은 같은 구조다(이전 기록의 ''KWCAG는 자동 재생 자체를 금지''는 원문과 달라 2026-10-18 독립 검토에서 고침). (2)에서 지정 키(Esc) 멈춤을 필수로 둔 것은
  원문보다 엄격한 체계 선택이다 — KWCAG 5.4.2 해설의 ''자동으로 재생되는 소리는 3초 내에 멈추거나, 지정된 키(예: esc키)를 누르면 재생을 멈추도록 구현한다''에서 지정 키는 3초
  내 멈춤의 대안이지만, 이 체계는 3초 이상 이어지는 소리에 제어 수단과 지정 키를 함께 요구해 화면낭독 사용자가 컨트롤을 찾지 않고 바로 멈출 수 있게 한다(원칙 1, 2026-10-18 재검증).'
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'A11Y-009: statement 수정'
- 'A11Y-009: statement·측정 기준을 원문 구조로 수정(2026-10-18 독립 검토)'
- 'A11Y-009: statement·측정 기준을 ''(1) 3초 안에 끝남 또는 (2) 시스템 음량과 별개인 제어 수단 + Esc 멈춤'' 구조로, 예시 추가 (2026-10-18 재검증)'
