id: CF-039
rules:
- FORM-052
- FORM-053
against: KRDS 텍스트 영역 페이지 내부 불일치(남은 글자 수 / 입력한 글자 수 / 예시 '0/100')
summary: 글자 수 표시 방식이 같은 페이지 안에서 다르다.
principle: 3
decision: '''현재 글자 수/최대 글자 수''(예: 37/100) 형식으로 통일한다. 판정은 화면에 보이는 텍스트만 본다 — 시각적으로 숨긴 보조기술용 문맥 텍스트(예: ''입력한 글자 수'',
  ''최대'')는 함께 넣을 수 있다.'
reason: 'KRDS 텍스트 영역 페이지 안에서 표시 대상이 갈린다: 구조 설명 4 ''입력된 글자 수: 입력 가능한 글자 수와 입력된 글자 수를 안내하는 텍스트''(PDF 677쪽)와 예시 화면
  ''0/100'', KRDS 키트(textarea-count: count-now/count-total)는 현재/최대이고, 사용성 가이드라인 05 ''최대 글자 수와 남은 입력 가능 글자 수 정보를
  제공한다''(683쪽)만 남은 글자 수다. CF-047(규범 문장이 예시 코드보다 우선)과 다르게 판단한 이유: 여기서는 가이드라인 본문 문장(구조 설명과 사용성 05)끼리 갈리고, 예시 화면·키트·컴포넌트
  규격(components/text-area.yaml)이 모두 현재/최대를 쓴다. 현재/최대 표시는 05가 요구한 최대 글자 수를 보여 주고 남은 글자 수는 두 숫자의 차로 알 수 있어 05의 목적(제출
  전 입력 제약 예측)을 해치지 않는다. 서비스 전체에서 한 방식만 쓴다(원칙 3). 2026-10-18 독립 검토: CF-047과의 판단 차이를 기록하고 측정을 화면에 보이는 숫자로 한정.'
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'FORM-052: statement 수정'
- 'FORM-053: statement 수정(현재/최대 표시 갱신)'
- 'FORM-052: 측정 기준을 화면에 보이는 텍스트만 검사하도록(보조기술용 숨긴 문맥 텍스트 허용) 수정, rationale을 CF-039 선택 이유로 수정 (2026-10-18 독립 검토)'
- 'FORM-053: rationale을 CF-039 형식에 맞게 수정 (2026-10-18 독립 검토)'
