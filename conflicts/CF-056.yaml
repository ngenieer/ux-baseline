id: CF-056
rules:
- COLOR-009
against: KRDS 선명한 화면 모드 대비 표(아이콘·시각 보조 4.5:1) vs KRDS 타이포그래피·색상 페이지(아이콘 7:1, 매직넘버 70)
summary: KRDS 가이드라인 안에서 선명한 화면 모드의 아이콘 대비 기준이 페이지마다 4.5:1과 7:1로 다르다(사이트·PDF 2025.08 모두).
principle: 3
decision: '선명한 화면 모드의 의미 있는 아이콘은 7:1 이상으로 한다. 같은 아이콘의 선 두께를 기본 모드보다 굵게 바꾼 경우에는 4.5:1 이상을 허용한다(KRDS 색상 ''아이콘 색상 —
  선명한 화면 모드: 매직넘버 50 (두께 변화)'', PDF 94쪽). 시각 보조 요소는 4.5:1 이상.'
reason: 'WCAG 요구가 아니다 — WCAG 2.2 AA는 아이콘(비텍스트)에 3:1(1.4.11)만 요구하고, 선명한 화면 모드 기준은 KRDS 내부 기준이다. KRDS 안의 세 서술 — 타이포그래피
  ''헤딩, 레이블 등의 텍스트와 아이콘: 7:1''(PDF 123쪽), 선명한 화면 모드 대비 표 ''아이콘, 시각 보조 4.5:1 이상'', 색상 ''아이콘 색상 선명한 화면 모드: 매직넘버 70
  / 매직넘버 50 (두께 변화)''(PDF 94쪽) — 을 함께 설명하도록 기본 7:1, 선 두께를 늘린 아이콘 4.5:1로 정한다. KRDS 내부 기준 선택이라 원칙 3(일관성). 2026-10-18
  독립 검토: 원칙 1→3 정정, 두께 변화 조건 추가.'
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'COLOR-009: 변경 없음, 확인 필요 해제'
- 'COLOR-009: statement·측정 기준에 ''선 두께를 기본 모드보다 굵게 바꾼 아이콘은 4.5:1 이상'' 추가(완화), 출처에 KRDS 색상 PDF 94쪽 추가 (2026-10-18
  독립 검토)'
