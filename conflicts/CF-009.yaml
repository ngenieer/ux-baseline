id: CF-009
rules:
- FORM-029
- FORM-030
- FORM-036
- FORM-039
summary: '단일 선택 컨트롤 선택 기준이 겹친다: 비교 필요 시 라디오(FORM-029), 영역 부족·모바일 웹은 셀렉트(FORM-039), 7개 초과·익숙한 목록은 셀렉트(FORM-030),
  셀렉트는 7~20개(FORM-036). 정확히 7개일 때 경계가 다르고 적용 순서가 없다.'
principle: 3
decision: '판단 순서를 고정한다: ① 옵션을 서로 비교해야 하거나 선택 속도가 중요하면 라디오(FORM-029) ② 옵션 목록을 펼칠 영역이 부족하거나 모바일 웹 이용 비중이 크면 네이티브 select(FORM-039)
  ③ 옵션이 7개 이상이고 사용자가 익숙한 목록이면 셀렉트(FORM-030·FORM-036), 단 옵션이 20개를 넘으면 콤보 상자를 쓰거나 셀렉트를 여러 개로 나눈다 ④ 그 밖(옵션 6개 이하, 또는
  익숙하지 않은 목록)은 라디오. 경계 7개는 셀렉트로 통일한다.'
reason: '같은 입력에 서로 다른 컨트롤이 나오지 않도록 판단 순서와 경계를 하나로 정한다(원칙 3). 순서 근거: KRDS 라디오·셀렉트 페이지가 비교·효율이 중요하면 라디오가 적합하다고 하고(FORM-029),
  셀렉트 페이지는 영역 부족·모바일 웹을 셀렉트에 적합한 경우로, 라디오 페이지는 모바일 플랫폼에서 셀렉트나 콤보박스를 우선 고려하라고 한다(FORM-039). 셀렉트 페이지는 옵션 20개 초과 시
  콤보박스를 쓰거나 여러 셀렉트로 분할하라고 한다. 경계: 라디오 페이지는 ''7개를 초과'', 셀렉트 페이지는 ''7개 이상''이라 원문 두 페이지가 1개 차이 난다 — 셀렉트 페이지 기준 7개로
  통일하는 것은 체계 선택이다. ④의 ''6개 이하는 라디오''는 KRDS 수치가 아니라 셀렉트 하한(7개)의 나머지를 라디오로 둔 체계 선택이다.'
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'FORM-030: statement 수정'
- 'CF-009: 판단 순서에 FORM-039(영역 부족·모바일 웹)와 20개 초과 시 셀렉트 분할 추가, FORM-039를 rules에 추가. FORM-029·030·036 관계 note 갱신 (2026-10-18
  독립 검토)'
