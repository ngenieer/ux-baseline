id: CF-025
rules:
- AI-001
- AI-002
- AI-004
against: 한국 AI 기본법 시행령 제23조(약관 기재·기계 판독 표시 등 다른 고지·표시 방법도 허용)
summary: 법은 고지·표시 방법으로 약관 기재와 기계 판독 표시도 허용하는데, 룰은 화면 표시를 요구한다.
principle: 1
decision: MUST를 유지한다. 화면 표시는 한국 시행령 제23조가 허용하는 '사람이 인식할 수 있는 방법'이고, EU AI Act 제50조 제5항(제1~4항 정보를 '분명하고 구별되는 방식으로'
  최초 상호작용·노출 시 제공)도 충족하며, UI에서 검증할 수 있다. EU 제50조 제2항의 기계 판독 표시는 제공자의 별도 의무로 이 룰과 따로 다룬다(AI-003).
reason: 여러 관할의 의무를 한 번에 충족하고 자동 검사가 가능한 방법을 고른다(원칙 1). 이전 기록의 '제50조 (1)·(4)의 분명하고 구별되는' 인용은 조항 번호가 틀려(제5항) 2026-10-18
  독립 검토에서 고쳤다.
deviates_from_priority: false
date: '2026-10-18'
