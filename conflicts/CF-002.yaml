id: CF-002
rules:
- A11Y-024
- NAV-012
- NAV-013
summary: KRDS는 도움말 속 리소스 링크를 새 탭으로 열라고 하고(NAV-013), KWCAG 7.2.1은 사용자가 의도하지 않은 새 창을 금지한다.
principle: 1
decision: 새 탭으로 열되, NAV-012에 따라 새 탭이 열린다는 사실을 링크에 텍스트(스크린 리더용 포함)로 미리 알린다. 미리 알린 새 탭은 사용자가 의도한 동작으로 본다.
reason: 접근성 기준이 금지하는 것은 '예고 없는' 새 창이다. 예고를 붙이면 상위 원칙(1)을 지키면서 KRDS의 과업 유지 목적(2)도 지킨다. NAV-012 자체는 SHOULD지만, NAV-013이
  새 탭으로 여는 링크에서는 예고가 KWCAG 7.2.1을 지키는 수단이므로 필수다. 예고를 붙일 수 없으면 새 탭 대신 같은 탭으로 연다.
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'NAV-013: statement 수정'
- 'NAV-013: statement·측정 기준 — 새 탭으로 열 때 NAV-012 예고 필수, 예고할 수 없으면 같은 탭 (2026-10-18 독립 검토)'
- 'NAV-013: 측정 기준에 NAV-012 (3)(서비스 전체 같은 아이콘·문구) 포함, 예시 숨긴 텍스트를 ''(새 창 열림)''으로 통일 (2026-10-18 재검증)'
