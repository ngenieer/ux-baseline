id: CF-028
rules:
- FORM-011
against: KRDS 모달 컴포넌트(모달 안 탭·아코디언·입력폼 지양)
summary: FORM-011은 모달 입력을 5개 이하로 허용하고, KRDS 모달 페이지는 모달 안 복잡한 구성 자체를 피하라고 한다.
principle: 2
decision: 'FORM-011을 SHOULD로 올리고 두 조건을 한 룰로 함께 적용한다: 모달 안 입력은 5개 이하로 두고, 모달 안에 탭·아코디언·다단계 절차를 넣지 않는다. 룰을 나누지 않는다.'
reason: '짧은 입력은 모달로 끝낼 수 있게 하되 복잡도는 막는다(원칙 2). 강도: KRDS 모달 페이지의 ''모달 내부에 … 탭, 아코디언, 입력폼 같은 컴포넌트 … 사용하는 것을 피해야 한다''는
  SHOULD 수준이라 탭·아코디언·다단계 금지는 SHOULD다. 입력 5개 이하 상한의 출처(입력폼 패턴 ''5개 이내로 구성하는 것이 바람직하다'')는 MAY 수준이지만, 모달 페이지는 모달 안
  입력폼 자체를 SHOULD로 피하라고 하므로 5개 상한은 그 SHOULD를 짧은 입력에 한해 완화한 값으로 보고 같은 SHOULD로 묶는다 — 입력폼 패턴 원문보다 엄격한 체계 선택. 측정 기준 (1)(2)
  모두 SHOULD로 판정한다.'
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'FORM-011: statement 수정'
- 'FORM-011: 강도 MAY → SHOULD, tags에 public-sector-must 추가 (2026-10-18 독립 검토)'
- 'FORM-011: 측정 기준 (2)·자동 검사 범위를 ''입력 컴포넌트가 1개 이상 있는 dialog''로(statement 와 맞춤) (2026-10-18 재검증)'
