id: CF-068
rules:
- FORM-003
- FORM-080
- STATE-001
summary: FORM-080 은 제출 전 aria-invalid 없이 aria-describedby 안내만 바꾸는 조건 안내를 허용하는데, (가) 아이디 '중복 확인' 같은 필드 옆 확인 버튼의 부정
  결과가 FORM-003 의 오류(aria-invalid 필요)인지, (나) 입력 중 바뀌는 조건 충족 안내가 STATE-001 의 상태 메시지(live 필요)인지 정해 두지 않았다.
principle: 1
decision: 제출 전 조건 안내(입력 중 조건 충족 여부, 필드 옆 확인 버튼 결과)는 필드의 aria-describedby 가 가리키는 요소의 텍스트로 쓰고, 그 요소 또는 조상에 role="status"(또는
  aria-live="polite")를 둔다. 이 안내에는 aria-invalid 를 두지 않는다 — 부정 결과('이미 사용 중인 아이디입니다')도 이 텍스트로 FORM-003(SC 3.3.1)의 식별·설명을
  충족한다. 제출할 때 그 조건이 여전히 맞지 않으면 FORM-003·FORM-077 대로 오류(aria-invalid, 오류 메시지, 오류 요약)로 다시 표시한다.
reason: SC 3.3.1 은 오류 항목을 식별하고 텍스트로 설명하라고만 하고 aria-invalid 를 요구하지 않으므로, 필드에 연결된 텍스트는 이 요구를 채운다. 반면 SC 4.1.3 은 사용자
  동작의 결과를 알리는 메시지를 초점 이동 없이 전달하라고 하는데, aria-describedby 는 초점을 받을 때만 읽혀 입력 중·버튼을 누른 뒤 바뀐 텍스트가 전달되지 않는다 — live 영역이
  필요하다(원칙 1). aria-invalid 를 제출 때만 두는 것은 FORM-080(제출 시점 검증, GOV.UK)과 맞춰 입력 흐름을 끊지 않기 위해서다(원칙 2). (2026-10-18 시험
  4 T6 독립 검토에서 발견)
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'FORM-003: 측정 기준에 제출 오류(aria-invalid)와 제출 전 확인 결과(role=status 텍스트) 구분 추가, relations 에 FORM-080 conflicts(CF-068)'
- 'FORM-080: statement·측정 기준 (2)에 필드 옆 확인 버튼 결과와 role=status(또는 aria-live=polite) 요건 추가, relations 에 FORM-003·STATE-001
  conflicts(CF-068)'
- 'STATE-001: 측정 기준에 입력 중 조건 충족 안내·확인 버튼 결과가 상태 메시지임을 명시, relations 에 FORM-080 conflicts(CF-068)'
