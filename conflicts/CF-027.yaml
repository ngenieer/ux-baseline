id: CF-027
rules:
- A11Y-024
- A11Y-058
against: KWCAG 2.2 7.2.1(사용자가 의도하지 않은 새 창·팝업 금지)
summary: KWCAG 7.2.1은 초점에 의한 변화(A11Y-024)보다 넓게, 사용자가 의도하지 않은 새 창·팝업 자체를 금지한다.
principle: 1
decision: A11Y-024는 WCAG 3.2.1 범위로 두고, 조작 없는 새 창·팝업 금지를 A11Y-058(MUST)로 신설한다.
reason: 국내 기준의 더 넓은 요구를 별도 룰로 두어 측정 기준을 분리한다(원칙 1).
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'A11Y-058: 측정 기준 확대 — 모든 새 창·팝업은 그 창을 여는 링크·버튼의 활성화 직후에만 열림 (2026-10-18 독립 검토)'
