id: CF-058
rules:
- RESP-010
- A11Y-008
- A11Y-015
summary: KRDS 페이지네이션은 좁은 화면에서 이전·다음 버튼을 숫자 링크 위에 모으라고 하는데(RESP-010), 넓은 화면은 이전·숫자·다음 순서라 한 DOM으로 두 배치를 만들면 어느 한쪽에서
  시각 순서와 Tab 순서가 어긋난다(A11Y-008·015).
principle: 1
decision: DOM 순서(이전 → 숫자 링크 목록 → 다음)를 모든 화면에서 유지한다. 좁은 화면에서는 숫자 링크를 7개 이하로 줄이고(NAV-044), 그래도 넘치면 같은 순서로 세로로 쌓는다.
  CSS order·grid 배치로 이전·다음을 숫자 위로 옮기지 않는다. RESP-010을 이 내용으로 고친다.
reason: 'A11Y-008·015는 MUST(WCAG 1.3.2·2.4.3)이고 RESP-010은 KRDS 사용성 권고(SHOULD)다. A11Y-015 측정 기준 (1)(Tab 순서 = 시각적
  읽기·작업 순서)은 WCAG 2.4.3(''focusable components receive focus in an order that preserves meaning and operability'')보다
  엄격한 체계 기준이다 — 2.4.3은 의미·조작이 보존되면 시각 순서와 다른 초점 순서도 허용한다. Understanding 2.4.3이 ''표현 순서가 프로그램 순서와 다르면 한쪽 표현의 사용자(예:
  시각 사용자인 키보드 사용자)가 이해·조작하기 어려울 수 있다''고 경고하는 내용을 판정 가능한 조건 하나로 고정한 것이고, 화면마다 판단이 갈리지 않게 하려는 일관성(원칙 3) 근거다. 원문보다
  엄격한 체계 선택. KRDS 페이지네이션 접근성 가이드라인 08(PDF 336쪽) ''화면 너비와 시각적 배치에 상관없이 이전 버튼, 숫자 링크 목록, 다음 버튼 … 순서로 제공한다''도 화면 너비와
  관계없이 같은 순서를 요구해 이 결정과 맞는다. 이전·다음을 함께 모으는 이점(엄지 도달)은 숫자 개수 축소로 일부 대신한다(2026-10-18 독립 검토).'
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'RESP-010: statement·측정 기준·예시 수정(DOM 순서 유지)'
- 'RESP-010: method에 세 요소의 x·y 순서를 DOM 순서와 비교하는 절차 추가 (2026-10-18 독립 검토)'
- 'A11Y-015: verification_note에 측정 기준 (1)이 WCAG 2.4.3보다 엄격한 체계 기준임을 기록 (2026-10-18 독립 검토)'
