id: CF-043
rules:
- NAV-012
- A11Y-053
against: KRDS 링크 컴포넌트 페이지(component_05_01) 예시 마크업의 target="_blank" title="새 창 열림"과, 같은 페이지 접근성 가이드라인 02의 링크 목적 보완
  문장 '눈에 보이는 텍스트만으로 목적지에 대한 정보를 충분히 전달하기 어렵다면 툴팁 속성(title)을 보조적인 수단으로 활용할 수 있다'(PDF 507쪽)
summary: KRDS 링크 페이지 예시 마크업은 새 창 링크를 title="새 창 열림"으로만 알리고, 같은 페이지 접근성 가이드라인 02는 링크 목적을 보완하는 보조 수단으로 title을 허용한다(새
  창 안내를 직접 다루는 문장은 아님). title은 키보드·터치 사용자에게 보이지 않고 화면 낭독기마다 읽는 방식이 달라 새 창 안내의 유일한 수단이 될 수 없다.
principle: 1
decision: 새 창 안내는 링크 안의 텍스트(시각적으로 숨긴 텍스트 포함)로 제공하고 title 속성만으로 알리지 않는다.
reason: 모든 사용자에게 확실히 전달되는 방법만 인정한다(원칙 1).
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'NAV-012: statement 수정'
- 변경 없음 — against·summary를 원문(예시 마크업과 링크 목적 보완 문장)에 맞게 정정 (2026-10-18 독립 검토)
- 'NAV-012: 예시 숨긴 텍스트를 이 체계의 단일 방식(아이콘 + 숨긴 텍스트 ''(새 창 열림)'', components/link)으로 통일 (2026-10-18 재검증)'
