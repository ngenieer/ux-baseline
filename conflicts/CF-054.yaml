id: CF-054
rules:
- AI-002
- AI-003
- AI-004
against: 과학기술정보통신부 「인공지능 투명성 확보 가이드라인」(2026-01) 표시 방법
summary: AI-002는 결과물마다 레이블을 요구했고 AI-004는 딥페이크 표시를 매체와 관계없이 전체 시간 동안 요구했는데, 가이드라인 원문은 대화·AI 지원 서비스에 초기 안내나 지속 로고(개별
  결과물 표시 불필요)를 허용하고, 딥페이크 음성은 시작 부분 안내로 충분하다고 쓴다.
principle: 1
decision: 'AI-002: 서비스 화면 안 표시는 결과물 옆 표시·화면에 계속 보이는 로고·문구·첫 이용 전 안내 중 하나 이상(MUST), 딥페이크도 서비스 안에서는 같다. AI-004: 딥페이크를
  다운로드·공유로 반출할 때는 사람이 인식하는 표시만 쓰고, 영상은 AI 생성 재생 구간 전체, 이미지는 이미지 안, 음성은 재생 시작 부분 안내(MUST). AI-003: 반출 딥페이크는 기계 판독
  표시만으로 대신하지 않는다. 예술적·창의적 표현물인 딥페이크는 전시·향유를 저해하지 않는 완화된 방법(시간적으로 주요 콘텐츠와 차이를 두어 표시하거나 비가시적인 표시 방법 적용 등)을 쓸 수 있다(가이드라인
  원문).'
reason: '법·시행령의 세부 방법은 가이드라인이 정한다. 가이드라인보다 엄격한 요구(결과물마다 레이블, 음성 전체 시간 표시)는 근거 없이 구현 부담을 늘리고, 가이드라인보다 느슨하게 쓰면 법 위반이
  된다 — 원문 기준에 맞춘다(원칙 1). 접근 가능한 이름 요구는 A11Y-001과의 정합을 위해 유지한다. 2026-10-18 독립 검토: 매체별 딥페이크 기준은 가이드라인 ''외부 반출 시 표시
  방법'' 절에 있고, 서비스 안 딥페이크는 ''일반 생성물과 동일한 표시 방법''(8쪽)이라 AI-004 범위를 반출로 고치고 AI-003 에 딥페이크 예외를 넣었다.'
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'AI-002: statement·측정 기준·예시 수정(표시 방법 3종 중 하나 이상)'
- 'AI-004: statement·측정 기준 수정(매체별 표시 방법), 음성 예시 추가'
- 'AI-004: 범위를 반출로, AI-003: 딥페이크 예외 추가, AI-002: 서비스 안 딥페이크 명시(2026-10-18 독립 검토)'
- 'AI-004: verification_note에 가이드라인 9쪽 ''인물의 특성 합성, 딥페이크 등 … 위험성을 고려한 추가적인 조치 필요''를 판정 불가(가이드 성격) 항목으로 기록 (2026-10-18
  독립 검토)'
- 'AI-004: 예술적·창의적 표현물 예외에 원문의 ''비가시적인 표시 방법'' 추가, 측정 기준 (4)에서 제외, 예시를 반출 파일(서버 프레임 로고 합성·음성 앞부분 안내 멘트) 기준으로 교체.
  AI-003: 측정 기준 (3)·딥페이크 예외에 예술적·창의적 표현물 예외 반영 (2026-10-18 재검증)'
