id: CF-035
rules:
- A11Y-012
- A11Y-029
- STATE-012
against: 모달 초점 가두기와 키보드 함정 금지의 관계(Esc 처리)
summary: 모달 초점 가두기(A11Y-029)가 키보드 함정(A11Y-012)이 되는지, X 버튼 없는 승인 모달(STATE-012)에서 Esc로 닫아야 하는지.
principle: 1
decision: 양립. 모달은 Esc 또는 모달을 닫는 버튼(닫기·취소·수락·거절) 중 하나를 키보드로 실행해 빠져나올 수 있으면 키보드 함정이 아니다(A11Y-012). X(닫기) 버튼이 있는 모달은
  Esc로도 닫고(A11Y-029), X 버튼이 없는 승인 요청 모달(STATE-012)은 Esc를 지원하지 않아도 된다.
reason: WCAG 2.1.2는 표준 키로 빠져나올 방법이 있으면 충족된다. 모달의 키보드 조작 가능한 버튼이 그 방법이다.
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'A11Y-012: 측정 기준의 모달 탈출 수단을 ''Esc 또는 닫기·취소·수락·거절 버튼 중 하나''로 수정 (2026-10-18 독립 검토)'
- 'A11Y-029: 측정 기준 (4) ''X 버튼이 있는 모달은 Esc로 닫는다'' 추가 (2026-10-18 독립 검토)'
