id: CF-067
rules:
- FORM-024
- FORM-033
- FORM-019
summary: 필수가 아니고 기본 선택이 없는 라디오 그룹에 '선택 안 함'을 두라는 FORM-033 을 그대로 적용하면, 선택 동의 항목(FORM-024 — '동의함'·'동의하지 않음' 두 옵션)에도
  세 번째 옵션이 필요해진다. 또 아무것도 고르지 않은 동의 항목·선택 항목을 어떤 값으로 기록할지 정해 둔 룰이 없다.
principle: 1
decision: (1) 동의 목록의 동의 항목은 FORM-033 대상이 아니다 — '동의하지 않음'이 '동의함'을 되돌리는 수단이므로 '선택 안 함'을 따로 두지 않는다. (2) 응답하지 않은 동의
  항목은 '동의하지 않음'과 같게 처리하고 결과 화면에 '동의하지 않음'으로 표시할 수 있다. '동의함'으로 처리하면 실패(FORM-024 측정 기준 (4)). (3) 동의 항목이 아닌 라디오 그룹·선택
  필드의 미응답은 빈 값 또는 '선택 안 함'과 같은 값으로 저장·표시하고 다른 응답 옵션의 값으로 바꾸지 않는다(FORM-019 측정 기준 (3)).
reason: 개인정보 보호법 제22조 제1항과 시행령 제17조 제1항 제4호는 동의를 정보주체가 명확하게 표시해야 성립하는 것으로 정한다(원칙 1) — 응답하지 않은 동의 항목은 동의하지 않은 것과
  법적 효과가 같고, 동의로 처리하면 법규 위반이다. 그래서 동의 항목에서는 미응답과 '동의하지 않음'을 하나로 다뤄도 정보 손실이 없고 세 번째 옵션은 선택지만 늘린다(원칙 2). 동의가 아닌 질문(성별·결혼
  여부 등)은 미응답과 특정 응답의 뜻이 달라, 미응답을 특정 값으로 바꾸면 KRDS 가 금지한 기본값과 같은 결과가 된다(FORM-019 근거를 제출 시점으로 넓힌 체계 해석). (2026-10-18
  시험 4 T6 독립 검토에서 발견)
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'FORM-033: 측정 기준에 동의 항목 제외 추가, exceptions 추가, relations 에 FORM-024 conflicts(CF-067)'
- 'FORM-024: 측정 기준 (4)(미응답을 ''동의함''으로 처리 금지, ''동의하지 않음''과 같게 처리) 추가, 출처 KR_PIPA·KR_PIPA_DECREE 추가, relations 에 FORM-033
  conflicts(CF-067)'
- 'FORM-019: 측정 기준 (3)(미응답을 다른 응답 값으로 저장·표시 금지) 추가, 출처 UXB_SYSTEM_CHOICE(CF-067), 동의 항목 예외, decisions 에 CF-067'
