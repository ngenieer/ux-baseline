id: CF-052
rules:
- AI-008
- AI-009
- COPY-029
- STATE-036
- TYPO-017
- TYPO-020
- TYPO-028
- TYPO-029
against: PREFERENCE — 1차 출처(표준·연구)가 없거나 출처가 수치·방식을 정하지 않은 체계 선택
summary: 출처가 여러 방식을 모두 허용하거나 수치를 정하지 않아, 이 체계가 하나를 골라야 판정 가능한 룰 8개. 선택을 결정 기록 없이 두면 확정할 수 없다.
principle: 3
decision: 'AI-008: 사용자가 중단한 AI 응답 끝에 ''생성 중단됨'' 텍스트를 표시한다(MAY). AI-009: AI 결과마다 다시 생성 버튼을 두고 이전 결과를 다시 볼 수 있게 한다(MAY).
  보존 방식(버전 탐색 또는 목록)은 둘 다 허용한다. COPY-029: 가로 배치 라디오·체크박스 레이블 길이 판정 기준은 ''브레이크포인트 토큰 너비 360·768·1024·1280px(RESP-004)마다
  한 줄''로 정한다(MAY). STATE-036: KRDS의 ''인증 실패 반복''을 ''같은 인증 절차에서 연속 2회 이상 실패''로 정한다(MAY). TYPO-017: 한국어 텍스트 블록의 기본
  줄바꿈은 어절 단위(word-break: keep-all)로 정한다(MAY). TYPO-020: 한국어 본문에 word-break: break-all을 쓰지 않는다(MAY). 긴 URL·코드는 overflow-wrap:
  anywhere로 처리한다. TYPO-028: 본문 letter-spacing 기본값은 0이고 음수 값을 쓰지 않는다(MAY). TYPO-029: 0이 아닌 letter-spacing은 em 단위로
  쓴다(MAY). KRDS 표의 px 자간은 글자 크기로 나눠 em으로 환산한다. 모두 강도 MAY로 두고, 근거는 UXB_SYSTEM_CHOICE(CF-052)로 표시한다.'
reason: 법규·접근성(원칙 1)과 과업 완료(원칙 2)는 이 선택들을 정하지 않는다 — 어느 방식도 WCAG·KWCAG 위반이 아니다. 하나로 정해 두어야 AI 산출물이 화면마다 다르게 나오지 않고
  자동 검사로 판정된다(일관성, 원칙 3). 근거가 선호이므로 MAY보다 올리지 않는다.
deviates_from_priority: false
