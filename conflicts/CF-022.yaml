id: CF-022
rules:
- A11Y-014
against: KWCAG 2.2 6.2.1(시간제한 콘텐츠 사용 배제 우선)
summary: WCAG 2.2.1은 조절 수단을 요구하고, KWCAG 6.2.1은 시간 제한을 '가급적 포함하지 않는 것이 바람직'하며 필요하면 회피 수단을 제공하라고 한다. KWCAG 예외 콘텐츠(경매·실시간
  게임)도 시간 제한 사전 고지와 종료 고지는 요구한다.
principle: 1
decision: 보안 등 필수 사유가 없으면 시간 제한을 두지 않는다. 시간 제한이 필요하면 A11Y-014의 수단 중 하나를 제공한다. 예외에 해당하는 시간 제한도 시작 전과 종료 시 그 사실을 알린다.
reason: KWCAG의 '바람직'을 MUST 측정 기준 (0)(필수 사유가 문서화되지 않은 시간 제한 금지)으로 둔 것은 원문보다 엄격한 체계 선택이다 — 시간 제한은 장애 사용자의 과업 실패 원인이
  되므로 원칙 1·2에 따라 유지한다. 예외 콘텐츠의 고지 의무는 KWCAG 원문 그대로다.
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'A11Y-014: statement 수정'
- 'A11Y-014: 예외에 고지 의무, 측정 기준 (2) 추가(2026-10-18 독립 검토)'
