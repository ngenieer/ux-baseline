id: CF-012
rules:
- LAYOUT-043
- RESP-003
summary: WCAG 1.4.10은 데이터 표의 2차원 스크롤을 허용하는데 LAYOUT-043은 제한된 영역에서 표 대신 세로 배치를 요구한다.
principle: 1
decision: 양립. LAYOUT-043은 아코디언·모달처럼 공간이 제한된 영역에만 적용한다. 일반 본문의 데이터 표는 표 영역 안에서만 가로 스크롤을 허용하고 페이지 전체 가로 스크롤은 만들지 않는다.
reason: LAYOUT-043은 RESP-003보다 엄격한 쪽이라 접근성 요구를 해치지 않는다. 허용하는 표 영역 가로 스크롤은 키보드로도 스크롤할 수 있어야 하므로 스크롤 컨테이너에 tabindex="0"과
  접근 가능한 이름을 둔다(WCAG 2.1.1).
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'LAYOUT-043: 예외 추가'
- 'LAYOUT-043: 예외에 스크롤 영역 tabindex="0"·접근 가능한 이름 조건 추가, 측정 너비 360 → 320 CSS px (2026-10-18 독립 검토)'
