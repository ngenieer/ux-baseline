id: CF-057
rules:
- SHAPE-002
against: KRDS 형태 페이지의 단계 표(Medium 40~64px = 6px) vs 같은 페이지의 표준형 계산법(56·64px → 8px)
summary: KRDS 형태 페이지 안에서 표와 계산법의 결과가 56px·64px 컨테이너에서 다르다(사이트·PDF 2025.08 모두). KRDS 토큰(radius medium3·4 = 8px)은
  계산법과 같다.
principle: 3
decision: 계산법을 정본으로 한다. 56px·64px 컨테이너의 반경은 8px(토큰 값)이고, 표의 6px는 따르지 않는다.
reason: 이 체계는 토큰 값만 쓴다(SHAPE-001, MUST). KRDS 배포 토큰이 계산법과 같으므로 계산법을 따르면 토큰·룰·린트가 일치한다(원칙 3). 반경은 접근성·과업 완료와 무관하다.
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'SHAPE-002: 변경 없음, 확인 필요 해제'
