id: CF-038
rules:
- FORM-080
against: KRDS 입력폼 상호작용(아이디·비밀번호는 Keyup, 날짜 등은 Focusout 시점 검증)
summary: GOV.UK는 blur 시점 검증을 금지하고, KRDS는 입력 중·포커스 이탈 시점 검증을 제시한다.
principle: 2
decision: 오류 표시(오류 메시지와 aria-invalid="true")는 다음 단계·제출 버튼을 눌렀을 때 한다. 입력하는 동안에는 aria-invalid를 설정하지 않고 필드의 aria-describedby가
  가리키는 안내 텍스트만 바꾸는 조건 충족 안내(아이디 중복 여부, 비밀번호 조건 충족 여부)를 허용한다 — 이 안내는 오류 표시가 아니다. KRDS를 적용하는 공공 프로젝트는 KRDS 입력폼 상호작용
  가이드라인(PDF 851쪽)대로 아이디·비밀번호는 입력하는 동안(Keyup), 날짜처럼 값을 모두 넣어야 판단할 수 있는 필드는 다음 항목으로 초점을 옮길 때(Focusout) 오류를 표시할 수 있다(FORM-080
  예외).
reason: 입력 도중의 오류 표시는 사용자를 방해하지만 조건 충족 안내는 과업을 돕는다(원칙 2). 허용하는 안내를 'aria-invalid를 설정하지 않고 aria-describedby 텍스트만
  바꾸는 것'으로 정의해 오류 표시와 판정으로 구분한다. KRDS는 클라이언트 측 검증 시점을 Keyup·Focusout으로 구체적으로 정한 국내 공공 기준이라, KRDS 적용 프로젝트에는 GOV.UK
  기반 기본값 대신 그 시점을 예외로 허용한다(2026-10-18 독립 검토).
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'FORM-080: statement 수정'
- 'FORM-080: KRDS 공공 프로젝트 Keyup·Focusout 예외 추가, 허용 안내를 ''aria-invalid 미설정 + aria-describedby 텍스트만 변경''으로 정의해 측정
  기준 (2)에 넣음 (2026-10-18 독립 검토)'
