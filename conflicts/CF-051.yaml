id: CF-051
rules:
- A11Y-048
- A11Y-016
- A11Y-011
against: KRDS 라디오·체크박스·토글 페이지(opacity:0 숨김의 문제 서술) vs KRDS 숨긴 콘텐츠 페이지(대화형 요소는 opacity로 숨김 권장)
summary: 커스텀 선택 컨트롤에서 네이티브 입력을 숨기는 방법을 KRDS 페이지들이 서로 다르게 말한다.
principle: 1
decision: '네이티브 input을 opacity: 0으로 시각적으로 숨기고 커스텀 표시와 같은 위치·크기에 겹쳐 두는 방식을 허용한다. 이때 커스텀 표시에 키보드 초점 표시(A11Y-016)를
  반드시 보여준다. display: none·visibility: hidden으로는 숨기지 않는다(A11Y-046).'
reason: 'opacity로 숨긴 네이티브 입력은 초점·클릭·보조기술 노출이 유지된다. 문제는 초점 표시가 사라지는 것이므로 초점 표시 요구로 보완한다(원칙 1). KRDS 라디오 버튼·체크박스·토글
  스위치 접근성 가이드라인 03(PDF 535·548·578쪽)은 display:none·visibility:hidden과 함께 opacity:0도 ''스크린 리더에서 역할을 인지할 수 없으며 키보드로
  옵션을 선택할 수 없게 된다''고 쓰지만, 이 서술의 opacity:0 부분은 따르지 않는다: WAI-ARIA 1.2 §7.1 Excluding Elements from the Accessibility
  Tree가 접근성 트리에서 빼는 것은 ''CSS display:none, visibility:hidden, or the HTML hidden attribute''처럼 표시되지 않는 요소이고 opacity는
  들어 있지 않다. opacity는 요소를 렌더링에서 빼지 않아 초점 이동 대상에서도 빠지지 않는다 — 같은 KRDS의 숨긴 콘텐츠 사용성 가이드라인 06(PDF 750쪽)도 대화형 요소를 z-index·opacity로
  숨기고 별도 outline으로 초점을 보이라고 한다. KRDS 페이지들이 지적한 실제 위험(초점·역할 손실)은 display:none·visibility:hidden 금지(A11Y-048 측정 기준
  (2), A11Y-046)와 초점 표시(A11Y-016)로 막는다(2026-10-18 독립 검토).'
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'A11Y-048: 측정 기준 (2) ''커스텀 선택 컨트롤의 원본 input에 display:none·visibility:hidden 없음'' 추가, 출처에 WAI-ARIA 1.2 §7.1 추가
  (2026-10-18 독립 검토)'
- 'A11Y-011: decisions에 CF-051 추가, verification_note의 BACKLOG 문구를 CF-051 결론으로 정리 (2026-10-18 독립 검토)'
