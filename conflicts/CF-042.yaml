id: CF-042
rules:
- NAV-001
against: KWCAG 2.2 6.4.1 해설·KRDS 건너뛰기 링크(문서 첫 요소에 건너뛰기 링크 요구)
summary: WCAG 2.4.1은 랜드마크·제목만으로도 충족하지만 KWCAG·KRDS는 건너뛰기 링크를 요구한다.
principle: 1
decision: 반복 블록이 있는 페이지에는 건너뛰기 링크를 문서의 첫 초점 요소로 제공한다. 건너뛰기 링크는 KWCAG를 적용하는 공공 프로젝트에서는 초점과 관계없이 항상 화면에 보이게, 그 밖의
  프로젝트에서는 초점을 받으면 화면에 보이게 한다. 랜드마크·제목은 함께 쓰되 대체 수단으로 인정하지 않는다.
reason: 더 엄격한 국내 기준(KWCAG 2.2 6.4.1 해설·KRDS)을 따른다(원칙 1). KWCAG 공식 원문 docx 해설은 '건너뛰기 링크는 웹 페이지의 가장 앞에 제공한다', '메뉴
  건너뛰기 링크는 화면에 보이도록 구현해야 한다'고 쓴다 — 해설의 '화면에 보이도록 구현'에는 '초점을 받았을 때'라는 한정이 없다. 공공(KWCAG 적용) 프로젝트는 원문대로 항상 보이게 하고,
  그 밖의 프로젝트는 초점을 받으면 보이게 하는(WCAG 2.4.1은 가시성을 요구하지 않음) 구분은 이 체계의 해석이다(2026-10-18 재검증).
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'NAV-001: statement 수정'
- 'NAV-001: 측정 기준 (3) 건너뛰기 링크가 초점을 받으면 화면에 보임 추가, KWCAG 출처 note를 공식 docx 기준으로 수정 (2026-10-18 독립 검토)'
- 'NAV-001: 측정 기준 (3)을 KWCAG 적용 공공 프로젝트는 항상 보임, 그 밖은 초점을 받으면 보임으로 나눔 (2026-10-18 재검증)'
