id: CF-008
rules:
- FORM-077
- LAYOUT-017
summary: GOV.UK는 오류 요약을 브레드크럼 아래·h1 위에 두는데(FORM-077), KRDS는 현재 경로를 생략한 브레드크럼과 h1 사이에 다른 요소를 두지 말라고 한다(LAYOUT-017).
principle: 3
decision: 오류 요약은 본문 제목(h1) 바로 아래, 본문의 첫 요소로 둔다.
reason: 오류 요약을 h1 바로 다음 요소로 두면 DOM·읽기 순서에서 페이지 제목 직후에 오류 요약이 온다. 초점이 오류 요약으로 옮겨지는 일반 폼(FORM-077)은 물론, 초점이 첫 번째 오류
  필드로 가는 KRDS 공공 프로젝트·모달 안 폼(CF-007, FORM-015)에서도 제목(h1)으로 이동하거나 위에서부터 읽는 화면 낭독·화면 확대 사용자는 제목 다음에 곧바로 오류 요약을 만난다.
  따라서 h1 위·아래 위치 차이는 과업 완료(원칙 2)에 영향이 없고, 브레드크럼-제목 인접 규칙(LAYOUT-017)과의 일관성(원칙 3)을 지킨다.
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'FORM-077: statement 수정'
- 'CF-008: reason 보충 — 초점이 오류 요약으로 가지 않는 KRDS 공공 프로젝트(CF-007)에도 성립하는 읽기 순서 근거로 고침(룰 내용 변경 없음) (2026-10-18 독립 검토)'
