id: CF-050
rules:
- MOTION-011
against: NN/g 내부 표기(100–500ms와 100–400ms 병기)·Material 토큰(50~1000ms)
summary: 애니메이션 지속 시간 범위가 출처마다 조금씩 다르다.
principle: 4
decision: MOTION-011의 100~500ms 범위를 유지한다.
reason: 'NN/g 기사는 ''대부분의 애니메이션은 복잡도와 이동 거리에 따라 100–500 ms''를 일반 범위로 쓰고, 같은 글에서 ''대부분 100–400 ms, 400ms는 큰 화면을 가로지르는
  큰 이동에만''을 그 안의 권장으로, ''500ms에서 지연으로 느껴진다''를 경계로 쓴다. 이 체계는 위반을 가르는 판정 범위로 일반 범위 100–500ms를 고르고(상한 500ms = 기사가 지연으로
  느껴진다고 한 경계), 400–500ms는 큰 이동이 있는 전환에서만 나오는 값으로 둔다. 모달·드로어는 200–300ms로 따로 고정하므로 상한이 실제로 쓰이는 곳은 큰 이동 전환뿐이다. 연구 근거가
  없는 전문가 가이드라 SHOULD로 두고, Material의 50~1000ms는 참고 사례라 따르지 않는다(원칙 4). 2026-10-18 독립 검토: 실제 선택 이유로 고쳐 씀.'
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'MOTION-011: verification_note의 ''상한 400/500ms 3단계 검토 여지''를 CF-050 결정으로 닫음 (2026-10-18 독립 검토)'
