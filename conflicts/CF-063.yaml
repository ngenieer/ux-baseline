id: CF-063
rules:
- PERF-018
against: KRDS 스플래시 스크린 (component_04_12, component_12_08 — 모바일 앱 실행 시 표시하는 화면)
summary: KRDS는 스플래시 스크린을 모바일 앱 전용으로 정의한다. 웹 SPA(웹앱)의 첫 로드를 '앱 실행'으로 보면 스플래시를 쓸 여지가 생기지만, 이 체계는 페이지 로드에 스켈레톤을 쓰기로
  정했다(PERF-018, CF-016).
principle: 2
decision: 스플래시 스크린은 이 체계(웹 프로젝트)의 범위 밖으로 둔다. 웹사이트와 웹앱(SPA 포함)의 첫 로드는 '페이지 로드'로 보고 스켈레톤을 쓴다(PERF-018). 설치형 웹앱(PWA)의
  실행 화면은 운영체제가 웹 앱 매니페스트(아이콘·배경색)로 그리므로 별도 규격을 두지 않는다. components/splash-screen 규격은 삭제한다.
reason: 스플래시는 준비가 끝날 때까지 화면을 가려 사용자가 아무것도 볼 수 없게 한다. 웹은 받은 내용부터 그릴 수 있으므로, 콘텐츠 자리를 먼저 보여 주는 스켈레톤이 과업 완료(원칙 2)에 유리하다.
  KRDS도 스플래시를 모바일 앱 전용으로 한정했다.
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'PERF-018: 변경 없음(웹앱 첫 로드도 적용 대상임을 결정으로 명시)'
- components/splash-screen.yaml 삭제
