id: CF-041
rules:
- FORM-077
- FORM-079
against: 'GOV.UK 문구(''There is a problem'', ''Error: '')의 한국어 대응 — 국내 근거 없음'
summary: 오류 요약 제목과 title 접두의 한국어 문구에 국내 근거가 없다.
principle: 3
decision: '오류 요약 제목은 ''입력 내용을 확인해 주세요''로 시작하고(뒤에 ''. 고쳐야 할 항목이 2개 있습니다.'' 같은 오류 개수 문장을 붙일 수 있다), title 접두는 ''오류:
  ''로 통일한다(체계 선택).'
reason: 문구를 하나로 고정해야 AI가 매번 다르게 쓰지 않는다(원칙 3). 국내 근거가 없어 체계 선택으로 기록한다.
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'FORM-077: 측정 기준 (4) 오류 요약 제목 ''입력 내용을 확인해 주세요'' 추가, verification_note 미결 문구 정리 (2026-10-18 독립 검토)'
- 'FORM-077: 측정 기준 (4)를 제목 전체 일치에서 ''로 시작한다(뒤에 오류 개수 문장 허용)''로 명확히 함 (2026-10-18 시험 4 검토 반영)'
