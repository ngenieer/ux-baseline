id: CF-001
rules:
- A11Y-014
- STATE-030
summary: 코치마크 표시 중 토스트 등 다른 레이어를 막으면(STATE-030) 자동으로 사라지는 알림의 시간 제한(A11Y-014)과 얽힌다.
principle: 1
decision: 양립. 코치마크 표시 중 생긴 알림은 버리지 않고 코치마크가 닫힌 직후 표시한다. 단, 시간 제한 경고(A11Y-014)와 오류·긴급 알림은 즉시 띄우고 코치마크를 닫는다. 토스트 표시
  시간은 CF-030을 따른다.
reason: 코치마크 때문에 시간 제한 경고가 늦어지면 '만료 20초 이상 전 경고'(WCAG 2.2.1, KWCAG 6.2.1)를 지킬 수 없다(원칙 1). 그 밖의 알림은 보류해도 정보 손실이 없다.
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'STATE-030: statement·측정 기준·예외 수정(2026-10-18 독립 검토)'
- 'STATE-030: 좋은 예에 시간 제한 경고·오류·긴급 알림 분기(코치마크 닫고 즉시 표시) 추가 (2026-10-18 재검증)'
