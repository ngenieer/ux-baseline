id: CF-010
rules:
- FORM-080
- NAV-055
summary: 다음 단계 버튼을 필수 행동 전까지 비활성화하라(NAV-055)는 요구가 버튼을 눌렀을 때 검증하라(FORM-080)는 요구와 부딪힌다.
principle: 2
decision: 다음 단계 버튼을 비활성화하지 않는다. 누르면 검증하고 오류를 안내한다(FORM-080). NAV-055는 폐기한다.
reason: 비활성 버튼은 왜 진행할 수 없는지 알려 주지 않고, disabled 버튼은 키보드 초점도 받지 못해 사용자가 무엇을 고쳐야 하는지 찾지 못한다 — 과업 완료(원칙 2). WCAG 3.3.1(오류
  식별)은 자동으로 감지한 입력 오류를 텍스트로 알리라는 요구이고 버튼 비활성화 자체를 금지하지 않으므로 이 결정의 근거가 아니다(2026-10-18 독립 검토로 근거를 원칙 1에서 2로 정정). 버튼을
  누르면 FORM-080대로 검증하고 오류를 텍스트로 알리므로 3.3.1도 함께 충족된다. 반대 근거로 KRDS 가이드라인 2025.08 입력폼 사용성 04(838쪽) '비활성화 상태의 입력폼 제출
  버튼 사용을 고려한다'(필수 항목을 다 채울 때까지 비활성화)가 있다. '고려한다'는 권고(MAY 수준)라 원칙 2 결정이 앞선다. 같은 쪽의 제출 중 중복 제출 방지용 비활성화는 FORM-013
  이 다루며 이 결정과 충돌하지 않는다(2026-10-18 KRDS PDF 대조 감사).
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'NAV-055: 폐기 → FORM-080'
- 'FORM-080: 측정 기준 (3) ''다음 단계·제출 버튼에 disabled 속성·aria-disabled="true" 없음'' 추가, statement에 비활성화 금지 명시 (2026-10-18
  독립 검토)'
- 'FORM-080: 예외에 파일 선택 결과(형식·크기·개수) 오류는 선택 직후 표시(FORM-063) 추가, FORM-063 과 relations(refines)로 연결 (2026-10-18 재검증)'
