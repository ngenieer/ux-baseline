id: CF-040
rules:
- FORM-063
against: KRDS 파일 업로드(최대 개수 도달 시 처리 미정)
summary: 파일을 최대 개수까지 올렸을 때 파일 선택 버튼을 비활성화할지 원문이 정하지 않았다.
principle: 2
decision: 최대 개수에 도달해도 파일 선택 버튼과 드롭 영역을 비활성화하지 않는다. 그 상태에서 파일을 더 선택하거나 드롭하면 추가 파일을 올리지 않고 최대 개수를 알리는 오류 문구를 표시한다.
  최대 개수 도달은 KRDS가 말한 '입력 행위 자체를 제한하는 상태'로 보지 않는다.
reason: 비활성 버튼은 이유를 알려주지 않는다(CF-010과 같은 판단, 원칙 2). 오류 표시 시점은 '파일을 더 선택·드롭한 직후' 하나로 정해 statement·측정 기준·컴포넌트 규격(components/file-upload.yaml
  '더 고르면')을 맞춘다(2026-10-18 독립 검토).
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'FORM-063: statement 수정'
- 'FORM-063: 오류 표시 시점을 ''최대 개수 도달 상태에서 파일을 더 선택·드롭한 직후''로 statement·측정 기준 통일 (2026-10-18 독립 검토)'
- 'FORM-063: FORM-080 과 relations(refines)로 연결 — 파일 선택 결과 오류는 선택 직후 표시 (2026-10-18 재검증)'
