id: CF-030
rules:
- A11Y-014
- STATE-001
- STATE-037
against: KRDS 토스트 컴포넌트(2~4초 후 자동으로 사라짐, 접근성 고려 없음)
summary: 자동으로 사라지는 토스트는 시간 제한(A11Y-014)과 상태 메시지(STATE-001) 요구를 놓칠 수 있다.
principle: 1
decision: 토스트는 사라진 뒤에도 화면의 다른 곳에서 확인할 수 있는 결과 알림만 담고(STATE-037 측정 기준 (4)), role=status로 보조기술에 알린다(STATE-001). 반드시
  필요한 정보나 조작은 토스트에만 두지 않으므로 표시 시간은 A11Y-014의 시간 제한에 해당하지 않게 한다. (4)를 충족하지 않는 자동 사라짐 토스트는 A11Y-014로 판정한다.
reason: 사라져도 정보·기능 손실이 없도록 내용을 제한하는 것이 상위 원칙(1)을 지키는 가장 간단한 방법이다. WCAG Understanding 2.2.1은 5초 뒤 사라지는 새 메일 토스트를
  예로 들어 'Users are able to identify the arrival of email through other means, such as viewing the Inbox, so the
  disappearance of the message does not set a time limit'라고 하고, 같은 정보를 다른 방법으로 알 수 없으면 각 메시지가 2.2.1을 충족해야 한다고 한다.
  KWCAG 2.2 용어 정의는 '짧은 기간 동안 나타났다 일정 시간 후에 자동적으로 사라지는 대화상자(dialog box), 팝업창, 레이어 팝업 등'을 시간제한이 있는 콘텐츠의 예로 든다. 체계는
  초점·조작이 없는 role=status 토스트를 이 대화상자·레이어 팝업과 다른 상태 메시지로 보고, 같은 결과를 다른 곳에서 확인할 수 있을 때만 시간 제한이 아니라는 Understanding 2.2.1
  해석을 따른다. 조작(실행 취소 버튼 등)이 들어간 알림은 스낵바(CF-004)로 보고 이 해석을 적용하지 않는다. 이 해석은 KWCAG 원문에 명시돼 있지 않아, 공공 프로젝트 심사에서 자동 사라짐
  토스트를 6.2.1 대상으로 판정할 수 있다는 점을 남긴다.
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'STATE-037: statement·측정 기준 (4) 추가 — 토스트 결과를 화면 다른 곳에서 확인 가능, 미충족 시 A11Y-014로 판정. 좋은 예시 갱신 (2026-10-18 독립 검토)'
