id: CF-069
rules:
- COPY-009
- FORM-024
against: 개인정보 보호법 제15조 제2항·제22조 제1항·제2항, 시행령 제17조 제3항 — 동의를 받을 때 알릴 사항과 '명확히 표시'를 요구하지만 화면에서의 위치(접힌 영역 허용 여부)는 정하지
  않음; KRDS 동의 패턴은 약관을 '약관읽기'로 따로 보게 하는 예시만 둠
summary: 동의 판단에 필요한 정보(수집 항목·목적·보유 기간)를 접힌 영역 안에만 둔 동의 화면을 COPY-009(필수 정보는 숨기지 않음)로 실패로 볼지 기준이 없다.
principle: 1
decision: 개인정보 수집·이용 동의 항목에서는 수집·이용 목적, 수집 항목, 보유·이용 기간, 동의를 거부할 권리와 거부 시 불이익(법 제15조 제2항 각 호)을 COPY-009 의 필수 정보로
  보고, 그 항목의 동의 선택지와 같은 항목 안 접히지 않은 본문에 표시한다. 약관·처리방침 전문은 접힌 영역이나 별도 화면에 둘 수 있다. 강도는 COPY-009 의 SHOULD 다.
reason: 법은 이 네 가지를 '알리고' '명확하게 인지할 수 있도록' 하라고 요구한다(원칙 1). 접힌 영역 안에만 두면 펼치지 않은 사용자는 무엇에 동의하는지 모른 채 동의할 수 있어 이 요구를
  화면에서 판정할 방법이 없다 — 접히지 않은 본문에 두면 판정이 결정적이 된다. 위치 자체는 법이 정하지 않았으므로 체계 결정(UXB_SYSTEM_CHOICE)으로 기록하고, 법 조문을 근거로 MUST
  로 올리지는 않는다(위치 요구는 법 문언에 없음). (2026-10-18 시험 4 T6 독립 검토에서 발견)
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'COPY-009: 측정 기준에 개인정보 동의 항목의 필수 정보 네 가지와 위치 추가, 출처 KR_PIPA·KR_PIPA_DECREE·UXB_SYSTEM_CHOICE(CF-069), scope 에
  ''개인정보 동의 항목'', 예시 추가'
- 'FORM-024: 측정 기준에서 정보 표시 위치는 COPY-009(CF-069)로 판정한다고 명시, relations 에 COPY-009 depends, decisions 에 CF-069'
