id: CF-065
rules:
- COLOR-002
against: KRDS 가이드라인 2025.08 — 상세 정보 확인 패턴 824쪽 '화면을 확대할 수 있는 경우 3:1까지 낮출 수 있다', 태그 567쪽 '태그 레이블·아이콘 3:1'
summary: KRDS 의 일부 문장이 일반 크기 텍스트 대비를 3:1 까지 허용해 WCAG 1.4.3(4.5:1)보다 느슨하다.
principle: 1
decision: 일반 크기 텍스트는 4.5:1(큰 텍스트 3:1)을 유지한다(COLOR-002). 확대 가능 여부나 태그 레이블이라는 이유로 3:1 로 낮추지 않는다. 텍스트가 아닌 아이콘은 COLOR-003(3:1, WCAG 1.4.11)으로 판정한다.
reason: WCAG 1.4.3 은 화면 확대 가능 여부로 기준을 낮추지 않으며, 법규·접근성(원칙 1)이 디자인 시스템 문장보다 앞선다. KRDS 안에서도 텍스트 대비 기본값은 4.5:1 이라 이 결정은 KRDS 일반 기준과도 맞는다. (2026-10-18 KRDS PDF 대조 감사에서 발견)
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'COLOR-002: decisions 에 CF-065 추가(룰 내용 변경 없음)'
