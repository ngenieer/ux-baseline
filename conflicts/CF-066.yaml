id: CF-066
rules:
- FORM-032
- FORM-024
summary: 선택 옵션을 가나다순으로 정렬하라(FORM-032)는 룰과 의미상 순서가 있는 옵션(동의 항목, 예·아니요, 척도)의 순서가 부딪히는지 판단이 갈렸다.
principle: 3
decision: '동의 항목은 FORM-032 가나다순 그대로 ''동의하지 않음'' → ''동의함''으로 둔다 — KRDS 동의 패턴(global_03) 예시 화면의 순서와 같아 충돌이 없다. 의미상
  순서가 정해진 다른 옵션은 가나다순 대신 그 순서를 쓴다: 예·아니요 질문은 ''예'' → ''아니요'', 척도·크기·기간·단계는 작은 값 → 큰 값(또는 그 반대로 한 서비스 안에서 한 방향).
  이 경우는 FORM-032 예외 ''정렬 기준에 명확한 근거나 이유가 있는 경우''에 해당하며 설계 문서 기록을 따로 요구하지 않는다. 의미상 순서가 없는 목록(지역·분야·관심사 등)은 가나다순이다.'
reason: FORM-032 의 예외 문구(KRDS 원문 단서)가 근거 있는 다른 정렬을 허용한다. 같은 화면 유형마다 AI 가 예외 여부를 다시 판단하지 않도록 해석을 고정한다(원칙 3 일관성).
  처음 결정(2026-10-18)은 시험 에이전트의 '가나다순이면 동의함·동의하지 않음 순서가 뒤집힌다'는 판단을 그대로 받아 동의 항목을 '동의함' 먼저로 정했으나, 가나다순('동의하지 않음' <
  '동의함')이 KRDS 예시 화면 순서와 같고 FORM-024 의 원래 좋은 예도 그 순서였다 — 2차 검토에서 찾아 동의 항목 부분을 정정했다.
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'FORM-032: relations 에 FORM-024 conflicts(CF-066) 추가, 예외 문구에 의미상 순서 예시 추가'
- 'FORM-024: relations 에 FORM-032 conflicts(CF-066) 추가'
- 'CF-066 정정(2026-10-18 시험 4 2차 검토): 동의 항목은 가나다순(''동의하지 않음'' → ''동의함'') — FORM-024 좋은 예 순서 복원, FORM-032 예외 문구에서
  동의 항목 제거'
