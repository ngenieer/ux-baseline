id: CF-053
rules:
- FORM-002
against: KWCAG 2.2 검사항목 7.2.1 사용자 요구에 따른 실행 — 입력에 따른 변화 (공식 원문 docx)
summary: WCAG 3.2.2는 입력에 따른 맥락 변화를 '사용 전에 알리면' 허용하지만, KWCAG 2.2 7.2.1은 선택 컨트롤의 항목 선택으로 기능 실행·서식 제출이 일어나지 않아야 하고
  실행 버튼을 눌렀을 때만 실행하라고 쓴다(사전 안내 예외 없음).
principle: 1
decision: 폼 제출·페이지 이동·새 창 열기·모달 열기·선택한 항목이 뜻하는 기능(삭제·정렬·저장 등) 실행은 값 변경·항목 선택만으로 일으키지 않고 실행 버튼으로만 일으킨다(사전 안내 예외 삭제).
  값 입력 완료 후 다음 필드로 초점을 옮기는 동작은 이 체계는 사전 안내·되돌아가기 조건에서 의도하지 않은 기능으로 보지 않는다(해석) — CF-005대로 사전 안내 시 허용한다. CF-006(코치마크
  단계 진행)은 바뀌지 않는다.
reason: 두 기준 모두 우선순위 1(법규·접근성)이다. 국내 서비스는 KWCAG 준수를 요구받으므로 둘 다 만족하는 더 엄격한 쪽을 따른다. 자동 초점 이동은 KRDS 입력폼 접근성 가이드라인(KWCAG
  2.2 근거 표기)이 이전 항목으로 돌아갈 수 있으면 허용한다고 명시하므로 유지한다. 자동 초점 이동 허용은 KWCAG 원문이 명시적으로 빼 주는 것이 아니라, 사전 안내와 되돌아가기(KRDS 입력폼,
  KWCAG 근거 표기)를 근거로 '사용자가 의도하지 않은 기능'이 아니라고 본 이 체계의 해석이다.
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'FORM-002: statement·측정 기준 수정(제출·이동·새 창의 사전 안내 예외 삭제), 예외에 시각 변화·추가 정보 추가'
- 'FORM-002: statement 에 모달 열기·선택한 항목이 뜻하는 기능(삭제·정렬·저장 등) 실행 금지 추가(측정 기준 (2)(4)와 맞춤) (2026-10-18 재검증)'
