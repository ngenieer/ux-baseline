id: CF-037
rules:
- MOTION-002
against: KWCAG 2.2 6.3.1(초당 3~50회 깜빡임·번쩍임 금지, 임계값 예외 없음)
summary: WCAG 2.3.1은 1초에 3회를 넘는 번쩍임을 금지하되 일반·적색 번쩍임 임계값 미만은 허용한다(상한 없음). KWCAG 6.3.1은 초당 3~50회 깜빡임·번쩍임을 제공하지 않도록
  하고, 해설에서 번쩍임 면적이 10인치 이상 화면의 10%를 넘지 않을 것, 깜빡임은 정지할 수 있을 것, 번쩍이는 시간을 3초 미만으로 제한하는 것을 설명한다.
principle: 1
decision: '둘을 합치고 더 엄격하게 둔다: 초당 3회 이상 깜빡이거나 번쩍이는 콘텐츠를 두지 않는다(상한 없음). WCAG 임계값 예외와 KWCAG 면적·정지 조건은 쓰지 않는다.'
reason: 광과민성 발작은 되돌릴 수 없는 피해라 두 기준의 허용 조건을 모두 쓰지 않는 체계 결정이다(원문보다 엄격, 원칙 1). 이전 기록의 '3~50회만 금지'는 WCAG의 50회 초과 금지를
  빠뜨렸고 KWCAG 해설 조건도 잘못 요약해 2026-10-18 독립 검토에서 고쳤다.
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'MOTION-002: statement 수정'
- 'MOTION-002: 상한 50회 삭제, 예외 삭제(2026-10-18 독립 검토)'
- 'MOTION-002: 예시 주석을 실제 토큰 값(slow 400ms, fast 200ms)에 맞추고 좋은 예 note 를 ''3회 미만''으로 (2026-10-18 재검증)'
