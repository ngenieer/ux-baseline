id: CF-019
rules:
- LAYOUT-002
against: KWCAG 2.2 6.1.3(컨트롤 대각선 6.0mm 이상 권장), KRDS 버튼·링크·캐러셀(마우스 17×17px, 터치 44×44px 권장)
summary: 포인터 대상 크기 기준이 출처마다 다르다.
principle: 1
decision: 24×24 CSS px 이상(WCAG 2.5.8)을 MUST로 유지한다. 24×24 CSS px 이상인 대상은 대각선이 약 9.0mm(1 CSS px = 0.2646mm)라 KWCAG
  6.1.3 권고(대각선 6.0mm 이상)도 충족한다. 2.5.8 예외(간격·인라인·동등·UA 제어·필수)로 24 CSS px보다 작게 둔 대상은 WCAG 2.5.8로만 판정한다. KRDS의 마우스
  17×17px은 채택하지 않는다. 터치 44×44px(WCAG 2.5.5 AAA)는 별도 SHOULD 후보로 다룬다.
reason: 가장 엄격한 법규·접근성 기준을 하나로 정하면 24 CSS px 이상 대상에서는 나머지도 충족된다(원칙 1). KWCAG 6.1.3 원문은 '모든 콘트롤은 대각선 방향의 길이를 6.0mm
  이상으로 제공하는 것이 바람직하다', '테두리 안쪽으로 1픽셀 이상의 여백을 두고 … 반응하지 않도록 구현하는 것이 바람직하다'로 권고다. 대각선 6.0mm ≈ 22.7 CSS px로 정사각형이면
  한 변 약 16 CSS px이다. 24 CSS px 미만 예외 대상은 이 권고를 충족하지 않을 수 있으나, 권고이므로 체계는 WCAG 2.5.8 기준으로 판정하고 KWCAG 대각선·1px 안쪽 여백은
  권고로 남긴다.
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'CF-019: decision의 ''KWCAG 6.0mm 충족''을 24 CSS px 이상 대상으로 한정, 24px 미만 예외 대상의 KWCAG 권고 처리를 reason에 기록(룰 내용 변경 없음)
  (2026-10-18 독립 검토)'
