id: CF-007
rules:
- FORM-015
- FORM-077
summary: '제출 오류 시 초점 위치: KRDS는 첫 번째 오류 필드(FORM-015), GOV.UK는 페이지 상단 오류 요약(FORM-077). 둘 다 WCAG 3.3.1을 충족한다.'
principle: 2
decision: 페이지 폼은 오류 요약을 표시하고 초점을 요약으로 옮긴다(FORM-077). 오류 요약을 두지 않는 폼(모달 안 폼, 입력 필드가 1개인 폼)은 첫 번째 오류 필드로 초점을 옮긴다(FORM-015).
  KRDS 적용 공공 프로젝트는 오류 요약을 표시하되 초점은 첫 번째 오류 필드로 옮긴다.
reason: 오류가 여럿일 때 요약이 전체를 한 번에 알려 과업 완료에 유리하다(원칙 2). 공공 프로젝트는 KRDS 준수 의무가 있어 KRDS 동작을 따른다.
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'FORM-015: statement 수정'
- 'FORM-077: 예외 추가'
- 'CF-007: 중복 기록된 ''FORM-077: 예외 추가'' 한 줄로 정리 (2026-10-18 독립 검토)'
