id: CF-070
rules:
- COLOR-015
- LAYOUT-026
summary: KRDS 버튼 페이지는 '한 페이지에 최상위 수준의 강조 버튼은 한 번만 사용한다'(COLOR-015)고 하고, KRDS 구조화 목록 페이지는 항목마다 가장 중요한 행동을 최상위 강조
  버튼(CTA)으로 표현하라(LAYOUT-026)고 해, 항목이 여러 개인 목록 화면에서 주조색 채움 버튼이 여러 개가 된다.
principle: 2
decision: 구조화 목록 항목마다 1개인 CTA 는 COLOR-015 의 '한 화면 상태에 주조색 채움 버튼 1개' 계산에서 뺀다. 목록 밖(페이지 머리·폼 하단·알림 등)의 주조색 채움 버튼은
  그대로 세어 1개 이하로 둔다. 한 항목 안의 주조색 채움 버튼은 1개다(LAYOUT-026).
reason: 구조화 목록 페이지는 목록이라는 특정 상황을 직접 다루는 출처라 일반 버튼 지침보다 구체적이고, 항목마다 같은 위치의 같은 행동이 강조되면 사용자는 각 항목에서 바로 목적 행동을 찾는다(원칙
  2 과업 완료). 항목 밖 채움 버튼까지 늘어나면 버튼 페이지가 경고한 '가장 중요한 행동을 찾는 시간'이 늘어나므로 목록 밖은 1개로 묶는다. 접근성 요구와는 부딪히지 않는다. (2026-10-18
  시험 4 T7 독립 검토로 COLOR-015 측정 기준을 정하면서 발견)
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'COLOR-015: type guide → rule, statement·측정 기준에 ''한 화면 상태에 주조색 채움 버튼 1개''(세지 않는 것: 선택 상태 토글, 구조화 목록 CTA) 추가, relations
  에 LAYOUT-026 conflicts(CF-070)'
- 'LAYOUT-026: relations 의 COLOR-015 depends 를 conflicts(CF-070)로 바꿈'
