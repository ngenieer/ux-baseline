id: CF-006
rules:
- FORM-002
- STATE-031
summary: 행동 완료를 감지해 코치마크가 자동으로 다음 단계로 넘어가는 것(STATE-031)이 입력에 따른 맥락 변화(FORM-002)인지.
principle: 1
decision: 양립. 코치마크 지시문에 '행동을 마치면 다음 단계로 넘어간다'는 사실을 쓰고, 단계가 넘어갈 때 키보드 초점을 강제로 옮기지 않는다.
reason: 사전 고지가 있고 초점을 빼앗지 않으면 WCAG 3.2.2 예외 조건을 충족한다. 초점을 옮기지 않으면 화면 낭독 사용자는 단계가 바뀐 것을 알 수 없으므로, 새 단계 지시문은 role=status(aria-live=polite)로
  알리거나 현재 초점 요소의 aria-describedby로 연결한다(WCAG 4.1.3, STATE-031 측정 기준 (4)).
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'STATE-031: statement 수정'
- 'STATE-031: statement·측정 기준 (4) 추가 — 단계 전환을 role=status 또는 aria-describedby로 보조기술에 알림 (2026-10-18 독립 검토)'
