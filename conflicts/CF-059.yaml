id: CF-059
rules:
- A11Y-007
against: 'html-validate no-redundant-role(ul·ol 의 role="list" 를 중복 역할로 오류 처리) vs KRDS 텍스트 목록 접근성 가이드라인 ''list-style-type:
  none 스타일 지정으로 인한 접근성 문제에 유의한다''(PDF 493쪽 — 목록에는 role="list", 항목에는 role="listitem" 명시)'
summary: 'KRDS는 list-style-type: none인 목록을 ''일부 모바일 디바이스 스크린 리더에서 요소의 역할을 탐지하지 못하는 문제''가 있다며 목록에 role="list", 항목에
  role="listitem"을 명시하라고 하는데, 이 체계의 html-validate 설정은 이를 중복 역할 오류로 막는다.'
principle: 1
decision: 'list-style: none 목록(ul·ol)에는 role="list"를 쓴다. lint/.htmlvalidate.json의 no-redundant-role에서 list 역할만 제외(exclude)한다.
  li에는 role="listitem"을 넣지 않는다(KRDS 요구와 다름). A11Y-007 측정 기준 (8)로 넣는다.'
reason: '보조기술에 목록 구조를 전달하는 것(원칙 1)이 검사기의 중복 역할 경고(일관성)보다 우선한다. 다른 중복 역할은 계속 오류로 둔다. KRDS가 항목에 요구한 role="listitem"은
  따르지 않는다: 원문이 든 문제는 목록 요소의 역할 탐지이고, ul·ol의 자식 li는 HTML 기본 역할이 listitem이라 목록에 role="list"를 명시하면 항목 역할도 함께 전달된다고
  본 이 체계의 판단이다(보조기술 조합별 시험은 하지 않았다). li에 role="listitem"을 허용하려고 no-redundant-role에서 listitem까지 빼면 중복 역할 검사 범위가 더
  줄어든다. lint 설정은 바꾸지 않고(list만 제외) 이 기록으로 남기며, 실제 보조기술에서 li 역할이 빠지는 사례가 확인되면 다시 결정한다(2026-10-18 독립 검토). 원문 표현은 ''일부
  모바일 디바이스 스크린 리더''이고 특정 브라우저·스크린 리더를 지목하지 않는다.'
deviates_from_priority: false
date: '2026-10-18'
rule_changes:
- 'A11Y-007: 측정 기준 (8) 추가'
- 'lint/.htmlvalidate.json: no-redundant-role exclude list'
- 'A11Y-007: 측정 기준 (8)의 ''Safari·VoiceOver'' 지목을 KRDS 원문 표현(''일부 모바일 디바이스 스크린 리더'')으로 바꾸고 li에 role을 넣지 않음을 명시, 출처에
  KRDS 텍스트 목록(PDF 493쪽) 추가 (2026-10-18 독립 검토)'
- lint/.htmlvalidate.json prefer-native-element 에서도 list 역할 제외(ol 에 role="list" 를 쓰면 ul 을 쓰라고 오탐), ux-baseline check
  에 list-role 런타임 검사 추가, 컴포넌트 규격 8개(accessible-media·calendar·file-upload·help-panel·language-switcher·step-indicator·tag·tutorial-panel)
  목록에 role="list" 추가 (2026-10-18 시험 4 T7 독립 검토)
