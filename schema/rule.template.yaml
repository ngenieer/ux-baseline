# 룰 템플릿. rules/<CATEGORY>/<ID>.yaml 로 복사해서 쓴다.
# 1단계(collected)는 id·category·stage·status·statement·sources 만 있으면 된다.
# 2단계(normalized)부터 나머지 필드가 필수다. (scripts/validate.py 가 검사)

id: CAT-000                 # 카테고리 약어 + 3자리. 한번 부여하면 바꾸지 않는다
category: CAT
title: 짧은 이름
stage: collected            # collected | normalized | resolved | platformed
status:
  value: candidate          # candidate | confirmed | deprecated
  # reason: 폐기 사유 (deprecated면 필수)
  # superseded_by: CAT-001
type: rule                  # rule(판정 가능) | guide(판정 불가 — MUST 불가)
strength: SHOULD            # MUST | SHOULD | MAY
statement: 한 문장, 명령형으로 쓴다.
measurement:
  criteria: 판정 조건. 수치·셀렉터·체크 방법. "적절히/충분히" 금지
  method: 판정 절차 (수동 체크면 절차를 적는다)
automation:
  feasibility: undecided    # full | partial | none | undecided
  checks:
    - tool: axe-core        # stylelint | axe-core | eslint | custom ...
      rule: 규칙-ID
      method: 변환 방법
  note: ""
rationale: 왜 필요한가
sources:
  - ref: WCAG22             # sources/registry.yaml 의 id
    locator: SC 0.0.0       # 출처 안 위치
    note: ""
scope:
  level: global             # global | component | situation
  targets: []               # 예: ["button", "a[href]"], ["모달 열림 상태"]
exceptions: []
relations: []
#  - type: conflicts        # conflicts | depends | duplicates | refines
#    id: CAT-001
#    decision: CF-001       # 충돌은 3단계에서 반드시 decision 필요
#    note: 결론 요약 — AI가 다시 판단하지 않도록 여기에도 적는다
decisions: []               # 외부 기준과의 충돌 해소 결정(CF-###). 룰 간 결정은 relations[].decision
examples:
  good:
    - lang: html
      code: |
        <!-- 좋은 예 -->
  bad:
    - lang: html
      code: |
        <!-- 나쁜 예 -->
needs_verification: true    # 수치·출처를 원문으로 확인하기 전에는 true
verification_note: 무엇을 확인해야 하는지
korean_specific: false
tags: []
