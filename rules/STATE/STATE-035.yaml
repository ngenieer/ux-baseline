id: STATE-035
category: STATE
title: 바텀시트 용도
stage: platformed
status:
  value: confirmed
type: guide
strength: MAY
statement: 바텀시트는 현재 화면을 유지한 채 하는 일시적인 짧은 상호작용(옵션 선택·부가 정보 확인)에만 쓰고, 오래 검토해야 하는 정보, 항상 필요한 정보·도구, 서비스 절차의 한 단계에는
  쓰지 않는다.
measurement:
  criteria: '점검 질문: (1) 시트 내용이 항상 보여야 하는 정보·도구인가? (2) 서비스 신청 절차의 필수 단계인가? (3) 정책 안내처럼 읽는 데 오래 걸리는 내용인가? — 하나라도 ''예''면
    위반.'
  method: 바텀시트 사용처 목록을 점검 질문으로 검토한다.
automation:
  feasibility: none
  checks: []
  note: ''
rationale: 바텀시트는 화면 일부를 가리는 일시적 UI라 오래 쓰거나 늘 필요한 내용에는 맞지 않는다(KRDS).
sources:
