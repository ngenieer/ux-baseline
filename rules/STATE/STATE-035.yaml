examples:
  good:
  - lang: text
    code: '목록 정렬 기준(최신순·조회순)을 고르는 바텀시트

      '
    note: 현재 화면을 유지한 짧은 옵션 선택이다.
  bad:
  - lang: text
    code: '개인정보 처리방침 전문(30개 조항)을 바텀시트로 표시

      '
    note: 오래 읽어야 하는 내용을 일시적 시트에 담는다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): 바텀시트 component_12_03 용례 ''항상 필요로 하는 정보를
  표시하는 경우·사용자 여정의 한 스텝으로 사용하는 경우 적합하지 않다'', 사용성 ''짧은 상호작용에만 … 바람직하다 … 상당한 시간을 소비해야 하는 경우 사용하지 않는 것이 좋다'' 확인. ''오래
  검토''는 수치 기준이 없어 type: guide, 근거 문장이 ''바람직하다·좋다''라 MAY.'
