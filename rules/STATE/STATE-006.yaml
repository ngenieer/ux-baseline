id: STATE-006
category: STATE
title: 긴급 공지 사용 제한
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 긴급 공지는 STATE-007의 긴급도 상·중·하에 해당하는 내용에만 쓰고, 홍보 콘텐츠, 일반 공지의 전달·강조, 입력 검증 결과·완료 상태 같은 피드백 메시지에는 쓰지 않는다.
measurement:
  criteria: 서비스에 게시된(또는 게시 예정인) 긴급 공지 각각의 내용이 (a) 재난·재해 대응, 예고 없는 장애·이용 중단, (b) 이용 중단 사전 예고, (c) 대부분의 사용자가 알아야 하는
    상황 중 하나다. 폼 검증 결과·완료 메시지를 긴급 공지 컴포넌트로 띄우는 코드가 없다.
  method: 긴급 공지 게시 이력과 긴급 공지 컴포넌트 호출 위치를 검토한다.
automation:
  feasibility: none
  checks: []
  note: 코드 검색으로 폼 검증·완료 처리에서 긴급 공지 컴포넌트를 호출하는지 찾을 수 있음(eslint 커스텀). 내용 분류는 수동.
rationale: 긴급 공지는 메인 메뉴와 히어로 사이에서 주의를 끄는 요소라 남용하면 과업을 방해하고 실제 긴급 상황에서 무시된다(KRDS 긴급 공지).
sources:
- ref: KRDS
  locator: 컴포넌트 > 긴급 공지 > 용례 (가이드라인 PDF 2025.08 360쪽)
  note: https://www.krds.go.kr/html/site/component/component_04_02.html
scope:
  level: component
  targets:
  - 긴급 공지
exceptions: []
relations:
- type: depends
  id: STATE-007
  note: 긴급도 분류가 사용 가능 범위를 정한다
examples:
  good:
  - lang: html
    code: "<section class=\"emergency-notice\" aria-labelledby=\"en-l\">\n  <strong id=\"en-l\">긴급도: 상</strong>\
      \ 태풍으로 10월 18일 18:00까지 방문 접수를 중단합니다. <a href=\"/notice/123\">접수 중단 안내 자세히 보기</a>\n</section>\n"
    note: 재난 대응 내용에만 긴급 공지를 쓴다.
  bad:
  - lang: html
    code: "<section class=\"emergency-notice\" aria-labelledby=\"en-l\">\n  <strong id=\"en-l\">긴급도: 하</strong>\
      \ 회원가입을 마쳤습니다.\n</section>\n"
    note: 완료 피드백 메시지를 긴급 공지 컴포넌트로 띄운다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): 긴급 공지 component_04_02 용례 ''사용하기 적합하지 않은
  경우: 홍보 목적, 일반적인 공지 전달·강조'', ''피드백 메시지 … 사용해서는 안 된다'' 확인. 강도: 피드백 금지는 ''해서는 안 된다''(SHOULD+public-sector-must),
  홍보·일반 공지는 ''적합하지 않은 경우''(MAY 수준)인데 한 룰에 묶여 SHOULD로 둠 — 분리 여부는 제안 파일.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
