id: STATE-008
category: STATE
title: 긴급 공지 게시 기간
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 긴급 공지는 공지 내용과 관련된 기간에만 게시하고, 그 기간이 끝나면 내린다.
measurement:
  criteria: 긴급 공지마다 게시 종료 일시(또는 종료 조건)가 정해져 있고, 종료 일시가 지난 긴급 공지가 화면에 표시되지 않는다.
  method: 긴급 공지 관리 데이터에서 종료 일시 필드를 확인하고, 종료 일시 이후 시각으로 페이지를 열어 표시 여부를 확인한다.
automation:
  feasibility: none
  checks: []
  note: 콘텐츠 관리 시스템에서 종료 일시를 필수 필드로 두고 지난 공지를 자동 숨기면 검사 대상이 운영 데이터가 된다.
rationale: 긴급 공지가 늘 떠 있거나 오래된 내용이 남아 있으면 실제 긴급 상황에서 사용자가 주의를 기울이지 않는다(KRDS).
sources:
- ref: KRDS
  locator: 컴포넌트 > 긴급 공지 > 사용성 가이드라인 (가이드라인 PDF 2025.08 363쪽)
  note: https://www.krds.go.kr/html/site/component/component_04_02.html
scope:
  level: component
  targets:
  - 긴급 공지
exceptions: []
relations: []
examples:
  good:
  - lang: html
    code: "<!-- 관리 데이터: {\"start\":\"2026-10-18T09:00\",\"end\":\"2026-10-18T18:00\"} — end가 지나면 렌더링하지 않는다 -->\n\
      <section class=\"emergency-notice\" aria-labelledby=\"en-l\">\n  <strong id=\"en-l\">긴급도: 상</strong> 태풍으로\
      \ 오늘 18:00까지 방문 접수를 중단합니다.\n</section>\n"
    note: 게시 종료 일시를 정해 두고 기간이 끝나면 내린다.
  bad:
  - lang: html
    code: "<!-- 2026-10-18 현재: 3주 전 끝난 점검 공지가 종료 일시 없이 계속 표시됨 -->\n<section class=\"emergency-notice\" aria-labelledby=\"\
      en-l\">\n  <strong id=\"en-l\">긴급도: 중</strong> 9월 28일 02:00~04:00 정기 점검으로 서비스를 중단합니다.\n</section>\n"
    note: 관련 기간이 끝난 긴급 공지를 계속 게시한다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): 긴급 공지 component_04_02 ''긴급 공지는 공지 내용과
  관련된 기간 동안만 일시적으로 사용해야 한다'' 확인.'
korean_specific: false
