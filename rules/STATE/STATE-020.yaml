id: STATE-020
category: STATE
title: 확정·불확정 진행 표시 선택
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 진행률을 계산할 수 있는 처리(파일 업로드·다운로드처럼 끝 지점이 정해진 처리)에는 진행률 값을 보여주는 확정 진행 표시를 쓰고, 완료 시점을 알 수 없는 처리에는 불확정 진행 표시를
  쓰며, 진행 표시 요소에 접근 가능한 이름을 준다.
measurement:
  criteria: (1a) 확정 진행 표시는 네이티브 <progress value max>로 만들고, value가 화면 표시와 함께 갱신된다. (1b) 원형 확정 스피너처럼 <progress>로 그릴
    수 없는 모양이라 role="progressbar"를 쓴 경우에는 aria-valuenow(필요시 aria-valuemin·aria-valuemax)가 있고, 그 값이 화면 표시와 함께 갱신된다.
    (2) 불확정 진행 표시는 <progress>에 value가 없거나 role="progressbar"에 aria-valuenow가 없다. (3) 진행 표시 요소에 aria-label·aria-labelledby
    또는 label로 접근 가능한 이름이 있다. (4) 바이트 수·처리 건수를 아는 처리에 불확정 표시를 쓰지 않는다.
  method: 업로드·다운로드·일괄 처리 화면에서 진행 표시 마크업과 값 갱신을 확인한다.
automation:
  feasibility: partial
  checks:
  - tool: axe-core
    rule: aria-progressbar-name
    method: role=progressbar의 접근 가능한 이름 존재 검사 — (3)만 해당
  note: (1)(2)(4)는 수동 또는 E2E(진행 중 aria-valuenow 변화 관찰).
rationale: 진행률을 아는데 불확정 표시를 쓰면 사용자가 얼마나 기다릴지 알 수 없다. ARIA 1.2는 값을 알면 aria-valuenow를 주고 모르면 생략하라고 쓴다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 스피너 > 유형 — '확정 스피너는 … 진행률을 계산할 수 있는 경우에 사용한다', '불확정 스피너는 계산할 수 없는 대기 시간을 표현할 때 사용한다' (가이드라인 PDF 2025.08 590쪽)
  note: https://www.krds.go.kr/html/site/component/component_07_02.html
- ref: NNG_RESPONSE_TIMES
  locator: 10 seconds; 보강 절 'percent-done indicator as well as a clearly signposted way ... to interrupt'
  note: '같은 요구: 완료까지 10초 이상 걸릴 수 있는 작업에는 진행률(%·단계 수·처리 건수)을 보여주는 확정 진행 표시와 작업 중단 수단을 함께 제공한다.'
- ref: NNG_PROGRESS
  locator: 'Percent-done animation: 10 seconds or more'
  note: '같은 요구: 완료까지 10초 이상 걸릴 수 있는 작업에는 진행률(%·단계 수·처리 건수)을 보여주는 확정 진행 표시와 작업 중단 수단을 함께 제공한다.'
- ref: MYERS_1985
  locator: 3.4 Results
  note: '진행 표시 선호 p=0.0006 — 10초 임계값의 근거는 아님 — 같은 요구: 완료까지 10초 이상 걸릴 수 있는 작업에는 진행률(%·단계 수·처리 건수)을 보여주는 확정 진행 표시와
    작업 중단 수단을 함께 제공한다.'
- ref: WAI_ARIA_12
  locator: progressbar role (name required; aria-valuenow SHOULD, omit when indeterminate SHOULD)
  note: '같은 요구: 진행 막대(role="progressbar" 또는 <progress>)에는 접근 가능한 이름을 주고, 진행률을 알면 aria-valuenow(필요시 aria-valuemin·aria-valuemax)를
    화면 표시와 함께 갱신하며, 진행률을 모르면 aria-valuenow를 넣지 않는다.'
scope:
  level: component
  targets:
  - progress
  - '[role=progressbar]'
  - 스피너
exceptions: []
relations:
- type: refines
  id: STATE-002
- type: depends
  id: MOTION-003
  note: 확정 스피너 채움 방향·완료 시 숨김
- type: conflicts
  id: PERF-018
  note: '선택 순서: 화면(페이지) 로드 → 스켈레톤, 끝 지점을 아는 처리 → 확정 진행 표시, 끝을 모르는 처리 → 불확정 진행 표시.'
  decision: CF-016
examples:
  good:
  - lang: html
    code: '<label for="up">증빙 서류 업로드</label>

      <progress id="up" value="42" max="100">42%</progress>

      '
    note: 끝을 아는 업로드에 값이 있는 확정 진행 표시와 이름을 준다.
  bad:
  - lang: html
    code: '<!-- 업로드 바이트 수를 아는데 값 없는 불확정 표시만 둔다 -->

      <label for="up">증빙 서류 업로드</label>

      <progress id="up"></progress>

      '
    note: 진행률을 계산할 수 있는 처리에 불확정 진행 표시를 쓴다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): 스피너 component_07_02 유형 설명 확인. WAI-ARIA
  1.2 progressbar 절(''SHOULD supply a value for aria-valuenow unless the value is indeterminate … SHOULD omit'')
  curl로 확인. NN/g 10초 기준(Myers 1985는 임계값 근거 아님)은 statement에 넣지 않았다 — BACKLOG ''진행 표시 선택 기준(STATE 진행률 계산 가능 여부 vs
  PERF 1/10초)''은 3단계에서 결합 규칙을 정한다. 10초 이상 작업의 중단 수단 요구는 별도 룰 후보(제안 파일).'
korean_specific: false
tags:
- krds
- krds-component
- wai-aria
decisions:
- CF-060
