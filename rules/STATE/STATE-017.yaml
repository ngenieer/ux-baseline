id: STATE-017
category: STATE
title: 탭 비활성 금지
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 탭에 비활성(사용 불가) 상태를 쓰지 않고, 표시할 콘텐츠가 없는 탭은 삭제하거나 그 탭의 패널에 콘텐츠가 없는 이유를 텍스트로 표시한다.
measurement:
  criteria: '[role=tab] 요소에 disabled·aria-disabled="true"가 없다. 모든 [role=tabpanel]이 콘텐츠를 갖거나, 콘텐츠가 없는 이유를 설명하는 텍스트를
    갖는다.'
  method: 탭 컴포넌트의 각 탭을 선택해 패널 내용을 확인하고 탭 속성을 검사한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 커스텀 검사: [role=tab][aria-disabled=true], [role=tab][disabled] 존재 시 실패. 빈 패널의 ''이유 텍스트'' 여부는 수동.'
rationale: 비활성 탭은 왜 쓸 수 없는지 알 수 없어 혼동을 준다(KRDS 탭).
sources:
- ref: KRDS
  locator: 컴포넌트 > 탭 > 사용성 가이드라인 (가이드라인 PDF 2025.08 451쪽)
  note: https://www.krds.go.kr/html/site/component/component_04_10.html
scope:
  level: component
  targets:
  - '[role=tab]'
  - '[role=tabpanel]'
  - 탭
exceptions: []
relations:
- type: refines
  id: STATE-041
  note: 탭 패널이 비었을 때의 빈 상태 표시
examples:
  good:
  - lang: html
    code: "<button role=\"tab\" id=\"t-2\" aria-selected=\"true\" aria-controls=\"p-2\">처리 완료</button>\n<div role=\"\
      tabpanel\" id=\"p-2\" aria-labelledby=\"t-2\">\n  <p>아직 처리된 신청이 없습니다. 신청이 처리되면 여기에 표시됩니다.</p>\n</div>\n"
    note: 탭을 비활성화하지 않고 패널에 콘텐츠가 없는 이유를 쓴다.
  bad:
  - lang: html
    code: '<button role="tab" id="t-2" aria-selected="false" aria-disabled="true">처리 완료</button>

      '
    note: 탭을 비활성 상태로 둬 왜 쓸 수 없는지 알 수 없다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): 탭 component_04_10 ''탭에 사용 불가 상태를 사용하지
  않는다. … 해당 탭을 삭제하거나 … 이유에 대한 설명을 제공하여 … 해야 한다'' 확인. 수집 때 ''같은 요구''로 붙은 Carbon ''빈 상태는 원래 컴포넌트를 대체'' 출처는 다른 요구라
  빼고 제안 파일에 새 룰 후보로 옮김.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
