id: STATE-022
category: STATE
title: 스피너 위치
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 스피너는 처리가 일어나는 영역 안(제출 처리는 제출 버튼 안에 둘 수도 있다)에 두고, 페이지 전체나 맥락이 바뀌는 영역 전체를 불러올 때는 화면 또는 그 영역의 가운데에 둔다.
measurement:
  criteria: (1) 부분 갱신 스피너는 갱신되는 영역(또는 그 영역을 일으킨 버튼)의 DOM 하위에 있다. (2) 전체 로딩 스피너의 중심 좌표가 뷰포트 또는 대상 영역의 중심 좌표와 같다(가운데
    정렬 CSS로 배치).
  method: 스피너 표시 상태에서 요소 위치(getBoundingClientRect)를 대상 영역과 비교한다.
automation:
  feasibility: none
  checks: []
  note: E2E에서 스피너와 대상 영역 rect 비교로 검사 가능.
rationale: 사용자가 주의를 기울일 위치에 스피너가 있어야 어떤 부분이 처리 중인지 안다(KRDS).
sources:
- ref: KRDS
  locator: 컴포넌트 > 스피너 > 사용성 가이드라인 (가이드라인 PDF 2025.08 589·593쪽)
  note: https://www.krds.go.kr/html/site/component/component_07_02.html
scope:
  level: component
  targets:
  - 스피너
exceptions: []
relations: []
examples:
  good:
  - lang: css
    code: '.region { position: relative; }

      .region > .spinner { position: absolute; inset: 0; margin: auto; } /* 갱신 영역 안 가운데 */

      '
    note: 스피너를 갱신되는 영역 안 가운데에 둔다.
  bad:
  - lang: css
    code: '/* 목록 영역만 갱신하는데 화면 우상단 고정 위치에 스피너 */

      .spinner { position: fixed; inset-block-start: var(--space-gap-2); inset-inline-end: var(--space-gap-2); }

      '
    note: 처리 영역과 떨어진 화면 구석에 스피너를 둔다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): 스피너 component_07_02 ''스피너는 처리가 진행 중인 영역
  근처에 배치한다 … 제출 버튼 내부에 스피너를 사용할 수 있다'', 용례 ''화면 중앙 또는 맥락이 변경되는 콘텐츠 영역 중앙에 배치'' 확인. ''근처''를 판정 가능하게 ''영역 안''으로 바꿈. (2026-10-18 KRDS PDF 대조) 이전: statement ''(제출 처리는 제출 버튼 안)''
  → 원문 593쪽: ''입력폼의 제출 처리 상태를 표시하기 위해서는 제출 버튼 내부에 스피너를 사용할 수 있다''(허용 표현) — 괄호를 ''둘 수도 있다''로 고침. 측정 기준 (1)은 이미 영역
  또는 버튼 하위를 모두 허용해 바꾸지 않음.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
