id: STATE-012
category: STATE
title: 승인 요청 모달은 X 버튼 없음
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 사용자가 응답해야 다음 절차로 갈 수 있는 승인 요청 모달에는 'X' 닫기 버튼을 두지 않고, 정보를 수락하거나 거절하는 액션 버튼으로만 닫히게 한다.
measurement:
  criteria: 승인 요청 모달에 닫기(X) 버튼이 없고, 수락·거절 액션 버튼이 각각 1개 이상 있으며, 각 액션 버튼이 모달을 닫고 정해진 다음 상태(이전 상태 또는 다른 절차)로 이동한다.
  method: 승인 요청 모달을 띄워 버튼 구성과 각 버튼의 결과를 확인한다.
automation:
  feasibility: none
  checks: []
  note: 컴포넌트 규격에서 variant=approval이면 닫기 버튼 슬롯을 비활성화하도록 만들 수 있음.
rationale: 승인 요청 모달은 사용자가 정보를 확인·응답하지 않고 다음 절차로 넘어가는 것을 막는 수단이라 응답 없이 닫는 경로를 두지 않는다(KRDS 모달 유형).
sources:
- ref: KRDS
  locator: 컴포넌트 > 모달 > 유형 '프로세스 진행 전에 사용자의 승인이 필요할 때' — ''X' 아이콘으로 표현되는 닫기 버튼은 제공되지 않으며 … 수용하거나 거절하여 … 액션 버튼이 제공된다' (가이드라인 PDF 2025.08 389쪽)
  note: https://www.krds.go.kr/html/site/component/component_04_05.html
scope:
  level: component
  targets:
  - 승인 요청 모달
exceptions: []
relations:
- type: depends
  id: A11Y-012
  note: X 버튼이 없어도 키보드로 액션 버튼에 접근해 모달을 벗어날 수 있어야 한다
examples:
  good:
  - lang: html
    code: "<dialog aria-labelledby=\"t\">\n  <h2 id=\"t\">개인정보 수집·이용에 동의하시겠습니까?</h2>\n  <button type=\"button\"\
      >동의</button><button type=\"button\">동의 안 함</button>\n</dialog>\n"
    note: 승인 요청을 수락·거절 버튼으로만 닫는다.
  bad:
  - lang: html
    code: "<dialog aria-labelledby=\"t\">\n  <h2 id=\"t\">개인정보 수집·이용에 동의하시겠습니까?</h2>\n  <button type=\"button\"\
      \ aria-label=\"닫기\">×</button>\n  <button type=\"button\">동의</button><button type=\"button\">동의 안 함</button>\n\
      </dialog>\n"
    note: X 버튼이 있어 응답 없이 닫혀 다음 상태가 정해지지 않는다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): 모달 component_04_05 유형 설명 확인. 원문은 유형 정의(''제공되지
  않으며'')로 완화 표현이 없어 SHOULD+public-sector-must. KRDS 상호작용 표는 ''Esc는 닫기 버튼이 제공되는 경우 닫기 동작''이라 승인 모달의 Esc 동작은 정의돼 있지
  않음 — 측정 기준에 넣지 않음.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
decisions:
- CF-035
