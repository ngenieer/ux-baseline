id: STATE-014
category: STATE
title: 배지 1개
stage: platformed
status:
  value: confirmed
type: rule
strength: MAY
statement: 한 항목 컨테이너(목록 항목·표 행·카드·글·구역 등)에 보이는 배지를 1개만 붙인다.
measurement:
  criteria: (1) 배지의 항목 컨테이너는 배지에서 가장 가까운 조상 중 li, tr, [role=listitem], [role=row], article, section, dialog, .card(카드
    컴포넌트 루트) 에 맞는 요소다. 이런 조상이 없으면 배지의 부모 요소를 항목 컨테이너로 본다. (2) 같은 항목 컨테이너를 가장 가까운 컨테이너로 가지는 보이는 배지(.badge, hidden·display:none
    제외)가 1개 이하다. 하위 항목 컨테이너 안의 배지는 그 하위 컨테이너에서 센다. (3) 'AI 생성'처럼 법령 표시(AI-002)를 .badge 로 만들었으면 그것도 센다 — AI-002 는
    배지가 아닌 제목·캡션 텍스트로도 충족된다. (4) 배지가 나타나는 모든 화면 상태에서 판정한다.
  method: 배지가 나타나는 화면 상태마다 보이는 .badge 의 가장 가까운 항목 컨테이너를 찾아 컨테이너별 개수를 센다.
automation:
  feasibility: none
  checks: []
  note: '4단계 커스텀 검사 후보: 보이는 .badge 마다 closest(''li, tr, [role=listitem], [role=row], article, section, dialog, .card'')
    (없으면 parentElement)로 묶어 개수 ≤ 1 확인.'
rationale: 한 항목에 배지가 여러 개면 강조가 분산돼 배지가 정보 훑어보기를 돕지 못한다(KRDS 배지).
sources:
- ref: KRDS
  locator: 컴포넌트 > 배지 > 사용성 가이드라인
  note: https://www.krds.go.kr/html/site/component/component_04_06.html
scope:
  level: component
  targets:
  - 배지
  - .badge
exceptions: []
relations: []
examples:
  good:
  - lang: html
    code: '<li>2026 청년 지원사업 <span class="badge">접수 중</span></li>

      '
    note: 항목 하나에 배지 1개만 붙인다.
  - lang: html
    code: "<section aria-labelledby=\"rt\">\n  <h2 id=\"rt\">요약 결과</h2>\n  <span class=\"badge badge--information\"\
      >AI 생성 · 사용자가 고침</span>\n  <ol><li>신청 기한은 30일입니다. <span class=\"badge badge--warning\">확인 필요</span></li></ol>\n\
      </section>"
    note: 구역(section)에 배지 1개, 목록 항목(li)에 배지 1개 — 각 항목 컨테이너에서 1개씩이다.
  bad:
  - lang: html
    code: '<li>2026 청년 지원사업 <span class="badge">신규</span><span class="badge">접수 중</span><span class="badge">인기</span></li>

      '
    note: 한 항목에 배지 3개를 붙여 어느 상태가 중요한지 흐려진다.
  - lang: html
    code: "<section aria-labelledby=\"rt\">\n  <div class=\"result__head\">\n    <h2 id=\"rt\">요약 결과</h2>\n    <span\
      \ class=\"badge badge--information\">AI 생성</span>\n    <span class=\"badge badge--gray\">사용자가 고침</span>\n\
      \  </div>\n</section>"
    note: 가장 가까운 항목 컨테이너(section)에 보이는 배지가 2개다(법령 표시 'AI 생성' 배지도 센다).
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): 배지 component_04_06 ''하나의 요소에 한 개의 배지를
  사용한다 … 한 번만 사용하는 것이 적절하다'' 확인. 근거 문장이 ''적절하다''라 MAY. (2026-10-18 T5 검토 반영) 결과 머리에 ''AI 생성''+''사용자가 고침'' 배지 2개를
  붙인 화면에서 ''항목 컨테이너''가 정의되지 않아 판정이 갈렸다 → 항목 컨테이너를 가장 가까운 조상 셀렉터로 정의하고, 법령 표시 배지도 센다고 정했다. 법령 표시를 세도 AI-002(법규, 우선순위
  1)와 충돌하지 않는다 — AI-002 는 배지가 아닌 텍스트 표시로 충족되므로 두 룰을 함께 지킬 수 있다. 셀렉터 목록은 KRDS ''하나의 요소''를 판정하기 위한 체계 정의다.'
korean_specific: false
tags:
- krds
- krds-component
