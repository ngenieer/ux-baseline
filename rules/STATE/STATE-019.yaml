id: STATE-019
category: STATE
title: 스피너는 실제 대기에만
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 스피너는 처리 중인 작업이 있어 사용자가 기다려야 하는 동안에만 표시하고, 장식이나 화면 전환 연출로 쓰지 않는다.
measurement:
  criteria: (1) 스피너를 보이게 하는 코드는 처리 작업(네트워크 요청, 백그라운드 job, 시연·테스트에서 그 작업 자리에 들어간 목 함수)을 시작한 뒤에만 실행된다. (2) 스피너를 숨기는
    코드가 그 작업의 종료(Promise 완료·실패, job 완료 이벤트, 취소·중단)에 묶여 있다. (3) 스피너를 숨기는 조건이 처리 작업과 무관한 고정 시간 타이머뿐인 코드가 없다. 표시를 늦추는
    타이머(STATE-002 의 1초 뒤 표시)와 목 함수 안에서 응답 지연을 흉내 내는 타이머는 (3)에 해당하지 않는다. 목 함수는 실제 작업이 들어갈 호출 자리에서 같은 시작·종료 인터페이스(Promise·콜백·이벤트)로
    호출될 때만 처리 작업으로 본다.
  method: 스피너 표시·숨김 코드를 모두 찾아 각각이 어떤 처리 작업의 시작·종료에 묶였는지 기록한다(코드 검토). 실행 중에는 성능 패널 녹화로 스피너 표시 구간이 요청·처리 구간 안에 있는지
    비교한다.
automation:
  feasibility: none
  checks: []
  note: 'eslint 커스텀 후보: 스피너 숨김이 Promise·이벤트 종료 처리 밖에서 setTimeout 콜백으로만 일어나면 경고(목 함수 내부 타이머와 표시 지연 타이머는 제외).'
rationale: 빠르게 표시될 수 있는 화면에 스피너를 보여주면 주의가 흩어진다(KRDS 스피너).
sources:
- ref: KRDS
  locator: 컴포넌트 > 스피너 > 사용성 가이드라인
  note: https://www.krds.go.kr/html/site/component/component_07_02.html
scope:
  level: component
  targets:
  - 스피너
exceptions: []
relations:
- type: refines
  id: STATE-002
  note: 진행 표시 중 스피너의 표시 조건을 실제 대기로 한정
examples:
  good:
  - lang: js
    code: 'spinner.hidden = false;

      try { await fetch(url); } finally { spinner.hidden = true; }

      '
    note: 실제 요청이 진행되는 동안에만 스피너를 보인다.
  - lang: js
    code: '// 시연 화면: 실제 요청 자리에 같은 Promise 인터페이스의 목 함수를 넣는다

      const summarize = DEMO ? (doc) => new Promise((ok) => setTimeout(() => ok(SAMPLE), 1200)) : requestSummary;

      spinner.hidden = false;

      try { await summarize(doc); } finally { spinner.hidden = true; }

      '
    note: 스피너가 목 함수(처리 작업 자리)의 시작·종료에 묶여 있다. 목 안의 지연 타이머는 응답을 흉내 낼 뿐 스피너를 직접 숨기지 않는다.
  bad:
  - lang: js
    code: '// 데이터가 이미 있는데 연출용으로 1.5초 스피너 표시

      spinner.hidden = false;

      setTimeout(() => { spinner.hidden = true; }, 1500);

      '
    note: 처리 없이 타이머만으로 스피너를 보여 기다리게 한다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): 스피너 component_07_02 ''스피너를 장식용으로 사용하지
  않는다. 스피너는 실제 대기 상태가 필요한 경우에 사용해야 한다'' 확인. (2026-10-18 T5 검토 반영) ''처리 없이 타이머만으로 스피너를 보여주는 코드가 없다''가 시연·목 화면(타이머로
  응답을 흉내 냄)에서 문자 그대로 위반으로 읽혀 판정이 갈렸다 → 스피너 표시·숨김이 처리 작업(요청·job·그 자리에 들어간 목 함수)의 시작·종료에 묶였는지로 기준을 바꾸고, 표시 지연 타이머(STATE-002)와
  목 내부 지연 타이머는 위반이 아님을 명시했다. KRDS ''실제 대기 상태가 필요한 경우에 사용'' 요구는 그대로다 — 데이터가 이미 있는데 고정 시간만 보여 주는 연출은 여전히 실패.'
korean_specific: false
