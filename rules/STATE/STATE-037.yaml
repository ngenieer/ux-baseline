id: STATE-037
category: STATE
title: 토스트를 쓰지 않는 경우
stage: platformed
status:
  value: confirmed
type: rule
strength: MAY
statement: 토스트에는 사라진 뒤에도 화면의 다른 곳에서 확인할 수 있는 결과만 담고, 중요하거나 긴급한 메시지는 토스트 대신 긴급 공지나 모달로, 사용자가 반드시 읽고 확인해야 하는 설명은 모달로,
  개별 입력 항목의 오류·성공·경고 메시지는 해당 입력 필드 옆 인라인 텍스트로 제공한다.
measurement:
  criteria: (1) 토스트 텍스트가 한 문장(마침표 1개 이하)이다. (2) STATE-007 긴급도 분류에 해당하는 메시지와 사용자 확인이 필요한 메시지를 토스트로 띄우지 않는다. (3) 폼
    필드 검증 메시지를 토스트로 띄우지 않는다. (4) 토스트로 알린 결과는 토스트가 사라진 뒤에도 같은 화면 또는 한 번의 이동으로 갈 수 있는 화면(목록의 바뀐 항목, 상태 표시, 알림 목록 등)에서
    확인할 수 있다. (4)를 충족하지 않는 자동 사라짐 토스트는 시간 제한 콘텐츠로 보고 A11Y-014(MUST)로 판정한다.
  method: 토스트를 호출하는 코드와 메시지 목록을 검토하고, 메시지마다 토스트가 사라진 뒤 같은 결과를 확인할 수 있는 위치를 적는다.
automation:
  feasibility: none
  checks: []
  note: 'eslint 커스텀: 토스트 함수 인자 문자열의 문장 수 검사, 폼 검증 핸들러 안 토스트 호출 금지.'
rationale: 토스트는 잠깐 보였다 사라지는 행동 결과 알림이라 중요한 정보·긴 설명·필드별 오류를 전달하면 놓친다(KRDS 토스트).
sources:
- ref: KRDS
  locator: 컴포넌트 > 토스트 > 용례
  note: https://www.krds.go.kr/html/site/component/component_12_05.html
- ref: WCAG22_UNDERSTANDING
  locator: Understanding 2.2.1 Timing Adjustable (toast 예)
  note: '''Users are able to identify the arrival of email through other means … so the disappearance of the message
    does not set a time limit'' — 측정 기준 (4)의 근거'
scope:
  level: component
  targets:
  - 토스트
exceptions: []
relations:
- type: conflicts
  id: COPY-050
  note: '메시지 종류는 중요도로 먼저 나눈다: 반드시 읽고 확인해야 하는 내용 → 모달, 그렇지 않은 두 줄 이상 또는 추가 행동이 필요한 결과 알림 → 스낵바, 한 줄 결과 알림 → 토스트.'
  decision: CF-004
- type: depends
  id: STATE-006
examples:
  good:
  - lang: html
    code: '<div class="toast" role="status">저장했습니다</div>

      <!-- 같은 화면 문서 목록의 해당 행에 ''저장됨 10:42'' 상태가 표시된다 -->

      '
    note: 토스트에는 한 문장의 행동 결과만 넣고, 같은 결과를 화면의 다른 곳에서도 확인할 수 있다.
  bad:
  - lang: html
    code: '<!-- 비밀번호 필드 검증 메시지를 토스트로 띄운다 -->

      <div class="toast" role="status">비밀번호는 8자 이상 입력하세요.</div>

      '
    note: 개별 필드 검증 메시지를 필드 옆이 아닌 토스트로 보낸다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): 토스트 component_12_05 용례 ''중요하거나 긴급한 메시지
  … 긴급공지 혹은 모달을 사용하는 것이 적합하다'', ''한 문장 이상의 긴 설명 … 모달을 사용하는 것이 적합하다'', ''개별 입력 양식에 대한 오류·성공·경고 메시지 … 인라인 텍스트 방식''
  확인. 근거 문장이 ''적합하다''라 MAY. 같은 용례의 필드별 메시지 항목을 statement에 추가. 2026-10-18 독립 검토: 토스트가 시간 제한이 되지 않는 전제(같은 정보를 다른 곳에서
  확인)를 statement·측정 기준 (4)로 추가(CF-030, WCAG Understanding 2.2.1 curl 확인).'
korean_specific: false
tags:
- krds
- krds-component
decisions:
- CF-030
