id: STATE-045
category: STATE
title: 오프라인 시 부분 제한
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 오프라인 상태가 되면 네트워크가 필요한 동작(구매·제출·동기화)만 비활성화하거나 연결 후 처리할 대기열에 넣고, 이미 불러온 콘텐츠는 계속 볼 수 있게 하며, 화면 전체를 덮는 모달로
  이용을 막지 않는다.
measurement:
  criteria: 개발자 도구 네트워크 '오프라인' 전환 후 (1) 이미 렌더링된 콘텐츠를 스크롤·열람할 수 있다. (2) 화면 전체를 덮는 모달·오버레이가 나타나지 않는다. (3) 네트워크가 필요한
    버튼은 disabled 또는 aria-disabled="true"이고 이유 텍스트가 있거나, 누르면 '연결되면 처리됩니다' 같은 대기 상태 메시지와 함께 대기열에 들어간다.
  method: 페이지를 연 뒤 오프라인으로 바꿔 위 항목을 확인하고, 다시 온라인으로 바꿔 대기열 처리 여부를 확인한다.
automation:
  feasibility: none
  checks: []
  note: 'E2E: Playwright context.setOffline(true) 후 전체 화면 오버레이 부재·버튼 상태 검사.'
rationale: 연결이 불안정할 때 화면 전체를 막으면 사용자는 아무것도 할 수 없다. 연결이 필요한 기능만 제한해야 과업을 이어갈 수 있다(web.dev 오프라인 UX).
sources:
- ref: WEBDEV_OFFLINE
  locator: Reflect context in the UI; Don't block content
scope:
  level: situation
  targets:
  - 네트워크 연결 끊김
  - 이미 로드된 페이지·오프라인 캐시가 있는 웹앱
exceptions: []
relations:
- type: depends
  id: STATE-001
  note: 연결 끊김·복구 알림은 상태 메시지로 전달
examples:
  good:
  - lang: html
    code: '<button type="button" disabled aria-describedby="off">결제하기</button>

      <p id="off" role="status">인터넷 연결이 끊겨 결제할 수 없습니다. 연결되면 다시 시도하세요.</p>

      '
    note: 네트워크가 필요한 동작만 막고 이유를 알리며 나머지 화면은 그대로 쓸 수 있다.
  bad:
  - lang: html
    code: "<div class=\"overlay\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"off-t\" style=\"position:\
      \ fixed; inset: 0\">\n  <h2 id=\"off-t\">인터넷 연결이 끊겼습니다</h2>\n</div>\n"
    note: 화면 전체를 덮는 모달로 이미 불러온 콘텐츠까지 막는다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(web.dev Offline UX design guidelines curl 확인): ''disables pricing and the Buy
  button until a connection is reestablished'', ''Don''t block content … intrusive loading modal dialog that covers
  the entire screen'', ''Let the user continue to browse your app and queue tasks'' 확인. 2016년 글. 적용 범위를 ''이미 로드된
  페이지·오프라인 캐시가 있는 웹앱''으로 한정(1단계 메모의 범위 정의 문제 해소).'
korean_specific: false
tags:
- research-state_copy_resp
