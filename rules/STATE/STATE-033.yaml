id: STATE-033
category: STATE
title: 바텀시트 닫기 버튼
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 바텀시트에는 스와이프와 별도로 '닫기' 버튼(텍스트 '닫기' 또는 접근 가능한 이름이 '닫기'인 X 아이콘 버튼)을 넣고, 그 버튼을 시트 상단에 둔다.
measurement:
  criteria: 열린 바텀시트 안에 접근 가능한 이름이 '닫기'인 button이 있고, 시트의 헤더(상단) 영역에 있다. 이 버튼을 누르면 시트가 닫힌다.
  method: 바텀시트를 열어 버튼 존재·이름·위치를 확인한다.
automation:
  feasibility: partial
  checks:
  - tool: axe-core
    rule: button-name
    method: 아이콘 버튼의 접근 가능한 이름 존재만 검사
  note: 버튼 존재·상단 위치는 커스텀 검사(시트 규격 셀렉터의 header 안 button).
rationale: 핸들 스와이프로 닫는 방법을 모든 사용자가 알지 못하므로 화면에서 인지하기 쉬운 닫기 버튼이 필요하다(KRDS 바텀시트).
sources:
- ref: KRDS
  locator: 컴포넌트 > 바텀시트 > 사용성 가이드라인
  note: https://www.krds.go.kr/html/site/component/component_12_03.html
scope:
  level: component
  targets:
  - 바텀시트
exceptions: []
relations:
- type: depends
  id: STATE-011
  note: 제출·확정형 바텀시트의 닫기는 취소와 같게
examples:
  good:
  - lang: html
    code: "<div role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"bs-t\" class=\"bottom-sheet\">\n  <header><h2\
      \ id=\"bs-t\">정렬</h2><button type=\"button\" aria-label=\"닫기\">×</button></header> …\n</div>\n"
    note: 시트 상단에 이름이 "닫기"인 버튼을 둔다.
  bad:
  - lang: html
    code: "<div role=\"dialog\" aria-modal=\"true\" aria-label=\"정렬\" class=\"bottom-sheet\">\n  <div class=\"handle\"\
      ></div> … <!-- 닫기 버튼 없음, 스와이프로만 닫힘 -->\n</div>\n"
    note: 스와이프로만 닫혀 키보드·보조기술 사용자가 닫을 수 없다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): 바텀시트 component_12_03 ''닫기 버튼을 포함하여 구현하여야
  한다 … 바텀 시트 상단에 ''닫기'' 또는 ''X'' 버튼을 포함하여 구성하는 것이 좋다'' 확인. 포함은 ''하여야 한다''(SHOULD), 상단 배치는 ''좋다''(MAY 수준)인데 한 룰로
  두고 SHOULD — 3단계에서 분리 여부 검토.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
