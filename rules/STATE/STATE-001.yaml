id: STATE-001
category: STATE
title: 상태 메시지
stage: platformed
status:
  value: confirmed
type: rule
strength: MUST
statement: 초점을 옮기지 않고 화면에 표시하는 상태 메시지(작업 결과, 대기 상태, 진행 상황, 오류 발생 알림)는 role(status·alert·log·progressbar) 또는 aria-live
  속성으로 지정해 보조기술이 초점 이동 없이 사용자에게 전달할 수 있게 한다.
measurement:
  criteria: 작업 결과·대기·진행·오류를 알리는 텍스트가 초점 이동이나 페이지 새로고침 없이 추가·변경될 때, 그 텍스트 노드 또는 조상 요소에 role="status"|"alert"|"log"|"progressbar"
    또는 aria-live="polite"|"assertive"가 있고, 스크린 리더가 초점 이동 없이 그 텍스트를 읽는다. 입력하는 동안 바뀌는 조건 충족 안내(비밀번호 조건 '(충족)' 등)와
    필드 옆 확인 버튼 결과('사용할 수 있는 아이디입니다')도 사용자 동작의 결과라 상태 메시지다 — 필드의 aria-describedby 연결은 초점을 받을 때만 읽히므로 그것만으로는 실패이고,
    그 텍스트가 role="status" 또는 aria-live="polite" 영역 안에 있어야 한다(FORM-080, CF-068).
  method: 화면의 상태 메시지 목록을 만들고 각 메시지를 발생시킨다. DOM 검사로 role·aria-live를 확인하고, 스크린 리더(NVDA+Chrome 또는 VoiceOver+Safari)에서
    초점을 움직이지 않은 채 메시지가 읽히는지 확인한다.
automation:
  feasibility: none
  checks: []
  note: 'axe-core에 4.1.3 규칙 없음(WCAG 추출본 axe_rules 비어 있음). 4단계 커스텀 검사: Playwright로 동작을 일으킨 뒤 새 메시지 노드의 closest(''[role=status],[role=alert],[role=log],[role=progressbar],[aria-live]'')가
    존재하고 동작 전부터 있었는지 검사. live 컨테이너를 메시지보다 먼저 DOM에 두는 구현 요건, 진행·완료 문구에 assertive 금지는 WCAG 요구가 아니라 KRDS·ARIA 기반이라
    별도 SHOULD 룰 후보로 분리(제안 파일).'
rationale: 초점을 받지 않는 메시지는 화면을 보지 않는 사용자에게 전달되지 않는다. WCAG 2.2 SC 4.1.3(AA)은 상태 메시지를 role·속성으로 판별 가능하게 하라고 요구한다.
sources:
- ref: WCAG22
  locator: SC 4.1.3 Status Messages (Level AA)
  note: https://www.w3.org/TR/WCAG22/#status-messages
- ref: WCAG22_UNDERSTANDING
  locator: https://www.w3.org/WAI/WCAG22/Understanding/status-messages.html
- ref: KRDS
  locator: 기본 패턴 > 필터링·정렬 > 접근성 가이드라인 (가이드라인 PDF 2025.08 876쪽)
  note: https://www.krds.go.kr/html/site/global/global_10.html — 검색 결과 수 안내에 live-region 적용(가이드라인 PDF 876쪽은 aria-live="assertive"를
    쓰라고 함). 사용자 피드백 패턴(PDF 810쪽)·스피너(PDF 595쪽)는 aria-live="polite"
- ref: KRDS
  locator: 컴포넌트 (여러 페이지) (가이드라인 PDF 2025.08 595쪽)
  note: '같은 요구를 다루는 KRDS 컴포넌트: 스피너 — 상세는 sources/extracts/KRDS-components.yaml'
- ref: CSS_VIEW_TRANSITIONS_1
  locator: view transition tree는 접근성 트리에 노출되지 않음(3절 및 변경 이력)
  note: '하위 사례(4.1.3의 구체 적용, 별도 룰 분리 후보): 화면 전환 애니메이션으로만 정보(항목의 추가·삭제·이동 방향, 현재 위치)를 전달하지 않고, 전환 후 DOM의 텍스트·상태 메시지·초점
    위치로도 같은 정보를 전달한다.'
- ref: REACT_USEOPTIMISTIC
  locator: What happens when the Action fails; 'Adding...' pending 표시 예시
  note: '하위 사례(4.1.3의 구체 적용, 별도 룰 분리 후보): 낙관적 UI로 서버 응답 전에 결과를 먼저 보여줄 때는 처리 중 항목을 시각·텍스트로 구분하고, 요청이 실패하면 화면을 이전
    상태로 되돌린 뒤 실패 사실과 재시도 수단을 알린다.'
- ref: WCAG22_TECH_ARIA23
  locator: ARIA23 Example 1 (chat)
  note: '하위 사례(4.1.3의 구체 적용, 별도 룰 분리 후보): AI 대화 기록 컨테이너에 role="log"와 접근 가능한 이름(aria-label 또는 aria-labelledby)을 주고,
    새 메시지는 컨테이너 끝에만 추가한다.'
- ref: MDN_ARIA_LOG
  locator: log role — implicit aria-live=polite, append only, name required
  note: '하위 사례(4.1.3의 구체 적용, 별도 룰 분리 후보): AI 대화 기록 컨테이너에 role="log"와 접근 가능한 이름(aria-label 또는 aria-labelledby)을 주고,
    새 메시지는 컨테이너 끝에만 추가한다.'
- ref: MDN_ARIA_BUSY
  locator: live regions — suppress partial announcements
  note: '하위 사례(4.1.3의 구체 적용, 별도 룰 분리 후보): AI 응답이 스트리밍으로 채워지는 동안 그 응답 요소에 aria-busy="true"를 두고, 생성이 완료·중단·실패하면 aria-busy="false"로
    바꿔 완성된 내용이 한 번에 전달되게 한다.'
- ref: MDN_ARIA_LIVE
  locator: polite live region
  note: '하위 사례(4.1.3의 구체 적용, 별도 룰 분리 후보): AI 생성의 완료·중단·실패 상태는 role="status" 영역의 짧은 텍스트(예: ''응답 완료'', ''생성 중단됨'',
    ''응답 실패'')로 보조기술에 알린다.'
- ref: WCAG22_TECH_ARIA23
  locator: SC 4.1.3 Status Messages
  note: '하위 사례(4.1.3의 구체 적용, 별도 룰 분리 후보): AI 생성의 완료·중단·실패 상태는 role="status" 영역의 짧은 텍스트(예: ''응답 완료'', ''생성 중단됨'',
    ''응답 실패'')로 보조기술에 알린다.'
- ref: WEBDEV_OFFLINE
  locator: Inform the user of state changes as soon as possible; don't rely on color alone
  note: '하위 사례(4.1.3의 구체 적용, 별도 룰 분리 후보): 네트워크 연결이 끊기거나 복구되면 그 사실을 텍스트와 아이콘으로 즉시 표시하고 role="status" 영역으로 보조기술에 알린다.'
- ref: WCAG22_UNDERSTANDING
  locator: 4.1.3 Status Messages
  note: '하위 사례(4.1.3의 구체 적용, 별도 룰 분리 후보): 네트워크 연결이 끊기거나 복구되면 그 사실을 텍스트와 아이콘으로 즉시 표시하고 role="status" 영역으로 보조기술에 알린다.'
- ref: WAI_ARIA_12
  locator: status role (implicit aria-live polite, aria-atomic true); alert role (implicit assertive)
  note: '하위 사례(4.1.3의 구체 적용, 별도 룰 분리 후보): ''불러오는 중'', ''저장했습니다'' 같은 진행·완료 문구는 role="status"(암묵 aria-live=polite)로
    알리고, role="alert"(암묵 assertive)는 즉시 알려야 하는 오류·시간 민감 정보에만 쓴다.'
scope:
  level: global
  targets:
  - '[role=status]'
  - '[role=alert]'
  - '[role=log]'
  - '[aria-live]'
  - 상태 메시지(저장 완료·검색 결과 수·처리 중·오류 알림)
exceptions:
- 초점 이동이나 새 창·대화상자 열림처럼 맥락 변화를 동반하는 메시지는 상태 메시지가 아니다(Understanding 4.1.3 'Examples of changes that are not status
  messages').
- 검색 결과 목록 자체는 상태 메시지가 아니다. 결과 수·'검색 중'·'결과 없음' 문구만 해당한다(Understanding 4.1.3).
relations:
- type: depends
  id: A11Y-025
  note: role·상태를 프로그램으로 판별하게 하는 일반 요구의 하위 요구
- type: conflicts
  id: FORM-080
  note: FORM-080 이 허용한 제출 전 조건 안내(입력 중 조건 충족, 확인 버튼 결과)도 상태 메시지 — aria-describedby 대상에 role=status(또는 aria-live=polite)를
    둔다.
  decision: CF-068
examples:
  good:
  - lang: html
    code: |
      <div role="status" id="save-msg"></div>
      <script>
        // 저장 후 미리 있던 live 영역에 텍스트만 넣는다
        document.getElementById('save-msg').textContent = '저장했습니다';
      </script>
    note: role="status" 영역이 미리 DOM에 있어 초점 이동 없이 저장 결과가 읽힌다.
  - lang: html
    code: |
      <input id="pw" type="password" autocomplete="new-password" aria-describedby="pw-rules">
      <ul id="pw-rules" role="status">
        <li>8자 이상 (충족)</li>
        <li>영문과 숫자 포함 (아직 충족하지 않음)</li>
      </ul>
    note: 입력 중 바뀌는 조건 충족 안내를 aria-describedby 로 필드에 잇고 role=status 영역에 두어 바뀔 때도 읽힌다(CF-068).
  bad:
  - lang: html
    code: |
      <script>
        // role·aria-live 없는 요소를 새로 만들어 붙임
        const p = document.createElement('p');
        p.textContent = '저장했습니다';
        form.append(p);
      </script>
    note: 상태 메시지에 role·aria-live가 없어 스크린 리더가 저장 결과를 읽지 않는다.
  - lang: html
    code: |
      <input id="pw" type="password" autocomplete="new-password" aria-describedby="pw-rules">
      <ul id="pw-rules">
        <li>8자 이상 (충족)</li>
      </ul>
      <!-- 입력 중 '(충족)'으로 바뀌어도 live 영역이 아니라 읽히지 않는다 -->
    note: aria-describedby 연결만 있어 입력하는 동안 바뀐 충족 여부가 전달되지 않는다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(WCAG: sources/extracts/WCAG22-A-AA.yaml 4.1.3 원문, Understanding 4.1.3 페이지 curl
  확인; KRDS 필터링·정렬 global_10 ''aria-live="polite"를 사용해야 한다'', 스피너 component_07_02 ''assertive가 아닌 polite를 사용해야 한다''
  직접 확인): statement·예외가 원문과 일치. 수집 때 ''같은 요구''로 붙은 AI 스트리밍(role=log·aria-busy)·오프라인·낙관적 UI·화면 전환 출처는 4.1.3의 하위 사례라
  note를 ''하위 사례''로 고쳤다 — 별도 룰 분리를 제안 파일에 적음. BACKLOG의 ''토스트 2~4초 자동 사라짐 vs STATE-001''은 상대 룰 ID가 없어 relations에 넣지
  않음. (2026-10-18 KRDS PDF 대조) 이전: 출처 note ''필터링·정렬 검색 결과 수 안내에 aria-live="polite"'' → 원문 876쪽: ''전체 검색 결과 수 안내
  텍스트에 live-region을 적용하고 … aria-live="assertive"를 사용해야 한다''. 룰은 polite·assertive를 모두 허용하므로 statement·측정 기준은 바꾸지
  않고 출처 note만 고침. 스피너 595쪽 ''assertive가 아닌 polite'' 확인. (2026-10-18 시험 4 검토 반영) 입력 중 조건 충족 안내(T6 비밀번호 규칙 ''(충족)'')가
  상태 메시지인지, FORM-080 이 허용한 aria-describedby 안내로 충분한지 불명 → Understanding 4.1.3 정의(사용자 동작의 결과를 알리고 맥락 변화 없이 전달)와 예시(우편번호
  오입력 뒤 나타나는 메시지)에 해당하므로 상태 메시지로 보고 측정 기준에 명시했다(CF-068). exceptions 가 아니라 측정 기준에 넣은 것은 적용 ''제외''가 아니라 ''포함''을 밝히는
  내용이라서다.'
