id: STATE-046
category: STATE
title: 로딩 영역 aria-busy
stage: platformed
status:
  value: confirmed
type: rule
strength: MAY
statement: 영역의 콘텐츠를 불러오거나 여러 번에 나눠 갱신하는 동안 그 영역에 aria-busy="true"를 두고, 갱신이 끝나면 aria-busy="false"로 바꾸거나 속성을 제거한다.
measurement:
  criteria: (1) 로딩·연속 갱신 중 대상 영역에 aria-busy="true"가 있다. (2) 로딩·갱신 완료(성공·실패·중단 모두) 뒤 그 영역에 aria-busy="true"가 남아 있지
    않다. (3) role=progressbar(네이티브 progress 포함)로 그 영역 전체의 로딩 진행을 표시하면, progressbar 에 접근 가능한 이름이 있고(WAI-ARIA 1.2 progressbar
    'Accessible Name Required' — 처리 영역의 제목을 aria-labelledby 로 가리킨다) aria-describedby 가 처리 중 상태 텍스트('검색 결과를 불러오는
    중입니다.')를 가리킨다. 이름과 설명에 같은 요소를 함께 가리키지 않는다. 버튼·입력 필드 안 대기처럼 영역 전체의 로딩이 아닌 progressbar 는 (3) 대상이 아니다(이름만 있으면 된다).
  method: 로딩 전·중·후(성공·실패 각각) DOM을 검사한다.
automation:
  feasibility: none
  checks: []
  note: 'E2E: 로딩 완료 후 [aria-busy=true] 잔존 여부 검사 — 남아 있으면 보조기술이 내용을 무시할 수 있음.'
rationale: 여러 번에 나눈 갱신을 하나로 묶어 전달하고, 불완전한 위젯 상태가 노출되지 않게 한다(WAI-ARIA 1.2 aria-busy).
sources:
- ref: WAI_ARIA_12
  locator: aria-busy state — 'authors MAY set aria-busy to true … then set it to false when the last change is complete';
    progressbar role — 'SHOULD use aria-describedby … and set the aria-busy attribute to true on the region until
    it is finished loading'; 'authors MUST set aria-busy to true on the widget' (필수 하위 요소가 빠지는 갱신)
- ref: MDN_ARIA_BUSY
  locator: aria-busy — live region 변경을 busy 동안 보류하고 false가 되면 알림
scope:
  level: situation
  targets:
  - '[aria-busy]'
  - 비동기로 갱신되는 영역
  - '[role=feed]'
  - '[aria-live]'
exceptions: []
relations:
- type: refines
  id: STATE-001
  note: live region 갱신을 한 번에 전달
- type: depends
  id: STATE-020
  note: progressbar로 영역 로딩을 표시할 때의 연결
examples:
  good:
  - lang: js
    code: |
      results.setAttribute('aria-busy', 'true');
      try { await load(); } finally { results.setAttribute('aria-busy', 'false'); }
    note: 성공·실패와 무관하게 끝나면 aria-busy를 해제한다.
  - lang: html
    code: |
      <section aria-labelledby="list-title" aria-busy="true">
        <h2 id="list-title">검색 결과</h2>
        <div class="spinner spinner--large" role="status">
          <progress class="spinner__indicator" aria-labelledby="list-title" aria-describedby="list-loading"></progress>
          <span class="spinner__text" id="list-loading">검색 결과를 불러오는 중입니다.</span>
        </div>
      </section>
    note: 영역 로딩 progressbar 는 영역 제목을 이름, 처리 중 텍스트를 설명으로 가리킨다(스피너 규격).
  bad:
  - lang: js
    code: |
      results.setAttribute('aria-busy', 'true');
      await load();               // 실패하면 아래 줄이 실행되지 않음
      results.removeAttribute('aria-busy');
    note: 오류가 나면 aria-busy="true"가 남아 영역 내용이 무시될 수 있다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(WAI-ARIA 1.2 REC를 curl로 받아 aria-busy·progressbar 절 직접 읽음): 일반 갱신은 MAY, progressbar로
  영역 로딩 표시 시 SHOULD, 필수 하위 요소가 빠지는 위젯 갱신은 MUST 확인. statement 범위가 일반 갱신이라 MAY — progressbar·위젯 경우의 강한 요구는 측정 기준 (3)과
  출처 locator에 남김. 스크린 리더별 aria-busy 지원 편차(MDN)는 원문 일치 문제가 아닌 구현 위험 — 4단계 AT 테스트에서 확인. (2026-10-18 시험 4 검토 반영) 측정
  기준 (3)은 progressbar 의 aria-describedby 를 요구하는데 스피너 규격은 aria-labelledby 로 처리 중 텍스트를 가리켜 어긋났다 → WAI-ARIA 1.2 원문(2026-10-18
  curl 재확인)이 progressbar 에 접근 가능한 이름을 필수로 하고(Accessible Name Required: True), 영역 로딩이면 ''aria-describedby to point
  to the status''를 SHOULD 로 요구하므로 룰을 약하게 바꾸지 않고 규격을 맞췄다: 이름 = 처리 영역 제목(aria-labelledby), 설명 = 처리 중 텍스트(aria-describedby).
  영역 로딩이 아닌 컴포넌트 안 대기는 (3) 대상이 아님을 명시했다.'
korean_specific: false
tags:
- research-state_copy_resp
- wai-aria
