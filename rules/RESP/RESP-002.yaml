id: RESP-002
category: RESP
title: 텍스트 200% 확대
stage: platformed
status:
  value: confirmed
type: rule
strength: MUST
statement: 자막과 텍스트 이미지를 제외한 텍스트를 보조기술 없이 200%까지 확대해도 콘텐츠와 기능이 손실되지 않게 한다.
measurement:
  criteria: (1) 너비 1280 CSS px 창에서 브라우저 확대 200%(또는 텍스트만 확대 200%)일 때 텍스트가 잘리거나 겹치거나 가려지지 않고, 모든 컨트롤을 쓸 수 있다. (2)
    <meta name="viewport">에 user-scalable=no(또는 0)가 없고 maximum-scale이 있으면 2 이상이다. (3) font-size에 vw·vh 같은 뷰포트 단위만
    단독으로 쓰지 않는다(clamp()·calc()에 rem·em을 섞으면 허용). (4) 텍스트 입력 컨트롤의 글자도 함께 커진다.
  method: axe-core로 (2)를, 브라우저 200% 확대 수동 점검으로 (1)(4)를, 코드 검색으로 (3)을 확인한다.
automation:
  feasibility: partial
  checks:
  - tool: axe-core
    rule: meta-viewport
    method: axe-core 실행 결과 위반 0건
  note: axe-core meta-viewport는 (2)만 판정한다(ACT 규칙 b4f0c3과 같은 조건). 잘림·겹침은 수동. (3)은 4단계 stylelint 커스텀(font-size 값이
    vw/vh 단독이면 경고).
rationale: 저시력 사용자는 글자를 키워야 읽을 수 있다. 확대 시 잘리거나 겹치면 내용을 잃는다.
sources:
- ref: WCAG22
  locator: SC 1.4.4 Resize Text (Level AA)
  note: https://www.w3.org/TR/WCAG22/#resize-text
- ref: WCAG22_UNDERSTANDING
  locator: https://www.w3.org/WAI/WCAG22/Understanding/resize-text.html
- ref: WCAG22_UNDERSTANDING
  locator: SC 1.4.4 Resize Text; F94, F69, F80
  note: F94 뷰포트 단위로 텍스트 크기를 정해 확대가 안 되면 실패, F69 잘림·가림, F80 폼 컨트롤 글자 미확대 — 측정 기준 (1)(3)(4)
- ref: ACT_META_VIEWPORT
  locator: Expectations 1·2
  note: 측정 기준 (2)
- ref: AXE_META_VIEWPORT
  locator: meta-viewport (WCAG 1.4.4 태그)
  note: 측정 기준 (2)
- ref: KRDS
  locator: 컴포넌트 > 화면 크기 조정 > 접근성 가이드라인 (가이드라인 PDF 2025.08 734쪽)
  note: https://www.krds.go.kr/html/site/component/component_10_02.html — '화면 크기를 조정했을 때 콘텐츠가 가려지거나 기능이 손실되지 않도록
    한다', '내용이 변형되어서는 안 된다'
- ref: KRDS
  locator: 컴포넌트 (여러 페이지) (가이드라인 PDF 2025.08 727~736쪽)
  note: '같은 요구를 다루는 KRDS 컴포넌트: 화면 크기 조정 — 상세는 sources/extracts/KRDS-components.yaml'
scope:
  level: global
  targets:
  - html
  - meta[name=viewport]
  - body
exceptions:
- 자막(captions)과 텍스트 이미지(WCAG 1.4.4).
relations:
- type: depends
  id: TYPO-027
  note: 글꼴 크기를 상대 단위로 지정하면 텍스트 확대를 막지 않는다.
- type: conflicts
  id: LAYOUT-018
  note: 줄바꿈 없는 고정 너비는 기본 글자 크기에서만 요구한다. 텍스트를 확대하면 항목 텍스트가 잘리지 않고 줄바꿈되게 한다.
  decision: CF-011
examples:
  good:
  - lang: html
    code: <meta name="viewport" content="width=device-width, initial-scale=1">
    note: 확대를 막지 않는 viewport 설정.
  - lang: css
    code: 'h1 { font-size: clamp(1.5rem, 1rem + 2vw, 2.5rem); }'
    note: clamp()에 rem을 섞어 텍스트 확대를 따른다.
  bad:
  - lang: html
    code: <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    note: user-scalable=no와 maximum-scale=1로 확대를 막는다.
  - lang: css
    code: 'h1 { font-size: 4vw; }'
    note: vw 단독 글자 크기는 텍스트 확대에 반응하지 않는다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(sources/extracts/WCAG22-A-AA.yaml, Understanding 1.4.4 curl, ACT b4f0c3 curl):
  SC 문장(자막·텍스트 이미지 제외, 200%)과 실패 기법 F94·F69·F80, ACT Expectation 1(user-scalable≠no)·2(maximum-scale≥2) 확인. KRDS
  화면 크기 조정(component_10_02) 접근성 가이드라인 문장 curl 확인. 1단계 ''같은 요구'' 출처들은 1.4.4의 실패 조건이라 측정 기준으로 흡수했다.'
korean_specific: false
