id: RESP-001
category: RESP
title: 화면 방향 고정 금지
stage: platformed
status:
  value: confirmed
type: rule
strength: MUST
statement: 콘텐츠의 보기와 조작을 세로 또는 가로 한 방향으로 고정하지 않는다. 특정 방향이 필수인 콘텐츠만 예외로 한다.
measurement:
  criteria: '(1) CSS에서 @media (orientation: …) 안의 transform: rotate(±90deg)로 화면을 강제로 돌리지 않는다. (2) JS에서 screen.orientation.lock()을
    호출하지 않는다(필수 예외 제외). (3) 기기를 세로·가로로 돌렸을 때 두 방향 모두 콘텐츠를 보고 조작할 수 있고 ''가로로 돌려 주세요'' 같은 차단 안내가 없다.'
  method: axe-core로 (1)을, 코드 검색으로 (2)를, 실제 기기 또는 에뮬레이터로 (3)을 확인한다.
automation:
  feasibility: partial
  checks:
  - tool: axe-core
    rule: css-orientation-lock
    method: axe-core 실행 결과 위반 0건
  note: axe-core는 CSS 미디어 쿼리 회전 고정만 판정한다. JS 방향 잠금과 차단 안내는 수동.
rationale: 휠체어에 고정된 기기처럼 방향을 바꿀 수 없는 사용자는 고정된 방향의 콘텐츠를 쓸 수 없다.
sources:
- ref: WCAG22
  locator: SC 1.3.4 Orientation (Level AA)
  note: https://www.w3.org/TR/WCAG22/#orientation
- ref: WCAG22_UNDERSTANDING
  locator: https://www.w3.org/WAI/WCAG22/Understanding/orientation.html
scope:
  level: global
  targets:
  - '@media (orientation)'
  - screen.orientation.lock()
exceptions:
- '특정 화면 방향이 필수인 경우(WCAG 1.3.4 Note 예: 수표, 피아노 앱, 프로젝터·TV용 슬라이드, 가상현실 콘텐츠).'
relations: []
examples:
  good:
  - lang: css
    code: '@media (orientation: landscape) { .layout { grid-template-columns: 1fr 1fr; } }'
    note: 방향에 따라 배치만 바꾸고 두 방향 모두 쓸 수 있다.
  bad:
  - lang: css
    code: '@media (orientation: portrait) { body { transform: rotate(90deg); } }'
    note: 세로 방향일 때 화면을 강제로 90도 돌린다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(sources/extracts/WCAG22-A-AA.yaml, Understanding 1.3.4 curl): SC 문장과 필수 예시
  Note 확인. 기기 설정의 방향 잠금은 작성자 책임이 아님(Understanding).'
korean_specific: false
tags:
- wcag22
- level-aa
- new-in-2.1
