id: RESP-013
category: RESP
title: 좁은 화면 단계 표시기 축약
stage: platformed
status:
  value: confirmed
type: rule
strength: MAY
statement: '모바일 레이아웃(RESP-004 기준 1024px 미만)에서는 단계 표시기에서 현재 단계와 전체 단계 수(예: 4단계 중 1단계)를 제외한 정보를 생략할 수 있다.'
measurement:
  criteria: '생략하는 경우: 1024px 미만 뷰포트에서 단계 표시기에 현재 단계 번호와 전체 단계 수가 텍스트로 보이고, 생략 후에도 <ol>·<li> 마크업으로 전체 단계 목록이 보조기술에
    노출된다.'
  method: 360px 너비로 렌더링해 보이는 텍스트와 접근성 트리의 목록 항목 수를 확인한다.
automation:
  feasibility: none
  checks: []
  note: 4단계 커스텀 Playwright 검사.
rationale: 작은 화면에서 단계 레이블을 모두 보이면 표시기가 화면을 많이 차지한다. 현재 위치와 전체 길이만 있으면 진행 상황을 알 수 있다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 단계 표시기 > 구조(단계 숫자) (가이드라인 PDF 2025.08 582쪽)
  note: https://www.krds.go.kr/html/site/component/component_07_01.html
- ref: KRDS
  locator: 디자인 스타일 > 레이아웃 > 브레이크포인트(PDF 153쪽)
  note: 모드 Mobile = small 360px·medium 768px('태블릿을 포함한 소형 디바이스'), PC = large 1024px 이상
- ref: UXB_SYSTEM_CHOICE
  locator: CF-055
  note: KRDS의 '좁은 화면·모바일 레이아웃·작은 디스플레이'를 Mobile 모드(1024px 미만)로 해석
scope:
  level: component
  targets:
  - 단계 표시기
exceptions: []
relations:
- type: depends
  id: A11Y-007
  note: 단계 목록의 ol·li 마크업(KRDS 접근성 가이드라인).
examples:
  good:
  - lang: html
    code: "<ol class=\"steps\" aria-label=\"신청 단계\">\n  <li aria-current=\"step\"><span class=\"sr-only\">4단계 중\
      \ </span>1단계 <span class=\"label\">본인 확인</span></li>\n  <li>…</li>\n</ol>"
    note: 보이는 텍스트는 현재 단계만 두고 전체 단계 수와 ol 목록은 보조기술에 노출한다.
  bad:
  - lang: html
    code: '<!-- 1024px 미만 -->

      <div class="steps"><span>본인 확인</span></div>'
    note: 축약하면서 현재 단계 번호와 전체 단계 수를 없애고 ol·li 목록도 쓰지 않는다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): 구조 ''단계 숫자 … 작은 디스플레이에서는 현재 단계, 전체 단계
  수를 제외한 정보는 생략할 수 있음(예 - 4단계 중 1단계)'', 접근성 ''단계 목록과 항목을 <ol>, <li>로 마크업'' 확인. ''할 수 있음'' → MAY. ''작은 디스플레이'' 수치가
  없어 768px 경계는 RESP-004 적용 해석(needs_verification=true). KRDS 가이드라인 PDF(2025.08, 1181쪽) 원문 대조 2026-10-18: 레이아웃 브레이크포인트
  표에서 Mobile 모드가 small(360)·medium(768)이고 PC 모드가 large(1024) 이상임을 확인 — 768px 경계를 1024px로 고침(CF-055).'
korean_specific: false
tags:
- krds
- krds-component
decisions:
- CF-055
