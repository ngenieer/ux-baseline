id: RESP-009
category: RESP
title: 좁은 화면 사이드 메뉴 숨김
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 레이아웃이 사이드 메뉴와 본문을 나란히 놓을 수 없는 1단 구간이 되면 사이드 메뉴를 표시하지 않고, 그 하위 탐색은 햄버거 메뉴로 축소된 메인 메뉴에서 제공한다.
measurement:
  criteria: 레이아웃 토큰의 다단→1단 전환 브레이크포인트 미만 너비에서 사이드 메뉴 요소가 display:none(또는 렌더링되지 않음)이고, 사이드 메뉴에 있던 링크가 햄버거 메뉴 레이어
    안에 모두 있다.
  method: 전환 브레이크포인트 양쪽 너비에서 사이드 메뉴 표시 여부와 메뉴 레이어 링크 목록을 비교한다.
automation:
  feasibility: none
  checks: []
  note: 4단계 커스텀 Playwright 검사.
rationale: 좁은 화면에서 사이드 메뉴를 본문 위·아래에 쌓으면 본문 접근이 늦어지므로 메인 메뉴로 탐색을 일원화한다(KRDS).
sources:
- ref: KRDS
  locator: 컴포넌트 > 사이드 메뉴 > 플랫폼에 대한 고려 사항 (가이드라인 PDF 2025.08 303쪽)
  note: https://www.krds.go.kr/html/site/component/component_03_04.html
scope:
  level: component
  targets:
  - 사이드 메뉴
  - aside nav
exceptions:
- 4수준 이상의 정보 구조는 본문 제목을 4수준 메뉴의 보조 탐색 수단으로 쓸 수 있다(KRDS).
relations:
- type: depends
  id: RESP-005
  note: 사이드 메뉴 링크를 담을 햄버거 메뉴.
examples:
  good:
  - lang: css
    code: '@media (max-width: 1023px) { .side-nav { display: none; } }'
    note: 1단 구간에서 사이드 메뉴를 숨긴다(링크는 햄버거 메뉴 레이어에 둔다).
  bad:
  - lang: css
    code: '@media (max-width: 1023px) { .side-nav { width: 100%; } } /* 본문 위에 그대로 쌓음 */'
    note: 1단 구간에서 사이드 메뉴를 본문 위에 그대로 쌓는다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): ''화면 너비가 충분하지 않은 경우 사이드 메뉴를 표시하지 않는다.
  사용자는 햄버거 아이콘으로 축소된 메인 메뉴를 통해 정보 구조를 탐색한다.'' 확인. 수치가 없어 NAV-014와 같은 방식(다단/1단 전환 브레이크포인트)으로 조건을 정함. 예시의 1023px은
  RESP-004 large 경계를 쓴 예일 뿐 원문 수치 아님. → SHOULD + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
