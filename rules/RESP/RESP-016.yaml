id: RESP-016
category: RESP
title: 좁은 화면 도움 패널 축약
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 레이아웃이 도움 패널과 본문을 나란히 놓을 수 없는 1단 구간이 되면 도움 패널을 패널 열기 버튼으로 축약하고, 버튼을 누르면 패널을 모달로 연다.
measurement:
  criteria: 다단→1단 전환 브레이크포인트 미만 너비에서 (1) 도움 패널 본문이 페이지 흐름에 표시되지 않고, (2) 패널 열기 <button>(접근 가능한 이름 있음)이 있으며, (3) 누르면
    role="dialog"·aria-modal="true"인 패널이 열린다.
  method: 전환 브레이크포인트 양쪽 너비에서 패널 표시 상태와 버튼 동작을 확인한다.
automation:
  feasibility: none
  checks: []
  note: 4단계 커스텀 Playwright 검사.
rationale: 좁은 화면에서는 사용자가 본문 콘텐츠에 먼저 접근하고 과업에 집중할 수 있게 한다(KRDS).
sources:
- ref: KRDS
  locator: 컴포넌트 > 도움 패널 > 플랫폼에 대한 고려 사항 (가이드라인 PDF 2025.08 606쪽)
  note: https://www.krds.go.kr/html/site/component/component_08_01.html
scope:
  level: component
  targets:
  - 도움 패널
exceptions: []
relations:
- type: depends
  id: A11Y-029
  note: 모달로 열 때 초점 가두기.
examples:
  good:
  - lang: html
    code: '<button type="button" aria-haspopup="dialog" aria-controls="help">도움말 열기</button>

      <div id="help" role="dialog" aria-modal="true" aria-labelledby="help-t" hidden>…</div>'
    note: 1단 구간에서 도움 패널을 열기 버튼으로 축약하고 모달로 연다.
  bad:
  - lang: css
    code: '@media (max-width: 1023px) { .help-panel { width: 100%; } } /* 본문 위에 펼친 채로 쌓음 */'
    note: 1단 구간에서 도움 패널을 본문 위에 펼친 채로 쌓는다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): ''화면 너비가 충분하지 않을 때 도움 패널은 패널 열기 버튼으로 축약하여
  제공한다'', ''패널 열기 버튼이나 아이콘 버튼을 눌렀을 때 패널은 모달 형식으로 제공하면 된다'' 확인. 축약은 지시형(SHOULD), 모달 방식은 ''제공하면 된다''(허용)지만 원문이 다른
  방식을 제시하지 않아 statement에 모달을 넣음. 너비 수치가 없어 RESP-009와 같은 1단 구간 조건 사용. → SHOULD + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
