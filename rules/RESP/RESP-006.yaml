id: RESP-006
category: RESP
title: 좁은 화면 푸터의 정보 순서
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 좁은 화면에서 푸터 요소를 세로로 재배열해도 서비스 로고, 연락처, 유틸리티 링크, 정책 링크, 저작권 정보의 순서를 유지한다.
measurement:
  criteria: '푸터 요소가 한 열로 쌓이는 너비(예: 360px)에서 다섯 묶음의 화면상 위→아래 순서와 DOM 순서가 모두 서비스 로고 → 연락처 → 유틸리티 링크 → 정책 링크 → 저작권
    정보이다(없는 묶음은 건너뜀).'
  method: 360px 너비로 렌더링해 각 묶음의 boundingBox.y 순서와 DOM 순서를 비교한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 커스텀: 푸터 묶음에 규약 data 속성을 두고 Playwright로 y좌표·DOM 순서 비교.'
rationale: 화면 크기와 관계없이 같은 정보를 같은 순서에서 찾을 수 있게 한다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 푸터 > 플랫폼에 대한 고려 사항 (가이드라인 PDF 2025.08 251쪽)
  note: https://www.krds.go.kr/html/site/component/component_02_04.html
scope:
  level: component
  targets:
  - 푸터
  - footer
exceptions: []
relations:
- type: refines
  id: LAYOUT-015
  note: LAYOUT-015의 푸터 정보 순서를 좁은 화면 재배열에도 적용.
- type: depends
  id: A11Y-008
  note: 시각 순서와 DOM 순서를 일치시킨다.
examples:
  good:
  - lang: html
    code: "<footer>\n  <div class=\"f-logo\">…</div><div class=\"f-contact\">…</div>\n  <ul class=\"f-util\">…</ul><ul\
      \ class=\"f-policy\">…</ul><p class=\"f-copy\">…</p>\n</footer>"
    note: DOM 순서가 로고 → 연락처 → 유틸리티 → 정책 → 저작권이고 화면 순서도 같다.
  bad:
  - lang: css
    code: '@media (max-width: 767px) { .f-copy { order: -1; } } /* 저작권을 맨 위로 */'
    note: 좁은 화면에서 저작권 정보를 맨 위로 올린다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): ''작은 화면 너비에서도 푸터의 정보 요소는 상대적으로 동일한 순서로
  제공되도록 표현한다'', ''수직 배열로 변경되더라도 서비스 로고, 연락처, 유틸리티 링크, 정책 링크, 저작권 정보의 순서로 배치한다'' 확인. 1단계 statement의 ''로고''를 원문대로
  ''서비스 로고''로 고침. 지시형 → SHOULD + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
