id: NAV-055
category: NAV
title: 순차 탐색 단계 이동 제한
stage: normalized
status:
  value: deprecated
  reason: CF-010 결정으로 폐기 — FORM-080로 대체
  superseded_by: FORM-080
type: rule
strength: MAY
statement: 순차 탐색 방식의 단계 절차에서는 현재 단계의 필수 행동을 마치기 전까지 다음 단계로 이동하는 UI를 비활성화한다.
measurement:
  criteria: 순차 탐색 절차의 각 단계에서 필수 입력·행동이 남아 있으면 다음 단계 이동 컨트롤이 disabled 또는 aria-disabled="true"이다.
  method: 'E2E 또는 수동: 필수 행동을 하지 않은 상태에서 다음 단계 컨트롤 상태를 확인한다.'
automation:
  feasibility: none
  checks: []
  note: 기존 검사기 규칙 없음. E2E 커스텀 검사로 자동화 가능.
rationale: 정해진 순서를 지켜야 하는 절차에서 필수 단계를 건너뛰지 않게 한다. 적응형 탐색 방식은 단계 순서를 자유롭게 허용한다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 단계 표시기 > 사용성 가이드라인 (순차적 탐색 / 적응형 탐색)
  note: https://www.krds.go.kr/html/site/component/component_07_01.html
scope:
  level: situation
  targets:
  - 순차 탐색 방식 단계 절차
  - 단계 표시기
exceptions:
- '적응형 탐색 방식(원문: 특정 단계를 건너뛰고 자유로운 순서로 접근 가능)'
relations:
- type: conflicts
  id: FORM-080
  note: 다음 단계 버튼을 비활성화하지 않는다. 누르면 검증하고 오류를 안내한다(FORM-080). NAV-055는 폐기한다.
  decision: CF-010
examples:
  good:
  - lang: html
    code: '<button type="button" aria-disabled="true" aria-describedby="why">다음 단계</button>

      <p id="why">필수 항목 2개를 입력하면 다음 단계로 갈 수 있습니다.</p>

      '
  bad:
  - lang: html
    code: '<!-- 순차 절차인데 필수 입력 없이 다음 단계로 이동 가능 -->

      <button type="button" onclick="goStep(3)">다음 단계</button>

      '
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS 페이지 curl 수신 후 텍스트 추출): ''순차적 탐색 방식에서 … 한 단계에서 필요한 행동이 완료되지 않으면 다음 단계로
  이동하는 데 사용되는 UI는 비활성화 상태로 제공된다'' 확인. 원문이 탐색 방식 서술(의무어 없음)이라 MAY. FORM-080(제출 시점 검증)과의 충돌 후보는 제안 파일 conflicts에 기록.'
korean_specific: false
tags:
- krds
- krds-component
