id: NAV-039
category: NAV
title: 콘텐츠 내 탐색 금지 상황
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 무한 스크롤 페이지, 필터 목록 표시, 서비스 정보 구조(메뉴) 탐색에는 콘텐츠 내 탐색을 쓰지 않고, 정보 구조 탐색에는 사이드 메뉴 같은 서브 메뉴를 쓴다.
measurement:
  criteria: (1) 무한 스크롤 목록이 있는 페이지에 콘텐츠 내 탐색 컴포넌트가 없다. (2) 콘텐츠 내 탐색의 링크가 필터 조건이 아니다. (3) 콘텐츠 내 탐색의 링크 대상이 모두 같은 페이지
    안의 앵커(href="#…")이고 다른 페이지로 가지 않는다.
  method: 콘텐츠 내 탐색 컴포넌트의 링크 href가 모두 같은 문서의 프래그먼트인지 스크립트로 확인하고, 무한 스크롤·필터 목록 페이지에 컴포넌트가 있는지 수동 확인한다.
automation:
  feasibility: none
  checks: []
  note: 기존 검사기 규칙 없음. (3)은 커스텀 DOM 검사(목차 링크 href가 '#'로 시작)로 자동화 가능, (1)(2)는 수동.
rationale: 무한 스크롤은 섹션 끝이 정해지지 않아 목차를 만들 수 없고, 필터·메뉴는 페이지 안 이동이 아니라 다른 컴포넌트(필터, 서브 메뉴)의 역할이다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 콘텐츠 내 탐색 > 용례 (사용하기 적합하지 않은 경우) (가이드라인 PDF 2025.08 309쪽)
  note: https://www.krds.go.kr/html/site/component/component_03_05.html
scope:
  level: component
  targets:
  - 콘텐츠 내 탐색
exceptions: []
relations:
- type: refines
  id: NAV-038
  note: NAV-038 사용 조건의 제외 상황
examples:
  good:
  - lang: html
    code: '<nav aria-label="이 페이지의 구성"><ol><li><a href="#apply">신청 방법</a></li></ol></nav>

      '
    note: 콘텐츠 내 탐색의 링크가 모두 같은 페이지 앵커다.
  bad:
  - lang: html
    code: '<!-- 목차 자리에 다른 페이지로 가는 메뉴를 넣음 -->

      <nav aria-label="이 페이지의 구성"><ol><li><a href="/service/apply">신청 서비스</a></li></ol></nav>

      '
    note: 콘텐츠 내 탐색 자리에 다른 페이지로 가는 메뉴 링크를 넣었다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS 페이지 curl 수신 후 텍스트 추출): ''무한 스크롤 기능이 있는 페이지의 경우 콘텐츠 내 탐색은 구현할 수 없으며 실용성이
  없다'', ''사이드 메뉴 등의 서브 메뉴를 사용하는 것이 적절하다'', ''필터 목록을 표시하는 데 콘텐츠 내 탐색을 사용하지 않는다'' 확인. 강도는 필터 항목의 ''~하지 않는다''에 맞춰 SHOULD
  + public-sector-must — 정보 구조 항목 원문은 ''적절하다''(권장) 수준임. 판정 (3)은 ''정보 구조 탐색 금지''를 같은 문서 앵커로 바꾼 이 체계의 해석.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
