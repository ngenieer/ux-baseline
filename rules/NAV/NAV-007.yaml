id: NAV-007
category: NAV
title: 긴 목록 페이지 분할
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 전체 항목이 20개를 넘거나 한 화면에 모두 표시했을 때 목록 높이가 뷰포트 높이의 2배를 넘는 목록은 페이지 단위로 나누고, 페이지네이션을 쓰면 한 페이지에 기본 10개 이상 항목을
  표시한다.
measurement:
  criteria: '판정 대상은 레코드 목록 — 각 항목·행이 따로 열거나 고르는 개별 레코드(게시글, 주문, 검색 결과, 신청 내역)인 목록·표. 날짜·분류별 합계처럼 행이 집계 단위인 표(차트와
    같은 데이터를 담은 표 등)는 대상이 아니다. (1) 전체 항목 수 > 20 또는 전체 목록 높이 > 2 × window.innerHeight 인 레코드 목록은 페이지네이션·더 보기·무한 스크롤(NAV-041)처럼
    항목을 단위로 나눠 보여 준다. 전체 항목을 한 번에 렌더하고 고정 높이 컨테이너의 내부 스크롤(overflow: auto·scroll)로 보이는 것은 나눔이 아니다(실패). (2) 페이지네이션이
    있는 목록의 기본(사용자가 표시 개수를 바꾸기 전) 페이지당 항목 수 ≥ 10 (마지막 페이지 제외).'
  method: 목록 화면을 기본 설정으로 열어 항목 수와 목록 높이를 개발자 도구로 측정한다.
automation:
  feasibility: none
  note: '4단계 커스텀 검사 가능: 목록 컴포넌트 규격에 pageSize 기본값 ≥10 제약을 두고 타입·단위 테스트로 확인.'
rationale: 한 번에 너무 많은 정보를 주지 않으면서도, 사용자가 다음 행동을 정하기 위해 여러 항목을 한 화면에서 비교할 수 있어야 한다.
sources:
- ref: KRDS
  locator: 기본 패턴 > 목록 탐색 > 사용성 가이드라인 (가이드라인 PDF 2025.08 801쪽)
  note: https://www.krds.go.kr/html/site/global/global_04.html — '긴 목록은 페이지 등으로 단위를 나누어 제공한다.' / '페이지네이션이 포함된 긴
    목록은 … 최소 10개 이상의 항목을 기본으로 표시해야 한다.'
- ref: KRDS
  locator: 컴포넌트 > 페이지네이션 > 용례 (가이드라인 PDF 2025.08 317·318쪽)
  note: https://www.krds.go.kr/html/site/component/component_03_06.html — '목록의 높이가 뷰포트의 2배를 초과하거나, 전체 항목 개수가 20개를
    초과하는 경우 페이지네이션의 사용을 검토한다.'
scope:
  level: component
  targets:
  - 레코드 목록
  - 검색 결과
  - 게시판
  - 레코드 표(행이 개별 레코드인 table)
exceptions:
- 무한 스크롤 등 페이지 외 단위로 나누는 경우(KRDS '페이지 등으로') — 조건은 NAV-041
- 행이 집계 단위인 표(일별·분류별 합계, 차트 데이터 표) — KRDS 목록 탐색 패턴이 다루는 '목록'(탐색해 항목을 고르는 목록)이 아니다.
relations: []
examples:
  good:
  - lang: html
    code: |
      <ul class="result-list">…10개 항목…</ul>
      <nav aria-label="페이지 이동">…</nav>
    note: 기본 페이지당 10개 항목을 보여준다.
  bad:
  - lang: html
    code: |
      <ul class="result-list">…5개 항목…</ul>  <!-- 기본 5개씩 -->
      <nav aria-label="페이지 이동">…</nav>
    note: 기본 페이지당 항목 수가 10개 미만이다.
  - lang: html
    code: |
      <div class="orders" style="max-block-size:20rem;overflow:auto">
        <table>…주문 120행…</table>
      </div>
    note: 주문 레코드 120개를 내부 스크롤로만 담았다 — 내부 스크롤은 단위 나눔이 아니다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS global_04·component_03_06 WebFetch): ''최소 10개 이상 … 표시해야 한다''(SHOULD, public-sector-must),
  ''긴 목록''의 기준은 페이지네이션 컴포넌트 용례의 20개·뷰포트 2배를 씀(원문 강도 ''검토한다''). 컴포넌트 페이지는 화면당 항목 수를 ''로딩 시간, 성능, 스크롤 설정을 고려''하라고만
  하고 10개는 언급하지 않음 — 10개 하한은 기본 패턴 페이지 근거. (2026-10-18 시험 4 검토 반영) T7 에서 30행 일별 집계 표를 내부 스크롤로 담은 경우 (가) ''목록''에 집계
  표가 드는지, (나) 내부 스크롤도 나눔인지 불명 → 대상을 레코드 목록(행이 개별 레코드)으로 한정하고 집계 표를 뺐다(KRDS global_04 는 목록을 탐색해 항목을 고르는 패턴으로 서술).
  내부 스크롤은 KRDS ''페이지 등으로 단위를 나누어''의 단위 나눔이 아니라 실패로 정했다.'
korean_specific: false
tags:
- krds
- public-sector-must
