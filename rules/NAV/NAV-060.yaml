id: NAV-060
category: NAV
title: 도움·따라하기 패널 기본 선택
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 도움 패널과 따라하기 패널을 한 패널 안에서 전환해 제공할 때는 처음에 도움 패널 탭을 선택된 상태로 둔다.
measurement:
  criteria: 화면을 처음 불러오면 패널 선택 탭 중 도움 패널 탭이 aria-selected="true"이고 도움 패널 내용이 표시된다.
  method: 화면을 새로 불러온 직후 패널 선택 탭 상태를 확인한다.
automation:
  feasibility: none
  checks: []
  note: 기존 검사기 규칙 없음. 커스텀 E2E 검사 가능.
rationale: 사용자가 의도하지 않은 상황에서 따라하기 절차나 상세 도움 정보가 먼저 나타나지 않게 한다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 도움 패널 > 사용성 가이드라인 (도움 패널과 따라하기 패널이 함께 제공되어야 하는 경우) (가이드라인 PDF 2025.08 603쪽)
  note: https://www.krds.go.kr/html/site/component/component_08_01.html
scope:
  level: component
  targets:
  - 도움 패널
  - 따라하기 패널
  - 패널 선택 탭
exceptions: []
relations:
- type: depends
  id: NAV-059
  note: 패널이 처음에 펼쳐져 있다는 전제
- type: depends
  id: COPY-041
  note: 선택된 도움 패널의 초기 내용
examples:
  good:
  - lang: html
    code: "<div role=\"tablist\" aria-label=\"도움 유형\">\n  <button role=\"tab\" aria-selected=\"true\">도움말</button><button\
      \ role=\"tab\" aria-selected=\"false\">따라하기</button>\n</div>\n"
    note: 처음 불러올 때 도움말 탭이 선택되어 있다.
  bad:
  - lang: html
    code: "<div role=\"tablist\" aria-label=\"도움 유형\">\n  <button role=\"tab\" aria-selected=\"false\">도움말</button><button\
      \ role=\"tab\" aria-selected=\"true\">따라하기</button>\n</div>\n"
    note: 처음 불러올 때 따라하기 탭이 선택되어 있다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS 페이지 curl 수신 후 텍스트 추출): ''도움 패널과 따라하기 패널이 함께 제공되어야 하는 경우, 도움 패널이 선택되어 있어야
  한다'' 확인. 구조 절 ''패널 선택 탭: 도움 패널과 따라하기 패널을 전환'' 확인. 원문 지시형 문장을 의무로 읽어 SHOULD + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
