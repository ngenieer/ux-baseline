id: NAV-053
category: NAV
title: 단계 표시기 단계 수
stage: platformed
status:
  value: confirmed
type: rule
strength: MAY
statement: 단계 표시기의 단계 수는 3개 이상 7개 이하로 한다.
measurement:
  criteria: 단계 표시기 목록(ol) 안 단계 항목(li) 수가 3 이상 7 이하이다.
  method: 단계 표시기 DOM의 li 개수를 센다.
automation:
  feasibility: none
  checks: []
  note: 기존 검사기 규칙 없음. 단계 표시기 셀렉터를 정하면 커스텀 DOM 검사로 완전 자동화 가능.
rationale: 단계가 많으면 인지 부담이 커진다. 원문은 불필요한 단계를 반복 점검해 줄이라고 함.
sources:
- ref: KRDS
  locator: 컴포넌트 > 단계 표시기 > 사용성 가이드라인 (단계의 수는 최소 3개에서 최대 7개로 제공한다) (가이드라인 PDF 2025.08 583·585쪽)
  note: https://www.krds.go.kr/html/site/component/component_07_01.html
scope:
  level: component
  targets:
  - 단계 표시기
exceptions: []
relations:
- type: depends
  id: NAV-028
  note: 절차 진행 표시에는 단계 표시기를 씀(NAV-028)
examples:
  good:
  - lang: html
    code: '<ol class="steps"><li>본인 확인</li><li>신청서 작성</li><li>서류 첨부</li><li>검토·제출</li></ol>

      '
    note: 단계가 4개로 3~7개 범위 안이다.
  bad:
  - lang: html
    code: "<ol class=\"steps\">\n  <li>약관 동의</li><li>본인 확인</li><li>기본 정보</li><li>연락처</li>\n  <li>가족 정보</li><li>서류\
      \ 첨부</li><li>수수료 결제</li><li>검토·제출</li>\n</ol>  <!-- 8단계 -->\n"
    note: 단계가 8개로 7개를 넘는다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS 페이지 curl 수신 후 텍스트 추출): 헤딩 ''단계의 수는 최소 3개에서 최대 7개로 제공한다'', 본문 ''단계의 수는
  최대 7개로 제한할 것을 권장한다'' 확인. 본문이 ''권장''이라 MAY. 2단계 이하 절차에 단계 표시기를 쓰지 말라는 뜻인지(최소 3개)는 원문에 설명이 없다.'
korean_specific: false
tags:
- krds
- krds-component
