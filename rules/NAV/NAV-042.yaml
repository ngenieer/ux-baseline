id: NAV-042
category: NAV
title: 페이지네이션 첫·마지막·이전·다음 이동
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 페이지네이션은 어느 화면에서든 첫 화면, 마지막 화면, 이전 화면, 다음 화면으로 이동하는 수단을 제공한다(목록 확장형 제외).
measurement:
  criteria: 모든 화면 번호에서 페이지네이션 안에 (1) 첫 화면(1) 링크, (2) 마지막 화면 번호 링크, (3) 이전 버튼, (4) 다음 버튼이 있다. 현재 화면이 첫 화면이면 (1)(3),
    마지막 화면이면 (2)(4)는 현재 위치 표시로 대신할 수 있다.
  method: 첫·중간·마지막 화면에서 페이지네이션 DOM을 확인한다(말줄임표로 첫·마지막 번호가 가려지지 않는지 포함).
automation:
  feasibility: none
  checks: []
  note: 기존 검사기 규칙 없음. 4단계 커스텀 E2E 검사(여러 화면 번호로 이동하며 링크 존재 확인)로 자동화 가능.
rationale: 첫·마지막 화면 번호가 항상 보이면 사용자가 목록의 시작이나 끝으로 바로 이동할 수 있다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 페이지네이션 > 사용성 가이드라인 (첫/마지막 화면, 이전/다음 화면으로 이동할 수 있는 수단을 제공한다) (가이드라인 PDF 2025.08 325·326쪽)
  note: https://www.krds.go.kr/html/site/component/component_03_06.html
scope:
  level: component
  targets:
  - 페이지네이션
exceptions:
- 목록 확장형(더보기) 페이지네이션 — 원문 명시
relations:
- type: depends
  id: NAV-044
  note: 숫자 링크를 줄이는 말줄임표가 첫·마지막 번호를 가리면 안 됨
examples:
  good:
  - lang: html
    code: "<nav aria-label=\"페이지\">\n  <a href=\"?p=4\">이전</a> <a href=\"?p=1\">1</a> … <a href=\"?p=4\">4</a>\n\
      \  <a aria-current=\"page\">5</a> <a href=\"?p=6\">6</a> … <a href=\"?p=20\">20</a> <a href=\"?p=6\">다음</a>\n\
      </nav>\n"
    note: 현재 화면 5에서 처음(1)·마지막(20)·이전·다음 수단이 모두 있다.
  bad:
  - lang: html
    code: "<nav aria-label=\"페이지\">\n  <a href=\"?p=4\">이전</a> <a href=\"?p=4\">4</a> <a aria-current=\"page\">5</a>\
      \ <a href=\"?p=6\">6</a> <a href=\"?p=6\">다음</a>\n</nav>  <!-- 첫·마지막 화면으로 가는 수단 없음 -->\n"
    note: 이전·다음만 있고 첫 화면·마지막 화면으로 가는 수단이 없다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS 페이지 curl 수신 후 텍스트 추출): ''목록 확장형 페이지네이션을 제외하고 사용자는 어떤 페이지에서든 항상 첫 화면, 마지막
  화면, 이전 화면, 다음 화면으로 이동할 수 있어야 한다'' 확인. 첫·마지막 화면에서 해당 방향 수단을 현재 위치 표시로 대신하는 판정은 논리상 필요한 이 체계의 해석. 원문 지시형 문장을 의무로
  읽어 SHOULD + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
