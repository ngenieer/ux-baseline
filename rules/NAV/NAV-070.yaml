id: NAV-070
category: NAV
title: 탭바 아이콘과 레이블
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 탭바의 각 탭에 아이콘과 화면에 보이는 텍스트 레이블을 함께 표시한다.
measurement:
  criteria: 탭바의 모든 탭 메뉴 요소 안에 아이콘 요소와 화면에 보이는(시각적으로 숨기지 않은) 텍스트 레이블이 함께 있다.
  method: 탭 메뉴마다 아이콘 요소와 보이는 텍스트 노드 존재를 DOM과 화면으로 확인한다.
automation:
  feasibility: none
  checks: []
  note: 기존 검사기 규칙 없음. 커스텀 DOM 검사(아이콘 요소 + 비어 있지 않은 보이는 텍스트) 가능.
rationale: 아이콘만 쓰면 의미가 모호하고 레이블만 쓰면 시각적 주목도가 떨어져 둘을 함께 써 보완한다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 탭바 > 사용성 가이드라인 (아이콘과 레이블을 함께 사용한다) (가이드라인 PDF 2025.08 346쪽)
  note: https://www.krds.go.kr/html/site/component/component_12_07.html
scope:
  level: component
  targets:
  - 탭바
exceptions: []
relations:
- type: depends
  id: COPY-052
  note: 레이블은 1~2단어, 잘림 없음(COPY-052)
examples:
  good:
  - lang: html
    code: '<a href="/" aria-current="page"><svg aria-hidden="true">…</svg><span>홈</span></a>

      '
    note: 탭에 아이콘과 보이는 텍스트 레이블이 함께 있다.
  bad:
  - lang: html
    code: '<a href="/" aria-label="홈"><svg aria-hidden="true">…</svg></a>

      '
    note: 아이콘만 있고 레이블은 aria-label로만 준다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS 페이지 curl 수신 후 텍스트 추출): ''각 탭에는 아이콘과 레이블을 함께 제공하여 의미를 명확하게 전달해야 한다'' 확인.
  원문 지시형 문장을 의무로 읽어 SHOULD + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
