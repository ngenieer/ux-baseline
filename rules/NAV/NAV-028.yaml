id: NAV-028
category: NAV
title: 진행 상황에는 단계 표시기
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 절차의 진행 상황을 보여줄 때는 브레드크럼 대신 단계 표시기(단계 식별자·진행 상황 표시기)를 쓴다.
measurement:
  criteria: 여러 단계로 된 절차 화면에서 현재 단계를 보여주는 요소가 브레드크럼 nav가 아니라 단계 표시기(단계 목록과 현재 단계 표시)다.
  method: 신청·결제 등 다단계 절차 화면을 열어 진행 상황 표시 요소를 확인한다.
automation:
  feasibility: none
  note: 절차 화면 판별이 필요해 수동.
rationale: 브레드크럼은 정보 구조상의 위치를 보여주는 도구이고, 절차 진행 상황(지난 단계·남은 단계)을 보여주지 못한다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 브레드크럼 > 용례 (가이드라인 PDF 2025.08 280쪽)
  note: https://www.krds.go.kr/html/site/component/component_03_03.html — '진행 상황을 표시하고자 하는 경우에는 단계 식별자나 진행 상황 표시기를
    사용해야 한다.'
scope:
  level: situation
  targets:
  - 다단계 절차 화면
exceptions: []
relations: []
examples:
  good:
  - lang: html
    code: "<ol class=\"steps\" aria-label=\"신청 단계\">\n  <li>본인 확인</li><li aria-current=\"step\">정보 입력</li><li>제출</li>\n\
      </ol>\n"
    note: 절차 진행을 단계 표시기와 aria-current="step"으로 보여준다.
  bad:
  - lang: html
    code: '<nav aria-label="브레드크럼"><ol><li>본인 확인</li><li>정보 입력</li><li>제출</li></ol></nav>

      '
    note: 절차 진행을 브레드크럼으로 보여준다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS component_03_03 WebFetch): ''단계 식별자나 진행 상황 표시기를 사용해야 한다'' 확인 → SHOULD
  + public-sector-must. 단계 표시기 세부는 NAV-053~056.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
