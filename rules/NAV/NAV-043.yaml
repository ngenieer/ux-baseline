id: NAV-043
category: NAV
title: 페이지네이션 전체 화면 수 표시
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 페이지네이션에 전체 화면 수를 텍스트로 표시한다.
measurement:
  criteria: 페이지네이션 영역 안에 전체 화면 수(마지막 화면 번호 또는 '/ N' 레이블)가 화면에 보이는 텍스트로 있다.
  method: 페이지네이션 DOM에서 전체 화면 수 텍스트를 찾는다.
automation:
  feasibility: none
  checks: []
  note: 기존 검사기 규칙 없음. 컴포넌트 구조를 정하면 커스텀 DOM 검사로 자동화 가능.
rationale: 사용자가 전체 데이터 양을 가늠하게 한다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 페이지네이션 > 사용성 가이드라인 (전체 화면 수를 표시한다) (가이드라인 PDF 2025.08 325·326쪽)
  note: https://www.krds.go.kr/html/site/component/component_03_06.html
scope:
  level: component
  targets:
  - 페이지네이션
exceptions: []
relations:
- type: depends
  id: RESP-011
  note: 전체 화면 수는 화면 크기와 무관하게 같아야 함(RESP-011)
examples:
  good:
  - lang: html
    code: "<nav aria-label=\"페이지\">\n  <a href=\"?p=1\">처음</a> <a href=\"?p=4\">이전</a>\n  <a aria-current=\"page\"\
      >5</a> <span>/ 20</span>\n  <a href=\"?p=6\">다음</a> <a href=\"?p=20\">마지막</a>\n</nav>\n"
    note: '''/ 20'' 텍스트로 전체 화면 수를 보여 준다.'
  bad:
  - lang: html
    code: "<nav aria-label=\"페이지\">\n  <a href=\"?p=1\">처음</a> <a href=\"?p=4\">이전</a>\n  <a aria-current=\"page\"\
      >5</a>\n  <a href=\"?p=6\">다음</a> <a href=\"?p=20\">마지막</a>\n</nav>  <!-- 전체 화면 수 표시 없음 -->\n"
    note: 처음·마지막 버튼은 있지만 전체 화면 수가 어디에도 보이지 않는다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS 페이지 curl 수신 후 텍스트 추출): ''전체 화면 수를 표시한다'', ''사용자가 전체 데이터 목록 수를 알 수 있도록
  전체 화면 수를 제공해야 한다'' 확인. 구조 절의 ''전체 화면 수 레이블''(입력 필드 오른쪽)도 확인. 원문 지시형 문장을 의무로 읽어 SHOULD + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
