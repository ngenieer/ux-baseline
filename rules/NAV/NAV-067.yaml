id: NAV-067
category: NAV
title: 탭바 사용 화면 너비
stage: platformed
status:
  value: confirmed
type: rule
strength: MAY
statement: 하단 탭바는 좁은 화면(RESP-004의 모바일·태블릿 구간)에서만 쓰고, 그보다 넓은 화면에서는 메인 메뉴를 쓴다.
measurement:
  criteria: RESP-004 기준 1024px 이상 뷰포트에서 탭바가 표시되지 않고 메인 메뉴가 표시된다.
  method: 1024px 이상과 미만 뷰포트로 각각 렌더링해 탭바·메인 메뉴 표시 여부를 확인한다.
automation:
  feasibility: none
  checks: []
  note: 기존 검사기 규칙 없음. 뷰포트별 렌더링 커스텀 검사 가능.
rationale: 탭바는 한 손 조작 범위가 제한된 작은 기기에서 핵심 화면으로 빠르게 가기 위한 수단이다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 탭바 > 용례 (화면 너비가 좁은 경우 / 화면 너비가 충분한 경우 메인 메뉴를 사용한다) (가이드라인 PDF 2025.08 339·340쪽)
  note: https://www.krds.go.kr/html/site/component/component_12_07.html
- ref: KRDS
  locator: 디자인 스타일 > 레이아웃 > 브레이크포인트(PDF 153쪽)
  note: Mobile 모드(태블릿 포함) < 1024px ≤ PC 모드
scope:
  level: component
  targets:
  - 탭바
  - 메인 메뉴
exceptions: []
relations:
- type: depends
  id: RESP-004
  note: 모바일·태블릿 구간 경계는 RESP-004 브레이크포인트
examples:
  good:
  - lang: css
    code: '@media (min-width: 1024px) { .tab-bar { display: none; } }

      '
  bad:
  - lang: css
    code: '.tab-bar { position: fixed; bottom: 0; }  /* 데스크톱에서도 탭바 표시 */

      '
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS 페이지 curl 수신 후 텍스트 추출): ''모바일, 태블릿과 같이 콘텐츠를 표시할 영역이 좁은 경우 탭바를 사용하여 … 제공할
  수 있다'', ''화면 너비가 충분한 경우 메인 메뉴를 사용한다'' 확인. 원문에 너비 수치가 없어 1024px 경계는 RESP-004(아직 collected·미대조)의 태블릿/데스크톱 경계에서 가져온
  해석 — 확인 필요. 원문이 용례·유형 서술(사용하기 적합/사용한다)이라 MAY. KRDS 가이드라인 PDF(2025.08, 1181쪽) 원문 대조 2026-10-18: Mobile 모드가 ''태블릿을
  포함한 소형 디바이스''(1024px 미만)임을 확인 — 1024px 경계가 KRDS 모드 정의와 일치.'
korean_specific: false
tags:
- krds
- krds-component
- system-choice
decisions:
- CF-055
