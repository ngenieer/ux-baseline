id: NAV-057
category: NAV
title: 언어 변경 지구본 아이콘
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 드롭다운형 언어 변경 버튼은 레이블 왼쪽에 지구본 아이콘을 표시한다.
measurement:
  criteria: 드롭다운형 언어 변경 버튼 안에서 지구본 아이콘 요소가 레이블 텍스트보다 앞(시각적 왼쪽)에 있다.
  method: 언어 변경 버튼 DOM과 화면을 확인한다.
automation:
  feasibility: none
  checks: []
  note: 기존 검사기 규칙 없음. 아이콘 클래스·파일명을 정하면 커스텀 DOM 검사 가능.
rationale: 언어 변경이 필요한 사용자는 레이블 텍스트를 읽지 못할 수 있어 익숙한 기호로 용도를 알린다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 언어 변경 > 사용성 가이드라인 (링크 레이블에 아이콘을 제공한다) (가이드라인 PDF 2025.08 718·719쪽)
  note: https://www.krds.go.kr/html/site/component/component_10_01.html
scope:
  level: component
  targets:
  - 드롭다운형 언어 변경
exceptions: []
relations:
- type: depends
  id: NAV-058
  note: 드롭다운형은 지원 언어 3개 이상일 때(NAV-058)
examples:
  good:
  - lang: html
    code: '<button type="button" aria-expanded="false"><svg aria-hidden="true" class="icon-globe">…</svg>Language</button>

      '
    note: 드롭다운형 언어 변경 버튼 레이블 왼쪽에 지구본 아이콘이 있다.
  bad:
  - lang: html
    code: '<button type="button" aria-expanded="false">Language ▾</button>

      '
    note: 지구본 아이콘 없이 레이블만 있다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS 페이지 curl 수신 후 텍스트 추출): ''드롭다운 유형에서 레이블 왼쪽에 지구본 형태의 아이콘을 표시하여 … 부가적인 단서를
  제공해야 한다'' 확인. 헤딩은 ''링크 레이블에 아이콘을 제공한다''지만 본문은 드롭다운 유형을 지정. 원문 지시형 문장을 의무로 읽어 SHOULD + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
