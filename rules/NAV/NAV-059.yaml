id: NAV-059
category: NAV
title: 도움 패널 초기 펼침
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 도움 패널을 제공하는 화면은 로딩이 끝났을 때 도움 패널을 펼친 상태로 표시하되, 키보드 초점을 도움 패널로 옮기지 않는다.
measurement:
  criteria: 도움 패널이 있는 화면을 처음 불러오면 (1) 패널이 보이는 상태(펼침)이고, 패널 열기 버튼이 있으면 aria-expanded="true"이며, (2) 로딩 직후 document.activeElement가
    도움 패널 안의 요소가 아니다.
  method: 화면을 새로 불러온 직후 도움 패널 표시 상태를 확인한다.
automation:
  feasibility: none
  checks: []
  note: 기존 검사기 규칙 없음. 페이지 로드 직후 상태를 보는 커스텀 E2E 검사 가능.
rationale: 도움이 필요한 사용자가 패널이 있다는 것을 바로 알게 한다. 처음 상태에는 패널의 용도·활용 방법만 안내한다(COPY-041).
sources:
- ref: KRDS
  locator: 컴포넌트 > 도움 패널 > 사용성 가이드라인 (화면이 로딩되었을 때 도움 패널은 열린 상태로 제공한다) (가이드라인 PDF 2025.08 601·602쪽)
  note: https://www.krds.go.kr/html/site/component/component_08_01.html
scope:
  level: component
  targets:
  - 도움 패널
exceptions:
- 화면 너비가 패널을 함께 표시할 수 없으면 패널 열기 버튼으로 축약(RESP-016)
relations:
- type: conflicts
  id: A11Y-024
  note: 양립. 로딩 시 펼친 상태는 초기 화면 상태일 뿐 맥락 변화가 아니다. 단, 펼친 패널로 키보드 초점을 옮기지 않는다.
  decision: CF-003
- type: depends
  id: COPY-041
  note: 펼친 초기 상태의 내용은 용도·활용 방법 안내(COPY-041)
- type: depends
  id: RESP-016
  note: 좁은 화면에서는 버튼으로 축약
examples:
  good:
  - lang: html
    code: '<button type="button" aria-controls="help" aria-expanded="true">도움 패널 접기</button>

      <aside id="help" aria-label="도움 패널">이 패널에서 신청서 항목별 도움말을 볼 수 있습니다.</aside>

      <!-- 로딩 후 초점은 문서 처음에 그대로 둔다(패널로 focus() 하지 않음) -->

      '
    note: 로딩 시 도움 패널이 펼쳐져 있고 초점은 옮기지 않는다.
  bad:
  - lang: html
    code: '<aside id="help" hidden>…</aside>

      <button aria-controls="help" aria-expanded="false">도움말</button>  <!-- 넓은 화면에서 처음부터 접힘 -->

      '
    note: 도움 패널이 처음부터 접혀 있다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS 페이지 curl 수신 후 텍스트 추출): ''화면이 로딩되었을 때 도움 패널은 열린 상태로 제공한다'', ''…도움 패널을 펼친
  상태로 제공한다'' 확인. 같은 KRDS의 맥락적 도움말(component_08_03)·코치마크(08_04) 페이지는 ''페이지가 로딩되자마자 … 자동으로 실행되어서는 안 된다''고 씀 — BACKLOG
  충돌 후보로 연결. 원문 지시형 문장을 의무로 읽어 SHOULD + public-sector-must. 2026-10-18 측정 기준을 3단계 결정(statement 변경)에 맞춰 고침.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
