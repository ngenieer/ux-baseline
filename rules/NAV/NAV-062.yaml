id: NAV-062
category: NAV
title: 맥락적 도움말과 도움 패널 병용 금지
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 하나의 과업 흐름(같은 절차에 속한 화면들)에서 맥락적 도움말과 도움 패널을 함께 쓰지 않는다.
measurement:
  criteria: 같은 과업 흐름에 속한 화면들 가운데 맥락적 도움말 팝오버 트리거와 도움 패널이 함께 있는 화면 조합이 없다.
  method: 과업 흐름별 화면 목록을 정하고, 각 화면의 도움 컴포넌트 종류를 모아 두 종류가 섞였는지 확인한다.
automation:
  feasibility: none
  checks: []
  note: 과업 흐름 경계 정의가 필요해 범용 자동 검사 불가. 화면 목록을 주면 컴포넌트 존재 집계는 스크립트로 가능.
rationale: 도움을 주는 방식이 섞이면 사용자가 인터페이스의 작동 방식을 혼동한다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 맥락적 도움말 > 사용성 가이드라인 (맥락적 도움말과 도움 패널을 함께 사용하지 않는다) (가이드라인 PDF 2025.08 623·629쪽)
  note: https://www.krds.go.kr/html/site/component/component_08_03.html
scope:
  level: situation
  targets:
  - 맥락적 도움말
  - 도움 패널
  - 과업 흐름
exceptions: []
relations:
- type: depends
  id: COPY-043
  note: 간단한 안내는 맥락적 도움말, 단계별 안내는 따라하기 패널·코치마크(COPY-043)
examples:
  good:
  - lang: html
    code: '<!-- 신청 절차 전체에서 도움 패널만 사용 -->

      <aside aria-label="도움 패널">…</aside>

      '
    note: 과업 흐름 전체에서 도움 패널 하나만 쓴다.
  bad:
  - lang: html
    code: '<aside aria-label="도움 패널">…</aside>

      <button aria-haspopup="dialog" aria-label="주민등록번호 도움말">?</button>  <!-- 같은 화면에 맥락적 도움말 -->

      '
    note: 같은 화면에 도움 패널과 맥락적 도움말을 함께 쓴다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS 페이지 curl 수신 후 텍스트 추출): ''맥락적 도움말과 도움 패널을 함께 사용하지 않는다'', ''하나의 과업 흐름에서
  맥락적 도움말과 도움 패널을 동시에 사용하지 않아야 한다'' 확인. 원문 지시형 문장을 의무로 읽어 SHOULD + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
