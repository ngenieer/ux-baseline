id: NAV-051
category: NAV
title: 커스텀 셀렉트 바깥 클릭 닫기
stage: normalized
status:
  value: deprecated
  reason: A11Y-040로 병합 (NAV-051(커스텀 셀렉트 바깥 클릭 시 목록 닫기)은 A11Y-040의 측정 기준 (1)과 같은 요구. A11Y-040이 바깥 클릭+Esc 초점 복귀를 함께
    다루고 셀렉트·언어 변경·화면 크기 조정 세 페이지를 모두 출처로 가진다. 출처 강도 같음(KRDS). 카테고리가 다른 두 룰 중 상위 요구를 포함한 쪽을 정본으로 제안 — 정책 1의 '번호가
    작은 룰'은 카테고리가 달라 적용 불가. 오케스트레이터 판단 필요.)
  superseded_by: A11Y-040
type: rule
strength: SHOULD
statement: 커스텀 셀렉트의 옵션 목록이 펼쳐진 상태에서 셀렉트의 레이블·컨테이너·옵션 목록이 아닌 영역을 클릭하면 옵션 목록을 닫는다.
measurement:
  criteria: 옵션 목록이 펼쳐진 상태에서 셀렉트 레이블·컨테이너·옵션 목록 바깥의 임의 지점을 클릭하면 옵션 목록이 숨겨지고 컨테이너의 aria-expanded가 "false"가 된다.
  method: 'E2E 또는 수동: 목록을 연 뒤 바깥 영역을 클릭해 목록 표시 상태와 aria-expanded를 확인한다.'
automation:
  feasibility: none
  checks: []
  note: 기존 검사기 규칙 없음. 4단계 E2E 커스텀 검사로 자동화 가능.
rationale: 펼쳐진 목록이 남아 다른 콘텐츠를 가리거나 조작을 막지 않게 한다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 셀렉트 > 상호작용 가이드라인 (목록 확장 및 축소 — Click)
  note: https://www.krds.go.kr/html/site/component/component_06_03.html
scope:
  level: component
  targets:
  - 커스텀 셀렉트(role=combobox/listbox로 만든 선택 컴포넌트)
exceptions:
- 브라우저 기본 select 요소(브라우저가 동작을 제공)
relations:
- type: refines
  id: A11Y-040
  note: 드롭다운 바깥 클릭 닫기(A11Y-040)를 셀렉트에 적용. 레이블 클릭은 바깥으로 보지 않음
examples:
  good:
  - lang: html
    code: "<script>\ndocument.addEventListener('click', e => {\n  if (!selectRoot.contains(e.target) && !labelEl.contains(e.target))\
      \ close();\n});\n</script>\n"
  bad:
  - lang: html
    code: '<script>

      // 옵션을 고를 때만 닫힘 — 바깥 클릭에는 반응하지 않음

      options.forEach(o => o.addEventListener(''click'', close));

      </script>

      '
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS 페이지 curl 수신 후 텍스트 추출): ''옵션 목록이 확장된 상태에서 셀렉트의 레이블, 컨테이너, 옵션 목록이 아닌 영역을
  Click 하면 옵션 목록은 축소되어야 한다'' 확인. 예외(기본 select)는 원문 명시가 아니라 적용 대상(''커스텀'') 한정에서 나온 범위 설명. 원문 지시형 문장을 의무로 읽어 SHOULD
  + public-sector-must. 카테고리 재검토(셀렉트 룰 다수가 FORM·A11Y).'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
