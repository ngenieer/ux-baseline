id: NAV-069
category: NAV
title: 탭바 메뉴 수
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 탭바 메뉴는 5개 이하로 두고, 그보다 많은 항목은 전체 메뉴나 더 보기 같은 부가 탐색 수단으로 제공한다.
measurement:
  criteria: 탭바 안 탭 메뉴 요소 수가 5 이하이다.
  method: 탭바 DOM의 탭 메뉴 개수를 센다.
automation:
  feasibility: none
  checks: []
  note: 기존 검사기 규칙 없음. 탭바 셀렉터를 정하면 커스텀 DOM 검사로 완전 자동화 가능.
rationale: 메뉴가 많으면 화면이 복잡해지고 탭마다 선택 영역이 줄어 터치하기 어렵다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 탭바 > 사용성 가이드라인 (탭 메뉴의 개수를 5개 이내로 제한한다) (가이드라인 PDF 2025.08 345쪽)
  note: https://www.krds.go.kr/html/site/component/component_12_07.html
scope:
  level: component
  targets:
  - 탭바
exceptions: []
relations:
- type: depends
  id: NAV-004
  note: 홈·전체 메뉴 버튼 배치 순서 항목은 NAV-004(일관된 내비게이션)로 병합됨
examples:
  good:
  - lang: html
    code: "<nav class=\"tab-bar\" aria-label=\"주요 메뉴\">\n  <a href=\"/\"><svg aria-hidden=\"true\">…</svg>홈</a>\
      \ <a href=\"/apply\"><svg aria-hidden=\"true\">…</svg>신청</a>\n  <a href=\"/status\"><svg aria-hidden=\"true\"\
      >…</svg>조회</a> <a href=\"/alerts\"><svg aria-hidden=\"true\">…</svg>알림</a>\n  <a href=\"/all\"><svg aria-hidden=\"\
      true\">…</svg>전체</a>\n</nav>\n"
    note: 탭바 메뉴가 5개이고 나머지는 '전체' 메뉴로 보낸다.
  bad:
  - lang: html
    code: "<nav class=\"tab-bar\" aria-label=\"주요 메뉴\">\n  <a href=\"/\"><svg aria-hidden=\"true\">…</svg>홈</a>\
      \ <a href=\"/apply\"><svg aria-hidden=\"true\">…</svg>신청</a>\n  <a href=\"/status\"><svg aria-hidden=\"true\"\
      >…</svg>조회</a> <a href=\"/cert\"><svg aria-hidden=\"true\">…</svg>증명서</a>\n  <a href=\"/alerts\"><svg aria-hidden=\"\
      true\">…</svg>알림</a> <a href=\"/settings\"><svg aria-hidden=\"true\">…</svg>설정</a>\n  <a href=\"/all\"><svg\
      \ aria-hidden=\"true\">…</svg>전체</a>\n</nav>  <!-- 7개 -->\n"
    note: 탭바 메뉴가 7개다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS 페이지 curl 수신 후 텍스트 추출): ''탭 메뉴는 5개 이내로 제한하여'', ''더 많은 항목이 필요한 경우, 전체 메뉴나
  더 보기 메뉴와 같은 부가적인 탐색 수단을 제공하고'' 확인. 같은 문단 근거 문장은 ''5개 이상의 메뉴가 있으면 화면이 복잡해지며''라고 써서 경계(5 포함 여부)가 헤딩과 어긋남 — statement는
  헤딩 ''5개 이내''를 따름. 원문 지시형 문장을 의무로 읽어 SHOULD + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
