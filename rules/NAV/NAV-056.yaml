id: NAV-056
category: NAV
title: 선택 단계 건너뛰기
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 단계 절차에 선택 단계가 있으면 그 단계를 건너뛰는 수단을 제공하고, 건너뛰면 다음 필수 단계로, 남은 필수 단계가 없으면 최종 검토·제출 단계로 이동시킨다.
measurement:
  criteria: 선택 단계 화면마다 건너뛰기 컨트롤이 있고, 실행하면 다음 필수 단계(없으면 최종 검토·제출 단계)가 표시된다.
  method: 'E2E 또는 수동: 선택 단계마다 건너뛰기를 실행해 도착 단계를 확인한다.'
automation:
  feasibility: none
  checks: []
  note: 기존 검사기 규칙 없음. 절차 정의(필수/선택 단계 목록)가 있으면 E2E 커스텀 검사로 자동화 가능.
rationale: 선택 정보를 입력하지 않으려는 사용자가 절차를 끝까지 진행할 수 있게 한다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 단계 표시기 > 사용성 가이드라인 (선택적인 단계) (가이드라인 PDF 2025.08 587쪽)
  note: https://www.krds.go.kr/html/site/component/component_07_01.html
scope:
  level: situation
  targets:
  - 선택 단계가 있는 단계 절차
exceptions: []
relations:
- type: depends
  id: COPY-003
  note: 건너뛰기 UI 레이블('건너뛰기', '다음에 입력하기')은 COPY-003으로 병합된 항목
examples:
  good:
  - lang: html
    code: '<h2>3단계(선택): 추가 연락처</h2> …

      <button type="button">다음에 입력하기</button>  <!-- 남은 필수 단계 없음 → 검토·제출 단계로 -->

      '
    note: 선택 단계에 건너뛰기 버튼이 있고 남은 필수 단계가 없어 검토·제출로 간다.
  bad:
  - lang: html
    code: '<h2>3단계(선택): 추가 연락처</h2> …

      <button type="submit">다음</button>  <!-- 빈 값으로 제출하면 오류 — 건너뛸 수 없음 -->

      '
    note: 선택 단계를 비워 두면 오류가 나서 건너뛸 수 없다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS 페이지 curl 수신 후 텍스트 추출): ''선택적인 단계를 건너뛰어 다음 필수 단계로 이동할 수 있는 수단을 제공해야 한다.
  남은 필수 단계가 존재하지 않는다면 최종 단계(최종 검토/제출)로 건너뛴다'' 확인. 1단계 statement의 ''선택 단계는 모든 필수 단계 뒤에 둔다''는 원문 ''가능한 한 … 마지막에 제공하는
  것이 바람직하다''(권장·모호어)라 강도가 달라 statement에서 뺐다 — 별도 MAY 룰 분리를 제안 파일 notes에 기록. 원문 지시형 문장을 의무로 읽어 SHOULD + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
