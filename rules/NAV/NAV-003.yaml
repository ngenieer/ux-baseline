id: NAV-003
category: NAV
title: 여러 찾기 방법
stage: platformed
status:
  value: confirmed
type: rule
strength: MUST
statement: 절차의 결과나 한 단계가 아닌 페이지는 사이트 안에서 그 페이지를 찾는 방법을 두 가지 이상 제공한다.
measurement:
  criteria: '절차(신청·결제 등)의 단계·결과 페이지를 뺀 모든 페이지가 다음 중 2가지 이상으로 도달 가능하다: 메인 메뉴·사이드 메뉴 등 내비게이션, 사이트맵 페이지, 사이트 검색, 목차,
    관련 페이지 링크.'
  method: 페이지 목록을 뽑고 페이지마다 도달 경로를 표로 기록해 2가지 미만인 페이지가 0개인지 확인한다(수동).
automation:
  feasibility: none
  note: '4단계 커스텀 검사 가능: 사이트맵·메뉴 링크 집합과 검색 색인 집합을 크롤로 만든 뒤 페이지별 포함 횟수를 계산.'
rationale: 메뉴 구조를 따라가기 어려운 사용자는 검색으로, 검색이 어려운 사용자는 사이트맵·메뉴로 찾을 수 있어야 한다.
sources:
- ref: WCAG22
  locator: SC 2.4.5 Multiple Ways (Level AA)
  note: https://www.w3.org/TR/WCAG22/#multiple-ways
- ref: WCAG22_UNDERSTANDING
  locator: https://www.w3.org/WAI/WCAG22/Understanding/multiple-ways.html
- ref: KRDS
  locator: 컴포넌트 > 푸터 > 사용성 가이드라인 (가이드라인 PDF 2025.08 250쪽)
  note: https://www.krds.go.kr/html/site/component/component_02_04.html — '사이트맵을 비롯하여 사용자가 빈번하게 찾는 링크는 웹사이트의 하단에서도
    쉽게 접근할 수 있도록 제공하는 것이 좋다.'(권장)
scope:
  level: global
  targets:
  - 웹사이트 내 모든 페이지
exceptions:
- 절차의 결과이거나 절차의 한 단계인 페이지(WCAG 2.4.5 원문)
relations: []
examples:
  good:
  - lang: html
    code: '<header><nav aria-label="메인 메뉴">…</nav><form role="search">…</form></header>

      <footer><a href="/sitemap">사이트맵</a></footer>

      '
    note: 메인 메뉴·사이트 검색·사이트맵 세 가지로 페이지를 찾을 수 있다.
  bad:
  - lang: html
    code: '<!-- 메뉴로만 도달 가능하고 검색·사이트맵 없음 -->

      <header><nav aria-label="메인 메뉴">…</nav></header>

      '
    note: 메인 메뉴 한 가지로만 도달할 수 있다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(WCAG22-A-AA.yaml 2.4.5, KRDS component_02_04 WebFetch): SC 원문 ''More than one
  way is available to locate a web page within a set of web pages except where the web page is the result of, or
  a step in, a process.''와 일치. KRDS 푸터 문장은 ''좋다''(권장) — 사이트맵을 푸터에 두는 것은 이 룰의 한 구현 수단.'
korean_specific: false
tags:
- wcag22
- level-aa
- new-in-2.0
- krds
