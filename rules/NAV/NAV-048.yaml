id: NAV-048
category: NAV
title: 캐러셀 전체 수와 현재 위치
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 캐러셀에 전체 슬라이드 수와 현재 보고 있는 슬라이드의 순서를 표시한다.
measurement:
  criteria: 캐러셀 영역에 (1) 전체 슬라이드 수와 (2) 현재 슬라이드 순서를 알 수 있는 식별자(분수형 'N / M' 텍스트 또는 슬라이드마다 하나씩 있는 도형 식별자 중 현재 항목 강조)가
    있다.
  method: 캐러셀 DOM에서 식별자 그룹을 찾고, 슬라이드를 넘길 때 현재 순서 표시가 바뀌는지 확인한다.
automation:
  feasibility: none
  checks: []
  note: 기존 검사기 규칙 없음. 컴포넌트 구조를 정하면 커스텀 DOM 검사(식별자 수 = 슬라이드 수, 현재 항목 표시 존재) 가능.
rationale: 사용자가 탐색할 정보의 양과 현재 위치를 확인하고 필요하면 다시 탐색하게 한다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 캐러셀 > 사용성 가이드라인 (전체 슬라이드 수와 사용자의 탐색 위치를 표시한다) (가이드라인 PDF 2025.08 430·435쪽)
  note: https://www.krds.go.kr/html/site/component/component_04_09.html
scope:
  level: component
  targets:
  - 캐러셀
exceptions:
- 슬라이드가 1개뿐이면 항목 식별자를 숨긴다(STATE-016, 같은 KRDS 페이지)
relations:
- type: depends
  id: STATE-016
  note: 항목 1개면 식별자를 숨김
- type: depends
  id: LAYOUT-040
  note: 식별자 유형(도형형·분수형)별 배치
examples:
  good:
  - lang: html
    code: "<div class=\"carousel\" aria-roledescription=\"carousel\" aria-label=\"주요 소식\">\n  … <p class=\"indicator\"\
      ><span aria-current=\"true\">2</span> / 5</p>\n</div>\n"
    note: '''2 / 5''로 현재 순서와 전체 슬라이드 수를 보여 준다.'
  bad:
  - lang: html
    code: "<div class=\"carousel\" aria-roledescription=\"carousel\" aria-label=\"주요 소식\">\n  … <button type=\"\
      button\">이전 소식</button><button type=\"button\">다음 소식</button>\n</div>  <!-- 순서·전체 수 표시 없음 -->\n"
    note: 전체 슬라이드 수와 현재 순서 표시가 없다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS 페이지 curl 수신 후 텍스트 추출): ''전체 슬라이드 수와 사용자의 탐색 위치를 표시한다'', ''…정보를 제공해야 한다''
  확인. 구조 절의 식별자 유형(도형·분수)도 확인. 원문 지시형 문장을 의무로 읽어 SHOULD + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
