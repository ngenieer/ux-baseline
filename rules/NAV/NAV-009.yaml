id: NAV-009
category: NAV
title: 필터 적용 후 초점 유지
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 필터·정렬·조회를 실행한 뒤 키보드 초점을, 결과를 즉시 반영하는 방식이면 값을 바꾼 옵션에, 일괄 반영하는 방식이면 적용(제출) 버튼에 유지하고 문서 처음이나 다른 요소로 옮기지
  않는다.
measurement:
  criteria: '즉시 반영 방식: 옵션 값을 바꾸고 결과가 갱신된 뒤 document.activeElement가 값을 바꾼 그 옵션 요소다. 일괄 반영 방식: 적용 버튼을 누르고 결과가 갱신된
    뒤 document.activeElement가 그 적용 버튼이다. 두 방식 모두 갱신 후 activeElement가 body·문서 첫 요소가 아니다.'
  method: 키보드만으로 필터·정렬을 실행하고 결과 갱신 후 초점 표시 위치를 확인한다(수동 또는 Playwright).
automation:
  feasibility: none
  note: '4단계 커스텀 E2E 검사 가능: 옵션 change/버튼 click 후 결과 갱신 이벤트를 기다려 activeElement 비교.'
rationale: 초점이 문서 처음이나 예측할 수 없는 곳으로 가면 키보드·스크린 리더 사용자가 다음 옵션을 고르려고 처음부터 다시 탐색해야 한다.
sources:
- ref: KRDS
  locator: 기본 패턴 > 필터링·정렬 > 접근성 가이드라인 (가이드라인 PDF 2025.08 876쪽)
  note: https://www.krds.go.kr/html/site/global/global_10.html — '필터링·정렬 결과를 즉각적으로 표시할 때, 키보드 초점은 값을 변경하거나 선택한 옵션
    항목에 유지되도록 한다.' / '결과를 일괄 표시할 때는 키보드 초점을 제출 버튼에 유지시킨다.'
- ref: KRDS
  locator: 컴포넌트 > 구조화 목록 > 접근성 가이드라인 (가이드라인 PDF 2025.08 358쪽)
  note: https://www.krds.go.kr/html/site/component/component_04_01.html — '구조화 목록을 정렬하거나 조회하는 기능이 있다면 해당 기능 실행 후,
    키보드 초점은 정렬/조회 UI에 유지되어야 한다.'
- ref: KRDS
  locator: 컴포넌트 > 태그 > 상호작용 가이드라인 (가이드라인 PDF 2025.08 568쪽)
  note: 필터 추가 태그 실행 시 초점을 적용된 옵션 막대로 옮긴다 — 이 룰의 예외적 세부 동작(sources/extracts/KRDS-components.yaml, 원문 재대조 안 함).
scope:
  level: component
  targets:
  - 필터 영역
  - 정렬 컨트롤
  - 구조화 목록 조회 UI
exceptions:
- 필터 추가 태그를 실행한 경우 초점을 적용된 옵션 막대로 옮긴다(KRDS 태그 컴포넌트)
relations:
- type: refines
  id: A11Y-015
  note: 초점 순서 보존(WCAG 2.4.3)을 필터·정렬 상황에서 구체화
examples:
  good:
  - lang: html
    code: "<script>\napplyBtn.addEventListener('click', async () => {\n  await refreshResults();\n  // 초점은 applyBtn에\
      \ 그대로 둔다 (focus 이동 코드 없음)\n});\n</script>\n"
    note: 결과 갱신 후 초점이 적용 버튼에 그대로 남는다.
  bad:
  - lang: html
    code: "<script>\napplyBtn.addEventListener('click', async () => {\n  await refreshResults();\n  document.querySelector('h1').focus();\
      \ // 초점을 페이지 처음으로 보냄\n});\n</script>\n"
    note: 결과 갱신 후 초점을 페이지 처음(h1)으로 옮긴다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS global_10, component_04_01 WebFetch): 두 문장 모두 확인. 원문은 ''제출 버튼''이라고 씀 —
  statement는 ''적용(제출) 버튼''. 강도: 구조화 목록 ''유지되어야 한다'' → SHOULD + public-sector-must. 태그 컴포넌트 문장은 추출본만 확인.'
korean_specific: false
tags:
- krds
- public-sector-must
