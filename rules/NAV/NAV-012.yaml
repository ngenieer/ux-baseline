id: NAV-012
category: NAV
title: 외부 이동·새 창 표시
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 외부 서비스로 이동하거나 새 창(탭)을 여는 링크·버튼에는 그 사실을 알리는 아이콘이나 텍스트를 서비스 전체에서 같은 방식으로 표시하고, 같은 내용을 링크 안의 텍스트(시각적으로 숨긴
  텍스트 포함)로 제공하며 title 속성만으로 알리지 않는다.
measurement:
  criteria: 'target="_blank"인 a 요소, window.open을 실행하는 버튼, 다른 출처(origin)로 가는 링크 모두에 대해: (1) 화면에 새 창·외부 아이콘이나 ''새
    창''·''외부'' 텍스트가 보이고, (2) 접근 가능한 이름 또는 aria-describedby 텍스트에 ''새 창'' 또는 ''외부''가 들어 있으며 (title 속성만으로는 충족하지 않음),
    (3) 서비스 안의 모든 해당 링크가 같은 아이콘·문구를 쓴다.'
  method: DOM에서 해당 링크·버튼 목록을 뽑아 접근 가능한 이름을 확인하고(개발자 도구 Accessibility 패널), 화면에서 아이콘·문구 일치를 확인한다.
automation:
  feasibility: partial
  checks:
  - tool: custom
    method: a[target=_blank]의 계산된 접근 가능한 이름(또는 aria-describedby)에 '새 창'|'외부' 포함 여부 검사 — axe 커스텀 규칙 또는 eslint(jsx-a11y
      계열) 커스텀
  note: 외부 출처 판별은 서비스 도메인 설정이 필요하고, 아이콘의 시각적 존재·일관성은 수동 확인.
rationale: 사용자가 원하지 않는 상황에서 현재 이용 맥락을 벗어나지 않도록 실행 결과를 미리 알 수 있어야 한다. 아이콘만 있으면 스크린 리더 사용자는 알 수 없다.
sources:
- ref: KRDS
  locator: 기본 패턴 > 상세 정보 확인 > 사용성 가이드라인 (가이드라인 PDF 2025.08 821쪽)
  note: https://www.krds.go.kr/html/site/global/global_06.html — '외부 서비스로 이동하거나 새 창을 실행하는 액션 버튼에 명확한 시각적 단서를 제공한다.'
    / '새 창 열림 아이콘을 표시하여…'
- ref: KRDS
  locator: 컴포넌트 > 링크 > 사용성 가이드라인 (가이드라인 PDF 2025.08 505·507쪽)
  note: https://www.krds.go.kr/html/site/component/component_05_01.html — '외부 서비스로 이동하는 링크를 분명하게 구분하고 일관된 방식으로 표현한다.'
    / '별도의 아이콘이나 텍스트(예 - ‘외부’)를 제공하여 … 예측할 수 있도록 해야 한다.' title은 '보조적인 수단'으로만 제시.
- ref: KRDS
  locator: 컴포넌트 > 구조화 목록 > 접근성 가이드라인 (가이드라인 PDF 2025.08 358쪽)
  note: https://www.krds.go.kr/html/site/component/component_04_01.html — '새로운 브라우저 창을 실행하는 링크나 외부 애플리케이션을 실행하는
    버튼이 있다면 부가적인 설명을 제공하여 스크린 리더 사용자가 기능의 실행 결과를 예측할 수 있어야 한다.'
- ref: KRDS
  locator: 컴포넌트 > 언어 변경 > 사용성 가이드라인 (가이드라인 PDF 2025.08 723쪽)
  note: 외국어 사이트로 가는 언어 변경 링크에 새 창 아이콘 표시 — 표시 부분만 이 룰과 같음('새 창으로 연다' 부분은 별도 요구). sources/extracts/KRDS-components.yaml
scope:
  level: component
  targets:
  - a[target=_blank]
  - 다른 출처로 가는 a[href]
  - 새 창·외부 앱을 여는 button
exceptions: []
relations:
- type: conflicts
  id: NAV-013
  note: 새 탭으로 열되, NAV-012에 따라 새 탭이 열린다는 사실을 링크에 텍스트(스크린 리더용 포함)로 미리 알린다. 미리 알린 새 탭은 사용자가 의도한 동작으로 본다.
  decision: CF-002
- type: depends
  id: A11Y-025
  note: 알림 텍스트는 접근 가능한 이름·설명으로 전달
examples:
  good:
  - lang: html
    code: "<a href=\"https://www.law.go.kr\" target=\"_blank\" rel=\"noopener\">\n  국가법령정보센터<svg aria-hidden=\"\
      true\" class=\"icon-new-win\">…</svg><span class=\"sr-only\"> (새 창 열림)</span>\n</a>\n"
    note: 화면에 새 창 아이콘이 보이고 접근 가능한 이름에 '(새 창 열림)'이 들어간다.
  bad:
  - lang: html
    code: '<a href="https://www.law.go.kr" target="_blank" title="새 창 열림">국가법령정보센터</a>

      <!-- 화면 표시 없음, title에만 의존 -->

      '
    note: 새 창이 열린다는 사실을 title 속성으로만 알린다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS global_06, component_05_01, component_04_01 WebFetch): 시각 단서·''외부'' 텍스트·일관성·스크린
  리더용 부가 설명 문장 모두 확인. 1단계 statement(시각 표시만)를 구조화 목록 접근성 문장으로 보강. 강도: ''해야 한다'' → SHOULD + public-sector-must. KRDS
  링크 페이지 예시는 title="새 창 열림"을 씀 — A11Y-053(title 대신 툴팁)과 충돌 후보로 제안. 언어 변경 문장은 추출본만 확인.'
korean_specific: false
tags:
- krds
- public-sector-must
decisions:
- CF-043
