id: MOTION-007
category: MOTION
title: 시차·스크롤 연동 효과 제거
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: '스크롤에 연동해 요소를 움직이는 효과(시차 스크롤, 스크롤 위치에 따라 미끄러져 들어오는 요소, animation-timeline: scroll()/view())는 비필수 모션으로
  분류하고, prefers-reduced-motion: reduce일 때 제거한다.'
measurement:
  criteria: '(1) animation-timeline 선언과 스크롤 연동 키프레임은 @media (prefers-reduced-motion: no-preference) 블록 안에만 있다. (2)
    emulateMedia({reducedMotion:''reduce''}) 상태에서 페이지를 끝까지 스크롤하는 동안 스크롤 이동 외에 위치·크기가 바뀌는 요소가 없다(JS 스크롤 리스너 기반 시차
    포함).'
  method: stylelint 커스텀으로 (1)을, Playwright 스크롤 녹화와 요소 boundingBox 비교로 (2)를 검사.
automation:
  feasibility: none
  checks: []
  note: 기존 규칙 없음. 4단계 커스텀 stylelint(animation-timeline 위치) + 런타임 검사.
rationale: 배경과 전경이 다른 속도로 움직이는 시차 스크롤은 전정기관 장애 반응을 일으키는 대표적인 비필수 모션이다.
sources:
- ref: WCAG22_UNDERSTANDING
  locator: Understanding 2.3.3 — Intent(parallax scrolling), Examples(Parallax scrolling with option to turn off)
- ref: WEBDEV_PRM
  locator: Motion-triggered vestibular spectrum disorder
scope:
  level: global
  targets:
  - animation-timeline
  - 시차 스크롤
  - 스크롤 연동 애니메이션
exceptions:
- 사용자가 스크롤해 새 콘텐츠가 뷰포트로 들어오는 움직임 자체(Understanding 2.3.3).
relations:
- type: refines
  id: MOTION-004
  note: 스크롤 연동 효과를 비필수 모션으로 분류한 하위 사례.
examples:
  good:
  - lang: css
    code: "@media (prefers-reduced-motion: no-preference) {\n  .reveal { animation: slide-in var(--motion-easing-linear)\
      \ both; animation-timeline: view(); }\n}"
    note: 스크롤 연동 애니메이션을 no-preference 미디어 쿼리 안에만 선언한다.
  bad:
  - lang: css
    code: '.hero-bg { animation: parallax var(--motion-easing-linear); animation-timeline: scroll(); } /* 모션 줄이기에서도
      실행 */'
    note: 시차 스크롤이 모션 줄이기 설정에서도 실행된다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(Understanding 2.3.3 curl, web.dev prefers-reduced-motion curl): ''Another animation
  that is often non-essential is parallax scrolling'', ''Moving new content into the viewport is essential for scrolling'',
  web.dev ''scrolling animations can cause vestibular disorders'' 확인. MOTION-004의 하위 사례라 병합 대신 refines로 연결(측정 대상이
  다름). scroll-behavior: smooth를 reduce에서 auto로 바꿀지는 출처 미확인 — 범위 밖.'
korean_specific: false
tags:
- wcag22
- level-aaa
- research-motion_perf
