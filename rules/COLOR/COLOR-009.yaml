id: COLOR-009
category: COLOR
title: 고대비 모드 대비 기준
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 선명한 화면 모드(고대비 모드)를 제공하면 그 모드에서 본문 텍스트는 15:1, 헤딩·레이블 텍스트는 7:1, 아이콘은 7:1(선 두께를 기본 모드보다 굵게 바꾼 아이콘은 4.5:1),
  시각 보조 요소는 4.5:1 이상 명도 대비를 갖게 한다.
measurement:
  criteria: 선명한 화면 모드 상태에서 본문 텍스트 대비 ≥ 15:1, 헤딩(h1~h6)·레이블(label, 버튼 텍스트) 대비 ≥ 7:1, 의미 있는 아이콘 대비 ≥ 7:1(같은 아이콘의 선
    두께 — SVG stroke-width 또는 아이콘 이미지의 획 두께 — 가 기본 모드보다 크면 ≥ 4.5:1), 시각 보조(링크 밑줄, 컴포넌트 외곽선) 대비 ≥ 4.5:1.
  method: 모드를 전환한 뒤 axe-core color-contrast-enhanced(7:1/4.5:1)로 텍스트를 검사하고, 15:1 본문과 아이콘·외곽선은 토큰 쌍 대비 계산(커스텀)으로
    확인. 4.5:1로 판정하는 아이콘은 두 모드의 선 두께(계산된 stroke-width 또는 아이콘 변형 파일)를 비교한다.
automation:
  feasibility: partial
  checks:
  - tool: axe-core
    rule: color-contrast-enhanced
    method: AAA 기준(7:1, 큰 텍스트 4.5:1) 텍스트 검사 — 15:1은 검사하지 않음
  note: 15:1 본문, 아이콘, 시각 보조 대비는 토큰 쌍 계산 스크립트(커스텀).
rationale: 선명한 화면 모드는 시각 기능 제약 사용자와 저조도 환경 사용자를 위해 기본 모드보다 높은 대비를 제공하는 모드다(KRDS).
sources:
- ref: KRDS
  locator: 디자인 스타일 > 선명한 화면 모드 > 대비 (가이드라인 PDF 2025.08 194쪽)
  note: https://www.krds.go.kr/html/site/style/style_09.html
- ref: KRDS
  locator: 디자인 스타일 > 타이포그래피 > 선명한 화면 모드 명도 대비 (가이드라인 PDF 2025.08 123쪽)
  note: https://www.krds.go.kr/html/site/style/style_03.html — 본문 15:1, 헤딩·레이블 등의 텍스트와 아이콘 7:1, 시각적 보조 수단 4.5:1
- ref: KRDS
  locator: 디자인 스타일 > 색상 > 색상 적용(글자·아이콘 색상) (가이드라인 PDF 2025.08 93~94쪽)
  note: https://www.krds.go.kr/html/site/style/style_02.html — 선명한 화면 모드 글자 매직넘버 70, 본문 90(15:1), 아이콘 70
- ref: KRDS
  locator: 디자인 스타일 > 색상 > 아이콘 색상 (가이드라인 PDF 2025.08 94쪽)
  note: '''기본 모드: 매직넘버 40'', ''선명한 화면 모드: 매직넘버 70'', ''선명한 화면 모드: 매직넘버 50 (두께 변화)'' — 매직넘버 50은 4.5:1'
scope:
  level: situation
  targets:
  - 선명한 화면 모드(고대비 테마) 활성 상태
exceptions: []
relations:
- type: refines
  id: COLOR-002
  note: 선명한 화면 모드에서 텍스트 대비 기준을 높인 것. 기본 모드 기준은 COLOR-002.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS https://www.krds.go.kr/html/site/style/style_09.html HTML을 curl로 받아 본문
  확인): 대비 표(선명한 화면 모드: 본문 15:1, 헤딩·레이블 7:1, 아이콘·시각 보조 4.5:1) 및 ''기본 명도 대비를 7:1 이상'', 접근성 가이드라인 ''최소 4.5:1, 가능하면
  7:1'' 확인. 그러나 아이콘 값이 페이지마다 다르다: style_09는 ''아이콘, 시각 보조 4.5:1'', style_03은 ''헤딩, 레이블 등의 텍스트와 아이콘: 7:1, 시각적 보조 수단:
  4.5:1'', style_02는 ''아이콘 색상 선명한 화면 모드 매직넘버 70(7:1)''. statement는 엄격한 쪽(아이콘 7:1, 두 페이지 일치)으로 썼으나 KRDS 내부 불일치라 확인
  필요 → needs_verification true(제안 파일 conflicts). 같은 표의 ''기본 모드 본문 7:1''과 색상 페이지 ''본문 매직넘버 50(4.5:1)'' 불일치는 BACKLOG.
  KRDS 가이드라인 PDF(2025.08, 1181쪽) 원문 대조 2026-10-18: PDF도 같은 불일치 — 타이포그래피 ''선명한 화면 모드 명도 대비''(123쪽)는 ''헤딩, 레이블 등의
  텍스트와 아이콘: 7:1'', 선명한 화면 모드 대비 표는 ''아이콘, 시각 보조 4.5:1 이상''. CF-056으로 아이콘 7:1(엄격한 쪽)을 확정. 2026-10-18 독립 검토: 색상 PDF
  94쪽 아이콘 색상의 ''매직넘버 50 (두께 변화)''를 확인하고, 선 두께를 기본 모드보다 굵게 바꾼 아이콘은 4.5:1을 허용하도록 CF-056을 고침(WCAG 요구가 아닌 KRDS 내부 기준
  선택).'
korean_specific: false
tags:
- krds
- high-contrast
- public-sector-must
decisions:
- CF-046
- CF-056
examples:
  good:
  - lang: css
    code: '/* 선명한 화면 모드: 본문 #000 on #fff = 21:1 (≥ 15:1) */

      [data-theme="high-contrast"] p{color:var(--palette-gray-100);background:var(--palette-gray-0)}'
    note: 선명한 화면 모드 본문이 15:1 이상이다
  bad:
  - lang: css
    code: '/* 선명한 화면 모드: 본문 #464c53 on #fff = 8.68:1 (< 15:1) */

      [data-theme="high-contrast"] p{color:var(--palette-gray-70);background:var(--palette-gray-0)}'
    note: 선명한 화면 모드인데 본문 대비가 8.68:1로 15:1에 못 미친다
