id: COLOR-021
category: COLOR
title: 코치마크 버튼 강조 단계
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 코치마크의 '그만보기'·'이전' 버튼은 텍스트 버튼 스타일로, '다음'·'마치기' 버튼은 고스트 버튼 스타일로 표시해 본문 액션 버튼보다 강조 수준을 낮춘다.
measurement:
  criteria: 코치마크 안 '그만보기'·'이전' 버튼이 텍스트 버튼 변형, '다음'·'마치기' 버튼이 고스트(윤곽선) 버튼 변형이고, 코치마크 안에 주조색 채움 버튼이 0개.
  method: 커스텀 DOM 검사(버튼 레이블과 변형 클래스 확인).
automation:
  feasibility: none
  note: '4단계: 컴포넌트 변형 클래스 기반 커스텀 검사.'
rationale: 코치마크는 본문 과업을 돕는 보조 안내이므로 그 버튼이 본문 액션보다 눈에 띄면 주요 과업에서 주의를 빼앗는다(KRDS 코치마크).
sources:
- ref: KRDS
  locator: 컴포넌트 > 코치마크 > 사용성 가이드라인 (가이드라인 PDF 2025.08 638·644쪽)
  note: https://www.krds.go.kr/html/site/component/component_08_04.html
scope:
  level: component
  targets:
  - 코치마크
exceptions: []
relations:
- type: depends
  id: COLOR-015
  note: 강조 단계(채움·윤곽선·텍스트)는 COLOR-015를 따른다.
examples:
  good:
  - lang: html
    code: "<div class=\"coachmark__actions\">\n  <button class=\"btn btn--text\">그만보기</button>\n  <button class=\"\
      btn btn--text\">이전</button>\n  <button class=\"btn btn--ghost\">다음</button>\n</div>"
    note: 그만보기·이전은 텍스트 버튼, 다음은 고스트 버튼으로 본문 액션보다 강조가 낮다
  bad:
  - lang: html
    code: "<div class=\"coachmark__actions\">\n  <button class=\"btn btn--text\">그만보기</button>\n  <button class=\"\
      btn btn--primary\">다음</button>\n</div>"
    note: 코치마크 '다음'이 주조색 채움 버튼이라 본문 액션 버튼과 강조 수준이 같다
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS https://www.krds.go.kr/html/site/component/component_08_04.html HTML을
  curl로 받아 본문 확인): ''''그만보기'', ''이전'' 버튼은 텍스트 버튼 스타일을, ''다음'', ''마치기'' 버튼은 고스트 버튼 스타일을 사용한다. ''다음'', ''마치기'' 버튼은
  본문 액션 버튼의 강조 수준보다 낮아야 한다'' 확인 → SHOULD + public-sector-must. KRDS 버튼 컴포넌트에는 ''고스트'' 변형 이름이 없음(primary/secondary/tertiary/text)
  — 고스트=윤곽선으로 해석, 4단계에서 변형 매핑 확인(제안 파일 notes). 카테고리 재검토: 버튼 구성(LAYOUT 후보).'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
