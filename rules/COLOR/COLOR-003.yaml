id: COLOR-003
category: COLOR
title: 비텍스트 대비
stage: platformed
status:
  value: confirmed
type: rule
strength: MUST
statement: UI 컴포넌트와 그 상태를 식별하는 데 필요한 시각 정보(경계·아이콘·상태 표시)와 내용 이해에 필요한 그래픽 부분은 인접 색과 3:1 이상 대비를 갖게 한다.
measurement:
  criteria: 입력 필드 테두리, 체크박스·라디오·토글의 경계와 선택 표시, 초점·선택 상태 표시, 의미 있는 아이콘, 차트의 선·막대·범례 표식이 인접 색과 상대 휘도 대비 ≥ 3:1.
  method: '수동: 색 추출 도구로 각 컴포넌트·상태(기본, hover, focus, 선택)의 경계·표식 색과 인접 배경색 대비를 측정한다.'
automation:
  feasibility: none
  note: 'axe-core에 1.4.11 대응 규칙 없음(추출본 axe_rules 비어 있음). 4단계: 토큰 쌍(테두리 토큰 vs 표면 토큰) 대비 검사로 일부 자동화.'
rationale: 저시력 사용자가 입력 필드·버튼 경계나 체크 상태를 못 보면 컨트롤을 찾거나 상태를 알 수 없다.
sources:
- ref: WCAG22
  locator: SC 1.4.11 Non-text Contrast (Level AA)
  note: https://www.w3.org/TR/WCAG22/#non-text-contrast
- ref: WCAG22_UNDERSTANDING
  locator: https://www.w3.org/WAI/WCAG22/Understanding/non-text-contrast.html
- ref: KRDS
  locator: 디자인 스타일 > 색상 > 색상 적용 (가이드라인 PDF 2025.08 94쪽)
  note: https://www.krds.go.kr/html/site/style/style_02.html — 아이콘 매직넘버 40(3:1), 인풋 보더 매직넘버 50
- ref: KRDS
  locator: 컴포넌트 (여러 페이지) (가이드라인 PDF 2025.08 290·434·533·546·556·578·595·607·631·647·684·695쪽)
  note: '같은 요구를 다루는 KRDS 컴포넌트: 도움 패널, 라디오 버튼, 맥락적 도움말, 브레드크럼, 셀렉트, 스피너, 체크박스, 캐러셀, 코치마크, 텍스트 영역, 텍스트 입력 필드, 토글 스위치,
    파비콘 — 상세는 sources/extracts/KRDS-components.yaml'
scope:
  level: global
  targets:
  - input
  - select
  - textarea
  - button
  - '[role=checkbox]'
  - '[role=radio]'
  - '[role=switch]'
  - svg 아이콘
  - 차트
exceptions:
- 비활성(inactive) 컴포넌트 (WCAG 1.4.11)
- 작성자가 바꾸지 않은 사용자 에이전트 기본 모양의 컴포넌트 (WCAG 1.4.11)
- 그래픽의 특정 표현이 전달하는 정보에 필수인 경우 (WCAG 1.4.11)
relations: []
examples:
  good:
  - lang: css
    code: '/* --color-gray-50 = #6d7882, 흰 배경 대비 4.51:1 (≥ 3:1) */

      input[type=text]{border:1px solid var(--palette-gray-50);background:var(--palette-gray-0)}'
    note: 입력 필드 경계가 인접 배경과 3:1 이상이다
  bad:
  - lang: css
    code: '/* --color-gray-10 = #e6e8ea, 흰 배경 대비 1.23:1 (< 3:1) */

      input[type=text]{border:1px solid var(--palette-gray-10);background:var(--palette-gray-0)}'
    note: 경계 대비가 1.23:1이라 저시력 사용자가 필드를 찾기 어렵다
needs_verification: false
verification_note: '2026-10-18 원문 대조(sources/extracts/WCAG22-A-AA.yaml SC 1.4.11): 3:1, UI 컴포넌트·상태와 그래픽 객체, 예외 3종
  원문 일치. 2026-10-18 원문 대조(KRDS https://www.krds.go.kr/html/site/style/style_02.html HTML을 curl로 받아 본문 확인): 아이콘 색상
  기본 모드 매직넘버 40(3:1), 인풋 보더 매직넘버 50(4.5:1) 확인 — 인풋 보더는 WCAG보다 엄격한 체계 값(토큰 단계에서 반영 검토). BACKLOG: KRDS 비텍스트 대비 항목이
  근거로 KWCAG ''텍스트 콘텐츠의 명도 대비''를 인용하는 문제는 컴포넌트 페이지 대조 때 확인 — 이번엔 컴포넌트 묶음 출처를 개별 대조하지 않음.'
korean_specific: false
tags:
- wcag22
- level-aa
- new-in-2.1
- krds
