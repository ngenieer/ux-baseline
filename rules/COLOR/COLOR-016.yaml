id: COLOR-016
category: COLOR
title: 버튼 그룹 아이콘 위계
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 버튼 그룹에서 가장 높은 강조 단계 버튼에 아이콘이 없으면 그 그룹의 다른 버튼에도 아이콘을 넣지 않는다.
measurement:
  criteria: 같은 버튼 그룹(공통 부모 안 버튼 2개 이상) 안에서 가장 높은 강조 스타일(주조색 채움 > 윤곽선 > 텍스트) 버튼에 아이콘 요소(svg, img, .icon)가 없으면, 나머지
    버튼의 아이콘 요소 수가 0.
  method: 커스텀 DOM 검사(버튼 변형 클래스로 강조 단계를 판정).
automation:
  feasibility: none
  note: '4단계: 컴포넌트 변형 클래스 기반 커스텀 DOM 검사.'
rationale: 아이콘이 있는 버튼은 없는 버튼보다 강조 수준이 높게 보이므로, 하위 버튼에만 아이콘이 있으면 위계가 뒤집힌다(KRDS 버튼).
sources:
- ref: KRDS
  locator: 컴포넌트 > 버튼 > 사용성 가이드라인 (가이드라인 PDF 2025.08 517쪽)
  note: https://www.krds.go.kr/html/site/component/component_05_02.html
scope:
  level: component
  targets:
  - 버튼 그룹
exceptions: []
relations:
- type: depends
  id: COLOR-015
  note: 강조 단계 판정은 COLOR-015의 세 단계 스타일을 따른다.
examples:
  good:
  - lang: html
    code: "<div class=\"btn-group\">\n  <button class=\"btn btn--primary\">신청하기</button>\n  <button class=\"btn\
      \ btn--outline\">임시 저장</button>\n</div>"
    note: 가장 높은 강조 버튼에 아이콘이 없으므로 나머지 버튼에도 아이콘이 없다
  bad:
  - lang: html
    code: "<div class=\"btn-group\">\n  <button class=\"btn btn--primary\">신청하기</button>\n  <button class=\"btn\
      \ btn--outline\"><svg aria-hidden=\"true\"></svg>임시 저장</button>\n</div>"
    note: 하위 강조 버튼에만 아이콘이 있어 강조 위계가 뒤집힌다
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS https://www.krds.go.kr/html/site/component/component_05_02.html HTML을
  curl로 받아 본문 확인): ''아이콘이 있는 버튼은 아이콘이 없는 버튼보다 강조 수준이 높아야 한다. 버튼 그룹에서 가장 중요한 작업에 아이콘이 없으면 나머지 하위 수준 작업에서 아이콘을 사용해서는
  안 된다'' 확인 → SHOULD + public-sector-must. ''가장 중요한 작업''을 ''가장 높은 강조 스타일 버튼''으로 바꿔 판정 가능하게 함. 카테고리 재검토: 색이 아니라 버튼
  구성 규칙(LAYOUT 후보).'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
