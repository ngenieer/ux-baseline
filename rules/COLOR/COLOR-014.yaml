id: COLOR-014
category: COLOR
title: 링크 위계(강조·기본)
stage: platformed
status:
  value: confirmed
type: guide
strength: SHOULD
statement: 링크를 강조 링크(파란색 또는 서비스 주조색)와 기본 링크 두 단계로 구분하고, 강조 링크는 화면에서 가장 중요한 과업과 연결된 링크에만 쓴다.
measurement:
  criteria: '점검 질문: 화면의 링크 스타일이 강조·기본 두 단계로 나뉘는가? 강조 링크 스타일이 붙은 링크가 해당 화면의 가장 중요한 과업 링크인가? 중요도가 같은 여러 링크는 기본 링크인가?'
  method: 수동 검토. 스타일 단계 수(2단계)는 컴포넌트 토큰으로 확인.
automation:
  feasibility: none
  note: 과업 중요도 판단이 필요 → guide.
rationale: 링크와 관련된 과업 중요도에 따라 위계를 분명히 해야 사용자가 가장 중요한 경로를 먼저 찾는다(KRDS 링크).
sources:
- ref: KRDS
  locator: 컴포넌트 > 링크 > 사용성 가이드라인 (가이드라인 PDF 2025.08 499·501쪽)
  note: https://www.krds.go.kr/html/site/component/component_05_01.html
scope:
  level: component
  targets:
  - a[href]
exceptions: []
relations: []
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS https://www.krds.go.kr/html/site/component/component_05_01.html HTML을
  curl로 받아 본문 확인): ''링크와 관련된 사용자 과업, 플로(Flow)의 중요도에 따라 위계를 명확하게 구분한다'', ''일반적으로 파란색이나 서비스의 주조색으로 표현되는 강조 링크를 가장
  중요한 정보에 사용한다'', 기본 링크는 ''중간 수준의 강조'', ''중요도가 동일한 여러 개의 링크 … 적합하다'' 확인 → SHOULD + public-sector-must, guide.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
examples:
  good:
  - lang: text
    code: 신청 안내 화면에서 '신청서 작성하기'만 강조 링크(주조색)로 두고, '자주 묻는 질문'·'관련 법령'은 기본 링크로 둔다.
    note: 가장 중요한 과업 링크 하나만 강조 링크다
  bad:
  - lang: text
    code: 같은 화면의 링크 6개를 모두 강조 링크(주조색) 스타일로 표시한다.
    note: 모든 링크가 강조되어 위계가 사라진다
