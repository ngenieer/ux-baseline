id: COLOR-013
category: COLOR
title: 운영기관 식별자 주목도
stage: platformed
status:
  value: confirmed
type: guide
strength: SHOULD
statement: 운영기관 식별자는 푸터의 정보·링크보다 시각적 주목도가 낮게 표현한다.
measurement:
  criteria: '점검 질문: 화면 하단에서 사용자의 시선이 운영기관 식별자보다 푸터의 정보·링크에 먼저 가는가? 식별자 배경색이 서비스 디자인 주제의 컨테이너 배경색 범위 안에 있는가?'
  method: 수동 검토(디자인 리뷰).
automation:
  feasibility: none
  note: 주목도는 결정적으로 판정할 수 없다 → guide.
rationale: 화면 하단에서 사용자가 먼저 집중해야 할 정보는 푸터의 정보와 링크이므로 식별자가 주의를 빼앗지 않아야 한다(KRDS).
sources:
- ref: KRDS
  locator: 컴포넌트 > 운영기관 식별자 > 사용성 가이드라인 (가이드라인 PDF 2025.08 230쪽)
  note: https://www.krds.go.kr/html/site/component/component_02_02.html
scope:
  level: component
  targets:
  - 운영기관 식별자
exceptions: []
relations: []
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS https://www.krds.go.kr/html/site/component/component_02_02.html HTML을
  curl로 받아 본문 확인): ''식별자가 지나치게 주의를 끌지 않도록 표현한다'', ''화면 하단 영역에서 사용자가 가장 먼저 집중해야 하는 정보는 푸터 내부의 정보와 링크이다'' 확인. 1단계
  statement의 비교 대상 ''헤더·본문''은 원문과 달라 ''푸터의 정보·링크''로 고침. SHOULD + public-sector-must, 판정 불가라 guide.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector
- public-sector-must
examples:
  good:
  - lang: text
    code: 푸터 아래 운영기관 식별자를 컨테이너 배경색 위 작은 기관 로고와 안내 한 줄로 두고, 푸터의 연락처·정책 링크가 먼저 읽힌다.
    note: 식별자가 푸터 정보·링크보다 주목도가 낮다
  bad:
  - lang: text
    code: 운영기관 식별자를 원색 배경의 큰 띠 배너로 만들어 푸터 링크보다 먼저 눈에 띈다.
    note: 식별자가 푸터 정보·링크보다 주의를 끈다
