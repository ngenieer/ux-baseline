id: FORM-015
category: FORM
title: 제출 시 첫 오류로 초점 이동
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 오류 요약(FORM-077)을 두지 않는 폼(모달 안 폼, 입력 필드가 1개인 폼)이나 KRDS를 적용하는 공공 프로젝트의 폼에서 제출 결과 검증 오류가 있으면 키보드 초점을 오류가
  난 첫 번째 입력 필드로 옮기고, 오류를 모달로 알렸다면 모달을 닫은 직후 그 필드로 초점을 옮긴다.
measurement:
  criteria: 오류가 있는 상태로 제출 버튼을 클릭하거나 Enter로 제출하면, 오류 표시가 끝난 뒤 document.activeElement가 DOM 순서상 첫 번째 aria-invalid="true"
    필드다. 오류를 dialog로 알린 경우 그 dialog를 닫은 직후 document.activeElement가 같은 필드다.
  method: 필수 항목 2개 이상을 비우고 마우스·키보드로 각각 제출해 activeElement를 확인한다(수동 또는 Playwright).
automation:
  feasibility: none
  checks:
  - tool: custom
    method: Playwright로 빈 폼 제출 후 document.activeElement와 첫 [aria-invalid=true] 비교
  note: 4단계 E2E 검사 후보. 정적 검사기 규칙 없음.
rationale: 초점이 오류 필드로 가야 키보드·스크린 리더 사용자가 오류를 찾아 다시 탐색하지 않고 바로 고칠 수 있다.
sources:
- ref: KRDS
  locator: 기본 패턴 > 입력폼 > 상호작용 가이드라인(서버 측 검증 Click·Enter) / 접근성 가이드라인 (가이드라인 PDF 2025.08 848, 851쪽)
  note: https://www.krds.go.kr/html/site/global/global_08.html — '사용자가 입력폼 제출을 Click 했을 때, 오류가 발생한 가장 첫 번째 항목으로
    Focus 이벤트가 발생해야 한다.' (Enter 동일) / '서버 측 검증인 경우, 사용자가 오류 메시지 창에서 확인 버튼을 누른 후에 초점을 오류 항목으로 이동시켜'
- ref: KRDS
  locator: 기본 패턴 > 오류 > 접근성 가이드라인 (가이드라인 PDF 2025.08 831쪽)
  note: https://www.krds.go.kr/html/site/global/global_07.html — '모달을 이용하여 오류 메시지가 제공되는 경우, 창이 닫힌 후 초점을 오류가 발생한
    입력 필드로 이동시키면 ...'
scope:
  level: situation
  targets:
  - 폼 제출 후 검증 오류
exceptions: []
relations:
- type: conflicts
  id: FORM-077
  note: 페이지 폼은 오류 요약을 표시하고 초점을 요약으로 옮긴다(FORM-077). 오류 요약을 두지 않는 폼(모달 안 폼, 입력 필드가 1개인 폼)은 첫 번째 오류 필드로 초점을 옮긴다(FORM-015).
    KRDS 적용 공공 프로젝트는 오류 요약을 표시하되 초점은 첫 번째 오류 필드로 옮긴다.
  decision: CF-007
- type: depends
  id: FORM-003
  note: 초점을 옮긴 필드에 오류 텍스트가 연결돼 있어야 함
examples:
  good:
  - lang: js
    code: "// 모달 안 폼: 오류 요약 없이 첫 오류 필드로 초점 이동\nform.addEventListener('submit', (e) => {\n  const firstInvalid =\
      \ form.querySelector('[aria-invalid=\"true\"]');\n  if (firstInvalid) { e.preventDefault(); firstInvalid.focus();\
      \ }\n});\n"
    note: 오류가 있으면 DOM 순서상 첫 번째 aria-invalid 필드로 초점을 옮긴다.
  bad:
  - lang: js
    code: "// 오류를 표시하지만 초점은 제출 버튼에 그대로 남는다\nform.addEventListener('submit', (e) => {\n  if (form.querySelector('[aria-invalid=\"\
      true\"]')) e.preventDefault();\n});\n"
    note: 오류가 있어도 초점을 옮기지 않아 키보드 사용자가 오류 필드를 찾아가야 한다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS global_08·global_07 HTML curl): 입력폼 상호작용 표 ''발생해야 한다'' → SHOULD + public-sector-must.
  오류 페이지 문장은 서술형. 원문은 서버 측 검증 표에 두었으나 동작은 제출 시점이라 클라이언트 검증 제출에도 적용.'
korean_specific: false
tags:
- krds
- public-sector-must
