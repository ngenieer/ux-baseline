id: FORM-057
category: FORM
title: 정해진 응답은 선택 컴포넌트로
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 응답 내용이나 양식이 미리 정해진 입력에는 텍스트 입력 필드 대신 라디오 버튼·체크박스·셀렉트를 쓴다.
measurement:
  criteria: 업무 규칙상 허용 값이 유한한 목록으로 정해진 필드가 input[type=text]·textarea가 아니라 radio·checkbox·select다.
  method: '수동: 서버 검증 규칙·업무 정의에서 허용 값 목록이 있는 필드를 찾아 요소 종류를 확인한다.'
automation:
  feasibility: none
  checks: []
  note: 허용 값 목록 판별이 필요해 자동화 불가.
rationale: KRDS는 입력값의 내용·양식이 정해져 있는 경우를 텍스트 입력 필드에 적합하지 않은 경우로 들고 라디오 버튼·체크박스·셀렉트를 사용해야 한다고 한다.
sources:
- ref: KRDS
  locator: '컴포넌트 > 텍스트 입력 필드 > 용례(사용하기 적합하지 않은 경우: 입력값의 내용, 양식이 정해져 있는 경우) (가이드라인 PDF 2025.08 687쪽)'
  note: 'https://www.krds.go.kr/html/site/component/component_09_03.html — 원문: ''라디오 버튼, 체크박스, 셀렉트와 같은 컴포넌트를 사용해야
    한다'''
scope:
  level: component
  targets:
  - input[type=text]
  - 텍스트 입력 필드
exceptions: []
relations:
- type: depends
  id: FORM-028
  note: 어느 선택 컴포넌트를 쓸지는 FORM-028·FORM-029·FORM-030·FORM-036 기준
examples:
  good:
  - lang: html
    code: '<label for="region">시·도</label>

      <select id="region"><option>서울특별시</option><option>부산광역시</option></select>

      '
    note: 허용 값이 정해진 시·도를 셀렉트로 받는다.
  bad:
  - lang: html
    code: '<label for="region">시·도</label>

      <input id="region" type="text">

      '
    note: 허용 값이 정해진 항목을 자유 입력으로 받아 표기가 제각각이 된다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트와 대조): 문장 일치 확인. 원문 강도 ''사용해야 한다'' → SHOULD +
  public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
