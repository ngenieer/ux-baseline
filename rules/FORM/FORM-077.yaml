id: FORM-077
category: FORM
title: 오류 요약 표시와 초점
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 폼 제출 시 검증 오류가 1개 이상이면 본문 제목(h1) 바로 아래, 본문의 첫 요소로 오류 요약을 표시하고 키보드 초점을 오류 요약으로 옮긴다.
measurement:
  criteria: 필수 필드 하나만 비우고 제출했을 때 (1) 오류 요약 컨테이너가 나타나고 (2) DOM 순서상 본문 제목(h1)의 바로 다음 요소이며 (3) 제출 직후 document.activeElement가
    오류 요약 컨테이너(tabindex="-1") 또는 그 안의 요소이고 (4) 오류 요약 컨테이너의 첫 제목 요소 텍스트(앞뒤 공백 제거)가 '입력 내용을 확인해 주세요'로 시작한다 — 바로 뒤에
    마침표와 오류 개수 문장('입력 내용을 확인해 주세요. 고쳐야 할 항목이 2개 있습니다.')을 붙일 수 있고, 다른 문구로 시작하면 실패(CF-041). 예외 조건(KRDS 공공 프로젝트, 모달
    안 폼, 필드 1개 폼)은 FORM-015로 판정한다.
  method: 'E2E: 오류 1개 상태와 여러 개 상태로 제출해 위 네 조건을 확인한다.'
automation:
  feasibility: partial
  checks:
  - tool: html-validate
    rule: ux-baseline/error-summary-position
    method: .error-summary 가 h1 바로 다음 요소인지 검사(초점 이동은 E2E) (lint/plugins/html-ux-baseline.mjs)
  note: 기존 검사기 규칙 없음. 4단계 커스텀 E2E로 판정 가능.
rationale: GOV.UK는 검증 오류가 하나여도 항상 오류 요약을 페이지 맨 위에 보이고 초점을 옮기라고 한다. WCAG 기법 G139도 페이지 맨 위에 오류를 설명하는 텍스트와 오류 필드로 가는
  링크를 두고 제출 시 그 텍스트로 초점을 옮기는 예를 든다. 화면 확대·스크린 리더 사용자가 오류 발생 사실을 곧바로 알 수 있다.
sources:
- ref: GOVUK_ERROR_SUMMARY
  locator: When to use this component / How it works / Where to put the error summary
  note: '''Always show an error summary when there is a validation error, even if there’s only one.'', ''You must:
    move keyboard focus to the error summary'''
- ref: GOVUK_VALIDATION
  locator: How to tell the user about validation errors
  note: '''show an Error summary component at the top of the page, and move keyboard focus to it'''
- ref: WCAG22_TECHNIQUES
  locator: G139 Example 3
  note: 제출 시 오류 목록으로 가는 텍스트 링크에 초점을 옮기는 예(비규범 기법)
scope:
  level: situation
  targets:
  - 폼 제출 후 검증 오류 상태
exceptions:
- 'KRDS를 적용하는 공공 프로젝트: 오류 요약은 표시하되 초점은 첫 번째 오류 필드로 옮긴다(CF-007, FORM-015).'
- '모달 안 폼과 입력 필드가 1개인 폼: 오류 요약 없이 FORM-015를 따른다(CF-007).'
relations:
- type: conflicts
  id: FORM-015
  note: 페이지 폼은 오류 요약을 표시하고 초점을 요약으로 옮긴다(FORM-077). 오류 요약을 두지 않는 폼(모달 안 폼, 입력 필드가 1개인 폼)은 첫 번째 오류 필드로 초점을 옮긴다(FORM-015).
    KRDS 적용 공공 프로젝트는 오류 요약을 표시하되 초점은 첫 번째 오류 필드로 옮긴다.
  decision: CF-007
- type: depends
  id: FORM-003
  note: 오류 항목 식별·텍스트 설명(WCAG 3.3.1)이 전제
- type: conflicts
  id: LAYOUT-017
  note: 오류 요약은 본문 제목(h1) 바로 아래, 본문의 첫 요소로 둔다.
  decision: CF-008
examples:
  good:
  - lang: html
    code: "<main>\n  <h1>회원 정보 수정</h1>\n  <!-- 제출 오류 시 이 요소를 표시하고 focus()로 초점을 옮긴다 -->\n  <div class=\"error-summary\"\
      \ tabindex=\"-1\">\n    <h2>입력 내용을 확인해 주세요</h2>\n    <ul><li><a href=\"#email\">이메일 주소를 입력해 주세요</a></li></ul>\n\
      \  </div>\n  <form>…</form>\n</main>\n"
    note: 오류 요약을 h1 바로 아래 본문 첫 요소로 두고 초점을 옮긴다(CF-008·CF-041).
  bad:
  - lang: html
    code: "<main>\n  <h1>회원 정보 수정</h1>\n  <form>…</form>\n  <!-- 오류는 필드 옆에만 표시하고 초점은 제출 버튼에 그대로 둔다 -->\n</main>\n"
    note: 오류 요약이 없고 초점도 옮기지 않아 오류가 났는지 바로 알 수 없다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 GOV.UK·W3C 페이지 HTML을 받아 본문 텍스트와 대조): GOV.UK Error summary·Validation
  문장과 G139 Example 3 확인. 원문 강도 ''You must/Always''지만 reference_system이라 SHOULD. 요약 제목 문구(''입력 내용을 확인해 주세요'')는 GOV.UK
  ''There is a problem''에 대응하는 국내 근거 없는 체계 선택으로 CF-041에서 고정하고 측정 기준 (4)에 넣었다(2026-10-18 독립 검토). 2026-10-18 측정 기준을
  3단계 결정(statement 변경)에 맞춰 고침. (2026-10-18 시험 4 검토 반영) 측정 기준 (4)가 제목 전체 일치인지 시작 일치인지 불명(T6 에서 ''입력 내용을 확인해 주세요.
  고쳐야 할 항목이 N개 있습니다.''로 씀) → ''로 시작한다(뒤에 오류 개수 문장 허용)''로 정했다. 고정 문구의 목적(CF-041: AI 가 매번 다른 제목을 쓰지 않게 함)은 시작 일치로
  지켜지고, 오류 개수는 GOV.UK 요약 목록이 이미 전하는 정보라 덧붙여도 해가 없다. lint error-summary-position 규칙은 위치만 보고 문구는 보지 않아 바꾸지 않았다.'
