id: FORM-043
category: FORM
title: 레이블로 두 상태를 설명하기 어려우면 라디오 2개
stage: platformed
status:
  value: confirmed
type: guide
strength: MAY
statement: 토글 레이블 하나로 켜짐·꺼짐 두 상태의 뜻을 설명할 수 없으면 토글 대신 각자 레이블을 가진 라디오 버튼 2개로 나눈다.
measurement:
  criteria: '점검 질문: 토글 레이블만 읽고 켜짐과 꺼짐이 각각 무엇을 뜻하는지 말할 수 있는가? 말할 수 없다면 COPY-032(동사형 레이블·도움말)로 보완했는가, 보완해도 말할 수 없다면
    라디오 버튼 2개로 바꿨는가?'
  method: 수동 검토(레이블 이해 여부는 사람이 판단)
automation:
  feasibility: none
  checks: []
  note: 레이블 의미 판단은 자동화 불가.
rationale: KRDS는 서로 반대되는 상태라도 단일 레이블로 설명하기 어렵다면 라디오 버튼 2개로 나누고 각각 정확한 레이블을 주는 것이 좋다고 한다.
sources:
- ref: KRDS
  locator: '컴포넌트 > 토글 스위치 > 용례(사용하기 적합하지 않은 경우: 레이블이 직관적이지 않은 경우) (가이드라인 PDF 2025.08 571쪽)'
  note: 'https://www.krds.go.kr/html/site/component/component_06_07.html — 원문: ''라디오 버튼을 사용하여 선택 컨트롤을 2개로 나누고 ...
    레이블을 제공하는 것이 좋다'''
scope:
  level: component
  targets:
  - 토글 스위치
exceptions: []
relations:
- type: refines
  id: FORM-041
  note: 토글 부적합 조건 중 '레이블이 직관적이지 않은 경우'를 구체화
- type: refines
  id: COPY-032
  note: COPY-032는 불명확한 토글 레이블을 동사형·도움말로 보완하라고 하고, 이 룰은 그래도 설명되지 않을 때 라디오 2개로 바꾸라고 함
examples:
  good:
  - lang: html
    code: "<fieldset>\n  <legend>정렬 순서</legend>\n  <label><input type=\"radio\" name=\"sort\" value=\"asc\" checked>\
      \ 오래된 순</label>\n  <label><input type=\"radio\" name=\"sort\" value=\"desc\"> 최신 순</label>\n</fieldset>\n"
    note: 두 상태에 각자 레이블을 붙인 라디오 버튼 2개로 나눴다.
  bad:
  - lang: html
    code: '<label><input type="checkbox" role="switch"> 오래된 순</label>

      '
    note: 꺼짐이 무엇을 뜻하는지 레이블만으로 알 수 없다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트와 대조): 문장 일치 확인. 원문 강도 ''좋다'' → MAY. ''직관적이지
  않은''은 판정 불가라 guide.'
korean_specific: false
tags:
- krds
- krds-component
