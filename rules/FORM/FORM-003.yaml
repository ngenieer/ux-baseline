id: FORM-003
category: FORM
title: 오류 식별
stage: platformed
status:
  value: confirmed
type: rule
strength: MUST
statement: 입력 오류를 자동으로 감지하면 오류가 난 항목을 식별하고 오류 내용을 텍스트로 설명한다.
measurement:
  criteria: 클라이언트·서버 검증이 오류를 감지한 모든 경우에 (1) 오류가 난 필드가 텍스트로 지목되고(필드 옆 메시지 또는 필드 이름을 담은 메시지), (2) 무엇이 잘못됐는지 설명하는 텍스트가
    화면에 표시된다. 색·아이콘·테두리만으로 오류를 표시하면 실패. 다음 단계·제출 버튼을 눌러 표시하는 오류(FORM-080)는 필드 옆 메시지를 aria-describedby 또는 aria-errormessage로
    그 필드와 연결하고 필드에 aria-invalid="true"를 준다. 제출 전에 필드 옆 확인 버튼(아이디 '중복 확인' 등)이나 입력 중 조건 안내가 알리는 결과('이미 사용 중인 아이디입니다')는
    그 필드의 aria-describedby 가 가리키는 role="status"(또는 aria-live="polite") 영역의 텍스트로 (1)(2)를 충족하고 aria-invalid 를 두지 않는다.
    그 조건이 제출 때도 맞지 않으면 제출 오류로 다시 표시한다(aria-invalid 포함, CF-068).
  method: 각 검증 규칙마다 오류 값을 넣고 제출해 화면 텍스트를 확인하고, 스크린 리더로 해당 필드에 초점을 두었을 때 오류 문장이 읽히는지 확인한다.
automation:
  feasibility: partial
  checks:
  - tool: custom
    method: 오류 상태(aria-invalid="true") 필드마다 aria-describedby/aria-errormessage 대상이 존재하고 텍스트가 비어 있지 않은지 DOM 검사
  note: axe-core에 이 SC 전용 규칙 없음. 오류 문장의 의미가 맞는지는 수동.
rationale: 오류 위치와 내용을 텍스트로 알려야 색을 구분하지 못하거나 화면을 보지 못하는 사용자도 무엇을 고칠지 알 수 있다.
sources:
- ref: WCAG22
  locator: SC 3.3.1 Error Identification (Level A)
  note: https://www.w3.org/TR/WCAG22/#error-identification
- ref: WCAG22_UNDERSTANDING
  locator: https://www.w3.org/WAI/WCAG22/Understanding/error-identification.html
- ref: KWCAG22
  locator: 검사항목 7.3.1 오류 정정
  note: 비공식 HTML 판 — '오류가 발생한 위치와 오류를 유발하게 된 이유 등에 관한 정보를 알려 주어야 한다.'
- ref: KRDS
  locator: 기본 패턴 > 오류 > 사용성 가이드라인 (가이드라인 PDF 2025.08 830쪽)
  note: https://www.krds.go.kr/html/site/global/global_07.html — '발생한 오류 및 문제를 분명하게 설명한다.'
- ref: KRDS
  locator: 기본 패턴 > 입력폼 > 접근성 가이드라인 (가이드라인 PDF 2025.08 848쪽)
  note: https://www.krds.go.kr/html/site/global/global_08.html — '어떤 항목에서 오류가 발생했는지에 관한 정확한 정보를 오류 메시지로 알려주어야 한다.'
- ref: KRDS
  locator: 컴포넌트 > 토스트·스낵바 > 용례
  note: component_12_05.html, component_12_06.html — '개별 입력 양식에 대한 메시지는 ... 각 요소에 인라인 텍스트 방식으로 제공하는 것이 사용자가 인지하기에
    더 적합하다.' 상세는 sources/extracts/KRDS-components.yaml
- ref: GOVUK_ERROR_MESSAGE
  locator: Visually hidden 'Error:' prefix
  note: '구현 방법(참고 사례): 필드 옆 오류 메시지 앞에 화면에는 숨기고 보조기술만 읽는 ''오류:'' 접두를 넣는다.'
scope:
  level: situation
  targets:
  - 입력 검증 오류 표시
exceptions: []
relations:
- type: conflicts
  id: FORM-080
  note: 필드 옆 확인 버튼 결과·입력 중 조건 안내는 aria-describedby 로 연결한 role=status 텍스트로 오류를 식별·설명하고 aria-invalid 는 제출 때만 둔다.
  decision: CF-068
examples:
  good:
  - lang: html
    code: |
      <label for="tel">휴대 전화번호</label>
      <input id="tel" type="tel" autocomplete="tel" aria-invalid="true" aria-describedby="tel-err">
      <p id="tel-err"><span class="sr-only">오류: </span>휴대 전화번호에 숫자가 아닌 문자가 있습니다. 숫자로 입력하세요.</p>
    note: 오류 필드를 aria-invalid로 지목하고, 무엇이 잘못됐는지 텍스트로 연결했다.
  - lang: html
    code: |
      <label for="uid">아이디</label>
      <input id="uid" autocomplete="username" aria-describedby="uid-check">
      <button type="button">중복 확인</button>
      <p id="uid-check" role="status">이미 사용 중인 아이디입니다. 다른 아이디를 입력해 주세요.</p>
      <!-- 확인 버튼 결과: aria-invalid 없음. 제출 때도 사용 중이면 aria-invalid="true"와 오류 메시지로 다시 표시 -->
    note: 제출 전 확인 결과는 필드에 연결된 상태 메시지 텍스트로 알린다(CF-068).
  bad:
  - lang: html
    code: |
      <label for="tel">휴대 전화번호</label>
      <input id="tel" type="tel" autocomplete="tel" class="is-error">
      <!-- .is-error { border-color: var(--color-border-danger); } — 테두리 색만 바뀌고 설명 텍스트가 없다 -->
    note: 오류를 테두리 색으로만 표시하고 텍스트 설명이 없다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(WCAG22-A-AA.yaml SC 3.3.1, KRDS global_07·global_08·component_12_05·12_06 HTML
  curl, KWCAG 비공식 HTML 판 7.3.1): statement가 SC 원문과 맞음. aria-invalid·aria-describedby 연결은 측정 수단으로 추가한 것(SC 요구 자체는
  ''텍스트로 설명''). KWCAG 공식 PDF 미대조. (2026-10-18 시험 4 검토 반영) ''중복 확인'' 같은 필드 옆 확인 버튼의 결과(''이미 사용 중인 아이디입니다'')가 이 룰의
  오류(aria-invalid 필요)인지 FORM-080 이 허용한 조건 안내인지 불명 → CF-068: 제출 전 결과는 aria-describedby 로 연결한 role=status 텍스트로 SC
  3.3.1(식별·텍스트 설명)을 충족하고 aria-invalid 는 제출 오류에만 둔다. SC 3.3.1 은 aria-invalid 를 요구하지 않으므로(측정 수단으로 넣은 것) 약해지지 않는다.'
korean_specific: false
