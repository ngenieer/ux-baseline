id: FORM-005
category: FORM
title: 오류 수정 제안
stage: platformed
status:
  value: confirmed
type: rule
strength: MUST
statement: 입력 오류를 자동으로 감지했고 올바른 값의 형식·범위·허용 값을 알고 있으면 오류 메시지에 그 수정 방법을 텍스트로 제시한다. 보안이나 콘텐츠 목적을 해치는 경우만 예외로 한다.
measurement:
  criteria: 형식(예 날짜 YYYY-MM-DD)·길이·범위·허용 문자·허용 값 목록이 정해진 검증 규칙마다, 그 규칙 위반 시 표시되는 오류 문장에 올바른 형식·범위·허용 값 또는 예시가 들어
    있다. '입력값이 올바르지 않습니다'처럼 수정 방법이 없는 문장만 있으면 실패.
  method: 검증 규칙 목록을 만들고 각 규칙을 위반하는 값을 넣어 오류 문장을 확인한다(수동).
automation:
  feasibility: none
  note: 오류 문장의 내용 판정은 수동. 4단계에서 검증 규칙 정의(스키마)와 오류 문구 사전을 대조하는 단위 테스트로 만들 수 있다.
rationale: 무엇이 틀렸는지만 알리면 인지 장애 사용자는 고치는 방법을 추측해야 한다. 알고 있는 수정 방법을 알려야 재입력 횟수가 준다.
sources:
- ref: WCAG22
  locator: SC 3.3.3 Error Suggestion (Level AA)
  note: https://www.w3.org/TR/WCAG22/#error-suggestion
- ref: WCAG22_UNDERSTANDING
  locator: https://www.w3.org/WAI/WCAG22/Understanding/error-suggestion.html
- ref: KWCAG22
  locator: 검사항목 7.3.1 오류 정정
  note: 비공식 HTML 판 — '입력 오류를 정정할 수 있는 방법을 제공해야 한다.'
- ref: KRDS
  locator: 기본 패턴 > 오류 > 사용성 가이드라인 (가이드라인 PDF 2025.08 830쪽)
  note: https://www.krds.go.kr/html/site/global/global_07.html — '오류를 수정할 수 있는 방법을 제공한다.'(본문 '효과적' — 권고형)
scope:
  level: situation
  targets:
  - 입력 검증 오류 메시지
exceptions:
- 수정 방법을 알려주면 보안이나 콘텐츠 목적을 해치는 경우(예 비밀번호가 틀렸을 때 올바른 값 제시, 시험 정답 제시) — WCAG 3.3.3
relations:
- type: depends
  id: FORM-003
  note: 오류 식별(항목 지목·텍스트 설명)이 먼저 있어야 수정 제안을 붙일 수 있다.
examples:
  good:
  - lang: html
    code: '<p id="birth-err">생년월일 형식이 맞지 않습니다. ''1990-05-17''처럼 연-월-일 순서의 숫자로 입력하세요.</p>

      '
    note: 허용 형식을 알고 있으므로 올바른 형식과 예시를 오류 문장에 넣었다.
  bad:
  - lang: html
    code: '<p id="birth-err">생년월일 형식이 맞지 않습니다.</p>

      '
    note: 무엇이 잘못됐는지만 말하고 올바른 형식(수정 방법)을 알려주지 않는다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(WCAG22-A-AA.yaml SC 3.3.3, KRDS global_07 HTML curl, KWCAG 비공식 HTML 판 7.3.1):
  SC 원문의 ''suggestions for correction are known''을 ''형식·범위·허용 값을 알고 있으면''으로 구체화. 예외는 SC 원문 그대로. KWCAG 공식 PDF 미대조.'
korean_specific: false
tags:
- wcag22
- level-aa
- new-in-2.0
- kwcag22
- krds
