id: FORM-039
category: FORM
title: 공간 부족·모바일에는 기본 셀렉트
stage: platformed
status:
  value: confirmed
type: guide
strength: MAY
statement: 옵션 목록을 펼쳐 둘 공간이 부족하거나 모바일 웹 사용이 중요한 화면의 단일 선택에는 커스텀 드롭다운 대신 브라우저 기본 select 요소를 쓴다.
measurement:
  criteria: '점검 질문: 이 화면에서 옵션 목록을 펼칠 영역이 부족하거나 모바일 웹 이용 비중이 큰가? 그렇다면 단일 선택이 role=listbox 커스텀 드롭다운이 아니라 네이티브 select로
    구현됐는가?'
  method: 설계 검토 때 화면 조건을 확인하고 구현 요소를 DOM에서 확인한다.
automation:
  feasibility: none
  note: '''공간 부족''·''모바일이 중요''는 사람 판단 — guide.'
rationale: 기본 select는 브라우저·운영체제의 옵션 목록 UI를 써서 작은 화면과 터치 환경에서 별도 스타일 없이도 조작하기 쉽다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 셀렉트 > 용례(사용하기 적합한 경우) (가이드라인 PDF 2025.08 551쪽)
  note: 'https://www.krds.go.kr/html/site/component/component_06_03.html — ''옵션 목록을 표시할 영역이 충분하지 않거나 모바일 웹이 더 중요한
    경우: 사용자의 웹브라우저와 화면 크기에 맞추어 별도의 스타일 적용이 필요한 드롭다운이나 콤보상자와 달리 셀렉트는 기본 컨트롤 요소를 사용하므로 더 쉽게 조작할 수 있다.'''
scope:
  level: situation
  targets:
  - select
  - 모바일 화면
exceptions: []
relations:
- type: refines
  id: FORM-031
  note: 모바일 단일 선택에서 셀렉트를 검토할 때 네이티브 select를 고르는 조건
examples:
  good:
  - lang: html
    code: "<label for=\"sido\">시·도</label>\n<select id=\"sido\" name=\"sido\" required>\n  <option value=\"\">선택하세요</option>\n\
      \  <option>강원특별자치도</option>…<option>충청북도</option>\n</select>\n"
    note: 모바일에서 OS 기본 선택 UI가 뜨는 네이티브 select를 썼다.
  bad:
  - lang: html
    code: '<span id="sido-lbl">시·도</span>

      <div role="combobox" aria-labelledby="sido-lbl" aria-expanded="false" aria-controls="sido-list" tabindex="0">선택하세요</div>

      <ul id="sido-list" role="listbox" class="dropdown-wide">…</ul>

      <!-- .dropdown-wide는 고정 너비라 360px 화면에서 목록이 잘린다 -->

      '
    note: 모바일 비중이 큰 화면에서 커스텀 드롭다운을 써서 목록이 화면 밖으로 잘린다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS component_06_03 HTML curl): ''사용하기 적합한 경우'' 서술 확인 → MAY. 조건이 판정 불가 → guide.
  2026-10-18 독립 검토: CF-009 판단 순서 ②에 편입(비교 필요 시 라디오 다음, 옵션 수 기준보다 먼저 적용).'
korean_specific: false
tags:
- krds
- krds-component
decisions:
- CF-009
