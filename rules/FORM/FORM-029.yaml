id: FORM-029
category: FORM
title: 비교가 필요한 단일 선택은 라디오
stage: platformed
status:
  value: confirmed
type: guide
strength: MAY
statement: 사용자가 옵션을 서로 비교해야 고를 수 있거나 선택 속도가 중요한 단일 선택(설문 응답 문항 등)에는 셀렉트·콤보 상자 대신 모든 옵션이 펼쳐 보이는 라디오 버튼을 쓴다.
measurement:
  criteria: '점검 질문: 이 단일 선택은 옵션 내용을 서로 비교해야 고를 수 있는가, 또는 한 화면에서 같은 유형의 선택을 반복하는가(설문 문항 등)? 그렇다면 옵션이 select·콤보 상자
    안에 숨어 있지 않고 라디오 버튼으로 모두 보이는가?'
  method: 설계 검토 때 단일 선택 컨트롤마다 점검 질문에 답한다.
automation:
  feasibility: none
  note: 비교 필요 여부가 사람 판단이라 자동 검사 불가.
rationale: 옵션이 모두 보이면 열고 닫는 조작 없이 바로 비교·선택할 수 있다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 라디오 버튼 > 용례 (가이드라인 PDF 2025.08 523쪽)
  note: https://www.krds.go.kr/html/site/component/component_06_01.html — '사용자가 옵션을 선택하기 위해 여러 옵션을 비교해야 하거나 선택 과정의
    효율성이 중요한 경우 — 셀렉트나 콤보 상자보다 라디오 버튼이 적합하다. 예) 설문조사 응답 문항'
- ref: KRDS
  locator: 컴포넌트 > 셀렉트 > 용례(사용하기 적합하지 않은 경우) (가이드라인 PDF 2025.08 552쪽)
  note: https://www.krds.go.kr/html/site/component/component_06_03.html — 같은 문장('셀렉트보다 라디오 버튼이 적합하다')
scope:
  level: component
  targets:
  - input[type=radio]
  - select
exceptions: []
relations:
- type: conflicts
  id: FORM-036
  note: '판단 순서를 고정한다: ① 옵션을 서로 비교해야 하거나 선택 속도가 중요하면 라디오(FORM-029) ② 옵션 목록을 펼칠 영역이 부족하거나 모바일 웹 이용 비중이 크면 네이티브 select(FORM-039)
    ③ 옵션이 7개 이상이고 사용자가 익숙한 목록이면 셀렉트(FORM-030·FORM-036), 단 옵션이 20개를 넘으면 콤보 상자를 쓰거나 셀렉트를 여러 개로 나눈다 ④ 그 밖(옵션 6개 이하,
    또는 익숙하지 않은 목록)은 라디오. 경계 7개는 셀렉트로 통일한다.'
  decision: CF-009
examples:
  good:
  - lang: html
    code: "<fieldset>\n  <legend>서비스에 얼마나 만족하십니까?</legend>\n  <label><input type=\"radio\" name=\"q1\" value=\"\
      5\" required> 매우 만족</label>\n  <label><input type=\"radio\" name=\"q1\" value=\"4\"> 만족</label>\n  <label><input\
      \ type=\"radio\" name=\"q1\" value=\"3\"> 보통</label>\n  <label><input type=\"radio\" name=\"q1\" value=\"\
      2\"> 불만족</label>\n  <label><input type=\"radio\" name=\"q1\" value=\"1\"> 매우 불만족</label>\n</fieldset>\n"
    note: 설문 척도 옵션을 모두 펼쳐 보여 비교하며 고를 수 있다.
  bad:
  - lang: html
    code: "<label for=\"q1\">서비스에 얼마나 만족하십니까?</label>\n<select id=\"q1\" name=\"q1\" required>\n  <option value=\"\
      \">선택하세요</option>\n  <option value=\"5\">매우 만족</option><option value=\"4\">만족</option><option value=\"3\"\
      >보통</option>\n  <option value=\"2\">불만족</option><option value=\"1\">매우 불만족</option>\n</select>\n"
    note: 비교가 필요한 척도 문항의 옵션을 셀렉트 안에 숨겼다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS component_06_01·06_03 HTML curl): ''적합하다'' 확인 → MAY. ''비교가 필요한지·효율이 중요한지''는
  판정 불가 → guide. 셀렉트 페이지에 같은 문장이 있어 출처 추가. title을 컴포넌트명에서 요구 이름으로 바꿈(ID 불변). 2026-10-18 독립 검토: 관계 note를 CF-009 새
  판단 순서로 갱신(내용 변경 없음).'
korean_specific: false
tags:
- krds
- krds-component
