id: FORM-010
category: FORM
title: 한 열 입력폼
stage: platformed
status:
  value: confirmed
type: rule
strength: MAY
statement: 입력폼의 입력 컴포넌트는 한 열로 세로 배치하고, 한 줄에 가로로 묶는 것은 하나의 정보를 이루는 필드(성·이름, 전화번호, 신용카드 번호, 우편번호·주소, 시작·종료 일자)로 한정한다.
  라디오 버튼·체크박스 옵션은 세로로 나열하고, 가로로 나열할 때는 레이블 길이(COPY-029)와 옵션 간격(SPACE-002) 조건을 지킨다.
measurement:
  criteria: (1) 폼의 각 줄(같은 세로 위치에 놓인 입력 컴포넌트 묶음)에 서로 다른 정보를 묻는 컴포넌트가 2개 이상 있으면 실패. 예외 목록(성·이름, 전화번호 분할 필드, 신용카드 번호
    분할 필드, 우편번호·주소, 시작·종료 일자)은 한 줄에 있어도 통과. (2) 라디오·체크박스 그룹의 옵션이 세로로 나열돼 있으면 통과. 옵션이 가로로 2개 이상 나란히 있으면, 그 그룹이 COPY-029(뷰포트
    360·768·1024·1280px 마다 가로 배치 상태의 각 레이블이 1줄)와 SPACE-002(이웃 옵션 사이 간격 ≥ 24px 이고 컨트롤-레이블 간격보다 넓음) 측정 기준을 모두 통과할
    때만 통과하고, 하나라도 어기면 실패.
  method: 화면 너비 1280px와 360px에서 폼을 보고 줄마다 컴포넌트가 묻는 정보를 확인한다(수동). 가로 배치 라디오·체크박스 그룹은 COPY-029·SPACE-002 측정 방법으로 레이블
    줄 수와 간격을 잰다.
automation:
  feasibility: none
  note: 같은 정보 묶음 판단이 필요해 수동. 4단계에서 필드 그룹 마크업(fieldset 또는 data-field-group)을 규격화하면 '그룹 밖 컴포넌트가 같은 줄' 검사를 만들 수 있다.
rationale: 여러 열로 배치하면 입력 순서와 컴포넌트 사이 관계를 잘못 읽기 쉽다. 세로 한 열은 읽기·초점 순서가 하나로 정해진다.
sources:
- ref: KRDS
  locator: 기본 패턴 > 입력폼 > 사용성 가이드라인 (가이드라인 PDF 2025.08 836쪽)
  note: 'https://www.krds.go.kr/html/site/global/global_08.html — ''콘텐츠는 가능한 한 하나의 열에 수직으로 정렬한다.'' / ''단일 열에 수직으로
    정렬하는 것이 권장된다.'' 가로 배치가 적절한 예: 성·이름, 전화번호, 신용카드 번호, 우편번호·주소, 시작 일자·종료 일자.'
- ref: KRDS
  locator: 컴포넌트 > 라디오 버튼·체크박스 > 사용성 가이드라인 (가이드라인 PDF 2025.08 528, 543쪽)
  note: component_06_01.html, component_06_02.html — '가독성과 옵션 간 명확한 구분을 위하여 라디오 버튼(체크박스)은 수직으로 배치하는 것이 좋다.' 상세는
    sources/extracts/KRDS-components.yaml
scope:
  level: component
  targets:
  - form
  - 라디오 버튼 그룹
  - 체크박스 그룹
exceptions:
- 하나의 정보를 이루는 필드 묶음(성·이름, 전화번호, 신용카드 번호, 우편번호·주소, 시작·종료 일자) — KRDS 입력폼
relations:
- type: depends
  id: SPACE-002
  note: 라디오·체크박스를 가로로 배치할 때의 간격 조건
- type: depends
  id: COPY-029
  note: 라디오·체크박스를 가로로 배치할 때의 레이블 길이 조건
examples:
  good:
  - lang: html
    code: |
      <form class="stack">
        <div class="row">
          <label>성 <input autocomplete="family-name"></label>
          <label>이름 <input autocomplete="given-name"></label>
        </div>
        <label>이메일 <input type="email" autocomplete="email"></label>
      </form>
    note: 한 줄에 묶은 것은 하나의 정보(성·이름)뿐이고 나머지는 세로 한 열이다.
  - lang: html
    code: |
      <fieldset class="radio-group radio-group--inline">
        <legend class="radio-group__legend">문자 수신</legend>
        <div class="radio-group__options">
          <div class="radio-group__option"><input class="radio-group__input" type="radio" name="sms" id="sms-y" value="y"> <label class="radio-group__label" for="sms-y">예</label></div>
          <div class="radio-group__option"><input class="radio-group__input" type="radio" name="sms" id="sms-n" value="n"> <label class="radio-group__label" for="sms-n">아니요</label></div>
        </div>
      </fieldset>
    note: 짧은 레이블(어느 너비에서도 1줄)과 규격 간격(옵션 사이 24px 이상)을 지킨 가로 배치는 통과한다(COPY-029·SPACE-002).
  bad:
  - lang: html
    code: |
      <form class="grid-2col"><!-- .grid-2col { display: grid; grid-template-columns: 1fr 1fr; } -->
        <label>이메일 <input type="email" autocomplete="email"></label>
        <label>직업 <input autocomplete="organization-title"></label>
      </form>
    note: 서로 다른 정보(이메일·직업)를 한 줄에 나란히 놓았다.
  - lang: html
    code: |
      <fieldset class="radio-group radio-group--inline">
        <legend class="radio-group__legend">가입 경로</legend>
        <div class="radio-group__options">
          <div class="radio-group__option"><input class="radio-group__input" type="radio" name="via" id="via-1" value="1"> <label class="radio-group__label" for="via-1">지인이나 가족의 추천을 받아서 알게 되었습니다</label></div>
          <div class="radio-group__option"><input class="radio-group__input" type="radio" name="via" id="via-2" value="2"> <label class="radio-group__label" for="via-2">검색 광고나 배너 광고를 보고 알게 되었습니다</label></div>
        </div>
      </fieldset>
    note: 긴 레이블을 가로로 나열해 360px 에서 레이블이 2줄 이상으로 접힌다 — COPY-029 실패라 이 룰도 실패. 세로로 나열한다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS global_08·component_06_01·06_02 HTML curl): 한 열 정렬 ''권장'', 라디오·체크박스 수직
  배치 ''좋다'' → MAY. 원문의 여러 열 허용 조건(''입력받을 데이터가 많고 입력폼 컨테이너의 너비가 충분하다면'')은 수치가 없어 판정할 수 없으므로 예외로 넣지 않음 — MAY라 위반해도
  이유를 남기면 된다. (2026-10-18 시험 4 검토 반영) 측정 기준은 ''라디오 옵션이 가로로 2개 이상이면 실패'', 예외는 ''KRDS 는 가로 배치를 금지하지 않고 조건을 단다''로 서로
  모순이었다 → KRDS 원문(라디오·체크박스 ''수직으로 배치하는 것이 좋다'' + 가로 배치 시 레이블 길이 제한·옵션 간격 조건, component_06_01·06_02)대로 ''세로가 기본,
  가로는 COPY-029·SPACE-002 를 모두 지킬 때만 통과''로 측정 기준 (2)에 하나로 정하고 모순된 예외 항목을 지웠다. radio-group·checkbox 규격의 --inline 변형(COPY-029
  조건 명시)과도 맞는다.'
korean_specific: false
tags:
- krds
