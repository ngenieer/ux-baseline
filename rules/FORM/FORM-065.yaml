id: FORM-065
category: FORM
title: 단일·다중 파일 업로드 선택
stage: platformed
status:
  value: confirmed
type: rule
strength: MAY
statement: '다중 파일 업로드는 올리는 파일이 모두 서로 관련 있을 때(예: 사진 여러 장)만 쓰고, 서로 관련 없는 파일 여러 개를 받을 때는 섹션을 나누어 파일마다 단일 파일 업로드 컴포넌트를
  따로 둔다.'
measurement:
  criteria: 'input[type=file][multiple] 하나가 받는 파일이 모두 같은 종류의 서류·자료다. 종류가 다른 서류(예: 신분증 사본과 재직증명서)는 각자 제목(레이블)이 있는
    별도 섹션의 단일 파일 업로드로 받는다.'
  method: '수동: 업로드 컴포넌트마다 받는 서류 종류를 확인한다.'
automation:
  feasibility: none
  checks: []
  note: 서류 종류 판별이 필요해 자동화 불가.
rationale: KRDS는 단일 파일 업로드를 서로 관련 없는 여러 파일에 쓰고 섹션을 명확히 구분해 파일마다 개별 컴포넌트를 두는 것이 적절하며, 다중 파일 업로드는 모든 파일이 서로 관련된 경우에
  적합하다고 한다.
sources:
- ref: KRDS
  locator: '컴포넌트 > 파일 업로드 > 유형(업로드 가능 파일 수: 단일 파일 업로드) (가이드라인 PDF 2025.08 698쪽)'
  note: 'https://www.krds.go.kr/html/site/component/component_09_04.html — 원문: ''... 제공하는 것이 적절하다'''
- ref: KRDS
  locator: '컴포넌트 > 파일 업로드 > 유형(업로드 가능 파일 수: 다중 파일 업로드) (가이드라인 PDF 2025.08 698쪽)'
  note: 'https://www.krds.go.kr/html/site/component/component_09_04.html — FORM-066에서 병합. 원문: ''사용하기 적합하다'''
scope:
  level: component
  targets:
  - input[type=file]
  - 파일 업로드
exceptions: []
relations: []
examples:
  good:
  - lang: html
    code: '<section><h3 id="id-doc">신분증 사본</h3><input type="file" aria-labelledby="id-doc"></section>

      <section><h3 id="job-doc">재직증명서</h3><input type="file" aria-labelledby="job-doc"></section>

      '
    note: 종류가 다른 서류를 섹션별 단일 파일 업로드로 받는다.
  bad:
  - lang: html
    code: '<label for="docs">신분증 사본, 재직증명서</label>

      <input id="docs" type="file" multiple>

      '
    note: 서로 관련 없는 서류를 다중 업로드 하나로 받는다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트와 대조): 두 문장 일치 확인. 1단계 locator ''사용성 가이드라인(용례)''는
  실제로 ''유형'' 절 — 고침. 원문 강도 ''적절하다/적합하다'' → MAY.'
korean_specific: false
tags:
- krds
- krds-component
