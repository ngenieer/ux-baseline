id: FORM-040
category: FORM
title: 대화형·비대화형 태그 혼합 금지
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 한 태그 그룹 안에 대화형 태그(선택 해제·삭제 등 조작 가능)와 비대화형 태그(분류 표시만)를 섞지 않는다.
measurement:
  criteria: 태그 그룹(태그 목록 컨테이너) 하나 안의 태그가 모두 대화형(button·a 또는 삭제 버튼 포함)이거나 모두 비대화형(조작 가능한 자손 없음)이다. 한 그룹에 두 종류가 함께
    있으면 실패.
  method: 태그 그룹마다 각 태그에 button·a·[tabindex]·[role=button] 자손이 있는지 DOM으로 확인한다.
automation:
  feasibility: full
  checks:
  - tool: custom
    method: 태그 그룹 컴포넌트(규격 클래스 기준) 안에서 대화형 자손이 있는 태그와 없는 태그가 공존하면 실패(DOM 검사)
  note: 태그 그룹 컨테이너 식별은 4단계 컴포넌트 규격의 클래스·data 속성에 의존.
rationale: 같은 모양의 태그 중 일부만 누를 수 있으면 사용자는 어떤 태그가 조작 가능한지 구분하지 못한다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 태그 > 사용성 가이드라인 (가이드라인 PDF 2025.08 563쪽)
  note: https://www.krds.go.kr/html/site/component/component_06_04.html — '대화형 태그와 비대화형 태그를 같은 그룹에 포함하지 않는다. ...
    사용자는 어떤 태그가 대화형으로 사용되는지 혼동을 느낄 수 있다.'
scope:
  level: component
  targets:
  - 태그 그룹
exceptions: []
relations:
- type: depends
  id: NAV-052
  note: 상호작용 없는 분류 표시는 태그가 아닌 배지를 쓴다(KRDS 태그 용례)
examples:
  good:
  - lang: html
    code: "<ul class=\"tag-group\" aria-label=\"적용한 필터\">\n  <li class=\"tag\">서울 <button type=\"button\" aria-label=\"\
      서울 필터 해제\">×</button></li>\n  <li class=\"tag\">2026년 <button type=\"button\" aria-label=\"2026년 필터 해제\">×</button></li>\n\
      </ul>\n"
    note: 한 그룹의 태그가 모두 해제 버튼이 있는 대화형이다.
  bad:
  - lang: html
    code: "<ul class=\"tag-group\" aria-label=\"적용한 필터\">\n  <li class=\"tag\">서울 <button type=\"button\" aria-label=\"\
      서울 필터 해제\">×</button></li>\n  <li class=\"tag\">신규</li>\n</ul>\n"
    note: 조작 가능한 태그와 분류 표시만 하는 태그가 한 그룹에 섞였다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS component_06_04 HTML curl): ''같은 그룹에 포함하지 않는다'' 확인 → SHOULD + public-sector-must.
  카테고리 재검토: 태그는 필터·정렬 결과 표시 컴포넌트라 FORM보다 NAV(필터링·정렬)에 가까움 — 제안 파일 category_review.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
