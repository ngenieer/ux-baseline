id: FORM-008
category: FORM
title: 접근 가능한 인증
stage: platformed
status:
  value: confirmed
type: rule
strength: MUST
statement: 인증 절차의 어느 단계에도 인지 기능 테스트(비밀번호 기억, 문자 받아쓰기, 퍼즐, 계산 등)만을 통과 수단으로 두지 않는다. 인지 기능 테스트가 없는 다른 인증 수단, 비밀번호 관리자
  자동 입력·붙여넣기 같은 보조 수단, 사물 인식, 사용자가 제공한 콘텐츠 식별 중 하나를 제공하면 예외로 한다.
measurement:
  criteria: '인증(로그인·본인 확인·재인증) 단계마다 다음 중 하나 이상: (1) 인지 기능 테스트가 없는 인증 수단(간편인증·인증서·이메일 링크·패스키 등)을 같은 화면에서 고를 수 있다,
    (2) 비밀번호·인증번호 입력 필드가 붙여넣기를 막지 않고(onpaste·oncopy에서 preventDefault 없음) autocomplete="off"가 아니며 아이디·비밀번호 필드에 autocomplete="username"·"current-password"가
    있다, (3) 테스트가 사물 인식이다, (4) 테스트가 사용자가 직접 올린 콘텐츠 식별이다. 문자 받아쓰기·퍼즐형 CAPTCHA만 있고 (1)이 없으면 실패.'
  method: 인증 화면마다 스크립트 이벤트 리스너와 속성을 확인하고, 비밀번호 관리자로 자동 입력·붙여넣기를 실제로 수행한다.
automation:
  feasibility: partial
  checks:
  - tool: custom
    method: input[type=password]·인증번호 필드의 autocomplete 값과 paste 이벤트 차단 여부를 DOM·이벤트 리스너로 검사
  note: CAPTCHA 유형과 대체 인증 수단 존재 여부는 수동 확인. axe-core 대응 규칙 없음.
rationale: 비밀번호 기억·문자 받아쓰기·퍼즐 같은 인지 테스트는 기억·읽기·계산에 어려움이 있는 사용자의 로그인을 막는다.
sources:
- ref: WCAG22
  locator: SC 3.3.8 Accessible Authentication (Minimum) (Level AA)
  note: https://www.w3.org/TR/WCAG22/#accessible-authentication-minimum
- ref: WCAG22_UNDERSTANDING
  locator: https://www.w3.org/WAI/WCAG22/Understanding/accessible-authentication-minimum.html
  note: 보조 수단 예로 비밀번호 관리자 입력 지원과 복사·붙여넣기. 로그인 폼이 SC 1.3.5를 만족하면 비밀번호 관리자 입력이 가능하다고 설명.
- ref: KWCAG22
  locator: 검사항목 7.3.3 접근 가능한 인증
  note: 비공식 HTML 판 — '인증 과정은 인지 기능 테스트에만 의존해서는 안 된다.' 브라우저 저장 가능한 서식, OAuth, 신체·물건 인증을 방법으로 듦.
- ref: KRDS
  locator: 기본 패턴 > 개인 식별 정보 입력 > 사용성 가이드라인(공통) (가이드라인 PDF 2025.08 759쪽)
  note: https://www.krds.go.kr/html/site/global/global_01.html — 개인 식별 정보 필드 복사·붙여넣기 허용(FORM-018과 같은 문장)
scope:
  level: situation
  targets:
  - 로그인·본인 확인·재인증 화면
  - input[type=password]
exceptions:
- WCAG 3.3.8 예외(대체 수단·보조 수단·사물 인식·본인 제공 콘텐츠)는 statement에 포함
relations:
- type: depends
  id: FORM-001
  note: 아이디·비밀번호 필드의 autocomplete 지정이 비밀번호 관리자 입력의 전제(Understanding 3.3.8)
- type: refines
  id: FORM-018
  note: 이 룰은 인증 필드의 붙여넣기 허용을 접근성 요구로 둔다. 개인 식별 정보 필드 일반은 FORM-018.
examples:
  good:
  - lang: html
    code: '<label for="uid">아이디</label>

      <input id="uid" autocomplete="username">

      <label for="pw">비밀번호</label>

      <input id="pw" type="password" autocomplete="current-password">

      '
    note: 비밀번호 관리자가 자동 입력하고 붙여넣을 수 있어 기억 테스트를 대신한다.
  bad:
  - lang: html
    code: '<label for="uid">아이디</label>

      <input id="uid" autocomplete="username">

      <label for="pw">비밀번호</label>

      <input id="pw" type="password" autocomplete="off" onpaste="return false">

      '
    note: 자동 입력과 붙여넣기를 막아 비밀번호를 외워 입력하는 것 외의 수단이 없다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(WCAG22-A-AA.yaml SC 3.3.8 본문·notes, Understanding accessible-authentication-minimum
  curl, KWCAG 비공식 HTML 판 7.3.3, KRDS global_01 HTML curl): statement·예외가 원문과 맞음. 측정 기준의 autocomplete 토큰은 Understanding의
  1.3.5 연계 설명에서 가져옴. KWCAG 공식 PDF 미대조.'
korean_specific: false
tags:
- wcag22
- level-aa
- new-in-2.2
- kwcag22
- krds
