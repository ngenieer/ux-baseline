id: FORM-038
category: FORM
title: 다중 선택에 셀렉트 금지
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 여러 값을 한 번에 골라야 하는 선택에는 단일 선택 셀렉트나 select[multiple]을 쓰지 않고 체크박스 그룹이나 다중 선택 드롭다운을 쓴다.
measurement:
  criteria: 값 여러 개를 받는 선택 그룹이 select(multiple 유무 무관)로 구현돼 있지 않다. 체크박스 그룹(fieldset + input[type=checkbox]) 또는 aria-multiselectable="true"
    listbox를 쓰는 다중 선택 드롭다운이면 통과.
  method: DOM에서 select[multiple]을 찾고, 폼 스키마에서 값 여러 개를 받는 필드가 select로 렌더링되는지 확인한다.
automation:
  feasibility: partial
  checks:
  - tool: custom
    method: select[multiple] 존재 시 실패(DOM 검사)
  note: 단일 select로 여러 값을 반복 선택시키는 구현은 폼 스키마와 대조해야 해 수동.
rationale: 셀렉트는 하나를 고르는 컨트롤로 인식되고, select[multiple]은 Ctrl·Shift 조합을 알아야 여러 개를 고를 수 있어 대부분의 사용자가 쓰기 어렵다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 셀렉트 > 용례(사용하기 적합하지 않은 경우) (가이드라인 PDF 2025.08 552쪽)
  note: https://www.krds.go.kr/html/site/component/component_06_03.html — '한 번에 여러 개의 값을 선택해야 하는 경우 — 체크박스 또는 다중
    선택이 가능한 드롭다운 컴포넌트를 사용한다.'
scope:
  level: component
  targets:
  - select
  - select[multiple]
exceptions: []
relations:
- type: refines
  id: FORM-028
  note: 여러 값 선택 컨트롤 선택을 셀렉트 관점에서 구체화
examples:
  good:
  - lang: html
    code: "<fieldset>\n  <legend>희망 지역(여러 개 선택)</legend>\n  <label><input type=\"checkbox\" name=\"area\" value=\"\
      busan\"> 부산</label>\n  <label><input type=\"checkbox\" name=\"area\" value=\"seoul\"> 서울</label>\n</fieldset>\n"
    note: 여러 값을 고르는 선택에 체크박스 그룹을 썼다.
  bad:
  - lang: html
    code: "<label for=\"area\">희망 지역(여러 개 선택)</label>\n<select id=\"area\" name=\"area\" multiple>\n  <option value=\"\
      busan\">부산</option><option value=\"seoul\">서울</option>\n</select>\n"
    note: select[multiple]은 Ctrl·Shift 조작을 알아야 여러 개를 고를 수 있다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS component_06_03 HTML curl): ''사용하기 적합하지 않은 경우'', ''사용한다'' 확인 → SHOULD
  + public-sector-must. select[multiple]을 명시적으로 넣은 것은 ''셀렉트''가 HTML select 전체를 뜻한다는 해석(원문은 단일 선택 셀렉트 컴포넌트 기준).'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
