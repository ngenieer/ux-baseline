id: FORM-031
category: FORM
title: 모바일 단일 선택은 셀렉트 우선 검토
stage: platformed
status:
  value: confirmed
type: guide
strength: MAY
statement: 모바일 화면의 단일 선택에서 라디오 옵션 목록 때문에 화면 전체를 스크롤해야 하면 라디오 버튼 대신 셀렉트나 콤보 상자를 먼저 검토한다.
measurement:
  criteria: '점검 질문: 너비 360px 화면에서 이 라디오 그룹의 옵션을 모두 보려면 페이지를 세로로 스크롤해야 하는가? 그렇다면 셀렉트·콤보 상자를 검토하고 그 결과(채택 또는 라디오 유지
    이유)를 설계 문서에 남겼는가?'
  method: 360px 뷰포트에서 라디오 그룹 높이가 뷰포트 높이를 넘는지 보고, 설계 검토 기록을 확인한다.
automation:
  feasibility: none
  note: 검토 여부는 문서 확인이라 자동 검사 불가.
rationale: 모바일에서 긴 옵션 목록을 페이지 스크롤로 훑기보다 별도 옵션 목록을 탐색하는 편이 효율적이다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 라디오 버튼 > 용례(사용하기 적합하지 않은 경우 — 모바일 플랫폼) (가이드라인 PDF 2025.08 524쪽)
  note: https://www.krds.go.kr/html/site/component/component_06_01.html — '옵션을 확인하기 위해 전체 화면을 스크롤 하는 것보다 별도의 옵션
    목록을 탐색하는 것이 더 효율적이므로 셀렉트나 콤보 상자의 사용을 우선적으로 고려해야 한다.'
scope:
  level: situation
  targets:
  - 모바일 화면의 라디오 그룹
exceptions: []
relations:
- type: refines
  id: FORM-030
  note: 옵션이 많은 라디오 그룹을 셀렉트로 바꾸는 판단을 모바일 화면 조건으로 구체화
examples:
  good:
  - lang: text
    code: '360px 화면에서 은행 라디오 20개가 세 화면 높이를 차지해, 셀렉트로 바꾸고 그 결정을 설계 문서에 기록했다.

      '
    note: 스크롤이 생기는 것을 확인하고 셀렉트를 검토한 결과를 남겼다.
  bad:
  - lang: text
    code: '360px 화면에서 은행 라디오 20개가 세 화면 높이를 차지하는데, 셀렉트를 검토하지 않고 라디오를 그대로 두었다.

      '
    note: 스크롤 문제를 검토하지 않았고 라디오를 유지한 이유도 기록이 없다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS component_06_01 HTML curl): ''우선적으로 고려해야 한다'' 확인. 정책 2의 ''해야 한다''(SHOULD)에
  해당하는 어미지만 의무 대상이 ''고려(검토)''라 결과를 강제하지 않음 — 권장으로 보고 MAY로 둠(정책과 다른 판단, 이유 기록). ''전체 화면을 스크롤''을 ''360px에서 그룹 높이가
  뷰포트를 넘음''으로 구체화한 것은 체계의 해석.'
korean_specific: false
tags:
- krds
- krds-component
