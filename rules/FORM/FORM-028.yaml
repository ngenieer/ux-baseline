id: FORM-028
category: FORM
title: 체크박스와 라디오 구분
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 여러 옵션을 동시에 고를 수 있는 선택에는 라디오 버튼을 쓰지 않고, 한 옵션만 고를 수 있는 선택에는 체크박스를 쓰지 않는다.
measurement:
  criteria: (1) 서버가 한 질문에 값 여러 개를 받는 그룹이 input[type=radio]·role=radio로 되어 있지 않다. (2) 서버가 한 질문에 값 하나만 받는 2개 이상 옵션
    그룹이 input[type=checkbox]·role=checkbox로 되어 있지 않다(스크립트로 체크박스를 하나만 선택되게 막는 구현 포함). 단일 체크박스 하나로 켜고 끄는 항목(예 '주문자
    정보와 같음')은 (2)의 대상이 아니다.
  method: 각 선택 그룹이 받는 값 개수(폼 스키마·API 명세)와 컨트롤 유형을 대조한다.
automation:
  feasibility: none
  note: 받는 값 개수는 폼 스키마와 대조해야 해 수동. 4단계에서 폼 스키마(multiple 여부)와 렌더링 컨트롤을 비교하는 단위 테스트 가능.
rationale: 체크박스는 여러 개, 라디오 버튼은 하나를 고른다는 관례가 굳어 있어, 바꿔 쓰면 사용자가 몇 개를 고를 수 있는지 잘못 읽는다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 라디오 버튼 > 용례 (가이드라인 PDF 2025.08 523~524쪽)
  note: https://www.krds.go.kr/html/site/component/component_06_01.html — '사용자가 여러 개의 옵션을 선택할 수 있도록 하는 경우에는 체크박스를
    사용해야 한다.'
- ref: KRDS
  locator: 컴포넌트 > 체크박스 > 용례 (가이드라인 PDF 2025.08 538쪽)
  note: https://www.krds.go.kr/html/site/component/component_06_02.html — 사용하기 적합하지 않은 경우 '사용자가 한 개의 옵션을 선택할 수 있도록
    하는 경우 — 라디오 버튼을 사용해야 한다.'
scope:
  level: component
  targets:
  - input[type=radio]
  - input[type=checkbox]
exceptions: []
relations: []
examples:
  good:
  - lang: html
    code: "<fieldset>\n  <legend>관심 분야(여러 개 선택)</legend>\n  <label><input type=\"checkbox\" name=\"topic\" value=\"\
      welfare\"> 복지</label>\n  <label><input type=\"checkbox\" name=\"topic\" value=\"tax\"> 세금</label>\n</fieldset>\n"
    note: 여러 값을 받는 질문에 체크박스를 썼다.
  bad:
  - lang: html
    code: "<fieldset>\n  <legend>관심 분야(여러 개 선택)</legend>\n  <label><input type=\"radio\" name=\"topic\" value=\"\
      welfare\" required> 복지</label>\n  <label><input type=\"radio\" name=\"topic\" value=\"tax\"> 세금</label>\n\
      </fieldset>\n"
    note: 여러 개를 고를 수 있다고 하면서 라디오 버튼을 써서 하나만 고를 수 있다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS component_06_01·06_02 HTML curl): 두 페이지 ''사용해야 한다'' 확인 → SHOULD + public-sector-must.
  1단계 statement의 ''체크박스를 쓴다''를 ''라디오를 쓰지 않는다''로 바꿈 — 여러 값 선택에 다중 선택 드롭다운을 허용하는 FORM-038과 부딪히지 않게 하려는 것.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
