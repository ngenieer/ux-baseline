id: FORM-001
category: FORM
title: 입력 목적 지정
stage: platformed
status:
  value: confirmed
type: rule
strength: MUST
statement: 사용자 본인에 관한 정보를 받는 입력 필드 중 목적이 HTML 자동완성 토큰(name, email, tel, bday, street-address 등)에 해당하는 필드에는 그 목적에
  맞는 autocomplete 값을 지정한다.
measurement:
  criteria: '사용자 본인 정보를 받는 input·select·textarea 중 목적이 WCAG 2.2 ''7. Input Purposes for User Interface Components''
    목록(HTML autocomplete 토큰)에 있는 필드는 autocomplete 속성에 그 목적의 유효한 토큰을 가진다 (예: 이름 → name, 이메일 → email, 휴대전화 → tel,
    생년월일 → bday 또는 bday-year·bday-month·bday-day). 속성 누락, autocomplete="off", 목적과 다른 토큰은 실패.'
  method: axe-core autocomplete-valid로 지정된 값의 유효성을 검사하고, 폼의 필드 목록을 사람이 보고 사용자 본인 정보 필드마다 토큰이 있는지와 목적이 맞는지 확인한다.
automation:
  feasibility: partial
  checks:
  - tool: axe-core
    rule: autocomplete-valid
    method: autocomplete 속성이 있을 때 토큰이 유효하고 필드 유형과 맞는지 검사
  - tool: html-validate
    rule: valid-autocomplete
    method: autocomplete 토큰 유효성 (정적 HTML 검사, lint/.htmlvalidate.json)
  note: axe는 autocomplete가 없는 필드를 실패로 잡지 않는다. 사용자 본인 정보 필드인지 판단과 토큰 누락은 수동 확인. 4단계에서 레이블·name 속성으로 후보 필드를 찾아 토큰
    누락을 경고하는 커스텀 검사를 만들 수 있다.
rationale: 브라우저와 보조기술이 필드 목적을 알면 저장된 값으로 자동 입력하거나 목적을 아이콘 등으로 표시할 수 있어, 인지·운동 장애 사용자의 입력 부담과 입력 오류가 줄어든다.
sources:
- ref: WCAG22
  locator: SC 1.3.5 Identify Input Purpose (Level AA)
  note: https://www.w3.org/TR/WCAG22/#identify-input-purpose
- ref: WCAG22_UNDERSTANDING
  locator: https://www.w3.org/WAI/WCAG22/Understanding/identify-input-purpose.html
- ref: KRDS
  locator: 기본 패턴 > 개인 식별 정보 입력 > 접근성 가이드라인 (가이드라인 PDF 2025.08 773쪽)
  note: https://www.krds.go.kr/html/site/global/global_01.html — '입력 필드에 자동 완성 속성을 설정한다.' (autocomplete 속성 사용)
- ref: KRDS
  locator: 컴포넌트 > 날짜 입력 필드, 텍스트 입력 필드 > 사용성 가이드라인 (가이드라인 PDF 2025.08 674, 694쪽)
  note: https://www.krds.go.kr/html/site/component/component_09_01.html, component_09_03.html — '사용자가 자주, 반복적으로
    입력하는 날짜/값은 자동 완성될 수 있도록 구현한다.' 상세는 sources/extracts/KRDS-components.yaml
scope:
  level: component
  targets:
  - input
  - select
  - textarea
  - 사용자 본인 정보 입력 필드
exceptions:
- 사용자 본인이 아닌 사람(수령인·가족 등)에 관한 정보를 받는 필드 — SC 1.3.5는 '사용자에 관한 정보'만 대상으로 한다.
- 목적이 WCAG 2.2 Input Purposes 목록에 없는 필드
relations: []
examples:
  good:
  - lang: html
    code: '<label for="email">이메일</label>

      <input id="email" name="email" type="email" autocomplete="email">

      '
    note: 본인 이메일 필드에 목적 토큰 email을 지정했다.
  bad:
  - lang: html
    code: '<label for="email">이메일</label>

      <input id="email" name="email" type="email" autocomplete="off">

      '
    note: 본인 정보 필드에서 autocomplete="off"로 목적 정보를 지웠다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(sources/extracts/WCAG22-A-AA.yaml SC 1.3.5, Understanding 1.3.5 curl, KRDS
  global_01·component_09_01·09_03 HTML curl): SC 문장과 두 조건(목록에 있는 목적, 기술 지원)을 확인해 statement 범위를 ''목록에 있는 목적''으로 좁힘.
  KRDS 개인 식별 정보 페이지 접근성 가이드라인 문장 확인(근거로 WCAG 2.1 1.3.5 인용).'
korean_specific: false
tags:
- wcag22
- level-aa
- new-in-2.1
- krds
