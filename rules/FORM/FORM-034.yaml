id: FORM-034
category: FORM
title: 레이블 클릭으로 선택
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 라디오 버튼·체크박스·토글 스위치는 컨트롤뿐 아니라 보이는 레이블 텍스트를 클릭·탭해도 값이 바뀌게 한다.
measurement:
  criteria: input[type=radio|checkbox]와 role=radio·checkbox·switch마다 보이는 레이블 텍스트 영역을 클릭하면 checked/aria-checked 값이
    바뀐다. 네이티브 컨트롤은 label[for=id] 또는 label로 감싸기로 연결돼 있으면 통과.
  method: 각 컨트롤의 레이블 텍스트를 클릭해 상태 변화를 확인한다. 네이티브는 label 연결을 DOM으로 확인한다.
automation:
  feasibility: partial
  checks:
  - tool: custom
    method: 네이티브 radio·checkbox가 label 요소와 연결돼 있는지 DOM 검사(aria-label·title만 있으면 실패), 커스텀 컨트롤은 Playwright로 레이블 클릭
      후 aria-checked 변화 확인
  note: axe label 규칙은 aria-label·title도 통과시키므로 이 룰을 판정하지 못함.
rationale: 체크박스·라디오·스위치 양식은 작아서 누르기 어렵다. 레이블까지 누를 수 있게 하면 운동 장애 사용자와 터치 사용자의 조작 실패가 준다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 라디오 버튼 > 상호작용 가이드라인(실행 Click) (가이드라인 PDF 2025.08 537쪽)
  note: https://www.krds.go.kr/html/site/component/component_06_01.html — '버튼 양식 또는 버튼 레이블을 Click 하였을 때 값이 선택되어야
    한다.'
- ref: KRDS
  locator: 컴포넌트 > 체크박스 > 상호작용 가이드라인(Click) (가이드라인 PDF 2025.08 550쪽)
  note: https://www.krds.go.kr/html/site/component/component_06_02.html — '체크박스 양식은 조작하기에 크기가 충분하지 않으므로 레이블로 상호작용이
    확장될 수 있도록 구현해야 한다.'
- ref: KRDS
  locator: 컴포넌트 > 토글 스위치 > 상호작용 가이드라인(Click) (가이드라인 PDF 2025.08 580쪽)
  note: https://www.krds.go.kr/html/site/component/component_06_07.html — '사용자는 스위치 또는 레이블을 눌러 선택하거나 선택 해제할 수 있다.
    ... 레이블로 상호작용이 확장될 수 있도록 구현해야 한다.'
scope:
  level: component
  targets:
  - input[type=radio]
  - input[type=checkbox]
  - '[role=switch]'
exceptions: []
relations:
- type: depends
  id: FORM-004
  note: 보이는 레이블이 있어야 레이블 클릭이 가능
examples:
  good:
  - lang: html
    code: '<input type="checkbox" id="notify" name="notify">

      <label for="notify">알림 수신</label>

      '
    note: label[for]로 연결해 레이블 텍스트를 눌러도 체크된다.
  bad:
  - lang: html
    code: '<input type="checkbox" id="notify" name="notify" aria-label="알림 수신">

      <span>알림 수신</span>

      '
    note: 보이는 텍스트가 label이 아니어서 텍스트를 눌러도 값이 바뀌지 않는다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS component_06_01·06_02·06_07 HTML curl): 세 페이지 ''선택되어야 한다'', ''구현해야 한다''
  확인 → SHOULD + public-sector-must. 1단계 출처는 라디오 페이지뿐이었으나 statement 대상인 체크박스·토글 페이지 문장을 출처에 추가.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
