id: FORM-074
category: FORM
title: 수량 현재 값 표시와 기본값
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 수량 토글의 수량 필드에 현재 값을 항상 표시하고, 기본값은 사용자가 가장 자주 고르는 값으로 둔다.
measurement:
  criteria: (1) 처음 그릴 때와 증감 버튼을 누른 뒤 모두 수량 필드에 숫자 값이 보이고 빈 상태가 없다. (2) 초기 기본값이 이용 기록에서 가장 많이 선택된 값과 같다(이용 기록이 없으면
    (2)는 판정 보류).
  method: '(1) E2E (2) 수동: 선택 로그의 최빈값과 기본값을 대조한다.'
automation:
  feasibility: none
  checks: []
  note: 기존 검사기 규칙 없음. (1)은 4단계 커스텀 E2E로 판정 가능, (2)는 이용 데이터 필요.
rationale: KRDS는 증감 시 값이 얼마나 바뀌는지 알 수 있게 수량 필드에 현재 값을 항상 표시해야 하고, 기본값은 사용자가 가장 자주 선택하는 값이 적합하다고 한다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 수량 토글 > 사용성 가이드라인(수량 필드에 현재 값을 항상 표시하여 사용한다)
  note: 'https://www.krds.go.kr/html/site/component/component_12_04.html — 원문: ''항상 표시하여 제공해야 합니다'', ''기본 값은 사용자가
    가장 자주 선택하는 값으로 제공하는 것 적합합니다'''
scope:
  level: component
  targets:
  - 수량 토글
exceptions: []
relations: []
examples:
  good:
  - lang: html
    code: '<!-- 이용 기록상 가장 많이 고른 값: 2 -->

      <button type="button" aria-label="인원 줄이기">−</button>

      <input aria-label="관람 인원" inputmode="numeric" value="2" data-min="1" data-max="8">

      <button type="button" aria-label="인원 늘리기">+</button>

      '
    note: 수량 필드에 값이 늘 보이고 기본값이 최빈값이다.
  bad:
  - lang: html
    code: '<button type="button" aria-label="인원 줄이기">−</button>

      <input aria-label="관람 인원" inputmode="numeric" value="" data-min="1" data-max="8">

      <button type="button" aria-label="인원 늘리기">+</button>

      '
    note: 처음 그릴 때 수량 필드가 비어 있다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트와 대조): 문장 일치 확인. 앞부분은 ''제공해야 합니다'' → SHOULD +
  public-sector-must, 기본값 부분은 ''적합합니다''(MAY 수준) — 한 룰에 강도가 섞여 있어 3단계에서 기본값 부분을 별도 MAY 룰로 분리할지 검토.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
