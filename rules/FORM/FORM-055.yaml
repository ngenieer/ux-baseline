id: FORM-055
category: FORM
title: 여러 질문을 텍스트 영역 하나로 받지 않음
stage: platformed
status:
  value: confirmed
type: guide
strength: SHOULD
statement: 여러 질문의 답을 텍스트 영역 하나로 받지 않고 질문마다 입력을 나누며, 응답이 정해진 질문은 라디오 버튼이나 체크박스로 받는다.
measurement:
  criteria: '점검 질문: 텍스트 영역 하나의 레이블·안내문이 두 개 이상의 질문을 묻는가? 그렇다면 질문별 입력으로 나눴는가? 나눈 질문 중 선택지가 정해진 질문을 라디오 버튼·체크박스로 받는가?'
  method: 수동 검토
automation:
  feasibility: none
  checks: []
  note: 질문 개수와 응답 유형 판단이 필요해 자동화 불가.
rationale: KRDS는 여러 질문에 대한 응답을 받는 경우를 텍스트 영역에 적합하지 않은 경우로 들고, 질문을 나누고 응답을 라디오 버튼·체크박스로 구성해 직접 입력 없이 빠르게 답하게 해야 한다고
  한다.
sources:
- ref: KRDS
  locator: '컴포넌트 > 텍스트 영역 > 용례(사용하기 적합하지 않은 경우: 여러 가지 질문에 대한 응답을 받기 위한 경우) (가이드라인 PDF 2025.08 677쪽)'
  note: 'https://www.krds.go.kr/html/site/component/component_09_02.html — 원문: ''질문을 여러 개로 분할하고, 가능하다면 응답을 라디오 버튼이나
    체크박스로 구성하여 ... 해야 한다'''
scope:
  level: component
  targets:
  - textarea
exceptions: []
relations:
- type: refines
  id: FORM-057
  note: '''응답이 정해진 입력은 선택 컴포넌트로''가 FORM-057과 겹침. 이 룰의 고유 요구는 질문 분할'
examples:
  good:
  - lang: html
    code: "<fieldset>\n  <legend>방문 목적</legend>\n  <label><input type=\"radio\" name=\"purpose\" value=\"apply\"\
      > 민원 신청</label>\n  <label><input type=\"radio\" name=\"purpose\" value=\"consult\"> 상담</label>\n</fieldset>\n\
      <label for=\"more\">추가로 남길 말</label>\n<textarea id=\"more\" rows=\"4\"></textarea>\n"
    note: 선택지가 정해진 질문은 라디오로, 자유 서술만 텍스트 영역으로 나눴다.
  bad:
  - lang: html
    code: '<label for="all">방문 목적과 추가로 남길 말을 적어 주세요</label>

      <textarea id="all" rows="4"></textarea>

      '
    note: 질문 두 개의 답을 텍스트 영역 하나로 받는다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트와 대조): 문장 일치 확인. 원문 강도 ''해야 한다'' → SHOULD + public-sector-must.
  원문의 ''가능하다면''은 statement에서 뺌(선택지가 정해진 질문으로 조건화).'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
