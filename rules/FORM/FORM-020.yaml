id: FORM-020
category: FORM
title: 이름 입력 제약 금지
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: '이름은 텍스트 입력 필드 하나로 받고, 공백·하이픈 등 기호를 포함한 모든 문자를 허용하며, 검증에서 최소 글자 수(예: 한글 3자)를 요구하지 않고, 입력값의 공백을 자동으로 지우거나
  대소문자를 바꾸지 않는다.'
measurement:
  criteria: (1) 이름 입력이 input 1개다(성·이름 분리 필드가 필수가 아님). (2) pattern 속성·클라이언트·서버 검증이 공백·하이픈·아포스트로피·로마자·한자를 거부하지 않는다.
    (3) 최소 길이 검증이 1자 이하다(minlength 없음 또는 1). (4) 'Kim  Min-Ji' 같은 값을 저장 후 다시 보면 공백·대소문자가 그대로다.
  method: 샘플 이름(이 / 남궁 민 / Kim Min-Ji / O'Brien)을 입력·제출하고 검증 결과와 저장 후 표시값을 확인한다.
automation:
  feasibility: partial
  checks:
  - tool: custom
    method: autocomplete="name" 필드에 pattern·minlength(>1)가 없는지 DOM 검사
  note: 서버 검증·저장 정규화 여부는 API 테스트 또는 수동.
rationale: 이름은 언어·국적·개명 여부에 따라 형식이 다양해, 형식 제약은 실제 이름을 입력하지 못하게 만든다.
sources:
- ref: KRDS
  locator: 기본 패턴 > 개인 식별 정보 입력 > 사용성 가이드라인(이름) (가이드라인 PDF 2025.08 760~762쪽; 로마자 이름 공백·대소문자 문장은 PDF에 없음)
  note: 'https://www.krds.go.kr/html/site/global/global_01.html — ''기호, 공백을 포함한 모든 문자를 입력 가능하도록 허용'' / ''한글 이름을
    기준으로 하였을 때 유효성 검사에서 최소 3글자 이상의 입력을 요청하지 않도록 유의한다.'' / ''이름 입력에 단일 텍스트 입력 필드를 사용한다.'' / 로마자 이름: ''중간 공백을 오류로
    처리하거나 자동 제거하지 않으며'', ''대·소문자 표기를 그대로 저장하고 표시한다.'''
scope:
  level: component
  targets:
  - input[autocomplete=name]
  - 이름 입력 필드
exceptions:
- 본인인증처럼 공적 문서의 이름 형식과 정확히 일치해야 하는 과업 — 제약 사항을 명확히 설명하고 대안을 제시한다(KRDS 원문 단서)
relations: []
examples:
  good:
  - lang: html
    code: '<label for="nm">이름</label>

      <input id="nm" autocomplete="name" aria-describedby="nm-help">

      <p id="nm-help">여권에 표기된 이름 전체를 입력하세요. 공백과 ''-''를 포함할 수 있습니다.</p>

      '
    note: 필드 하나로 받고 공백·기호·글자 수를 제한하지 않는다.
  bad:
  - lang: html
    code: '<label for="nm">이름</label>

      <input id="nm" autocomplete="name" pattern="[가-힣]{3,}" minlength="3">

      '
    note: 한글 3자 이상만 허용해 두 글자 이름·외국 이름·하이픈을 거부한다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS global_01 HTML curl): 이름 절 문장 확인. 강도: ''허용하고 ... 해야 한다'', ''단일 텍스트 입력
  필드를 사용한다'', ''유의한다'' → SHOULD + public-sector-must. 1단계 메모의 로마자 이름 필드 너비(''최소 320~360px 이상'')는 같은 페이지에서 확인했으나
  이 룰과 다른 요구(필드 너비) — FORM-056(필드 너비) 쪽 출처로 제안 파일 notes.'
korean_specific: true
tags:
- krds
- public-sector-must
