id: FORM-014
category: FORM
title: 클라이언트·서버 검증 병행
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 입력 검증 규칙은 클라이언트에서 검사하더라도 서버에서 모두 다시 검사하고, 서버 검증에서 나온 필드 오류도 해당 입력 필드 옆에 인라인 텍스트로 표시한다.
measurement:
  criteria: (1) 클라이언트 검증을 끈 상태(JS 비활성 또는 요청 직접 전송)로 규칙을 위반한 값을 보내면 서버가 거부하고 필드별 오류를 돌려준다. (2) 서버가 돌려준 필드 오류가 화면에서
    해당 필드 바로 아래 메시지 영역에 표시되고 aria-describedby로 필드와 연결된다. 페이지 상단 알림이나 토스트로만 표시하면 실패.
  method: 검증 규칙마다 클라이언트 검증을 우회한 요청을 보내 응답을 확인하고, 그 오류가 화면에서 필드 옆에 표시되는지 확인한다.
automation:
  feasibility: partial
  checks:
  - tool: custom
    method: API 테스트로 규칙 위반 요청을 보내 4xx와 필드별 오류 응답을 확인
  note: 화면 표시 위치(필드 옆 인라인)는 E2E 또는 수동 확인.
rationale: 클라이언트 검증은 쉽게 우회되고 보안 검사를 대신하지 못한다. 서버 오류를 필드 옆에 보여줘야 사용자가 고칠 위치를 찾는다.
sources:
- ref: KRDS
  locator: 기본 패턴 > 입력폼 > 상호작용 가이드라인 (가이드라인 PDF 2025.08 850쪽)
  note: https://www.krds.go.kr/html/site/global/global_08.html — '클라이언트 측 검증은 ... 보안 측면을 확인하는 것이 아니므로 서버 측 검증이 반드시
    함께 사용되어야 한다. 서버 측 검증 결과에 기반하여 ... 메시지는 오류가 발생한 항목에 인라인으로 제공하는 것이 바람직하다.'
- ref: GOVUK_VALIDATION
  locator: Server-side validation
  note: 참고 사례 — 서버 검증 필수(registry note)
scope:
  level: situation
  targets:
  - 입력 검증
exceptions: []
relations:
- type: depends
  id: FORM-003
  note: 서버 오류도 오류 식별(WCAG 3.3.1) 방식으로 표시
examples:
  good:
  - lang: html
    code: '<!-- 서버 검증 결과로 렌더링한 화면 -->

      <label for="uid">아이디</label>

      <input id="uid" autocomplete="username" value="hong" aria-invalid="true" aria-describedby="uid-err">

      <p id="uid-err">아이디 ''hong''은 이미 사용 중입니다. 다른 아이디를 입력하세요.</p>

      '
    note: 서버가 돌려준 필드 오류를 해당 필드 바로 아래에 연결해 표시한다.
  bad:
  - lang: html
    code: '<div role="alert">아이디 ''hong''은 이미 사용 중입니다. 다른 아이디를 입력하세요.</div>

      …

      <label for="uid">아이디</label>

      <input id="uid" autocomplete="username" value="hong">

      '
    note: 서버 필드 오류를 페이지 상단 알림으로만 보여주고 필드에 연결하지 않는다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS global_08 HTML curl): 서버 검증 ''반드시 함께 사용되어야 한다''(필수) → SHOULD + public-sector-must.
  인라인 표시는 ''바람직하다''(권장)로 강도가 더 낮음 — 한 룰로 두되 강도는 상위 문장 기준. 3단계에서 분리 여부 검토.'
korean_specific: false
tags:
- krds
- public-sector-must
