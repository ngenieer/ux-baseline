id: FORM-059
category: FORM
title: 파일 제한 사항 안내
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 업로드 파일의 형식·크기·개수에 제한이 있으면 허용 형식 목록, 최대 크기와 단위, 최대 개수를 파일 업로드 영역의 도움말 텍스트로 표시한다.
measurement:
  criteria: '서버나 accept 속성이 강제하는 제한(형식·크기·개수)마다 그 값이 같은 파일 업로드 컴포넌트 안의 화면에 보이는 도움말 텍스트에 적혀 있다 (예: ''PDF, JPG, PNG
    / 파일당 최대 10MB / 최대 5개'').'
  method: '수동: 서버 검증 규칙과 accept 속성의 제한 값을 도움말 텍스트와 대조한다.'
automation:
  feasibility: none
  checks: []
  note: 기존 검사기 규칙 없음. 4단계 커스텀 DOM 검사로 accept 속성의 확장자가 도움말 텍스트에 모두 나오는지 판정 가능(크기·개수는 서버 규칙과 대조 필요).
rationale: KRDS는 업로드 가능한 문서 유형·크기·개수에 제한이 있으면 도움말 텍스트로 제약 사항을 강조해 표시해 잘못된 형식이나 큰 파일로 인한 오류를 막으라고 한다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 파일 업로드 > 사용성 가이드라인(파일 유형, 파일 크기, 파일 개수 제한에 대해 안내한다) (가이드라인 PDF 2025.08 703쪽)
  note: 'https://www.krds.go.kr/html/site/component/component_09_04.html — 원문: ''도움말 텍스트를 사용하여 제약 사항에 대한 정보를 강조하여
    표시한다'''
scope:
  level: component
  targets:
  - input[type=file]
  - 파일 업로드
exceptions: []
relations:
- type: refines
  id: FORM-004
  note: 입력 안내 제공(FORM-004, WCAG 3.3.2)을 파일 업로드 제한 사항에 구체화
examples:
  good:
  - lang: html
    code: '<h3 id="doc">재직증명서</h3>

      <p id="doc-help">PDF, JPG, PNG 파일 / 파일당 최대 10MB / 1개</p>

      <input type="file" accept=".pdf,.jpg,.jpeg,.jpe,.png" aria-labelledby="doc" aria-describedby="doc-help">

      '
    note: 허용 형식·최대 크기·개수를 업로드 영역 도움말에 적었다.
  bad:
  - lang: html
    code: '<h3 id="doc">재직증명서</h3>

      <input type="file" accept=".pdf,.jpg,.jpeg,.jpe,.png" aria-labelledby="doc">

      '
    note: 제한이 있는데 도움말이 없어 사용자는 올린 뒤에야 오류를 안다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트와 대조): 문장 일치 확인. 원문 강도 ''표시한다''(지시문) → SHOULD.
  원문의 ''강조하여''는 강조 방식·수치가 없어 측정 기준에서 뺌(3단계·4단계에서 도움말 텍스트 스타일 토큰으로 정할지 검토).'
korean_specific: false
tags:
- krds
- krds-component
