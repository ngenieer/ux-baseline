id: FORM-035
category: FORM
title: 즉시 적용 설정은 토글, 확정 흐름은 체크박스
stage: platformed
status:
  value: confirmed
type: guide
strength: MAY
statement: 선택하자마자 적용되는 켜기·끄기 설정에는 체크박스 대신 토글 스위치를 검토하고, 체크박스는 적용·제출 같은 별도 확정 동작이 있는 흐름 안의 선택에 쓴다.
measurement:
  criteria: '점검 질문: 이 체크박스의 값 변경이 별도의 적용·저장·제출 버튼 없이 바로 서버·화면에 반영되는가? 그렇다면 토글 스위치(role=switch)로 바꾸는 것을 검토했는가?'
  method: 설계 검토 때 체크박스마다 값 변경 직후 반영 여부를 확인한다.
automation:
  feasibility: none
  note: 즉시 반영 여부는 동작 확인이 필요하고 '검토'는 판정 불가 — guide.
rationale: 체크박스는 확정 동작 전 임시 선택이라는 기대를, 토글 스위치는 즉시 켜고 끈다는 기대를 준다. 기대와 동작이 다르면 사용자는 저장 버튼을 찾거나 변경이 반영됐는지 모른다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 체크박스 > 용례(사용하기 적합하지 않은 경우) (가이드라인 PDF 2025.08 538쪽)
  note: 'https://www.krds.go.kr/html/site/component/component_06_02.html — ''옵션을 선택하자마자 적용되는 경우: 토글 스위치를 사용을 고려한다.
    체크박스는 적용, 제출과 같은 별도의 확정 행위가 필요한 하나의 큰 과업 플로(Flow) 내에서 부분적으로 옵션을 선택하는 경우에 사용하기 적합하다.'''
scope:
  level: component
  targets:
  - input[type=checkbox]
  - '[role=switch]'
exceptions: []
relations:
- type: refines
  id: FORM-041
  note: FORM-046(확정 동작이 필요한 선택에는 토글 대신 체크박스·라디오)과 같은 구분을 체크박스 쪽에서 쓴 룰. 일부만 겹쳐(FORM-046은 라디오 포함, 이 룰은 즉시 적용 쪽 포함)
    병합하지 않음. (원래 대상 FORM-046 폐기 → FORM-041)
examples:
  good:
  - lang: html
    code: '<button type="button" role="switch" aria-checked="false" id="push">푸시 알림</button>

      <!-- 누르는 즉시 설정을 저장한다 -->

      '
    note: 즉시 적용되는 켜기·끄기 설정에 토글 스위치를 썼다.
  bad:
  - lang: html
    code: '<label><input type="checkbox" name="push" onchange="saveNow(this)"> 푸시 알림</label>

      <!-- 체크하는 즉시 저장되고 적용·저장 버튼이 없다 -->

      '
    note: 확정 단계 없이 바로 적용되는 설정을 체크박스로 만들어 저장 버튼을 찾게 만든다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS component_06_02·06_07 HTML curl): ''고려한다'', ''적합하다'' 확인 → MAY. 토글 페이지
  ''선택한 옵션 값의 적용에 별도 제출/적용 과정이 필요한 경우 ... 체크박스나 라디오 버튼을 사용한다''(FORM-046)와 같은 구분. ''검토''는 판정 불가 → guide.'
korean_specific: false
tags:
- krds
- krds-component
