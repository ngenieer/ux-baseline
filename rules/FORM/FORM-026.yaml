id: FORM-026
category: FORM
title: 자동 초점 이동 시 되돌아가기
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 값을 다 입력하면 초점을 다음 입력 필드로 자동으로 옮기는 동작은 입력 전에 그 동작을 텍스트로 알린 경우에만 쓰고, 그때도 Shift+Tab이나 클릭으로 이전 필드로 돌아가 값을
  고칠 수 있게 하며 돌아간 필드에서 초점을 다시 자동으로 옮기지 않는다.
measurement:
  criteria: 자동 초점 이동이 있는 필드 묶음(예 전화번호 3칸, 생년월일 년·월·일)에서 (0) 묶음 앞 또는 레이블·도움말에 자동으로 다음 칸으로 이동한다는 안내 텍스트가 있다, (1) 다음
    필드로 자동 이동한 뒤 Shift+Tab을 누르면 이전 필드에 초점이 간다, (2) 값이 가득 찬 이전 필드에 초점이 간 상태에서 입력 없이 500ms가 지나도 초점이 그 필드에 남는다, (3)
    이전 필드에서 Backspace·문자 입력으로 값을 고칠 수 있다.
  method: 키보드로 필드 묶음을 채운 뒤 Shift+Tab으로 돌아가 값을 고쳐 본다(수동 또는 Playwright).
automation:
  feasibility: none
  checks:
  - tool: custom
    method: Playwright로 maxlength 필드를 채운 뒤 Shift+Tab, 500ms 대기 후 activeElement 확인
  note: 4단계 E2E 검사 후보.
rationale: 자동 초점 이동이 되돌아가기를 막으면 잘못 입력한 값을 고칠 수 없고, 키보드 사용자는 원하는 필드로 이동하지 못한다.
sources:
- ref: KRDS
  locator: 기본 패턴 > 입력폼 > 접근성 가이드라인 (가이드라인 PDF 2025.08 848쪽)
  note: 'https://www.krds.go.kr/html/site/global/global_08.html — ''사용자가 원하는 입력 필드로 초점을 자유롭게 이동시킬 수 있어야 한다. 편의성을
    위해 값의 입력이 완료되었을 때 초점을 자동으로 다음 입력 필드로 이동시키는 경우에도 이전 항목으로 돌아갈 수 있도록 해야 한다.'' (근거 표기: KWCAG 2.2 초점 이동과 표시, WCAG
    2.1 Focus Order)'
scope:
  level: situation
  targets:
  - 자동 초점 이동이 있는 입력 필드 묶음
exceptions: []
relations:
- type: conflicts
  id: FORM-002
  note: 자동 초점 이동은 입력 전에 그 동작을 텍스트로 알린 경우에만 쓴다(FORM-002 예외 조건). 쓸 때는 FORM-026의 되돌아가기 요건을 지킨다.
  decision: CF-005
- type: depends
  id: A11Y-015
  note: 초점 순서가 의미·조작을 보존(WCAG 2.4.3)
examples:
  good:
  - lang: html
    code: "<fieldset>\n  <legend id=\"tel-lg\">휴대 전화번호</legend>\n  <p id=\"tel-help\">칸을 다 채우면 다음 칸으로 자동 이동합니다.</p>\n\
      \  <input aria-labelledby=\"tel-lg\" aria-describedby=\"tel-help\" maxlength=\"3\" inputmode=\"numeric\" autocomplete=\"\
      tel-area-code\">\n  <input aria-labelledby=\"tel-lg\" aria-describedby=\"tel-help\" maxlength=\"4\" inputmode=\"\
      numeric\" autocomplete=\"tel-local-prefix\">\n  <input aria-labelledby=\"tel-lg\" aria-describedby=\"tel-help\"\
      \ maxlength=\"4\" inputmode=\"numeric\" autocomplete=\"tel-local-suffix\">\n</fieldset>\n<!-- 자동 이동은 사용자가\
      \ 문자를 입력해 maxlength에 도달한 input 이벤트에서만 실행한다 -->\n"
    note: 자동 이동을 미리 텍스트로 알리고, 입력 이벤트에서만 이동해 이전 칸으로 돌아갈 수 있다.
  bad:
  - lang: js
    code: '// focus 이벤트에서도 값이 가득 차 있으면 다음 칸으로 넘긴다 → Shift+Tab으로 돌아가도 바로 튕겨 나간다

      el.addEventListener(''focus'', () => { if (el.value.length === el.maxLength) next.focus(); });

      '
    note: 값이 찬 이전 칸으로 돌아가면 초점이 다시 자동으로 넘어가 수정할 수 없다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS global_08 HTML curl): ''이전 항목으로 돌아갈 수 있도록 해야 한다'' 확인 → SHOULD + public-sector-must.
  ''돌아간 필드에서 다시 자동 이동하지 않는다''와 500ms 대기는 ''돌아갈 수 있도록''을 판정 가능하게 만든 체계의 해석(원문 수치 아님). 2026-10-18 측정 기준을 3단계 결정(statement
  변경)에 맞춰 고침.'
korean_specific: false
tags:
- krds
- public-sector-must
