id: FORM-056
category: FORM
title: 길이를 예측할 수 있는 필드는 너비 고정
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 이름·우편번호·전화번호처럼 입력값 최대 길이를 예측할 수 있는 텍스트 입력 필드는 너비를 최대 길이에 맞춰 고정하고 너비 320 CSS px 화면에서도 최대 길이 입력값이 잘리지 않게
  하며, 그 밖의 텍스트 입력 필드는 섹션 너비를 채우게 한다.
measurement:
  criteria: (1) 최대 길이를 예측할 수 있는 필드는 CSS width(또는 max-width)를 글자 단위(ch·ic)나 고정값으로 지정하고 부모 너비 100%로 늘리지 않는다. (2) 뷰포트
    너비 320 CSS px에서 그 필드에 최대 길이 값을 넣었을 때 값 전체가 필드 안에 보인다(input.scrollWidth ≤ input.clientWidth). (3) 나머지 텍스트 입력
    필드는 그리드 칼럼(섹션) 너비를 채운다.
  method: 'E2E: 320 CSS px 뷰포트에서 최대 길이 값을 입력하고 scrollWidth와 clientWidth를 비교한다. 너비 지정 방식은 CSS 검토.'
automation:
  feasibility: none
  checks: []
  note: 기존 검사기 규칙 없음. 4단계 커스텀 E2E로 (2)를 판정 가능. 어떤 필드가 '길이 예측 가능'인지는 maxlength·autocomplete 값으로 후보를 뽑고 수동 확인.
rationale: KRDS는 텍스트 입력 필드를 기본적으로 섹션 영역을 채우게 하되, 길이를 예측할 수 있는 입력은 최대 길이에 맞춰 너비를 고정하고 더 작은 화면에서도 잘림 없이 값을 확인할 수 있는지
  점검해야 한다고 한다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 텍스트 입력 필드 > 사용성 가이드라인(입력 필드는 텍스트의 길이를 고려하여 ... 크기로 제공한다) (가이드라인 PDF 2025.08 690쪽)
  note: 'https://www.krds.go.kr/html/site/component/component_09_03.html — 원문: ''최대 길이에 맞추어 입력 필드의 너비를 고정하고 ...
    잘림 없이 입력값을 확인할 수 있는지를 점검해야 한다''. 작은 화면 수치는 원문에 없음'
- ref: WCAG22
  locator: SC 1.4.10 Reflow (Level AA)
  note: '''작은 화면'' 기준값 320 CSS px의 출처(RESP-003과 같은 기준)'
scope:
  level: component
  targets:
  - input[type=text]
  - input[type=tel]
  - 텍스트 입력 필드
exceptions: []
relations:
- type: depends
  id: RESP-003
  note: 320 CSS px 기준은 RESP-003(WCAG 1.4.10)을 따른다
examples:
  good:
  - lang: html
    code: '<style>.input-zip { width: 8ch; }</style>

      <label for="zip">우편번호</label>

      <input id="zip" class="input-zip" inputmode="numeric" maxlength="5" autocomplete="postal-code">

      '
    note: 최대 5자리 우편번호 필드의 너비를 글자 단위로 고정했다.
  bad:
  - lang: html
    code: '<style>.input-zip { width: 100%; }</style>

      <label for="zip">우편번호</label>

      <input id="zip" class="input-zip" inputmode="numeric" maxlength="5" autocomplete="postal-code">

      '
    note: 길이를 예측할 수 있는 필드를 부모 너비 100%로 늘렸다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트와 대조): 문장 일치 확인. 원문 강도 ''고정하고 ... 점검해야 한다'' →
  SHOULD + public-sector-must. 320 CSS px은 원문에 없어 WCAG 1.4.10 기준을 가져옴.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
