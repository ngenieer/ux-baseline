id: FORM-048
category: FORM
title: 대략적인 날짜는 월·범위로 입력
stage: platformed
status:
  value: confirmed
type: guide
strength: SHOULD
statement: 사용자가 특정일을 기억하거나 지정하기 어려운 날짜는 월 단위 입력이나 시작일·종료일 범위 입력으로 받는다.
measurement:
  criteria: '점검 질문: 날짜를 묻는 각 필드가 사용자가 정확한 일자를 모를 수 있는 정보(예: 여권 분실 일자, 지난 신청 일자로 목록 조회)인가? 그렇다면 ''2023년 12월'' 같은
    월 단위 입력이나 범위 입력을 받는가?'
  method: 수동 검토
automation:
  feasibility: none
  checks: []
  note: 어떤 날짜가 기억하기 어려운지는 사람이 판단.
rationale: KRDS는 기억하기 어렵거나 특정일을 지정하기 어려운 정보는 범위로 날짜를 입력하도록 구성해야 한다고 하고, 여권 분실 일자를 월 단위로 받는 예를 든다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 날짜 입력 필드 > 사용성 가이드라인(사용자가 대략적인 날짜를 입력할 수 있도록 한다) (가이드라인 PDF 2025.08 672쪽)
  note: 'https://www.krds.go.kr/html/site/component/component_09_01.html — 원문: ''범위로 날짜를 입력할 수 있도록 입력 필드를 구성해야 한다'',
    예: ''2023년 12월'''
scope:
  level: component
  targets:
  - 날짜 입력 필드
exceptions: []
relations:
- type: refines
  id: NAV-010
  note: 원문의 두 번째 예(신청 결과 목록 조회 기간을 범위 입력으로)가 NAV-010(날짜 필터 범위 입력)과 겹침
examples:
  good:
  - lang: html
    code: "<fieldset>\n  <legend>여권을 잃어버린 시기</legend>\n  <label>연 <input inputmode=\"numeric\" maxlength=\"4\"></label>\n\
      \  <label>월 <select><option>1</option><!-- … --><option>12</option></select></label>\n</fieldset>\n"
    note: 정확한 일자를 모를 수 있는 날짜를 월 단위로 받는다.
  bad:
  - lang: html
    code: '<label for="lost">여권 분실 일자</label>

      <input id="lost" type="date" required>

      '
    note: 기억하기 어려운 날짜를 특정일로만 입력하게 한다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트와 대조): 문장·예시(''2023년 12월'') 일치 확인. 원문 강도 ''구성해야
  한다'' → SHOULD + public-sector-must. 판정 대상 선정이 판단이라 guide.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
