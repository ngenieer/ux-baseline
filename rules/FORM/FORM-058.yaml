id: FORM-058
category: FORM
title: 파일 업로드는 필요할 때만
stage: platformed
status:
  value: confirmed
type: guide
strength: SHOULD
statement: 파일 첨부가 없으면 업무를 처리할 수 없을 때만 파일 업로드를 요청한다.
measurement:
  criteria: '점검 질문: 각 파일 업로드 항목마다 그 파일이 없으면 처리할 수 없는 이유를 적을 수 있는가? 적을 수 없는 항목을 빼거나 선택 항목으로 바꿨는가?'
  method: 수동 검토(업무 담당자와 항목별 필요성 확인)
automation:
  feasibility: none
  checks: []
  note: 필요성 판단은 자동화 불가.
rationale: KRDS는 파일 업로드가 파일 탐색·선택이라는 복잡한 과업을 요구하므로 첨부가 꼭 필요한지 확인해 불필요한 입력을 요청하지 않아야 한다고 한다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 파일 업로드 > 사용성 가이드라인(파일 업로드는 필요한 경우에만 사용한다) (가이드라인 PDF 2025.08 702쪽)
  note: 'https://www.krds.go.kr/html/site/component/component_09_04.html — 원문: ''불필요한 입력을 요청하지 않아야 한다'''
scope:
  level: component
  targets:
  - input[type=file]
  - 파일 업로드
exceptions: []
relations: []
examples:
  good:
  - lang: text
    code: '재직 여부를 행정정보 공동이용으로 확인할 수 없는 신청에서만 재직증명서 업로드를 받는다.

      항목 옆에 "재직 여부 확인에 필요합니다"라고 이유를 적었다.

      '
    note: 파일이 없으면 처리할 수 없는 경우에만 업로드를 요청한다.
  bad:
  - lang: text
    code: '모든 신청자에게 주민등록등본 업로드를 필수로 요구한다.

      담당 기관이 행정정보 공동이용으로 직접 확인할 수 있는 서류다.

      '
    note: 파일 없이도 처리할 수 있는데 업로드를 요청한다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트와 대조): 문장 일치 확인. 원문 강도 ''요청하지 않아야 한다'' → SHOULD
  + public-sector-must. 필요성 판단이라 guide.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
