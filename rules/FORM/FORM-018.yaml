id: FORM-018
category: FORM
title: 입력 필드 복사·붙여넣기 허용
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 개인 식별 정보 입력 필드, 텍스트 입력 필드, 텍스트 영역에서 복사와 붙여넣기를 막지 않는다.
measurement:
  criteria: input(type=text·email·tel·number·password 등)·textarea에 copy·cut·paste 이벤트를 preventDefault()로 막거나 onpaste="return
    false" 같은 속성을 두지 않는다. 다른 곳에서 복사한 텍스트를 Ctrl/Cmd+V로 붙여넣으면 값이 들어간다.
  method: 각 필드에 붙여넣기를 실제로 해 보고, DevTools Event Listeners에서 paste·copy 리스너를 확인한다.
automation:
  feasibility: full
  checks:
  - tool: eslint
    method: no-restricted-syntax로 onpaste/oncopy 속성, addEventListener('paste'|'copy') 안의 preventDefault() 패턴을 금지(커스텀
      규칙)
  - tool: custom
    method: Playwright로 클립보드 텍스트를 붙여넣어 inputValue 확인
  note: ''
rationale: 입력이 어렵거나 오래 걸리는 사용자는 다른 문서·앱에서 복사해 붙여넣어야 정확하게 입력할 수 있다.
sources:
- ref: KRDS
  locator: 기본 패턴 > 개인 식별 정보 입력 > 사용성 가이드라인(공통) (가이드라인 PDF 2025.08 759쪽)
  note: https://www.krds.go.kr/html/site/global/global_01.html — '모든 개인 식별 정보 입력 필드에는 복사와 붙여넣기를 제한하지 않아야 한다.'
- ref: KRDS
  locator: 컴포넌트 > 텍스트 입력 필드·텍스트 영역 > 사용성 가이드라인 (가이드라인 PDF 2025.08 682, 694쪽)
  note: component_09_02.html, component_09_03.html — '복사, 붙여쓰기를 제한하지 않는다. ... 제한하지 않는 것이 바람직하다.' 상세는 sources/extracts/KRDS-components.yaml
scope:
  level: component
  targets:
  - input
  - textarea
exceptions: []
relations: []
examples:
  good:
  - lang: html
    code: '<label for="acct">계좌번호</label>

      <input id="acct" inputmode="numeric">

      '
    note: 복사·붙여넣기를 막는 처리가 없다.
  bad:
  - lang: html
    code: '<label for="acct">계좌번호</label>

      <input id="acct" inputmode="numeric" onpaste="return false" oncopy="return false">

      '
    note: 붙여넣기와 복사를 막아 다른 곳의 계좌번호를 가져올 수 없다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS global_01·component_09_02·09_03 HTML curl): 개인 식별 정보 필드 ''제한하지 않아야 한다''(필수)
  → SHOULD + public-sector-must. 컴포넌트 페이지는 ''바람직하다''(권장) — 범위를 텍스트 필드 전체로 넓힌 부분은 권장 수준이지만 같은 요구라 합침. 인증 필드의 붙여넣기
  허용은 WCAG 3.3.8 근거로 FORM-008(MUST)이 정본. title을 ''개인 정보 필드 붙여넣기 허용''에서 범위에 맞게 바꿈(ID 불변).'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
