id: FORM-036
category: FORM
title: 셀렉트 사용 옵션 수
stage: platformed
status:
  value: confirmed
type: rule
strength: MAY
statement: 셀렉트는 옵션이 7개 이상 20개 이하인 단일 선택에 쓰고, 옵션이 20개를 넘으면 콤보 상자를 쓰거나 셀렉트를 여러 개로 나눈다.
measurement:
  criteria: select(multiple 없음)와 커스텀 단일 선택 listbox의 옵션 수(값이 빈 '선택하세요' 안내 옵션 제외)가 7 이상 20 이하. 6개 이하이면 다른 컨트롤 사용 근거(FORM-039
    조건 등, CF-009 ②)를 설계 문서에 기록해야 통과. 21개 이상이면 콤보 상자로 바꾸거나 여러 select로 나눠 각 select가 20개 이하여야 통과.
  method: DOM에서 select의 option 수를 센다.
automation:
  feasibility: full
  checks:
  - tool: custom
    method: select:not([multiple])의 option[value]:not([value='']) 개수가 7~20 밖이면 경고(DOM 검사)
  note: 범위 밖은 경고 수준 — MAY 룰.
rationale: 옵션이 적으면 펼쳐 보이는 라디오가 빠르고, 너무 많으면 좁은 목록에서 찾기 어렵다. KRDS는 그 사이 구간을 셀렉트에 맞는 범위로 제시한다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 셀렉트 > 용례(사용하기 적합한 경우) (가이드라인 PDF 2025.08 551쪽)
  note: https://www.krds.go.kr/html/site/component/component_06_03.html — '사용자에게 제공할 옵션 목록이 7개 이상, 20개 이하인 경우'
- ref: KRDS
  locator: 컴포넌트 > 셀렉트 > 용례(사용하기 적합하지 않은 경우) (가이드라인 PDF 2025.08 552쪽)
  note: https://www.krds.go.kr/html/site/component/component_06_03.html — '옵션의 개수가 20개를 초과하는 경우 … 콤보박스를 사용하거나, 여러
    개의 셀렉트 요소로 분할하는 방법을 고려해야 한다.'
scope:
  level: component
  targets:
  - select
  - '[role=listbox]'
exceptions:
- 옵션 목록을 표시할 영역이 부족하거나 모바일 웹이 중요한 경우 — 같은 페이지의 다른 '적합한 경우'(FORM-039)
relations:
- type: conflicts
  id: FORM-030
  note: '판단 순서를 고정한다: ① 옵션을 서로 비교해야 하거나 선택 속도가 중요하면 라디오(FORM-029) ② 옵션 목록을 펼칠 영역이 부족하거나 모바일 웹 이용 비중이 크면 네이티브 select(FORM-039)
    ③ 옵션이 7개 이상이고 사용자가 익숙한 목록이면 셀렉트(FORM-030·FORM-036), 단 옵션이 20개를 넘으면 콤보 상자를 쓰거나 셀렉트를 여러 개로 나눈다 ④ 그 밖(옵션 6개 이하,
    또는 익숙하지 않은 목록)은 라디오. 경계 7개는 셀렉트로 통일한다.'
  decision: CF-009
- type: conflicts
  id: FORM-029
  note: '판단 순서를 고정한다: ① 옵션을 서로 비교해야 하거나 선택 속도가 중요하면 라디오(FORM-029) ② 옵션 목록을 펼칠 영역이 부족하거나 모바일 웹 이용 비중이 크면 네이티브 select(FORM-039)
    ③ 옵션이 7개 이상이고 사용자가 익숙한 목록이면 셀렉트(FORM-030·FORM-036), 단 옵션이 20개를 넘으면 콤보 상자를 쓰거나 셀렉트를 여러 개로 나눈다 ④ 그 밖(옵션 6개 이하,
    또는 익숙하지 않은 목록)은 라디오. 경계 7개는 셀렉트로 통일한다.'
  decision: CF-009
examples:
  good:
  - lang: html
    code: "<label for=\"month\">월</label>\n<select id=\"month\" name=\"month\" required>\n  <option value=\"\">선택하세요</option>\n\
      \  <option>1월</option><option>2월</option>…<option>12월</option>\n</select>\n"
    note: 옵션 12개(안내 옵션 제외)로 7~20개 범위다.
  bad:
  - lang: html
    code: "<label for=\"recv\">수신 여부</label>\n<select id=\"recv\" name=\"recv\" required>\n  <option value=\"\"\
      >선택하세요</option>\n  <option>수신</option><option>수신 안 함</option>\n</select>\n"
    note: 옵션 2개를 셀렉트에 넣어 라디오라면 바로 보일 선택지를 숨겼다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS component_06_03 HTML curl): ''7개 이상, 20개 이하인 경우''가 ''사용하기 적합한 경우'' 목록에
  있음 확인 → MAY. ''선택하세요'' 안내 옵션 제외는 체계의 셈 기준. 2026-10-18 독립 검토: KRDS PDF 텍스트에서 셀렉트 ''20개를 초과 … 콤보박스 … 여러 개의 셀렉트 요소로
  분할'' 확인 → statement·측정 기준에 20개 초과 처리 추가(CF-009).'
korean_specific: false
tags:
- krds
- krds-component
