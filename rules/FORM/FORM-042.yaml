id: FORM-042
category: FORM
title: 계층 옵션은 중간 상태 체크박스
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 상위 항목이 하위 항목들을 함께 켜고 끄는 계층 구조의 선택 옵션에는 토글 스위치 대신 중간 상태를 표시하는 체크박스 목록을 쓴다.
measurement:
  criteria: 상위·하위 관계가 있는 선택 옵션 묶음에 role="switch"가 없고, 상위 항목은 체크박스이며 하위 항목 일부만 선택됐을 때 상위 체크박스가 중간 상태(input.indeterminate=true
    또는 aria-checked="mixed")다.
  method: '수동+E2E: 하위 항목 하나만 선택한 뒤 상위 체크박스의 indeterminate 속성 또는 aria-checked 값을 확인한다.'
automation:
  feasibility: none
  checks: []
  note: 기존 검사기 규칙 없음. 4단계 커스텀 E2E로 하위 일부 선택 시 상위 체크박스의 중간 상태를 판정할 수 있다.
rationale: KRDS는 선택 옵션이 계층 구조를 가지는 경우를 토글 사용에 적합하지 않은 경우로 들고, 중간 상태를 가지는 체크박스 목록을 쓰라고 한다.
sources:
- ref: KRDS
  locator: '컴포넌트 > 토글 스위치 > 용례(사용하기 적합하지 않은 경우: 선택 옵션이 계층 구조를 가지는 경우) (가이드라인 PDF 2025.08 571쪽)'
  note: 'https://www.krds.go.kr/html/site/component/component_06_07.html — 원문: ''중간 상태를 가지는 체크박스 목록을 사용한다'''
scope:
  level: component
  targets:
  - 토글 스위치
  - input[type=checkbox]
exceptions: []
relations:
- type: refines
  id: FORM-041
  note: 토글 부적합 조건 중 '계층 구조' 하나를 구체화
examples:
  good:
  - lang: html
    code: "<fieldset>\n  <legend>알림 종류</legend>\n  <label><input type=\"checkbox\" id=\"all\" aria-controls=\"a\
      \ b\"> 전체</label>\n  <ul>\n    <li><label><input type=\"checkbox\" id=\"a\" checked> 문자</label></li>\n   \
      \ <li><label><input type=\"checkbox\" id=\"b\"> 이메일</label></li>\n  </ul>\n</fieldset>\n<script>document.getElementById('all').indeterminate\
      \ = true;</script>\n"
    note: 하위 일부만 선택되면 상위 체크박스가 중간 상태가 된다.
  bad:
  - lang: html
    code: '<label><input type="checkbox" role="switch"> 전체 알림</label>

      <label><input type="checkbox" role="switch"> 문자 알림</label>

      <label><input type="checkbox" role="switch"> 이메일 알림</label>

      '
    note: 상위·하위 관계가 있는 옵션을 토글로 만들어 부분 선택 상태를 표시할 수 없다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트와 대조): 문장 일치 확인. 원문 강도 ''사용한다''(지시문) → SHOULD.'
korean_specific: false
tags:
- krds
- krds-component
