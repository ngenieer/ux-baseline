id: FORM-054
category: FORM
title: 여러 줄 입력은 텍스트 영역
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 여러 줄의 텍스트 입력이 예상되는 필드에는 텍스트 입력 필드(input) 대신 텍스트 영역(textarea)을 쓴다.
measurement:
  criteria: 입력 목적이 여러 문장 서술(사유·내용·의견·상세 설명 등)인 필드가 <textarea>이고 <input type="text">가 아니다.
  method: '수동: 폼의 텍스트 필드를 목적별로 분류해 서술형 필드의 요소 종류를 확인한다.'
automation:
  feasibility: none
  checks: []
  note: 입력 목적 판별이 필요해 자동화 불가.
rationale: KRDS 텍스트 영역·텍스트 입력 필드 페이지 모두 입력값이 여러 줄의 텍스트로 예상되면 텍스트 입력 필드가 아니라 텍스트 영역을 사용해야 한다고 한다.
sources:
- ref: KRDS
  locator: '컴포넌트 > 텍스트 영역 > 용례(사용하기 적합한 경우: 입력값이 여러 줄의 텍스트로 예상되는 경우) (가이드라인 PDF 2025.08 677쪽)'
  note: 'https://www.krds.go.kr/html/site/component/component_09_02.html — 원문: ''텍스트 영역을 사용해야 한다'''
- ref: KRDS
  locator: '컴포넌트 > 텍스트 입력 필드 > 용례(사용하기 적합하지 않은 경우: 입력값이 여러 줄의 텍스트로 예상되는 경우) (가이드라인 PDF 2025.08 687쪽)'
  note: https://www.krds.go.kr/html/site/component/component_09_03.html — 같은 문장
scope:
  level: component
  targets:
  - textarea
  - input[type=text]
exceptions: []
relations: []
examples:
  good:
  - lang: html
    code: '<label for="detail">불편 사항</label>

      <textarea id="detail" rows="6"></textarea>

      '
    note: 여러 문장 서술 필드를 textarea로 받는다.
  bad:
  - lang: html
    code: '<label for="detail">불편 사항</label>

      <input id="detail" type="text">

      '
    note: 여러 문장이 예상되는 서술을 한 줄 입력 필드로 받는다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트와 대조): 두 페이지 모두 같은 문장 확인. 원문 강도 ''사용해야 한다'' →
  SHOULD + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
