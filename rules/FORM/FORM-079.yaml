id: FORM-079
category: FORM
title: 오류 상태 title 접두
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: '제출 후 검증 오류를 표시하는 페이지는 <title> 맨 앞에 ''오류: ''를 붙인다.'
measurement:
  criteria: '검증 오류 상태(서버가 다시 표시한 페이지 또는 클라이언트가 오류 요약을 표시한 상태)에서 document.title이 ''오류: ''로 시작하고, 오류를 모두 고쳐 다시 제출한
    뒤에는 접두가 없다.'
  method: 'E2E: 오류 상태와 정상 상태에서 document.title을 확인한다.'
automation:
  feasibility: partial
  checks:
  - tool: html-validate
    rule: ux-baseline/error-title-prefix
    method: '.error-summary 나 aria-invalid="true" 가 있는 문서의 <title> 이 ''오류: '' 로 시작하는지 검사 (lint/plugins/html-ux-baseline.mjs)'
  note: 기존 검사기 규칙 없음. 4단계 커스텀 E2E로 판정 가능.
rationale: 'GOV.UK는 검증 오류가 있으면 페이지 title 앞에 ''Error: ''를 붙여 스크린 리더가 가장 먼저 읽게 하라고 한다.'
sources:
- ref: GOVUK_VALIDATION
  locator: How to tell the user about validation errors
  note: '''add ‘Error: ’ to the beginning of the page <title> so screen readers read it out as soon as possible'''
- ref: GOVUK_ERROR_SUMMARY
  locator: How it works
  note: 같은 요구를 Validation 패턴 참조로 반복
scope:
  level: situation
  targets:
  - 폼 제출 후 검증 오류 상태
exceptions: []
relations:
- type: depends
  id: NAV-002
  note: 페이지 제목 제공(WCAG 2.4.2)이 전제
- type: depends
  id: FORM-077
  note: 같은 오류 상태에서 함께 적용
examples:
  good:
  - lang: html
    code: '<title>오류: 회원 정보 수정 - 서비스명</title>

      '
    note: '검증 오류 상태 페이지 title 맨 앞에 ''오류: ''를 붙였다(CF-041).'
  bad:
  - lang: html
    code: '<!-- 검증 오류 상태인데 접두 없음 -->

      <title>회원 정보 수정 - 서비스명</title>

      '
    note: 페이지 제목만으로는 오류 상태인지 알 수 없다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 GOV.UK·W3C 페이지 HTML을 받아 본문 텍스트와 대조): ''Error: '' 접두 요구 확인. 원문은 reference_system
  권장 → SHOULD. 한국어 접두 ''오류: ''는 GOV.UK 문구를 옮긴 것으로 국내 근거 없음 — COPY 결정 필요. 원문은 서버가 페이지를 다시 그리는 경우를 전제로 하며, 클라이언트에서
  오류를 표시하는 폼까지 넓힌 것은 이 체계의 해석.'
korean_specific: false
tags:
- research-state_copy_resp
- reference-system
decisions:
- CF-041
