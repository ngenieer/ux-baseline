id: FORM-002
category: FORM
title: 입력 시 맥락 변화 금지
stage: platformed
status:
  value: confirmed
type: rule
strength: MUST
statement: 입력 필드·셀렉트·라디오 버튼·체크박스·파일 선택의 값을 바꾸거나 항목을 선택하는 것만으로 폼 제출, 페이지 이동, 새 창 열기, 모달 열기, 선택한 항목이 뜻하는 기능(삭제·정렬·저장
  등) 실행을 일으키지 않고, 이런 동작은 함께 제공한 실행 버튼을 눌렀을 때만 일으킨다. 값 입력을 마친 뒤 초점을 다음 필드로 옮기는 동작은 입력 전에 그 동작을 텍스트로 알린 경우에만 쓴다(FORM-026).
measurement:
  criteria: 각 입력 컴포넌트의 값을 바꾼 뒤(입력, 옵션 선택, 체크, 파일 선택) 실행 버튼을 누르기 전까지 (1) URL 변경·폼 submit·네트워크 제출 요청이 없고, (2) 새 창·탭·모달이
    열리지 않는다 — 사전 안내가 있어도 예외 없음(KWCAG 7.2.1, CF-053). (3) document.activeElement가 그 컴포넌트에서 바뀌면, 그 동작을 설명하는 텍스트가 컴포넌트보다
    앞(DOM 순서와 시각 순서 모두)에 있어야 통과. (4) 항목을 선택하는 것만으로 그 항목이 뜻하는 기능(삭제·정렬·저장 등)이 실행되지 않는다(KWCAG 7.2.1 '해당 항목이 의미하는 기능이
    실행되거나').
  method: 키보드와 마우스로 각 컴포넌트의 값을 바꾸며 URL·네트워크 요청·창·초점을 관찰한다(수동 또는 Playwright 스크립트).
automation:
  feasibility: none
  checks:
  - tool: custom
    method: Playwright로 각 컨트롤에 fill/selectOption/check/setInputFiles 후 navigation·request·popup·activeElement 변화를
      기록
  note: axe-core에 대응 규칙 없음. 사전 안내 텍스트가 있는지는 사람이 판단한다. 4단계 커스텀 E2E 검사 후보.
rationale: 값을 고르는 동작만으로 화면이 바뀌면 키보드·스크린 리더 사용자는 무엇이 일어났는지 알기 어렵고, 원하지 않는 제출이나 입력값 손실이 생긴다.
sources:
- ref: WCAG22
  locator: SC 3.2.2 On Input (Level A)
  note: https://www.w3.org/TR/WCAG22/#on-input
- ref: WCAG22_UNDERSTANDING
  locator: https://www.w3.org/WAI/WCAG22/Understanding/on-input.html
  note: 충분 기법 G80(제출 버튼으로 맥락 변화 시작), G13(맥락 변화 전에 미리 설명). '콘텐츠 변화가 항상 맥락 변화는 아니다.'
- ref: KWCAG22
  locator: 검사항목 7.2.1 사용자 요구에 따른 실행 — 입력에 따른 변화
  note: '공식 원문 docx 대조(2026-10-18): ''입력에 따른 변화'' — 항목 선택으로 기능 실행·서식 제출이 일어나지 않아야 하고, 실행 버튼을 활성화했을 때 비로소 실행. 사전
    안내 예외 없음.'
- ref: KRDS
  locator: 컴포넌트 > 셀렉트 > 사용성 가이드라인 (가이드라인 PDF 2025.08 555쪽)
  note: https://www.krds.go.kr/html/site/component/component_06_03.html — '셀렉트에 값을 변경하였을 때 폼이 제출되어서는 안 된다.'
- ref: KRDS
  locator: 컴포넌트 > 파일 업로드 > 사용성 가이드라인 (가이드라인 PDF 2025.08 708쪽)
  note: https://www.krds.go.kr/html/site/component/component_09_04.html — '파일을 자동으로 제출하지 않는다. 사용자가 입력폼을 제출할 때까지
    파일을 서버에 업로드하거나 저장해서는 안 된다.'
scope:
  level: component
  targets:
  - input
  - select
  - textarea
  - input[type=radio]
  - input[type=checkbox]
  - input[type=file]
  - '[role=combobox]'
  - '[role=listbox]'
exceptions:
- 값 입력을 마친 뒤 다음 필드로 초점을 옮기는 동작을 입력 전에 텍스트로 안내한 경우(CF-005, CF-053). 폼 제출·페이지 이동·새 창 열기·모달 열기·항목이 뜻하는 기능 실행에는 이 예외를
  적용하지 않는다.
- '색 반전·테두리 같은 시각 변화와, 초점을 옮기지 않고 나타나는 추가 정보(예: 입력 도움말)는 맥락 변화로 보지 않는다(KWCAG 7.2.1 해설).'
relations:
- type: conflicts
  id: FORM-026
  note: 자동 초점 이동은 입력 전에 그 동작을 텍스트로 알린 경우에만 쓴다(FORM-002 예외 조건). 쓸 때는 FORM-026의 되돌아가기 요건을 지킨다.
  decision: CF-005
- type: conflicts
  id: STATE-031
  note: 양립. 코치마크 지시문에 '행동을 마치면 다음 단계로 넘어간다'는 사실을 쓰고, 단계가 넘어갈 때 키보드 초점을 강제로 옮기지 않는다.
  decision: CF-006
examples:
  good:
  - lang: html
    code: "<form action=\"/centers\">\n  <label for=\"region\">지역</label>\n  <select id=\"region\" name=\"region\"\
      >…</select>\n  <button type=\"submit\">조회하기</button>\n</form>\n"
    note: 지역을 골라도 아무 일이 없고, 조회하기 버튼을 눌러야 제출된다.
  bad:
  - lang: html
    code: "<form action=\"/centers\">\n  <label for=\"region\">지역</label>\n  <select id=\"region\" name=\"region\"\
      \ onchange=\"this.form.submit()\">…</select>\n</form>\n"
    note: 옵션을 고르는 순간 사전 안내 없이 폼이 제출돼 페이지가 바뀐다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(WCAG22-A-AA.yaml SC 3.2.2, Understanding on-input curl, KRDS component_06_03·09_04
  HTML curl, KWCAG 비공식 HTML 판 a11ykr.github.io/kwcag22 7.2.1): statement·예외가 SC 원문과 맞음. KRDS 셀렉트·파일 업로드 문장 확인. KWCAG
  7.2.1은 사전 안내 예외 없이 ''실행 버튼으로만 실행''을 요구 — 더 엄격. 공식 PDF 미대조. 제안 파일 conflicts에 기록. 2026-10-18 KWCAG 2.2 공식 docx 대조
  — 7.2.1이 사전 안내 예외 없이 실행 버튼을 요구함을 확인, CF-053으로 statement 수정.'
