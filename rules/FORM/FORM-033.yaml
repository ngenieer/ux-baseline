id: FORM-033
category: FORM
title: 라디오 선택 안 함 옵션
stage: platformed
status:
  value: confirmed
type: rule
strength: MAY
statement: 필수가 아니고 처음에 선택된 옵션이 없는 라디오 그룹에는 '해당 없음'·'잘 모름'·'선택 안 함' 같은 응답하지 않는 옵션을 하나 둔다.
measurement:
  criteria: '판정 대상: 처음 불러온 상태에서 (가) 그룹 안 어떤 라디오에도 required 가 없고 그룹(fieldset·[role=radiogroup])에 aria-required="true"
    가 없으며 (나) checked 인 옵션이 없는 라디오 그룹. 대상 그룹마다 ''해당 없음'', ''잘 모름'', ''선택 안 함'' 또는 같은 뜻의 옵션이 1개 있다. 처음부터 옵션 하나가 선택된
    그룹(설정값·시연 조건처럼 기본값이 있는 그룹)은 대상이 아니다. 동의 목록의 동의 항목(''동의함''·''동의하지 않음'' 라디오 그룹, FORM-024)은 필수가 아니어도 대상이 아니다 —
    ''동의하지 않음''이 응답하지 않는 선택지 역할을 한다(CF-067).'
  method: 페이지를 새로 열어 처음 불러온 DOM 에서 대상 그룹을 찾고 옵션 레이블을 확인한다.
automation:
  feasibility: partial
  checks:
  - tool: custom
    method: required·aria-required·checked 가 없는 라디오 그룹의 레이블에 '해당 없음|잘 모름|선택 안 함|선택안함' 문자열이 있는지 DOM 검사
  note: 같은 뜻의 다른 문구는 수동 확인.
rationale: 라디오 버튼은 한 번 선택하면 새로 고침 전까지 선택을 되돌릴 수 없어, 답하지 않아도 되는 질문에는 답하지 않는 선택지가 필요하다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 라디오 버튼 > 사용성 가이드라인
  note: https://www.krds.go.kr/html/site/component/component_06_01.html — ''해당 없음', '잘 모름' 옵션 제공을 고려한다. ... 필수 입력
    항목이 아닌 경우와 같이 아무 값도 선택하지 않아도 되는 상황을 고려하여 '해당 없음', 잘 모름', '선택 안 함'과 같은 옵션을 제공하는 것이 좋다.'
- ref: KRDS
  locator: 기본 패턴 > 개인 식별 정보 입력 > 사용성 가이드라인(성별)
  note: https://www.krds.go.kr/html/site/global/global_01.html — ''선택 안 함' 옵션을 제공한다. ... 사용자가 응답하지 않을 옵션을 제공하는 것이
    바람직하다.'
scope:
  level: component
  targets:
  - input[type=radio]
  - '[role=radiogroup]'
exceptions:
- '동의 목록의 동의 항목(FORM-024): ''동의하지 않음'' 옵션이 ''동의함'' 선택을 되돌리는 수단이고, 응답하지 않은 동의 항목은 동의하지 않은 것과 같게 처리하므로(CF-067) ''선택
  안 함''을 따로 두지 않는다.'
relations:
- type: depends
  id: FORM-019
  note: 기본 선택이 없는 라디오 그룹에서 선택을 되돌리는 수단
- type: conflicts
  id: FORM-024
  note: 동의 항목은 FORM-033 대상이 아니다. '동의하지 않음'이 응답하지 않는 선택지 역할을 하고, 응답하지 않은 동의 항목은 '동의하지 않음'과 같게 처리한다.
  decision: CF-067
examples:
  good:
  - lang: html
    code: "<fieldset>\n  <legend>결혼 여부(선택)</legend>\n  <label><input type=\"radio\" name=\"married\" value=\"y\"\
      > 기혼</label>\n  <label><input type=\"radio\" name=\"married\" value=\"n\"> 미혼</label>\n  <label><input type=\"\
      radio\" name=\"married\" value=\"na\"> 선택 안 함</label>\n</fieldset>\n"
    note: 필수가 아닌 그룹에 '선택 안 함' 옵션을 두어 선택을 되돌릴 수 있다.
  - lang: html
    code: "<fieldset>\n  <legend>화면 글자 크기</legend>\n  <label><input type=\"radio\" name=\"fs\" value=\"m\" checked>\
      \ 보통</label>\n  <label><input type=\"radio\" name=\"fs\" value=\"l\"> 크게</label>\n</fieldset>\n"
    note: 처음부터 기본값이 선택된 설정 그룹은 대상이 아니다 — 응답하지 않은 상태가 없으므로 '선택 안 함'이 필요 없다.
  bad:
  - lang: html
    code: "<fieldset>\n  <legend>결혼 여부(선택)</legend>\n  <label><input type=\"radio\" name=\"married\" value=\"y\"\
      > 기혼</label>\n  <label><input type=\"radio\" name=\"married\" value=\"n\"> 미혼</label>\n</fieldset>\n"
    note: 한 번 고르면 응답하지 않는 상태로 돌아갈 방법이 없다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS component_06_01·global_01 HTML curl): ''고려한다'', ''제공하는 것이 좋다'', ''바람직하다''
  확인 → MAY. 개인 식별 정보 패턴의 성별 ''선택 안 함'' 문장을 같은 요구로 출처에 추가. title을 컴포넌트명에서 요구 이름으로 바꿈(ID 불변). (2026-10-18 T5 검토 반영)
  기본값이 checked 인 설정형·시연용 라디오 그룹에도 ''선택 안 함''을 요구하는지 판정이 갈렸다 → 판정 대상을 ''필수가 아니고 처음에 선택된 옵션이 없는 그룹''으로 정했다. KRDS 근거(''한
  번 선택하면 새로 고침 전까지 되돌릴 수 없다 … 아무 값도 선택하지 않아도 되는 상황'')는 처음에 선택이 없는 그룹에서만 성립한다. 검토 제안의 ''사용자 응답을 수집하는 질문형''은 DOM 으로
  판정할 수 없어 쓰지 않았다. 정확한 응답이 필요한 그룹에 기본값을 두지 않는 것은 FORM-019 가 맡는다. (2026-10-18 시험 4 검토 반영) 필수가 아니고 기본 선택이 없는 선택 동의
  항목(마케팅 수신)이 이 룰 대상인데 FORM-024 는 ''동의함''·''동의하지 않음'' 두 옵션만 요구해 판정이 갈렸다 → 동의 항목을 대상에서 뺐다(CF-067). 이 룰의 근거(''한 번
  선택하면 되돌릴 수 없음'')는 동의 항목에서 ''동의하지 않음''이 채운다. 미응답을 다른 응답 값으로 저장·표시하지 않는 요구는 기본값 금지인 FORM-019 측정 기준 (3)에 넣었다.'
