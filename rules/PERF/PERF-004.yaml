id: PERF-004
category: PERF
title: 웹폰트 preload 제한
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: unicode-range로 나눈 웹폰트 서브셋 파일을 link rel="preload"로 일괄 미리 불러오지 않고, 폰트 preload는 첫 화면 렌더링에 실제로 쓰이는 파일만 한
  형식(WOFF2)으로 지정한다.
measurement:
  criteria: (1) <link rel="preload" as="font">의 대상이 모두 같은 형식(type="font/woff2")이다. (2) preload한 각 폰트 파일이 첫 화면 렌더링에
    사용된다 — Chrome 콘솔에 'preloaded … but not used within a few seconds' 경고가 없다. (3) 한 family의 unicode-range 서브셋 파일
    전체를 preload하지 않는다.
  method: HTML 정적 검사로 (1)(3)을, Playwright로 콘솔 경고를 수집해 (2)를 확인한다.
automation:
  feasibility: none
  checks: []
  note: 기존 규칙 없음. 4단계 커스텀 HTML 검사 + 콘솔 경고 수집.
rationale: preload는 unicode-range를 무시하고 브라우저의 형식 협상을 우회하며 다른 자원의 로딩 자원을 빼앗는다. 한글은 서브셋이 수십 개라 일괄 preload하면 첫 화면에
  쓰지 않는 파일까지 받는다.
sources:
- ref: WEBDEV_FONT_BP
  locator: Font loading — Be cautious when using preload to load fonts
  note: '''preload ignores unicode-range declarations, and if used prudently, should only be used to load a single
    font format'', ''taking away browser resources from the loading of other resources'''
scope:
  level: global
  targets:
  - link[rel=preload][as=font]
exceptions: []
relations:
- type: depends
  id: PERF-002
examples:
  good:
  - lang: html
    code: <link rel="preload" href="/f/pg-0.woff2" as="font" type="font/woff2" crossorigin>
    note: 첫 화면에 쓰이는 WOFF2 파일 하나만 type을 명시해 preload한다.
  bad:
  - lang: html
    code: '<link rel="preload" href="/f/pg-0.woff2" as="font" crossorigin>

      <link rel="preload" href="/f/pg-1.woff2" as="font" crossorigin>

      <!-- … 서브셋 92개 전부 -->'
    note: 서브셋 파일 전체를 preload해 다른 리소스 로딩을 방해한다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(web.dev Best practices for fonts curl): ''Be cautious when using preload …
  preload ignores unicode-range declarations, and if used prudently, should only be used to load a single font format'',
  ''preloading the most important fonts can be very effective'' 확인. 1단계의 ''1개 파일''은 원문 수치가 아니어서(원문은 ''단일 형식'') 빼고,
  ''첫 화면에 실제 쓰이는 파일''로 조건을 바꿈. 측정 기준 (2)의 콘솔 경고 문구는 Chrome 동작 — 판정 수단일 뿐.'
korean_specific: true
tags:
- research-typo
