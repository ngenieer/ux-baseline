id: PERF-001
category: PERF
title: 웹폰트 font-display 명시
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 본문용 웹폰트의 @font-face에는 font-display를 swap·fallback·optional 중 하나로 명시하고, block을 쓰거나 font-display를 생략(auto)하지
  않는다.
measurement:
  criteria: 본문 텍스트(body·p·li 등)에 쓰이는 font-family의 모든 @font-face 규칙에 font-display 디스크립터가 있고 값이 swap, fallback, optional
    중 하나다.
  method: stylelint로 @font-face의 font-display 존재와 값을 검사하고, Lighthouse font-display 감사로 실제 로드 시 텍스트가 보이는지 확인한다.
automation:
  feasibility: partial
  checks:
  - tool: stylelint
    rule: at-rule-property-required-list
    method: '@font-face에 font-display 필수'
  - tool: stylelint
    rule: declaration-property-value-disallowed-list
    method: '@font-face 안 font-display 값 block·auto 금지(커스텀 범위 제한 필요)'
  - tool: lighthouse
    rule: font-display
    method: 감사 통과
  note: stylelint 기본 규칙은 '본문용' 여부를 모른다 — 본문 font-family 목록과 대조하는 부분은 4단계 커스텀. 아이콘 폰트 등 예외는 설정으로 제외.
rationale: 기본 동작(auto)은 브라우저마다 웹폰트가 올 때까지 텍스트를 최대 3초(Chromium·Firefox) 또는 무기한(Safari) 숨긴다. 본문이 보이지 않으면 사용자가 읽기를
  시작할 수 없다.
sources:
- ref: CSS_FONTS_4
  locator: 4.9 font-display
  note: 'block: 짧은 차단(3s 권장)+무한 교체, ''반드시 작은 텍스트에만''; swap: 100ms 이하 차단+무한 교체; fallback: 100ms 이하+짧은 교체(3s), ''본문
    텍스트에 써야 한다''; optional: 첫 그리기에 없으면 쓰지 않음'
- ref: WEBDEV_FONT_BP
  locator: Font rendering — Choose an appropriate font-display strategy
  note: 기본 차단 Chromium·Firefox 최대 3초, Safari 무기한(2022 기준). 본문엔 optional, 브랜드엔 swap 조합 제안
scope:
  level: global
  targets:
  - '@font-face'
exceptions:
- '특정 글꼴로 그려지지 않으면 페이지를 쓸 수 없는 작은 텍스트(예: 아이콘 폰트)는 block을 쓸 수 있다(CSS Fonts 4 block 설명).'
relations:
- type: depends
  id: PERF-005
  note: swap·fallback을 고르면 교체 시 레이아웃 이동을 PERF-005로 줄인다.
examples:
  good:
  - lang: css
    code: "@font-face {\n  font-family: \"Pretendard GOV\";\n  src: url(/fonts/pretendard-gov.woff2) format(\"woff2\"\
      );\n  font-display: swap;\n}"
    note: '본문 웹폰트에 font-display: swap을 명시했다.'
  bad:
  - lang: css
    code: "@font-face {\n  font-family: \"Pretendard GOV\";\n  src: url(/fonts/pretendard-gov.woff2) format(\"woff2\"\
      );\n  /* font-display 생략 → auto */\n}"
    note: font-display를 생략해 auto(차단)로 동작한다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(CSS Fonts 4 TR·web.dev Best practices for fonts curl): block ''short block
  period (3s is recommended)'', ''must only be used for small pieces of text'', swap·fallback ''100ms or less'',
  fallback ''should be used for body text'', web.dev ''Chromium and Firefox … up to 3 seconds. Safari … indefinitely'',
  ''use font-display: swap for branding … optional for fonts used in body text'' 확인. web.dev는 상황별 선택을 권장(정답 하나 없음)
  → SHOULD. 세 값 중 기본값 선택(swap vs optional)은 TYPO-010 브랜드 서체 요구와 얽혀 3단계(PERF-005의 TYPO-010 충돌). Lighthouse 감사 ID
  ''font-display''는 lighthouse 12.2.1 default-config로 확인. 브라우저 기본 차단 시간은 2022년 서술이라 현재 동작 재확인 필요(측정 기준에는 영향 없음).'
korean_specific: false
tags:
- research-typo
