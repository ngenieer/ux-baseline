id: PERF-017
category: PERF
title: 0.1초 즉각 반응
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 사용자 조작에 대한 화면 반응(선택 강조·눌림 상태·입력 문자 표시)은 조작 후 100ms 이내에 보여준다.
measurement:
  criteria: 대표 상호작용(버튼 클릭, 목록 항목 선택, 텍스트 입력)마다 입력 이벤트 시각부터 대상 요소의 시각 상태가 바뀐 첫 프레임까지가 100ms 이하이다(중급 모바일 기기 또는 CPU
    4배 감속 에뮬레이션 기준).
  method: Playwright로 CPU 감속 후 입력을 보내고 requestAnimationFrame·PerformanceEventTiming으로 다음 페인트까지 시간을 잰다.
automation:
  feasibility: none
  checks: []
  note: 기존 규칙 없음. 4단계 커스텀 Playwright 측정. 측정 기기 조건(CPU 4배 감속)은 판정 절차용 체계 선택.
rationale: 0.1초 이내면 사용자는 시스템이 즉시 반응한다고 느끼고 객체를 직접 조작한다고 느낀다. 이를 넘으면 지연을 알아챈다.
sources:
- ref: NNG_RESPONSE_TIMES
  locator: 0.1 second
  note: '''0.1 second is about the limit for having the user feel that the system is reacting instantaneously'',
    ''Limit for users feeling that they are directly manipulating objects in the UI'''
scope:
  level: global
  targets:
  - button
  - '[role=option]'
  - input
  - textarea
exceptions: []
relations:
- type: conflicts
  id: PERF-007
  note: 양립. PERF-017은 조작 직후 화면에 보이는 즉각 반응(눌림·선택 표시)의 상한, PERF-007은 실사용자 측정 지표(INP p75)의 상한이다. 측정 대상이 다르므로 둘 다 적용한다.
  decision: CF-015
examples:
  good:
  - lang: css
    code: 'button:active { background: var(--color-button-primary-fill-pressed); } /* 즉시 눌림 표시 */'
    note: :active 상태로 누르는 즉시 눌림 표시가 바뀐다.
  bad:
  - lang: js
    code: button.addEventListener('click', async () => { await fetch('/api'); button.classList.add('is-selected');
      }); // 응답 뒤에야 선택 표시
    note: 서버 응답을 기다린 뒤에야 선택 표시를 한다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(NN/g Response Times curl): ''0.1 second is about the limit for having the user
  feel that the system is reacting instantaneously'', ''0.1 second: Limit for users feeling that they are directly
  manipulating objects in the UI'' 확인. 원 연구(Miller 1968, Card 1991)는 registry verified=false로 미확인 — 수치는 검증된 NN/g
  가이드 근거라 needs_verification=false, 연구 근거로 격상하려면 원문 확인 필요. 원문도 ''about''으로 근사치. 전문가 가이드 SHOULD. 2026-10-18 확정 시
  미검증 출처 MILLER_1968·CARD_1991 제외(나머지 검증된 출처로 근거 성립).'
korean_specific: false
tags:
- research-motion_perf
