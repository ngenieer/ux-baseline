id: PERF-013
category: PERF
title: 첫 화면·LCP 이미지 지연 로딩 금지
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: loading="lazy"는 첫 화면 뷰포트 밖의 이미지·iframe에만 쓰고, 페이지 로드 시 뷰포트에 보이는 이미지와 LCP 후보 이미지에는 쓰지 않는다.
measurement:
  criteria: 프로젝트가 지원하는 각 브레이크포인트(RESP-004)의 최소 너비 테스트 뷰포트에서 (1) 로드 직후 뷰포트와 교차하는 img·iframe에 loading="lazy"가 없고,
    (2) LCP 요소가 img이면 loading="lazy"가 없다.
  method: Lighthouse lcp-lazy-loaded 감사로 (2)를, Playwright로 뷰포트 교차 img의 loading 속성을 검사해 (1)을 확인한다.
automation:
  feasibility: partial
  checks:
  - tool: lighthouse
    rule: lcp-lazy-loaded
    method: 감사 통과(LCP 이미지 lazy 아님)
  note: Lighthouse는 LCP 이미지만 판정한다. 첫 화면의 다른 이미지는 4단계 커스텀 Playwright 검사.
rationale: 지연 로딩 이미지는 브라우저가 배치를 계산한 뒤에야 요청되므로, 첫 화면 이미지에 쓰면 오히려 늦게 보이고 LCP가 나빠진다.
sources:
- ref: WEBDEV_LAZY_IMG
  locator: Always eager-load images visible in the first viewport
  note: '''Don''t lazy-load images that are likely to be in-viewport when the page loads, especially LCP images'',
    ''Use loading=lazy only for images outside the initial viewport'''
- ref: WEBDEV_OPT_LCP
  locator: loading=lazy가 LCP 이미지를 늦춤
- ref: HTML_LS
  locator: 2.5.7 Lazy loading attributes (lazy|eager, 기본 eager)
scope:
  level: global
  targets:
  - img[loading=lazy]
  - iframe[loading=lazy]
exceptions: []
relations:
- type: refines
  id: PERF-006
  note: LCP 이미지 로딩 지연 방지.
examples:
  good:
  - lang: html
    code: '<img src="hero.jpg" alt="…" width="1200" height="675" fetchpriority="high">

      <img src="below.jpg" alt="…" width="600" height="400" loading="lazy">'
    note: 첫 화면 이미지는 즉시 로드하고 아래쪽 이미지만 lazy로 둔다.
  bad:
  - lang: html
    code: <img src="hero.jpg" alt="…" width="1200" height="675" loading="lazy">
    note: 첫 화면 LCP 이미지에 loading="lazy"를 썼다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(web.dev lazy loading·Optimize LCP curl): ''Caution: Don''t lazy-load images
  that are likely to be in-viewport when the page loads, especially LCP images'', ''Use loading=lazy only for images
  outside the initial viewport'' 확인. ''첫 화면'' 판정 뷰포트를 RESP-004 브레이크포인트 최소 너비로 정한 것은 1단계 메모의 해결안(체계 선택, 높이는 프로젝트
  테스트 설정). Lighthouse lcp-lazy-loaded는 lighthouse 12.2.1로 확인.'
korean_specific: false
tags:
- research-motion_perf
