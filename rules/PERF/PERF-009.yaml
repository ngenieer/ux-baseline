id: PERF-009
category: PERF
title: 이미지·동영상 크기 예약
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: '지연 로딩 여부와 관계없이 모든 <img>와 <video>에 width·height 속성을 지정하거나 CSS aspect-ratio로 공간을 예약하고, 반응형 크기 조정은 width:
  100%(또는 max-width: 100%)와 height: auto로 한다.'
measurement:
  criteria: (1) 모든 img·video 요소에 width와 height 속성이 함께 있거나, 계산된 aspect-ratio가 auto가 아닌 값이다. (2) CSS로 너비를 바꾸는 img는
    height가 auto이다(고정 height로 비율이 깨지지 않음). (3) loading="lazy"인 img도 (1)을 만족한다.
  method: Lighthouse unsized-images 감사와 HTML 정적 검사로 (1)(3)을, 계산 스타일 검사로 (2)를 확인한다.
automation:
  feasibility: partial
  checks:
  - tool: lighthouse
    rule: unsized-images
    method: 감사 통과(명시적 width·height 없는 이미지 0건)
  note: Lighthouse는 img 크기 누락만 판정한다. video와 CSS aspect-ratio 대체는 4단계 HTML 린트 커스텀(html-validate 규칙 작성).
rationale: 크기를 모르는 이미지는 로드되는 순간 공간을 차지하며 아래 콘텐츠를 밀어낸다. 지연 로딩 이미지는 크기가 없으면 0×0으로 계산돼 갤러리 이미지가 모두 즉시 로드될 수 있다.
sources:
- ref: WEBDEV_OPT_CLS
  locator: Images without dimensions
  note: '''Always include width and height size attributes on your images and video elements. Alternatively, reserve
    the required space with CSS aspect-ratio'', ''width: 100%; /* or max-width: 100%; */ height: auto;'''
- ref: WEBDEV_LAZY_IMG
  locator: width/height 권고, 0×0 갤러리 문제
  note: '''we recommend adding width and height attributes to all <img> tags'', ''Without width and height specified,
    image dimensions default to 0×0 pixels'' — PERF-015에서 병합'
scope:
  level: global
  targets:
  - img
  - video
  - img[loading=lazy]
exceptions:
- <picture>의 <source>마다 가로세로비가 다르면 각 <source>에 width·height를 지정한다(1단계 메모, web.dev 원문 확인 안 함 — 확인 필요).
relations:
- type: refines
  id: PERF-008
  note: 이미지 로드로 생기는 CLS 방지.
examples:
  good:
  - lang: html
    code: <img src="hero.jpg" alt="민원실 안내" width="1200" height="675">
    note: width·height 속성으로 이미지 공간을 예약한다.
  - lang: css
    code: 'img { max-width: 100%; height: auto; }'
    note: '반응형 조정은 max-width: 100%와 height: auto로 한다.'
  bad:
  - lang: html
    code: '<img src="hero.jpg" alt="민원실 안내" style="height: 400px; width: 100%;">

      <img src="g1.jpg" alt="" loading="lazy">'
    note: 고정 height로 비율이 깨지고, 지연 로딩 이미지에 크기 속성이 없다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(web.dev Optimize CLS·lazy loading curl): ''Always include width and height
  size attributes on your images and video elements. Alternatively, reserve the required space with CSS aspect-ratio'',
  ''width: 100%; /* or max-width: 100%; */ height: auto;'', lazy 문서 ''adding width and height attributes to all
  <img> tags'', ''0×0 pixels'' 확인. PERF-015(지연 로딩 이미지 크기 지정)는 이 룰의 하위 사례라 병합(같은 guide 강도 → 번호 작은 PERF-009가 정본, statement와
  측정 기준 (3)에 반영). Lighthouse unsized-images 감사 ID는 lighthouse 12.2.1로 확인. 예외 칸의 <picture> 비율 문장은 1단계 메모로 이번에 원문을
  확인하지 않음.'
korean_specific: false
tags:
- research-motion_perf
