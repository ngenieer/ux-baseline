id: SHAPE-005
category: SHAPE
title: 딤드는 한 겹만
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 배경 딤드는 모달·바텀시트·알림 팝업처럼 주의를 집중시켜야 하는 레이어에만 쓰고, 한 번에 한 겹만 표시하며, 딤드 위에서도 닫기 버튼 같은 조작 영역이 분명히 보이게 한다.
measurement:
  criteria: (1) 딤드 오버레이(::backdrop 또는 전체 화면 반투명 레이어)는 모달형 레이어(dialog.showModal(), [role=dialog][aria-modal=true],
    바텀시트, 알림 팝업)가 열려 있을 때만 존재한다. (2) 동시에 표시되는 딤드 레이어 수 ≤ 1. (3) 딤드 위 레이어의 닫기·액션 버튼이 딤드보다 위(z-order)에 있고 COLOR-003의
    비텍스트 대비 3:1을 충족한다.
  method: 모달 위에서 다른 모달·바텀시트를 여는 흐름을 포함해 딤드 레이어 수를 확인한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 커스텀 검사: 열린 dialog[open]:modal·.dim 요소 수 카운트.'
rationale: 딤드는 강한 집중 효과라 남용하면 피로를 주고, 겹치면 시각적 혼란이 생긴다.
sources:
- ref: KRDS
  locator: 디자인 스타일 > 엘리베이션 > 딤드 효과 (가이드라인 PDF 2025.08 189쪽)
  note: https://www.krds.go.kr/html/site/style/style_08.html
- ref: KRDS
  locator: 컴포넌트 (여러 페이지)
  note: '같은 요구를 다루는 KRDS 컴포넌트: 바텀시트 — 상세는 sources/extracts/KRDS-components.yaml'
scope:
  level: component
  targets:
  - ::backdrop
  - dialog
  - 바텀시트
  - 딤드
exceptions: []
relations:
- type: conflicts
  id: STATE-034
  note: 바텀시트를 겹쳐 띄우더라도 배경 딤드는 맨 위 시트 아래 한 겹만 표시한다.
  decision: CF-017
- type: depends
  id: COLOR-003
examples:
  good:
  - lang: css
    code: 'dialog::backdrop { background: var(--color-background-dim); }

      dialog.stacked::backdrop { background: transparent; } /* 다른 모달 위에 여는 대화상자는 딤드를 더하지 않음 */

      '
    note: 모달이 겹쳐도 딤드는 한 겹만 보인다.
  bad:
  - lang: css
    code: 'dialog::backdrop { background: var(--color-background-dim); } /* 모달 위에 확인 대화상자를 열면 딤드가 두 겹 */

      '
    note: 중첩 모달마다 딤드를 그려 두 겹이 된다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트를 직접 확인): style_08 딤드 효과 ''과도한 사용을 피한다: … 주의가
  필요한 요소에만 제한적으로 사용한다.'', ''중첩된 딤드 효과 지양: 여러 겹의 딤드 효과를 사용하면 시각적 혼란을 초래할 수 있으므로 단일 효과로 제한한다.'', ''조작 가능한 영역 고려: 딤드
  상태에서도 닫기 버튼 등 상호작용이 필요한 영역은 시각적으로 명확하게 표시'' 확인. 1단계 병합 출처 바텀시트(component_12_03) ''다중으로 바텀 시트를 사용하지 않아야 한다.'' 재조회
  확인. 지시형 ''제한한다'' → SHOULD. ''분명히 보이게''는 COLOR-003(3:1)으로 판정.'
korean_specific: false
tags:
- krds
