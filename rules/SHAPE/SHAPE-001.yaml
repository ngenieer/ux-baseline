id: SHAPE-001
category: SHAPE
title: 반경은 단계 토큰에서
stage: platformed
status:
  value: confirmed
type: rule
strength: MUST
statement: 모서리 반경은 디자인 토큰의 단계 값에서만 고르고, 같은 크기 단계에 속하거나 함께 배치되는 비슷한 크기의 컴포넌트에는 같은 반경 토큰을 쓴다.
measurement:
  criteria: '(1) CSS의 border-radius* 값이 var(--radius-*) 토큰, 0, 또는 완전한 원형용 토큰(radius-max) 중 하나다. (2) 같은 단계 컴포넌트는
    같은 토큰을 쓴다 — KRDS 표준형: Small(칩·체크박스·라디오·스위치·태그), Medium(버튼·텍스트 입력·텍스트 영역·셀렉트·캐러셀 숫자·단계 표시기·페이지네이션), Large(카드·대화상자),
    Xlarge(배너·대화상자·바텀시트).'
  method: stylelint로 값 형식을 검사하고, 컴포넌트별 반경 토큰 매핑표를 대조한다.
automation:
  feasibility: partial
  checks:
  - tool: stylelint
    rule: scale-unlimited/declaration-strict-value
    method: border-radius 계열에 var(--radius-*)·0만 허용
  note: 단계-컴포넌트 매핑 준수는 4단계 컴포넌트 규격 대조(수동/커스텀).
rationale: 반경이 제각각이면 함께 놓인 컴포넌트가 어긋나 보이고 시스템 일관성이 깨진다.
sources:
- ref: KRDS
  locator: 디자인 스타일 > 형태 > 표준형 스타일 (가이드라인 PDF 2025.08 129~130·135쪽)
  note: https://www.krds.go.kr/html/site/style/style_04.html
scope:
  level: global
  targets:
  - border-radius
exceptions:
- 외부 라이브러리·KRDS 키트 원본 CSS(CF-049)
relations:
- type: refines
  id: SHAPE-002
  note: SHAPE-002는 KRDS 표준형 반경 계산 공식.
- type: refines
  id: SHAPE-003
  note: SHAPE-003은 % 반경 사용 범위.
examples:
  good:
  - lang: css
    code: '.btn, .input, .select { border-radius: var(--radius-medium1); } /* 같은 Medium 단계 = 같은 토큰 */

      '
    note: 함께 배치되는 Medium 단계 컴포넌트가 같은 반경 토큰을 쓴다.
  bad:
  - lang: css
    code: '.btn { border-radius: 7px; } .input { border-radius: 3px; } /* 나란히 놓이는데 반경이 다르고 토큰도 아님 */

      '
    note: 토큰 밖 값을 쓰고 같은 단계 컴포넌트의 반경이 다르다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트를 직접 확인): 디자인 스타일 > 형태(style_04) ''각 레벨은 함께 사용할
  빈도가 높은 컴포넌트의 묶음으로 같은 형태의 래디어스(radius) 적용이 필요하다.'', ''함께 사용이 되는 비슷한 크기의 구성 요소는 래디어스 값을 동일하게 적용하는 것이 좋다.'', 표준형
  표(Level·Apply components) 확인. ''필요하다'' → SHOULD. statement에는 수치가 없음. 출처 내부 불일치(BACKLOG): 페이지 표 Medium(40~64px)
  6px vs 토큰 radius-medium3·4 = number-5 = 8px(krds_tokens.css). 같은 페이지 계산 공식(SHAPE-002)을 적용하면 56px→8px, 64px→8px라
  토큰이 공식과 맞고 표가 다름 — 원인 추정을 notes에 기록. 2026-10-18 독립 검토: COLOR-022·TYPO-032와 같은 적용 범위 예외(외부 라이브러리·KRDS 키트 원본 CSS,
  CF-049) 추가(CF-024).'
korean_specific: false
tags:
- krds
- design-token
decisions:
- CF-024
