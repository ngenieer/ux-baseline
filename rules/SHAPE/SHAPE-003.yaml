id: SHAPE-003
category: SHAPE
title: '% 반경 제한'
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: '% 단위 반경은 프로필 사진·원형 아이콘 버튼처럼 완전한 원형이 필요한 정사각형 요소에만 쓰고, 그 밖의 컴포넌트에는 px 기반 반경 토큰을 쓴다.'
measurement:
  criteria: border-radius에 % 값이 쓰인 요소는 모두 너비 = 높이이고 값이 50%다. 그 밖의 요소의 border-radius는 길이 단위 토큰 값이다.
  method: stylelint로 % 반경 선언을 찾고, 해당 요소의 렌더링 크기를 확인한다.
automation:
  feasibility: partial
  checks:
  - tool: stylelint
    rule: ux-baseline/radius-percent-allowlist
    method: '% 반경은 허용 클래스(기본 .avatar·.icon-button--circle)의 50% 만 (lint/plugins/ux-baseline.mjs)'
  note: 정사각형 여부는 렌더링 검사(커스텀). 선택자 범위 규칙은 체계 기본 클래스 이름을 기준으로 하며, 프로젝트 클래스 이름이 다르면 classNames 옵션으로 바꾼다.
rationale: '% 반경은 컴포넌트 크기 비율마다 모양이 달라져 일관성을 잃고, 작은 컴포넌트에 50%를 주면 의도보다 둥글어진다.'
sources:
- ref: KRDS
  locator: 디자인 스타일 > 형태 > 표현 방법 (가이드라인 PDF 2025.08 134·138쪽)
  note: https://www.krds.go.kr/html/site/style/style_04.html
scope:
  level: global
  targets:
  - border-radius
exceptions: []
relations: []
examples:
  good:
  - lang: css
    code: '.avatar { inline-size: 40px; block-size: 40px; border-radius: 50%; } /* 정사각형 → 완전한 원 */

      .btn { border-radius: var(--radius-medium1); }

      '
    note: '% 반경은 정사각형 원형 요소에만 쓴다.'
  bad:
  - lang: css
    code: '.tag { border-radius: 50%; } /* 가로로 긴 태그가 타원이 됨 */

      '
    note: 정사각형이 아닌 컴포넌트에 % 반경을 썼다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트를 직접 확인): style_04 표현 방법 ''px 값 사용: 버튼이나 입력 필드
  같은 요소는 … px 단위로 설정한다.'', ''% 값 사용: 프로필 사진처럼 완전한 원형이 필요한 경우 % 값을 사용'', 주의 사항 ''작은 컴포넌트에 50%를 적용하면 지나치게 둥글어져 …'',
  사용 가이드 ''% 사용 … 피해야 할 사례'' 확인. 지시형 ''설정한다'' → SHOULD. 참고: KRDS 표 Xsmall 주석은 ''온전한 원형의 형태를 사용하는 경우 radius-max token을
  사용한다''(radius-max = 100rem) — 원형에 % 대신 큰 고정 토큰을 쓰는 방식도 허용되므로 criteria (1)에서 % 사용 시 조건만 둠.'
korean_specific: false
tags:
- krds
- design-token
