id: LAYOUT-011
category: LAYOUT
title: 헤더
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 정부 로고(서비스 아이덴티티)를 헤더의 왼쪽 위에 둔다.
measurement:
  criteria: 헤더 안에서 공식 배너·건너뛰기 링크를 뺀 요소 중 정부 로고의 경계 상자가 가장 왼쪽(left 최소)이며 첫 행에 있다. DOM 순서도 건너뛰기 링크 → (공식 배너) → 서비스
    아이덴티티.
  method: 360·1280px에서 헤더 레이아웃과 DOM 순서를 확인한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 커스텀 검사: 헤더 직계 요소들의 bounding box 비교.'
rationale: 정부 로고 위치를 모든 서비스에서 같게 해 정부와의 연결과 일관된 경험을 준다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 헤더 > 사용성 가이드라인 (가이드라인 PDF 2025.08 235·236쪽)
  note: https://www.krds.go.kr/html/site/component/component_02_03.html
scope:
  level: component
  targets:
  - header
  - 서비스 아이덴티티
exceptions: []
relations: []
examples:
  good:
  - lang: html
    code: "<header>\n  <div class=\"header-top\">\n    <a href=\"/\" class=\"identity\"><img src=\"/img/gov-symbol.svg\"\
      \ alt=\"대한민국정부 민원24시 홈\"></a>\n    <ul class=\"utility-links\"><li><a href=\"/login\">로그인</a></li></ul>\n\
      \  </div>\n  <nav class=\"main-menu\" aria-label=\"메인 메뉴\">…</nav>\n</header>\n"
    note: 정부 로고가 헤더 첫 행 가장 왼쪽에 있고 DOM에서도 먼저 온다.
  bad:
  - lang: html
    code: "<header>\n  <div class=\"header-top\">\n    <ul class=\"utility-links\"><li><a href=\"/login\">로그인</a></li></ul>\n\
      \    <a href=\"/\" class=\"identity\"><img src=\"/img/gov-symbol.svg\" alt=\"대한민국정부 민원24시 홈\"></a>\n  </div>\n\
      </header>\n<!-- .header-top { display: flex; justify-content: space-between; } — 로고가 오른쪽 위로 감 -->\n"
    note: 정부 로고가 유틸리티 링크 뒤, 헤더 오른쪽에 놓인다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트를 직접 확인): 헤더(component_02_03) ''정부 로고는 항상 헤더의
  왼쪽 상단에 제공한다.''와 ''건너뛰기 링크가 항상 가장 먼저 … 그 다음으로 서비스 아이덴티티, 유틸리티 그룹/드롭다운 메뉴, 검색 버튼, 메인 메뉴 순'' 확인. 1단계 ''정부(기관) 로고''를
  원문 ''정부 로고''로 고침. 지시형 → SHOULD.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector
