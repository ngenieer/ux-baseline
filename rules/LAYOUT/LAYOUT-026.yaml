id: LAYOUT-026
category: LAYOUT
title: 구조화 목록
stage: platformed
status:
  value: confirmed
type: guide
strength: SHOULD
statement: 구조화 목록에서는 목록 정보의 성격과 사용자 방문 목적에 비춰 가장 중요한 행동 하나를 최상위 강조 버튼(CTA)으로 표현한다.
measurement:
  criteria: '점검 질문: 이 목록에서 사용자가 가장 많이 하려는 행동이 무엇인가? 그 행동이 항목의 최상위 강조 버튼인가? 최상위 강조 버튼이 항목마다 하나인가?'
automation:
  feasibility: none
  checks: []
  note: 가장 중요한 행동 판단이 필요한 가이드.
rationale: 가장 중요한 행동을 강조 버튼으로 드러내야 사용자가 목록에서 바로 목적을 달성한다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 구조화 목록 > 사용성 가이드라인 (가이드라인 PDF 2025.08 356쪽)
  note: https://www.krds.go.kr/html/site/component/component_04_01.html
scope:
  level: component
  targets:
  - 구조화 목록
exceptions: []
relations:
- type: conflicts
  id: COLOR-015
  note: 항목마다 1개인 CTA 는 COLOR-015 의 '한 화면 상태에 주조색 채움 버튼 1개' 계산에서 뺀다. 강조 단계 정의는 COLOR-015 를 따른다.
  decision: CF-070
examples:
  good:
  - lang: text
    code: '보조금 목록 항목마다 ''신청하기''만 채움 버튼으로 두고, ''관심 등록''은 텍스트 버튼으로 둔다.

      '
    note: 가장 중요한 행동 하나만 최상위 강조 버튼이다.
  bad:
  - lang: text
    code: '항목마다 ''신청하기''·''관심 등록''·''공유'' 세 버튼을 모두 채움 버튼으로 둔다.

      '
    note: 최상위 강조 버튼이 항목마다 여러 개라 핵심 행동이 드러나지 않는다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트를 직접 확인): 구조화 목록(component_04_01) ''구조화 목록에서
  전달하고자 하는 정보의 특성 및 사용자의 방문 목적을 고려하여 가장 중요한 행동을 콜투액션 버튼(최상위 수준의 강조 버튼)으로 표현해야 한다.'' 확인. ''가장 중요한 행동'' 판단이 필요해 guide·SHOULD.
  (2026-10-18 시험 4 검토 반영) COLOR-015 에 ''주조색 채움 버튼은 한 화면 상태에 1개'' 측정 기준을 넣으면서 항목마다 CTA 를 두는 이 룰과 부딪혀 CF-070 으로 정했다(항목별
  CTA 는 세지 않음).'
korean_specific: false
tags:
- krds
- krds-component
