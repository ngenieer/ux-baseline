id: LAYOUT-050
category: LAYOUT
title: 토글 스위치
stage: platformed
status:
  value: confirmed
type: rule
strength: MAY
statement: 넓은 컨테이너 안의 토글 스위치는 레이블을 스위치 바로 옆에 붙여 두고, 레이블과 스위치를 컨테이너 양 끝으로 떼어 놓지 않는다.
measurement:
  criteria: '토글 레이블과 스위치 사이에 다른 요소가 없고, 둘 사이 간격이 컨테이너 너비에 따라 늘어나지 않는다(justify-content: space-between, margin-inline-start:
    auto 등으로 양 끝 배치하지 않음).'
  method: 넓은 화면(1280px)과 좁은 화면(360px)에서 레이블-스위치 간격이 같은지 확인한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 커스텀 검사: 두 너비에서 레이블-스위치 간격 비교.'
rationale: 레이블과 스위치가 멀리 떨어지면 두 요소의 관계를 파악하기 어렵다(저시력 확대 사용자는 둘을 동시에 보지 못함).
sources:
- ref: KRDS
  locator: 컴포넌트 > 토글 스위치 > 사용성 가이드라인 (가이드라인 PDF 2025.08 573·576쪽)
  note: https://www.krds.go.kr/html/site/component/component_06_07.html
scope:
  level: component
  targets:
  - 토글 스위치
  - '[role=switch]'
exceptions:
- '행 전체를 클릭 영역으로 만든 목록형 설정 화면: 레이블 왼쪽 끝, 스위치 오른쪽 끝 배치 허용(CF-013).'
relations:
- type: conflicts
  id: LAYOUT-051
  note: 행 전체를 클릭 영역으로 만든 목록형 설정 화면에서는 레이블을 왼쪽 끝, 스위치를 오른쪽 끝에 둘 수 있다. 그 밖에는 LAYOUT-050을 따른다.
  decision: CF-013
examples:
  good:
  - lang: css
    code: '.toggle { display: inline-flex; align-items: center; gap: var(--space-gap-3); } /* 레이블 바로 옆에 스위치 */

      '
    note: 레이블과 스위치 간격이 컨테이너 너비와 관계없이 고정된다.
  bad:
  - lang: css
    code: '.toggle { display: flex; justify-content: space-between; inline-size: 100%; } /* 1280px에서 레이블과 스위치가 1000px
      넘게 떨어짐 */

      '
    note: 레이블과 스위치를 컨테이너 양 끝으로 떼어 놓았다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트를 직접 확인): 토글 스위치(component_06_07) ''레이블과 스위치
  사이의 거리에 유의한다.'', ''레이블과 스위치가 지나치게 멀리 배치되어 있으면 … 관계를 파악하기 어려울 수 있다. 넓은 컨테이너 내부에 스위치를 사용해야 하는 경우, 레이블을 스위치 오른쪽과
  같이 보다 인접한 영역에 배치하는 것이 바람직하다.'' 확인. ''바람직하다'' → MAY. 원문의 ''지나치게 멀리''는 수치가 없어 ''컨테이너 너비에 따라 늘어나지 않음''으로 판정.'
korean_specific: false
tags:
- krds
- krds-component
