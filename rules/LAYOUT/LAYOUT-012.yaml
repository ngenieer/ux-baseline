id: LAYOUT-012
category: LAYOUT
title: 헤더
stage: platformed
status:
  value: confirmed
type: guide
strength: SHOULD
statement: 헤더에는 건너뛰기 링크·공식 배너·서비스 아이덴티티·유틸리티 링크·검색·메인 메뉴 같은 필수 항목만 두고 꾸밈 요소와 부가 정보를 넣지 않는다.
measurement:
  criteria: '점검 질문: 헤더의 각 요소가 KRDS 헤더 구조(건너뛰기 링크, 공식 배너, 서비스 아이덴티티, 유틸리티 링크 그룹, 드롭다운 메뉴, 아이콘 링크·버튼과 레이블, 메인 메뉴)에
    속하는가? 속하지 않는 요소는 모든 화면에 반복될 필요가 있는가?'
automation:
  feasibility: none
  checks: []
  note: 필수 여부 판단이 필요한 가이드.
rationale: 헤더는 모든 화면에 반복되므로 불필요한 꾸밈·정보가 있으면 모든 화면에서 이용이 어려워진다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 헤더 > 사용성 가이드라인 (가이드라인 PDF 2025.08 235·236쪽)
  note: https://www.krds.go.kr/html/site/component/component_02_03.html
scope:
  level: component
  targets:
  - header
exceptions: []
relations: []
examples:
  good:
  - lang: text
    code: '헤더: 건너뛰기 링크 / 공식 배너 / 정부 로고 / 유틸리티 링크(로그인·회원가입) / 검색 / 메인 메뉴만 둔다.

      '
    note: KRDS 헤더 구조에 속하는 필수 항목만 모든 화면에 반복한다.
  bad:
  - lang: text
    code: '헤더에 행사 홍보 슬라이드와 오늘의 날씨 위젯을 넣어 모든 페이지에 반복 노출한다.

      '
    note: 모든 화면에 반복할 필요가 없는 꾸밈·부가 정보가 헤더에 들어갔다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트를 직접 확인): 헤더(component_02_03) ''핵심적인 정보만 간결하게
  제공한다.'', ''헤더에 포함되는 요소 중 필수적인 항목을 간결하게 배치해야 한다. 헤더에 불필요한 꾸밈이나 과다한 정보가 배치되면…'' 확인. 필수 여부 판정이 불가해 guide·SHOULD.
  필수 항목 목록은 같은 페이지 ''구조'' 절의 7개 구성 요소에서 가져옴.'
korean_specific: false
tags:
- krds
