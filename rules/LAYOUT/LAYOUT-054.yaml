id: LAYOUT-054
category: LAYOUT
title: 텍스트 입력 필드
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 텍스트 입력 필드의 기본 너비는 그리드·화면 크기에 따라 유동적으로 두고 입력 필드가 속한 섹션 너비 전체를 차지하게 한다.
measurement:
  criteria: '길이를 예측할 수 없는 텍스트 입력 필드(input[type=text|email|search|url], textarea)의 렌더링 너비가 속한 폼 섹션(필드 그룹 컨테이너)의 콘텐츠
    너비와 같다(width: 100% 또는 inline-size: 100%).'
  method: 360·768·1280px에서 입력 필드와 섹션 컨테이너의 너비를 비교한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 커스텀 검사: 길이 예측형 예외(FORM-056)를 data 속성으로 표시하고 나머지 입력의 너비 비교.'
rationale: 입력값을 잘림 없이 보고 수정할 수 있어야 한다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 텍스트 입력 필드 > 사용성 가이드라인 (가이드라인 PDF 2025.08 690쪽)
  note: https://www.krds.go.kr/html/site/component/component_09_03.html
scope:
  level: component
  targets:
  - input[type=text]
  - input[type=email]
  - textarea
  - 텍스트 입력 필드
exceptions:
- 이름·우편번호·전화번호처럼 입력값 길이를 예측할 수 있으면 최대 길이에 맞춰 너비를 고정한다(KRDS 원문, FORM-056).
relations:
- type: refines
  id: FORM-056
  note: FORM-056은 길이 예측 가능한 입력의 고정 너비 예외.
examples:
  good:
  - lang: css
    code: '.form-field input[type=email] { inline-size: 100%; } /* 속한 폼 섹션 너비 전체 */

      '
    note: 길이를 예측할 수 없는 입력 필드가 섹션 너비를 채운다.
  bad:
  - lang: css
    code: '.form-field input[type=email] { inline-size: 200px; } /* 길이를 예측할 수 없는 이메일 입력을 좁게 고정 */

      '
    note: 길이를 예측할 수 없는 필드의 너비를 고정했다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트를 직접 확인): 텍스트 입력 필드(component_09_03) ''기본적으로
  텍스트 입력 필드의 크기를 그리드, 화면 크기에 따라 유동적이나 전체 섹션 영역을 차지하도록 구현한다. 그러나 이름, 우편번호, 전화번호 등 입력값의 길이를 예측할 수 있는 경우 최대 길이에 맞추어
  입력 필드의 너비를 고정'' 확인. 원문 항목 제목의 ''적절한 크기''는 이 기본값·예외로 구체화됨. 지시형 → SHOULD.'
korean_specific: false
tags:
- krds
- krds-component
