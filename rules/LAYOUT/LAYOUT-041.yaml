id: LAYOUT-041
category: LAYOUT
title: 탭
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 탭과 탭 패널을 인접하게 배치해 패널이 선택된 탭의 내용임을 시각적으로 드러낸다.
measurement:
  criteria: '[role=tablist]와 그 [role=tabpanel] 사이에 다른 콘텐츠 요소가 없다(DOM·화면 모두). 수평 탭은 패널이 탭 목록 바로 아래, 수직 탭은 바로 옆에 붙어
    있다.'
  method: 탭 컴포넌트의 DOM과 렌더링을 확인한다.
automation:
  feasibility: partial
  checks:
  - tool: custom
    method: tablist의 다음 형제가 tabpanel인지 DOM 검사
  note: 시각적 인접(간격)은 수동.
rationale: 탭과 패널이 떨어져 있으면 어떤 탭의 내용인지 알기 어렵다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 탭 > 사용성 가이드라인 (가이드라인 PDF 2025.08 449쪽)
  note: https://www.krds.go.kr/html/site/component/component_04_10.html
scope:
  level: component
  targets:
  - '[role=tablist]'
  - '[role=tabpanel]'
exceptions: []
relations: []
examples:
  good:
  - lang: html
    code: '<div role="tablist" aria-label="신청 현황"><button role="tab" id="t1" aria-selected="true" aria-controls="p1">진행
      중</button><button role="tab" id="t2" aria-selected="false" aria-controls="p2">완료</button></div>

      <div role="tabpanel" id="p1" aria-labelledby="t1">…</div>

      '
    note: 탭 목록 바로 아래에 패널이 붙어 있다.
  bad:
  - lang: html
    code: '<div role="tablist" aria-label="신청 현황"><button role="tab" id="t1" aria-selected="true" aria-controls="p1">진행
      중</button><button role="tab" id="t2" aria-selected="false" aria-controls="p2">완료</button></div>

      <p class="notice">신청 내역은 3년간 보관됩니다.</p>

      <div role="tabpanel" id="p1" aria-labelledby="t1">…</div>

      '
    note: 탭 목록과 패널 사이에 다른 콘텐츠가 있다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트를 직접 확인): 탭(component_04_10) ''탭과 탭 패널을 인접한 영역에
  배치하여 탭 패널이 선택된 탭에 관련된 콘텐츠임을 인지할 수 있도록 해야 한다. 탭과 탭 패널의 배경색을 동일하게 지정하면 … 강조할 수 있다.'' 확인. ''해야 한다'' → SHOULD + public-sector-must.
  같은 배경색은 선택(할 수 있다).'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
