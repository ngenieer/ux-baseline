id: LAYOUT-014
category: LAYOUT
title: 푸터
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 푸터를 모든 페이지의 본문 아래 마지막 요소로 두고, 본문 높이가 뷰포트보다 짧으면 푸터 아래끝을 뷰포트 아래끝에 맞춘다.
measurement:
  criteria: (1) footer(contentinfo)가 body의 마지막 시각 요소다. (2) 본문이 짧은 페이지에서 footer.getBoundingClientRect().bottom이 window.innerHeight와
    같다(푸터 아래 빈 공간 0px).
  method: 본문이 짧은 페이지(오류·빈 결과 페이지)를 768·1280px 너비, 높이 1000px 이상 창에서 열어 푸터 아래 빈 공간이 없는지 확인한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 커스텀 검사: 짧은 페이지 픽스처에서 footer bottom == innerHeight 확인.'
rationale: 푸터가 일관된 위치에 있어야 길을 잃은 사용자가 보조 탐색 수단을 찾을 수 있다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 푸터 > 사용성 가이드라인 (가이드라인 PDF 2025.08 247·248쪽)
  note: https://www.krds.go.kr/html/site/component/component_02_04.html
scope:
  level: component
  targets:
  - footer
  - body
exceptions: []
relations: []
examples:
  good:
  - lang: css
    code: 'body { min-block-size: 100dvh; display: flex; flex-direction: column; margin: 0; }

      main { flex: 1 0 auto; } /* 본문이 짧아도 푸터 아래끝이 뷰포트 아래끝에 붙음 */

      '
    note: 푸터가 마지막 요소이고 짧은 페이지에서도 화면 아래끝에 맞는다.
  bad:
  - lang: css
    code: 'body { margin: 0; } /* 최소 높이 없음 — 본문이 짧은 페이지에서 푸터 아래에 빈 공간이 생김 */

      '
    note: 짧은 페이지에서 푸터가 화면 중간에 떠 아래가 비어 보인다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트를 직접 확인): 푸터(component_02_04) ''모든 페이지에 푸터를 일관된
  위치에 제공해야 한다.'', ''푸터는 페이지의 마지막 요소이므로 본문 하단에 배치해야 한다. 본문의 높이가 뷰포트 높이보다 짧은 경우 푸터가 뷰포트 하단에 고정되어 있는지 확인한다.'' 확인. 1단계
  statement(''확인한다'')를 요구 문장으로 바꿈. ''해야 한다'' → SHOULD + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
