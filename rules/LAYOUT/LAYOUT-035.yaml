id: LAYOUT-035
category: LAYOUT
title: 모달
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 모달 본문에 세로 스크롤이 생기면 스크롤바와 본문 하단 흐림 효과로 스크롤 단서를 주고, 액션 버튼이 있는 푸터는 스크롤 위치와 관계없이 항상 보이게 한다.
measurement:
  criteria: '모달 본문 scrollHeight > clientHeight일 때: (1) 본문의 overflow-y가 auto 또는 scroll이고 scrollbar-width: none·::-webkit-scrollbar
    { display:none }로 스크롤바를 숨기지 않는다. (2) 본문 하단에 그라데이션(흐림) 오버레이가 있다. (3) 본문을 처음·끝으로 스크롤해도 푸터 경계 상자가 뷰포트와 모달 안에 보인다.'
  method: 360px 너비·짧은 높이 창에서 긴 내용 모달을 열어 스크롤하며 확인한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 커스텀 검사: 모달 본문 overflow 계산값과 푸터 가시성 확인.'
rationale: 스크롤 단서가 없으면 아래 내용을 놓치고, 액션 버튼이 스크롤 끝에 숨으면 모달을 끝내는 방법을 찾지 못한다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 모달 > 사용성 가이드라인 (가이드라인 PDF 2025.08 391·393쪽)
  note: https://www.krds.go.kr/html/site/component/component_04_05.html
scope:
  level: component
  targets:
  - dialog
  - '[role=dialog]'
  - 모달
exceptions: []
relations: []
examples:
  good:
  - lang: css
    code: "dialog { display: flex; flex-direction: column; max-block-size: 90dvh; }\n.modal-body { overflow-y: auto;\
      \ } /* 스크롤바 유지 */\n.modal-body::after { content: \"\"; position: sticky; inset-block-end: 0; display: block;\
      \ block-size: var(--space-gap-8);\n  background: linear-gradient(transparent, var(--color-surface-white));\
      \ } /* 하단 흐림 */\n.modal-footer { flex: none; } /* 푸터는 스크롤 영역 밖 */\n"
    note: 본문만 스크롤되고 스크롤바·하단 흐림이 단서가 되며 푸터는 항상 보인다.
  bad:
  - lang: css
    code: 'dialog { overflow-y: auto; } /* 푸터까지 함께 스크롤되어 버튼이 끝에 숨음 */

      dialog::-webkit-scrollbar { display: none; }

      '
    note: 푸터가 스크롤에 묻히고 스크롤바도 숨겨 단서가 없다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트를 직접 확인): 모달(component_04_05) ''콘텐츠 영역에 스크롤이
  필요한 경우 … 스크롤바를 제공하고 콘텐츠 영역 하단부에 흐림 효과를 적용하여 사용자가 스크롤 해야 함을 인지할 수 있는 단서를 제공해야 한다. 또한 … 푸터는 모달 영역의 하단부에 항상 표시될 수
  있도록 구현해야 한다.'' 확인. ''해야 한다'' → SHOULD + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
