id: LAYOUT-002
category: LAYOUT
title: 포인터 대상 최소 크기
stage: platformed
status:
  value: confirmed
type: rule
strength: MUST
statement: 포인터 입력 대상은 24×24 CSS px 이상으로 만들고, 더 작으면 각 대상 경계 상자 중심에 지름 24 CSS px 원을 그렸을 때 그 원이 다른 대상이나 다른 작은 대상의 원과
  겹치지 않게 배치한다.
measurement:
  criteria: '모든 포인터 대상(a[href], button, input, select, textarea, [role=button], [onclick] 등)의 경계 상자 너비·높이가 각각 24
    CSS px 이상이다. 미만이면 간격 예외: 해당 대상 중심의 지름 24px 원이 인접 대상의 경계 상자나 다른 미달 대상의 원과 교차하지 않는다. 예외(문장 안 인라인 링크, 같은 기능의 24px
    이상 대체 컨트롤, 작성자가 바꾸지 않은 UA 기본 컨트롤, 필수 표현)에 해당하면 통과.'
  method: axe-core target-size 실행 후, 검사기가 판단하지 못하는 예외(동등 컨트롤·필수 표현)는 수동으로 확인한다.
automation:
  feasibility: partial
  checks:
  - tool: axe-core
    rule: target-size
    method: 크기 24px 미만 대상의 간격(오프셋)을 계산해 판정. 인라인 예외는 자동 제외.
  note: axe target-size는 크기·간격을 판정하지만 동등 컨트롤(Equivalent)·필수(Essential) 예외는 판단하지 못한다 — 수동 확인.
rationale: 작은 대상은 손떨림·운동 장애가 있는 사용자와 터치 사용자에게 오조작을 일으킨다.
sources:
- ref: WCAG22
  locator: SC 2.5.8 Target Size (Minimum) (Level AA)
  note: https://www.w3.org/TR/WCAG22/#target-size-minimum
- ref: WCAG22_UNDERSTANDING
  locator: https://www.w3.org/WAI/WCAG22/Understanding/target-size-minimum.html
- ref: KWCAG22
  locator: 검사항목 6.1.3
- ref: KRDS
  locator: 컴포넌트 (여러 페이지) (가이드라인 PDF 2025.08 435·508·520·608·633쪽)
  note: '같은 요구를 다루는 KRDS 컴포넌트: 도움 패널, 링크, 맥락적 도움말, 버튼, 브레드크럼, 수량 토글, 아코디언, 캐러셀, 페이지네이션 — 상세는 sources/extracts/KRDS-components.yaml'
- ref: CSS_MQ4
  locator: 4.3 pointer, 4.5 any-pointer and any-hover
  note: '같은 요구: 입력 방식에 따른 크기·간격 조정은 주 포인터 기준인 (pointer: coarse)·(pointer: fine)으로 하고, 보조 장치를 포함하는 (any-pointer:
    fine)·(any-hover: hover)만으로 작은 대상이나 호버 전용 UI로 바꾸지 않는다.'
scope:
  level: global
  targets:
  - a[href]
  - button
  - input
  - select
  - textarea
  - '[role=button]'
  - '[role=link]'
  - '[tabindex]'
exceptions:
- '간격(Spacing): 24px 미만 대상이 지름 24px 원 기준으로 다른 대상과 겹치지 않는 경우.'
- '동등(Equivalent): 같은 페이지에 같은 기능을 하는 기준 충족 컨트롤이 있는 경우.'
- '인라인(Inline): 문장 안에 있거나 크기가 주변 텍스트의 행간에 묶인 대상.'
- '사용자 에이전트 제어: 크기를 UA가 정하고 작성자가 바꾸지 않은 경우.'
- '필수(Essential): 특정 표현이 정보 전달에 필수이거나 법적으로 요구되는 경우.'
- 슬라이더·색상 선택기처럼 대상 안 위치로 값을 고르는 대상은 대상 하나로 본다(SC 2.5.8 Note).
relations:
- type: refines
  id: SPACE-002
  note: SPACE-002(가로 나열 체크박스·라디오 24px 간격)는 이 룰의 간격 조건을 특정 컴포넌트에 구체화한 KRDS 수치.
examples:
  good:
  - lang: css
    code: '.icon-btn { min-inline-size: 24px; min-block-size: 24px; } /* WCAG 2.5.8 최소 24×24 CSS px */

      '
    note: 아이콘 버튼의 포인터 대상이 24×24 CSS px 이상이다.
  bad:
  - lang: html
    code: '<style>.icon-btn { inline-size: 16px; block-size: 16px; }</style>

      <button type="button" class="icon-btn" aria-label="수정">✎</button><button type="button" class="icon-btn" aria-label="삭제">×</button>

      <!-- 16px 대상 두 개가 붙어 지름 24px 원이 서로 겹침 — 간격 예외도 불충족 -->

      '
    note: 24px 미만 대상이 붙어 있어 크기·간격 조건을 모두 어긴다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(sources/extracts/WCAG22-A-AA.yaml): SC 2.5.8 규범 문장·예외 5개·Note를 확인하고 statement를
  원문(원 중심=경계 상자 중심)에 맞춤. KWCAG 6.1.3(비공식 HTML 판 a11ykr.github.io/kwcag22 재조회): 요구는 "충분한 크기", 수치는 대각선 6.0mm 이상·테두리
  안쪽 1px 여백을 "바람직하다"로 기술 — 단위·강도가 달라 BACKLOG 충돌 후보로 남김(공식 원문 미대조, registry verified=false). KRDS 버튼·링크·캐러셀 "마우스
  17×17px, 터치 44×44px 이상 권장", 도움 패널·맥락적 도움말 "44×44px 이상 고려"(component_05_01·05_02·04_09·08_01·08_03 재조회 확인) — 17px은
  이 룰의 24px보다 작아 BACKLOG 충돌 후보(상위 원칙상 24px 유지). 1단계에 병합된 CSS_MQ4 출처의 "pointer: coarse/fine로 크기 조정, any-pointer만으로
  작은 대상 금지"는 이 SC와 다른 요구 — 분리 제안(제안 파일 notes). 2026-10-18 독립 검토: KWCAG 공식 원문 사본으로 6.1.3 ''대각선 6.0mm 이상 … 바람직하다'',
  ''안쪽 1픽셀 이상의 여백 … 바람직하다'' 확인 — 권고. 24 CSS px 미만 예외 대상 처리는 CF-019 reason.'
