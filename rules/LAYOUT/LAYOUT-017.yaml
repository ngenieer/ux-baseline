id: LAYOUT-017
category: LAYOUT
title: 브레드크럼
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 브레드크럼은 본문 제목(h1) 위 왼쪽에 두고, 현재 화면 경로를 생략한 브레드크럼이면 브레드크럼과 본문 제목 사이에 다른 요소를 두지 않는다.
measurement:
  criteria: (1) 브레드크럼 nav의 경계 상자가 h1보다 위에 있고 왼쪽 경계가 h1과 같다(±1px). (2) 브레드크럼 마지막 항목이 현재 화면이 아닌 상위 화면이면 DOM에서 브레드크럼
    nav 다음 시각 요소가 h1이다.
  method: 브레드크럼이 있는 템플릿에서 DOM 순서와 위치를 확인한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 커스텀 검사: nav[aria-label*=브레드크럼] 다음 형제 요소가 h1(또는 h1을 감싼 헤딩 영역)인지 DOM 검사.'
rationale: 브레드크럼 마지막 경로와 본문 제목이 이어져 읽혀야 탐색 경로를 한 번에 파악할 수 있다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 브레드크럼 > 사용성 가이드라인 (가이드라인 PDF 2025.08 282·284쪽)
  note: https://www.krds.go.kr/html/site/component/component_03_03.html
scope:
  level: component
  targets:
  - nav.breadcrumb
  - h1
exceptions: []
relations:
- type: conflicts
  id: FORM-077
  note: 오류 요약은 본문 제목(h1) 바로 아래, 본문의 첫 요소로 둔다.
  decision: CF-008
examples:
  good:
  - lang: html
    code: '<nav aria-label="브레드크럼"><ol><li><a href="/">홈</a></li><li><a href="/minwon">민원</a></li><li><a href="/minwon/resident">주민등록</a></li></ol></nav>

      <h1>전입신고</h1>

      '
    note: 현재 화면을 생략한 브레드크럼 바로 다음이 본문 제목이다.
  bad:
  - lang: html
    code: '<nav aria-label="브레드크럼"><ol><li><a href="/">홈</a></li><li><a href="/minwon">민원</a></li><li><a href="/minwon/resident">주민등록</a></li></ol></nav>

      <div class="banner">이번 달 민원 처리 기간 안내</div>

      <h1>전입신고</h1>

      '
    note: 브레드크럼과 본문 제목 사이에 다른 요소가 끼어 있다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트를 직접 확인): 브레드크럼(component_03_03) ''브레드크럼은 항상
  본문 제목의 왼쪽 상단에 표시한다.''와 ''본문 상단에 명확한 본문 제목이 제공되고 있는 경우, 브레드크럼의 마지막 항목으로 현재 화면의 경로를 생략 … 이때 브레드크럼과 본문 제목 사이에 다른
  요소가 존재해서는 안 된다.'' 확인. 1단계 statement는 ''사이 요소 금지''를 무조건으로 적었으나 원문은 현재 경로 생략 조건에서만 요구 — 조건을 살림. ''안 된다'' → SHOULD
  + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
