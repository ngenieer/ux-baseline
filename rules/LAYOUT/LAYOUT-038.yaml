id: LAYOUT-038
category: LAYOUT
title: 아코디언
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 아코디언 패널에 자체 세로·가로 스크롤을 만들지 않고, 긴 패널 내용은 페이지 스크롤로 탐색하게 한다.
measurement:
  criteria: 펼친 아코디언 패널의 overflow-x·overflow-y 계산값이 auto·scroll이 아니고, scrollHeight ≤ clientHeight, scrollWidth ≤
    clientWidth다.
  method: 내용이 긴 패널을 펼쳐 개발자 도구로 overflow와 크기를 확인한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 커스텀 검사: 펼친 패널의 getComputedStyle overflow와 scroll 크기 비교. stylelint로 .accordion-panel의 max-height+overflow
    조합 금지 가능.'
rationale: 패널 안 스크롤은 페이지 스크롤과 겹쳐 조작이 어렵고 내용을 놓치게 한다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 아코디언 > 사용성 가이드라인 (가이드라인 PDF 2025.08 408·413쪽)
  note: https://www.krds.go.kr/html/site/component/component_04_07.html
scope:
  level: component
  targets:
  - 아코디언 패널
exceptions: []
relations: []
examples:
  good:
  - lang: css
    code: '.accordion-panel { overflow: visible; } /* 높이 제한 없이 펼쳐 페이지 스크롤로 읽음 */

      '
    note: 패널에 자체 스크롤이 없다.
  bad:
  - lang: css
    code: '.accordion-panel { max-block-size: 300px; overflow-y: auto; } /* 패널 안에 세로 스크롤 생김 */

      '
    note: 패널 높이를 묶어 패널 자체 스크롤이 생긴다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트를 직접 확인): 아코디언(component_04_07) ''패널 영역에 스크롤이
  발생하지 않도록 한다.'', ''패널 내부 콘텐츠가 길어져 화면의 뷰포트를 넘어가는 경우, 페이지 스크롤을 통해 콘텐츠를 탐색할 수 있어야 한다. 패널 영역에 별도의 세로, 가로 스크롤이 생성되어서는
  안 된다.'' 확인. ''안 된다'' → SHOULD + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
