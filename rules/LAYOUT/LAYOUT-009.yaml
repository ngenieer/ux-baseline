id: LAYOUT-009
category: LAYOUT
title: 공식 배너
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 공식 배너는 모든 화면의 최상단에 두고, DOM에서는 건너뛰기 링크만 공식 배너 앞에 둔다.
measurement:
  criteria: 모든 페이지에서 공식 배너 요소가 화면 맨 위(top 0)에 렌더링되고, DOM 순서상 body의 첫 번째 시각 요소다. 공식 배너 앞에는 건너뛰기 링크만 있다.
  method: 대표 페이지 템플릿 전부에서 DOM 순서와 화면 위치를 확인한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 커스텀 검사: 템플릿별로 body 첫 요소가 skip link, 다음이 공식 배너 컴포넌트인지 DOM 검사.'
rationale: 공식 배너는 정부 서비스임을 확인하는 기준이므로 모든 서비스에서 같은 위치에 있어야 사용자가 신뢰를 판단할 수 있다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 공식 배너 > 사용성 가이드라인 (가이드라인 PDF 2025.08 221·222·226쪽)
  note: https://www.krds.go.kr/html/site/component/component_02_01.html
scope:
  level: component
  targets:
  - 공식 배너
  - 공공 서비스 전 페이지
exceptions: []
relations:
- type: depends
  id: NAV-001
  note: 'KRDS 공식 배너 접근성: 건너뛰기 링크를 공식 배너보다 먼저 둔다.'
- type: depends
  id: COPY-012
  note: 공식 정부 서비스가 아니면 공식 배너 자체를 쓰지 않는다.
examples:
  good:
  - lang: html
    code: "<body>\n  <a class=\"skip-link\" href=\"#main\">본문 바로가기</a>\n  <div class=\"official-banner\">이 누리집은\
      \ 대한민국 공식 전자정부 누리집입니다.</div>\n  <header>…</header>\n"
    note: 건너뛰기 링크 다음, 화면 최상단에 공식 배너가 있다.
  bad:
  - lang: html
    code: "<body>\n  <a class=\"skip-link\" href=\"#main\">본문 바로가기</a>\n  <header>…</header>\n  <div class=\"official-banner\"\
      >이 누리집은 대한민국 공식 전자정부 누리집입니다.</div>\n"
    note: 공식 배너가 헤더 아래에 있어 최상단이 아니다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트를 직접 확인): 공식 배너(component_02_01) ''배너는 모든 화면의
  최상단에 제공한다.''와 접근성 ''건너뛰기 링크는 공식 배너 이전에 제공한다'' 확인. 지시형 ''제공한다'' → SHOULD. 공공 서비스 전용(public-sector).'
korean_specific: false
tags:
- krds
- krds-component
- public-sector
