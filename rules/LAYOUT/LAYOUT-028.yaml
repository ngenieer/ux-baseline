id: LAYOUT-028
category: LAYOUT
title: 구조화 목록
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 구조화 목록의 모든 항목은 같은 정보 항목을 같은 순서로 보여 주고, 값이 없는 항목도 자리를 비우지 않는다.
measurement:
  criteria: '목록의 모든 항목이 같은 필드 집합(예: 기관·기간·상태)을 같은 DOM 순서로 가진다. 원자료에 값이 없는 필드도 생략하지 않고 자리에 대시(-)를 표시한다.'
  method: 값이 비어 있는 데이터를 포함한 목록 픽스처로 항목별 필드 수와 순서를 비교한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 커스텀 검사: 항목별 dt(또는 필드 클래스) 목록이 첫 항목과 같은지 비교.'
rationale: 항목마다 정보 구성이 다르거나 비어 있으면 사용자가 항목을 비교할 때 혼동한다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 구조화 목록 > 사용성 가이드라인 (가이드라인 PDF 2025.08 357쪽)
  note: https://www.krds.go.kr/html/site/component/component_04_01.html
scope:
  level: component
  targets:
  - 구조화 목록
exceptions: []
relations:
- type: depends
  id: STATE-005
  note: 빈 값 자리의 대시(-) 표시는 STATE-005.
examples:
  good:
  - lang: html
    code: "<ul class=\"structured-list\">\n  <li><dl><dt>기관</dt><dd>서울특별시</dd><dt>기간</dt><dd>-</dd></dl></li>\n\
      \  <li><dl><dt>기관</dt><dd>부산광역시</dd><dt>기간</dt><dd>2026. 10. 1. ~ 2026. 10. 31.</dd></dl></li>\n</ul>\n"
    note: 모든 항목이 같은 필드를 같은 순서로 갖고, 값이 없으면 대시(-)를 둔다.
  bad:
  - lang: html
    code: "<ul class=\"structured-list\">\n  <li><dl><dt>기관</dt><dd>서울특별시</dd></dl></li>\n  <li><dl><dt>기관</dt><dd>부산광역시</dd><dt>기간</dt><dd>2026.\
      \ 10. 1. ~ 2026. 10. 31.</dd></dl></li>\n</ul>\n"
    note: 값이 없는 '기간' 필드를 생략해 항목마다 구조가 다르다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트를 직접 확인): 구조화 목록(component_04_01) ''항목을 구성하는
  모든 정보를 일관된 분류 체계와 순서로 제공해야 한다. 만약 … 정보가 비어있거나 생략되면 사용자는 혼동을 느낄 수 있으므로 해당 카테고리 정보가 제공되어야 하는 위치에 대시(-)를 플레이스홀더로
  제공한다.'' 확인. ''해야 한다'' → SHOULD + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
