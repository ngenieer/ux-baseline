id: LAYOUT-033
category: LAYOUT
title: 디스클로저
stage: platformed
status:
  value: confirmed
type: rule
strength: MAY
statement: 한 섹션에는 디스클로저를 1개만 둔다.
measurement:
  criteria: 같은 섹션(같은 h2·h3 헤딩 아래 영역) 안 디스클로저(details 또는 aria-expanded 디스클로저 버튼) 수 ≤ 1. 연속 배치된 디스클로저가 없다.
  method: 섹션별 디스클로저 수를 센다.
automation:
  feasibility: partial
  checks:
  - tool: custom
    method: 헤딩 기준 섹션 분할 후 details 수 카운트
  note: 섹션 경계가 헤딩으로 표시되지 않으면 수동.
rationale: 디스클로저를 연속으로 두면 복잡성이 커져 오히려 혼동을 준다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 디스클로저 > 사용성 가이드라인 (가이드라인 PDF 2025.08 382·384쪽)
  note: https://www.krds.go.kr/html/site/component/component_04_04.html
scope:
  level: component
  targets:
  - details
  - 디스클로저
exceptions: []
relations:
- type: refines
  id: LAYOUT-036
  note: 여러 섹션을 접어야 하면 디스클로저 여러 개 대신 아코디언 검토.
examples:
  good:
  - lang: html
    code: "<section><h2>신청 자격</h2>\n  <p>만 19~34세 무주택 청년</p>\n  <details><summary>소득 기준 자세히 보기</summary>…</details>\n\
      </section>\n"
    note: 한 섹션에 디스클로저가 하나다.
  bad:
  - lang: html
    code: "<section><h2>신청 자격</h2>\n  <details><summary>소득 기준 자세히 보기</summary>…</details>\n  <details><summary>재산\
      \ 기준 자세히 보기</summary>…</details>\n</section>\n"
    note: 한 섹션에 디스클로저 2개가 연달아 있다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트를 직접 확인): 디스클로저(component_04_04) ''가능한 한 하나의
  섹션에 하나의 디스클로저만 사용한다.'', ''여러 개의 디스클로저를 연속적으로 배치하게 되면 복잡성이 증가'' 확인. 원문 ''가능한 한''은 완화 표현이라 MAY로 두고 statement에서는
  수치(1개)로 바꿈.'
korean_specific: false
tags:
- krds
- krds-component
