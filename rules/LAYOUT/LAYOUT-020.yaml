id: LAYOUT-020
category: LAYOUT
title: 버튼
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 그룹으로 묶인 버튼은 모두 같은 크기로 만들고, 특정 버튼의 강조는 크기가 아니라 스타일(채움·윤곽선·텍스트)로 구분한다.
measurement:
  criteria: 같은 버튼 그룹([role=group], .btn-group 등 한 컨테이너에 나란한 버튼) 안 버튼들의 렌더링 너비·높이가 서로 같다(±1px).
  method: 버튼 그룹이 있는 화면에서 각 버튼의 경계 상자 크기를 비교한다.
automation:
  feasibility: partial
  checks:
  - tool: ux-baseline-check
    rule: button-group-equal
    method: 'ux-baseline check: .button-group 직계 버튼의 렌더링 너비·높이 편차가 1px 를 넘으면 경고'
  note: '4단계 커스텀 검사: 그룹 내 button getBoundingClientRect() width·height 비교.'
rationale: 같은 크기는 선택지가 동질적임을 알려 주고, 크기로 강조하면 위계가 흐트러진다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 버튼 > 사용성 가이드라인 (가이드라인 PDF 2025.08 512·513쪽)
  note: https://www.krds.go.kr/html/site/component/component_05_02.html
scope:
  level: component
  targets:
  - .btn-group
  - '[role=group] > button'
exceptions: []
relations:
- type: depends
  id: COLOR-015
  note: 강조 수준별 스타일(채움·윤곽선·텍스트) 정의는 COLOR-015.
examples:
  good:
  - lang: css
    code: '.btn-group { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: var(--space-gap-3);
      }

      .btn-group > button { block-size: var(--size-height-6); } /* 강조는 채움·윤곽선 스타일로만 구분 */

      '
    note: 그룹 안 버튼이 모두 같은 너비·높이다.
  bad:
  - lang: html
    code: '<div class="btn-group"><button type="button" class="btn-lg btn-primary">신청</button><button type="button"
      class="btn-sm btn-secondary">취소</button></div>

      '
    note: 강조를 크기로 표현해 그룹 안 버튼 크기가 다르다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트를 직접 확인): 버튼(component_05_02) ''버튼이 그룹으로 제공될
  때 모든 버튼의 크기를 동일하게 제공한다.'', ''특정 버튼을 강조해야 할 필요가 있다면 크기가 아닌 다른 스타일을 통해 정보의 위계를 구분해야 한다.'' 확인. ''해야 한다'' → SHOULD
  + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
