id: LAYOUT-053
category: LAYOUT
title: 단계 표시기
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 단계 사이 흐름 표시(연결선·화살표·꺾쇠 중 하나)를 사이트 전체에서 한 방식으로 통일한다.
measurement:
  criteria: 사이트의 모든 단계 표시기 인스턴스가 같은 흐름 표시 방식(연결선, 화살표, 꺾쇠 중 하나)을 쓴다.
  method: 단계 표시기가 있는 화면을 모아 흐름 표시 방식을 비교한다.
automation:
  feasibility: none
  checks: []
  note: '4단계: 단계 표시기 컴포넌트 변형을 하나로 고정.'
rationale: 흐름 표시가 화면마다 다르면 같은 컴포넌트로 인식되지 않는다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 단계 표시기 > 사용성 가이드라인 (가이드라인 PDF 2025.08 585쪽)
  note: https://www.krds.go.kr/html/site/component/component_07_01.html
scope:
  level: component
  targets:
  - 단계 표시기
exceptions: []
relations: []
examples:
  good:
  - lang: css
    code: '.steps li + li::before { content: ""; display: block; border-block-start: 1px solid var(--color-border-gray);
      } /* 사이트 전체 공통: 연결선 */

      '
    note: 모든 단계 표시기가 같은 연결선 방식을 쓴다.
  bad:
  - lang: css
    code: '.apply .steps li + li::before { content: "›"; } /* 신청 화면: 꺾쇠 */

      .change .steps li + li::before { content: ""; display: block; border-block-start: 1px solid var(--color-border-gray);
      } /* 변경 화면: 연결선 */

      '
    note: 같은 사이트에서 꺾쇠와 연결선을 섞어 쓴다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 본문 텍스트를 직접 확인): 단계 표시기(component_07_01) ''단계의 흐름은 연결선,
  화살표, 꺾쇠 기호 등을 활용하여 표현할 수 있다. … 어떤 표현 방식을 사용하든 한 사이트 내에서 단계는 일관성 있게 표현되어야 한다.'' 확인. ''되어야 한다'' → SHOULD + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
