id: LAYOUT-008
category: LAYOUT
title: 상세 정보 단일 화면
stage: platformed
status:
  value: confirmed
type: rule
strength: MAY
statement: 상세 정보 페이지는 본문을 탭으로 나누지 않고 한 화면에 이어서 제공하며, 주요 단락 이동은 콘텐츠 내 탐색으로 한다.
measurement:
  criteria: 상세 정보 페이지의 main 안에 본문 섹션을 전환하는 [role=tablist]가 없다. 섹션이 여러 개면 콘텐츠 내 탐색(목차 링크)으로 이동한다.
  method: 상세 정보 페이지 템플릿에서 main 안 tablist 유무를 확인하고, 있으면 예외 사유(아래 exceptions)에 해당하는지 수동 판단한다.
automation:
  feasibility: partial
  checks:
  - tool: custom
    method: 상세 페이지 템플릿 main에서 [role=tablist] 존재 여부 탐지
  note: 탭 사용이 예외 사유에 해당하는지는 수동 판단.
rationale: 상세 정보를 탭으로 나누면 숨은 탭의 정보를 놓치고 섹션 간 비교가 어려워진다.
sources:
- ref: KRDS
  locator: 기본 패턴 > 상세 정보 확인 > 사용성 가이드라인 (가이드라인 PDF 2025.08 813쪽)
  note: https://www.krds.go.kr/html/site/global/global_06.html
- ref: KRDS
  locator: 컴포넌트 (여러 페이지) (가이드라인 PDF 2025.08 445쪽)
  note: '같은 요구를 다루는 KRDS 컴포넌트: 탭 — 상세는 sources/extracts/KRDS-components.yaml'
scope:
  level: situation
  targets:
  - 상세 정보 페이지
exceptions:
- 내용이 한 화면에 담기에 복잡하거나 섹션 간 성격이 달라 사용자가 섹션을 비교하며 볼 필요가 없을 때는 탭을 쓸 수 있다(KRDS 상세 정보 확인 > 유형 > 탭).
relations:
- type: depends
  id: NAV-014
  note: 단일 화면의 단락 이동 수단(콘텐츠 내 탐색) 위치는 NAV-014.
examples:
  good:
  - lang: html
    code: "<main>\n  <h1>청년 월세 지원</h1>\n  <nav aria-label=\"이 페이지 목차\"><a href=\"#target\">지원 대상</a> <a href=\"\
      #how\">신청 방법</a></nav>\n  <section id=\"target\"><h2>지원 대상</h2>…</section>\n  <section id=\"how\"><h2>신청 방법</h2>…</section>\n\
      </main>\n"
    note: 상세 정보를 한 화면에 이어 두고 목차 링크로 단락을 이동한다.
  bad:
  - lang: html
    code: "<main>\n  <h1>청년 월세 지원</h1>\n  <div role=\"tablist\"><button role=\"tab\" aria-selected=\"true\">지원 대상</button><button\
      \ role=\"tab\" aria-selected=\"false\">신청 방법</button></div>\n  <div role=\"tabpanel\">…</div>\n</main>\n"
    note: 비교하며 읽을 상세 정보를 탭으로 나눠 '신청 방법'이 숨는다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 기본 패턴 상세 정보 확인 global_06 재조회): 유형 > 단일 화면 ''불가피하게 탭을 사용해야 하는 상황을
  제외하고 상세 정보는 기본적으로 단일 화면 레이아웃으로 제공되는 것이 바람직하다''와 탭 유형의 적합 조건 확인. ''바람직하다'' → MAY. 1단계에 병합된 KRDS 탭 컴포넌트 항목(''탭 간
  비교가 필요하거나 순서가 중요하면 탭 대신 다른 패턴'') component_04_10 재조회로 확인.'
korean_specific: false
tags:
- krds
