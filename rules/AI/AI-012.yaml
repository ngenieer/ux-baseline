id: AI-012
category: AI
title: 결과 없음(답 없음) 안내
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: AI가 결과를 찾지 못하면 오류 색·오류 아이콘·role="alert" 없이 표시하고, 찾지 못한 이유의 범위(지원하지 않는 요청·자료 없음 등)와 대안 경로(요청 바꾸기 예시·사람
  상담·일반 검색 등) 1개 이상을 함께 보여준다.
measurement:
  criteria: empty 상태 컴포넌트에서 (1) 오류(danger) 색 토큰·오류 아이콘·role="alert"·aria-live="assertive"를 쓰지 않는다. (2) 찾지 못한 이유를
    설명하는 텍스트가 있다. (3) 대안 경로로 가는 button 또는 a[href]가 1개 이상 있다.
  method: empty 상태 목 응답으로 렌더링해 (1)~(3)을 단위 테스트한다.
automation:
  feasibility: none
  checks: []
  note: 4단계 커스텀 단위 테스트(empty 컴포넌트에 대안 링크·버튼 1개 이상, 오류 토큰 미사용).
rationale: 결과 없음은 시스템 고장이 아니므로 오류처럼 보이면 사용자가 재시도만 반복한다. 이유와 다른 길을 알려야 과업을 이어갈 수 있다.
sources:
- ref: PAIR_GUIDEBOOK
  locator: Errors + Graceful Failure — Low confidence / failstates
  note: '''Explain why a certain result couldn''t be given and provide alternative paths forward.'''
- ref: HAX_GUIDELINES_POSTER
  locator: G10 Scope services when in doubt
  note: '''Engage in disambiguation or gracefully degrade the AI system''s services when uncertain about a user''s
    goals.'''
scope:
  level: component
  targets:
  - AI 결과 없음 상태
  - '[data-ai-status=empty]'
exceptions: []
relations:
- type: refines
  id: AI-011
  note: empty 상태의 표시 방법.
- type: refines
  id: STATE-041
  note: 빈 상태 유형 구분의 AI 결과 없음 사례.
examples:
  good:
  - lang: html
    code: "<div data-ai-status=\"empty\">\n  <p>2020년 이전 공고는 자료가 없어 찾지 못했습니다.</p>\n  <a href=\"/search?q=입찰\">일반\
      \ 검색으로 찾기</a>\n</div>"
    note: 오류 표현 없이 찾지 못한 이유와 대안 경로(일반 검색 링크)를 보여준다.
  bad:
  - lang: html
    code: '<div data-ai-status="empty" role="alert" class="text-danger">⚠ 오류: 결과 없음</div>'
    note: 결과 없음을 role="alert"·오류 색·오류 문구로 표시한다.
needs_verification: false
verification_note: '2026-10-18 원문 대조: PAIR Errors+Graceful Failure 장(curl) ''Explain why a certain result couldn''t
  be given and provide alternative paths forward'' 확인, HAX 포스터 G10 확인. 1단계 메모대로 ''오류처럼 보이지 않게''를 ''오류 색·오류 아이콘·role=alert
  미사용''으로 구체화(체계 해석).'
korean_specific: false
tags:
- research-ai
