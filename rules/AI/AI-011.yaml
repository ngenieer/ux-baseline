id: AI-011
category: AI
title: AI 실패 유형 구분 표시
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: AI 응답 실패를 그 기능이 낼 수 있는 유형별로 시스템 오류(네트워크·서버·시간 초과), 결과 없음(요청에 해당하는 답을 찾지 못함), 정책상 거절(안전·정책 사유로 답하지 않음)로
  나누고, 유형마다 서로 다른 문구와 상태 값으로 표시한다.
measurement:
  criteria: '(0) 판정 대상 유형: error 는 AI 응답을 요청하는 모든 기능이 대상이다. empty 는 기능의 응답 정의(API 스키마·SDK 응답·목 응답 정의)에 ''결과 없음''
    응답(검색 0건, 요약할 내용 없음 등)이 있으면 대상이다. refused 는 기능이 쓰는 모델·API·필터 중 하나라도 거절 신호(가드레일·콘텐츠 필터 오류, 모델의 거절 종료 사유 등)를 낼
    수 있으면 대상이다 — 백엔드가 거절 신호를 오류로 바꿔 넘기더라도 대상이다. 대상이 아닌 유형의 상태는 두지 않아도 된다. (1) AI 응답 컴포넌트의 상태 값(예: data-ai-status)이
    대상 유형마다 서로 다르다(error·empty·refused). (2) 대상 유형끼리 제목·본문 문구가 서로 다르다. (3) 재시도 버튼은 error 상태에만 있고, empty·refused
    상태는 오류 문구(''오류가 발생했습니다'' 등)를 쓰지 않는다.'
  method: 기능이 쓰는 모델·API·필터 문서와 응답 정의에서 (0)의 대상 유형을 정해 기록한 뒤, 대상 유형마다 목 응답을 주입해 렌더링 결과(상태 값·문구·버튼)를 단위 테스트로 비교한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 커스텀 단위 테스트: (0)으로 정한 대상 유형(error|empty|refused 중)마다 서로 다른 메시지 컴포넌트가 렌더되는지.'
rationale: 시스템 오류는 다시 시도하면 풀릴 수 있지만 결과 없음·거절은 재시도해도 같으므로, 사용자가 다음 행동을 고르려면 셋을 구분해야 한다.
sources:
- ref: PAIR_GUIDEBOOK
  locator: Errors + Graceful Failure — Identify user, system, and context errors; Categorize user-perceived errors
  note: 시스템 한계·맥락 오류·failstate·배경 오류 분류와 유형별 대응
- ref: APPLE_WWDC25_248
  locator: guardrail error 처리
  note: 가드레일(안전) 오류는 '앱이 요청을 처리할 수 없음을 설명하는 UI 피드백'으로 따로 처리
scope:
  level: component
  targets:
  - AI 응답 영역
  - '[data-ai-output]'
exceptions: []
relations: []
examples:
  good:
  - lang: html
    code: '<div data-ai-status="error"><p>응답을 받지 못했습니다. 네트워크 연결을 확인한 뒤 다시 시도하세요.</p><button>다시 시도</button></div>

      <div data-ai-status="empty"><p>요청과 일치하는 공고를 찾지 못했습니다.</p></div>

      <div data-ai-status="refused"><p>이 요청에는 답할 수 없습니다(이용 정책).</p></div>'
    note: 거절 신호를 낼 수 있는 모델을 쓰는 기능 — 대상 유형 셋의 문구가 다르고 재시도 버튼은 error에만 있다.
  - lang: html
    code: '<!-- 거절 신호가 없는 문서 요약 기능(응답 정의: 성공·결과 없음·오류) -->

      <div data-ai-status="error"><p>요약을 만들지 못했습니다. 잠시 후 다시 시도하세요.</p><button type="button">다시 시도</button></div>

      <div data-ai-status="empty"><p>문서에서 요약할 안내 내용을 찾지 못했습니다.</p></div>'
    note: 모델·API·필터에 거절 신호가 없어 refused는 대상이 아니다 — error·empty 두 상태만 구분해도 통과한다.
  bad:
  - lang: html
    code: "<!-- 세 상태 모두 같은 컴포넌트·같은 문구 -->\n<div class=\"ai-error\" data-ai-status=\"error\">\n  <p>응답을 받지 못했습니다.\
      \ 네트워크 연결을 확인한 뒤 다시 시도하세요.</p>\n  <button type=\"button\">다시 시도</button>\n</div>"
    note: 결과 없음·정책상 거절도 같은 오류 문구와 재시도 버튼으로 표시한다.
needs_verification: false
verification_note: '2026-10-18 원문 대조: PAIR Errors+Graceful Failure 장(curl) 오류 분류(System limitation, Context, Failstates,
  Background errors)와 유형별 Response 확인, WWDC25 248 세션 페이지(curl) ''For a user-initiative feature … provide appropriate
  UI feedback to explain that the app cannot process the request'' 확인. 3분류는 PAIR 분류와 일대일이 아닌 이 체계의 정리(프로젝트 AI 카테고리
  정의 ''AI 오류와 답 없음의 구분'')이며 참고 사례 근거라 SHOULD. 하위 상태별 표시는 AI-012(결과 없음)·AI-013(거절)이 구체화. (2026-10-18 T5 검토 반영) 측정
  기준 (1)이 세 상태를 무조건 요구해, 거절이 생길 수 없는 기능(목 응답에 거절이 없는 시연 화면)에도 refused를 구현해야 하는지 갈렸다 → 판정 대상 유형을 기능이 쓰는 모델·API·필터와
  응답 정의로 정하는 (0)을 추가했다. 검토 제안(''정책 필터가 있는 기능만'')은 모델 자체의 거절을 놓쳐 ''거절 신호를 낼 수 있으면''으로 넓혔다(백엔드가 오류로 바꿔도 대상). 출처(PAIR
  유형별 대응, WWDC25 가드레일 오류 처리)의 요구 범위는 줄이지 않았다.'
korean_specific: false
tags:
- research-ai
