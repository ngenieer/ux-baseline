id: AI-007
category: AI
title: 근거 부족 표시
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 검색·문서 근거를 바탕으로 답하는 AI 기능에서 답변이나 답변의 항목에 쓸 근거 자료를 찾지 못했거나 일부만 찾았으면, 그 답변이나 항목과 함께 근거가 없거나 일부만 확인됐다는 사실을
  텍스트로 표시한다.
measurement:
  criteria: '(1) 근거 상태를 응답 단위([data-ai-output] 요소의 data-grounding) 또는 항목 단위(답변 안 항목 요소의 data-grounding) 중 하나 이상으로
    렌더 결과에 둔다. 값은 none | partial | full 이다. (2) 응답 단위 값이 none 또는 partial이면 그 [data-ai-output] 안에 근거 부족 텍스트가 보인다.
    (3) 항목 단위 값이 none 또는 partial인 항목마다 그 항목 요소 안에 근거 부족 텍스트가 보인다. 항목 단위로만 표시하면 응답 단위 텍스트는 요구하지 않는다. (4) 근거 부족 텍스트는
    ''근거'' 또는 ''자료''라는 낱말과 ''없음''·''찾지 못''·''일부'' 중 하나를 포함한다(예: ''근거 자료 없음'', ''일부 자료만 확인됨'', ''근거 원문 없음''). full이면
    표시하지 않아도 된다.'
  method: 근거 상태별 목 응답(응답 단위 none·partial·full, 항목 단위 none·partial이 섞인 응답)을 주입해 렌더 결과의 data-grounding 값과 근거 부족 텍스트를
    단위 테스트한다.
automation:
  feasibility: none
  checks: []
  note: '자동 검사 어려움(모델 출력 의존). 4단계: API 응답에 근거 상태 필드를 두고 UI 렌더 여부를 단위 테스트.'
rationale: 근거가 부족한 답변은 품질이 낮을 수 있으므로 사용자가 스스로 판단해야 한다는 신호를 줘야 한다.
sources:
- ref: PAIR_GUIDEBOOK
  locator: Explainability + Trust — Articulate data sources
  note: '''Tell the user when a lack of data might mean they''ll need to use their own judgment.'' ''Don''t be afraid
    to admit when a lack of data could affect the quality of the AI recommendations.'''
scope:
  level: situation
  targets:
  - 검색 증강(RAG) 답변
  - 문서 기반 AI 답변
exceptions:
- 근거 자료를 검색하지 않는 순수 생성 기능(근거 상태 값이 없음)에는 적용하지 않는다.
relations: []
examples:
  good:
  - lang: html
    code: "<article data-ai-output data-grounding=\"partial\">\n  <p class=\"grounding-note\">일부 자료만 확인됨 — 2024년\
      \ 이후 공고는 찾지 못했습니다.</p>\n  <p>…</p>\n</article>"
    note: 근거 상태가 partial이라 '일부 자료만 확인됨'을 답변 위에 표시했다.
  - lang: html
    code: "<ol data-ai-output>\n  <li data-grounding=\"full\"><p>신청 기한은 접수일로부터 30일입니다.</p></li>\n  <li data-grounding=\"\
      none\">\n    <p>수수료는 없습니다.</p>\n    <p class=\"grounding-note\">근거 원문 없음 — 이 항목의 근거 문장을 문서에서 찾지 못했습니다.</p>\n\
      \  </li>\n</ol>"
    note: 항목 단위로 근거 상태를 두고, 근거가 없는 항목 안에 근거 부족 텍스트를 표시했다.
  bad:
  - lang: html
    code: <article data-ai-output data-grounding="none"><p>…(근거 없음 표시 없이 단정적으로 답함)</p></article>
    note: 근거를 찾지 못했는데(none) 아무 표시 없이 답한다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(PAIR Explainability+Trust 장 curl): ''Tell the user when a lack of data might
  mean they''ll need to use their own judgment'', ''Don''t be afraid to admit when a lack of data could affect the
  quality'' 확인(1단계 locator ''say when data is missing''을 실제 문구로 고침). 적용 범위를 근거 상태가 있는 RAG·문서 기반 기능으로 한정(순수 생성 응답은
  근거 상태를 판정할 수 없음). (2026-10-18 T5 검토 반영) 근거 상태가 응답 단위로만 정의돼 항목마다 ''근거 없음''을 표시한 화면이 기준을 채우는지 판정이 갈렸다 → 응답 단위·항목
  단위를 모두 허용하고 판정용 속성(data-grounding)과 근거 부족 텍스트의 낱말 조건을 정했다. 항목 단위 표시는 근거가 없는 부분을 더 좁게 알려 PAIR 요구(''lack of data
  … use their own judgment'')를 약하게 하지 않는다. 낱말 조건은 판정을 위한 체계 기준(출처 문구 아님).'
korean_specific: false
tags:
- research-ai
