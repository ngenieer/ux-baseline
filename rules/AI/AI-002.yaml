id: AI-002
category: AI
title: 서비스 내 AI 생성물 표시
stage: platformed
status:
  value: confirmed
type: rule
strength: MUST
statement: 생성형 AI 결과물을 서비스 화면 안에서 보여줄 때는 (a) 결과물 영역 안이나 바로 옆의 'AI 생성' 표시, (b) 그 서비스 화면에 계속 보이는 AI 로고·문구, (c) 첫 이용
  전 화면 안내 중 하나 이상으로 AI가 생성했다는 사실을 표시하고, 로고·아이콘으로 표시하면 접근 가능한 이름을 준다.
measurement:
  criteria: 'AI 결과물이 나오는 화면마다 다음 중 하나 이상이 참이다: (a) 결과물 컨테이너([data-ai-output]) 안 또는 인접 위치에 ''AI''를 포함한 보이는 텍스트 또는
    접근 가능한 이름이 ''AI 생성'' 취지인 아이콘, (b) 화면을 스크롤해도 같은 화면에 계속 보이는 AI 로고·문구(이미지면 alt·aria-label이 있다), (c) 사용자의 첫 입력 전에
    표시되는 AI 생성 안내 텍스트. 아이콘·로고만 쓰면 접근 가능한 이름 길이 > 0. 딥페이크 결과물도 서비스 화면 안에서만 보여 줄 때는 이 기준을 따른다(가이드라인 ''서비스 내 제공 시''
    딥페이크 = 일반 생성물과 동일).'
  method: AI 결과가 나오는 화면을 열어 (a)~(c) 중 무엇으로 표시했는지 확인하고, 아이콘·로고는 접근 가능한 이름을 DOM으로 확인한다.
automation:
  feasibility: none
  checks: []
  note: '기존 검사기 규칙 없음. 4단계 커스텀 DOM 검사: [data-ai-output]마다 [data-ai-label] 자식 또는 aria-describedby로 연결된 레이블이 있는지.'
rationale: 한국 AI 기본법은 생성형 AI 결과물이 AI로 생성됐다는 사실의 표시를 의무로 둔다. 화면에서 바로 보이게 하면 사용자가 결과를 검토할 필요를 알 수 있다.
sources:
- ref: KR_AI_BASIC_ACT
  locator: 제31조 제2항
  note: 생성형 AI 결과물의 생성 사실 표시 의무
- ref: KR_AI_BASIC_ACT_DECREE
  locator: 제23조 제2항
  note: '표시 방법: 사람이 인식할 수 있는 방법 또는 기계 판독 방법(+안내 1회 이상)'
- ref: MSIT_AI_TRANSPARENCY_GUIDE
  locator: Ⅲ 표시 방법 — 대화 기반 서비스 / AI 지원 서비스
  note: '대화 기반 서비스: ''초기 안내 또는 지속 로고 표출 등(반복적 표시 불필요)'', 문구 영역이 부족하면 툴팁. AI 지원 서비스: ''이용 화면 내 로고 표출, 이용 전 안내 등…
    개별 결과물에 대해 표시 불필요''.'
- ref: EU_AI_ACT_ART50
  locator: Art.50(2)
  note: EU는 제공자의 기계 판독 표시 의무(화면 레이블은 직접 요구하지 않음)
scope:
  level: situation
  targets:
  - '[data-ai-output]'
  - AI 생성 텍스트·이미지·음성·영상
exceptions:
- 서비스명·화면 문구·결과물 표시 문구 등으로 생성형 AI 활용 사실이 명백한 경우(한국 시행령 제23조 제4항 제1호).
- 인공지능사업자의 내부 업무 용도로만 쓰는 경우(한국 시행령 제23조 제4항 제2호).
relations:
- type: refines
  id: AI-001
  note: AI-001은 상호작용 사실의 사전 고지, 이 룰은 화면 안 결과물의 생성 사실 표시(초기 안내로 둘 다 충족할 수 있다).
- type: depends
  id: A11Y-001
  note: AI 아이콘만 쓰면 대체 텍스트 필요.
examples:
  good:
  - lang: html
    code: "<header class=\"chat-header\">\n  <h1>민원 상담</h1>\n  <p class=\"ai-notice\"><img src=\"ai.svg\" alt=\"\
      \">AI가 답변을 생성합니다</p>\n</header>\n<ol class=\"chat-log\">\n  <li data-ai-output>신청 기한은 접수일로부터 30일입니다.</li>\n\
      </ol>"
    note: 대화 화면에 계속 보이는 AI 문구로 표시했다(결과물마다 반복할 필요 없음).
  - lang: html
    code: "<article data-ai-output aria-describedby=\"lbl-1\">\n  <p id=\"lbl-1\" class=\"badge\">AI 생성</p>\n  <p>요약:\
      \ …</p>\n</article>"
    note: 결과물 옆에 보이는 AI 생성 레이블을 두었다.
  bad:
  - lang: html
    code: "<header class=\"chat-header\">\n  <h1>민원 상담</h1>\n  <img src=\"spark.svg\"> <!-- 이름 없는 아이콘만 -->\n</header>\n\
      <ol class=\"chat-log\">\n  <li data-ai-output>신청 기한은 접수일로부터 30일입니다.</li>\n</ol>"
    note: AI 표시가 이름 없는 아이콘뿐이라 AI 생성 사실이 텍스트로도 보조기술로도 전달되지 않는다.
needs_verification: false
verification_note: 'MSIT 투명성 가이드라인(2026-01, NIA 게시 PDF) 원문 대조 2026-10-18: 대화 기반 서비스는 초기 안내 또는 지속 로고(반복 표시 불필요),
  AI 지원 서비스는 화면 내 로고·이용 전 안내(개별 결과물 표시 불필요)를 확인 — 결과물마다 레이블을 요구하던 이전 statement는 가이드라인보다 엄격해 CF-054로 가이드라인 기준에 맞춤.
  법·시행령 조문은 이전 대조(law.go.kr) 그대로.'
korean_specific: true
tags:
- research-ai
- law
decisions:
- CF-025
- CF-054
