id: AI-005
category: AI
title: AI 능력 범위 안내
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: AI 기능의 첫 화면(대화·결과가 없는 상태)에 그 기능으로 할 수 있는 작업의 예시와 할 수 없는 작업을 텍스트로 보여준다.
measurement:
  criteria: 대화·결과 0건 상태의 AI 기능 화면에 (1) 할 수 있는 작업 예시 텍스트가 1개 이상, (2) 할 수 없는 작업(한계) 설명 텍스트가 1개 이상 보인다.
  method: '새 세션으로 AI 기능 화면을 열어 두 텍스트를 확인한다(E2E: [data-ai-capabilities] li ≥ 1, [data-ai-limitations] 텍스트 존재).'
automation:
  feasibility: none
  checks: []
  note: 기존 검사기 규칙 없음. 4단계 커스텀 E2E(위 method).
rationale: 사용자가 AI로 무엇을 할 수 있는지 모르면 기능을 쓰지 못하거나 할 수 없는 일을 요청해 실패를 겪는다. 능력과 한계를 일찍 알려야 기대를 맞출 수 있다.
sources:
- ref: HAX_GUIDELINES_POSTER
  locator: G1 Make clear what the system can do
  note: '''Help users understand what the AI system is capable of doing.'''
- ref: PAIR_GUIDEBOOK
  locator: Explainability + Trust — Set expectations
  note: '''Communicate the product''s capabilities and limitations clearly to set expectations, and do this early.'''
scope:
  level: situation
  targets:
  - AI 기능 첫 화면
  - AI 채팅 빈 상태
exceptions: []
relations:
- type: refines
  id: STATE-042
  note: 처음 사용 빈 상태의 AI 기능 특화.
examples:
  good:
  - lang: html
    code: "<section data-ai-empty>\n  <h2>AI 민원 도우미</h2>\n  <ul data-ai-capabilities><li>신청서 작성 방법 안내</li><li>필요\
      \ 서류 확인</li></ul>\n  <p data-ai-limitations>개인별 처리 결과 조회와 법률 판단은 할 수 없습니다.</p>\n</section>"
    note: 빈 상태에 할 수 있는 작업 예시와 할 수 없는 작업을 함께 보여준다.
  bad:
  - lang: html
    code: <section data-ai-empty><textarea placeholder="무엇이든 물어보세요"></textarea></section>
    note: 입력창만 있어 기능의 범위와 한계를 알 수 없다.
needs_verification: false
verification_note: '2026-10-18 원문 대조: HAX 포스터 PDF(curl, 브라우저 UA) G1 ''Make clear what the system can do. Help users
  understand what the AI system is capable of doing.'' 확인. PAIR Explainability+Trust 장(curl) ''Communicate the product''s
  capabilities and limitations clearly to set expectations, and do this early'' 확인. ''1개 이상''은 존재 판정용 최소값(출처에 개수
  없음). 조사 초안의 ''예시 3개 이상''은 출처에 없어 쓰지 않음. HAX CHI 2019 논문 본문은 미확인이라 연구 결과가 아닌 지침 포스터 근거 SHOULD.'
korean_specific: false
tags:
- research-ai
