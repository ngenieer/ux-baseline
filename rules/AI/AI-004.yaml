id: AI-004
category: AI
title: 딥페이크 결과물 상시 표시
stage: platformed
status:
  value: confirmed
type: rule
strength: MUST
statement: 실제와 구분하기 어려운 가상의 이미지·영상·음성(딥페이크)을 다운로드·공유로 서비스 밖으로 내보낼 때는 사람이 보거나 들어서 알 수 있는 AI 생성 표시를 결과물에 넣고 기계 판독
  표시만으로 대신하지 않으며, 영상은 AI로 생성한 재생 구간 전체에 표시를 보이고, 이미지는 이미지 안에 표시하고, 음성은 재생 시작 부분에 음성으로 안내한다.
measurement:
  criteria: '내보낸 딥페이크 결과물마다 (1) 이미지: 이미지 안에 보이는 AI 생성 표시가 있다. (2) 영상: AI 생성 구간을 재생하는 동안 모든 시점에 화면에 AI 생성 표시가 보인다.
    (3) 음성: 재생 시작 후 첫 안내로 AI 생성 사실이 들린다. (4) 메타데이터·워터마크만 있고 보이거나 들리는 표시가 없는 결과물이 0개다(예술적·창의적 표현물 예외 제외). 서비스 화면
    안에서만 보여 주는 딥페이크는 AI-002 기준을 따른다.'
  method: 딥페이크 생성 기능의 산출물을 재생·표시하며 (1)~(4)를 수동 확인한다.
automation:
  feasibility: none
  checks: []
  note: '자동 검사 어려움 → 리뷰 체크리스트. 4단계: 영상 플레이어 컴포넌트 규격에 AI 표시 오버레이 slot을 필수로 둔다.'
rationale: 실제와 구분하기 어려운 생성물은 사용자를 속여 피해를 줄 수 있어 법이 명확한 인식 방식의 고지·표시를 요구한다.
sources:
- ref: KR_AI_BASIC_ACT
  locator: 제31조 제3항
  note: 실제와 구분하기 어려운 가상 결과물은 이용자가 명확하게 인식할 수 있는 방식으로 고지·표시. 예술·창의적 표현물은 전시·향유를 해치지 않는 방식 허용
- ref: KR_AI_BASIC_ACT_DECREE
  locator: 제23조 제3항
  note: 시각·청각 등을 통하거나 소프트웨어 등을 이용하여 쉽게 확인할 수 있는 방법, 주된 이용자의 나이·신체적·사회적 조건 고려
- ref: MSIT_AI_TRANSPARENCY_GUIDE
  locator: 외부 반출 시 표시 방법 예시 — 딥페이크 생성물, 이미지·동영상·음성 생성물
  note: 반출 딥페이크는 '사람이 직관적으로 인식할 수 있는 표시 방법 적용', 동영상은 'AI로 생성된 재생구간 전체에 로고 표출 등', 음성은 '재생시간 전체에 표시할 필요는 없으며 … 시작
    부분에'. 서비스 내 제공 시 딥페이크는 '일반 생성물과 동일한 표시 방법'(8쪽).
- ref: EU_AI_ACT_ART50
  locator: Art.50(4)
  note: 딥페이크 생성·조작 사실 공개 의무(배포자). 명백한 예술·창작·풍자·허구 작품은 감상을 해치지 않는 방식으로 존재만 공개
scope:
  level: situation
  targets:
  - 딥페이크 이미지·음성·영상 생성 결과
  - video
  - audio
exceptions:
- 예술적·창의적 표현물은 전시·향유를 저해하지 않는 완화된 방법(시간적으로 주요 콘텐츠와 차이를 두어 표시하거나 비가시적인 표시 방법 적용 등)을 쓸 수 있다(가이드라인 외부 반출 딥페이크 — '시간적으로
  주요 콘텐츠와 차이를 두어 표시하거나 비가시적인 표시 방법 적용 등'). 이 예외를 적용한 결과물은 측정 기준 (1)~(4) 대신 완화된 표시가 있는지 확인한다.
relations:
- type: refines
  id: AI-002
  note: 제31조 제3항 — 실제와 구분하기 어려운 결과물에 대한 강화된 표시.
- type: refines
  id: AI-003
  note: AI-003(반출 표시) 중 딥페이크는 기계 판독 표시만으로 대신할 수 없다.
examples:
  good:
  - lang: text
    code: '# 다운로드용 파일을 만들 때 서버에서 영상 프레임에 ''AI 생성'' 로고를 합성한다(이 영상은 전체가 AI 생성 구간)

      ffmpeg -i gen.mp4 -i ai-label.png -filter_complex "overlay=W-w-24:24" -c:a copy gen-export.mp4

      '
    note: 내보낸 영상 파일 자체에 AI 생성 재생 구간 전체 동안 로고가 보인다. 화면의 HTML 오버레이는 파일에 따라가지 않으므로 반출 기준이 되지 않는다.
  - lang: text
    code: '# 음성 파일 앞부분에 ''AI가 생성한 음성입니다'' 안내 멘트를 붙여 내보낸다

      ffmpeg -i ai-notice.wav -i gen-voice.wav -filter_complex "[0:a][1:a]concat=n=2:v=0:a=1" gen-voice-export.mp3

      '
    note: 내보낸 음성 파일이 안내 멘트로 시작한다(재생 내내 표시할 필요 없음).
  bad:
  - lang: text
    code: '# 내보낸 파일에 C2PA 메타데이터만 넣는다

      c2patool gen.mp4 -m manifest.json -o gen-export.mp4

      '
    note: 내보낸 파일에 C2PA 메타데이터만 있고 보이거나 들리는 AI 생성 표시가 없다.
needs_verification: false
verification_note: 'MSIT 투명성 가이드라인(2026-01, NIA 게시 PDF) 원문 대조 2026-10-18: 딥페이크는 사람이 인식할 수 있는 방법만, 동영상은 AI 생성 재생
  구간 전체 표시, 음성은 시작 부분 안내(전체 시간 표시 불필요) 확인 — ''전체 시간 동안 보이거나 들리게''를 매체별 요구로 고침(CF-054). 2026-10-18 독립 검토 반영: 매체별
  기준은 가이드라인 ''외부 반출'' 절에 있고 서비스 안 딥페이크는 일반 생성물과 같은 방법 — 범위를 반출로 고침(CF-054). 가이드라인 9쪽 딥페이크 생성물 표시 방법의 ''※ 인물의 특성
  합성, 딥페이크 등 오인･혼동 또는 피해 발생의 위험성이 있는 결과물의 경우, 해당 위험성을 고려한 추가적인 조치 필요'' 확인 — 추가 조치의 내용·방법을 가이드라인이 정하지 않아 측정 기준에 넣지
  않았다(판정 불가, 가이드 성격). 실존 인물 합성처럼 위험성이 있는 결과물은 이 룰의 표시에 더해 사업자가 위험성에 맞는 추가 조치를 정해야 한다(2026-10-18 독립 검토). 2026-10-18
  재검증: 가이드라인 예술적·창의적 표현물 완화 방법 ''시간적으로 주요 콘텐츠와 차이를 두어 표시하거나 비가시적인 표시 방법 적용 등'' 확인 — 예외에 비가시적 방법을 넣고 측정 기준 (4)에서
  제외. 예시를 반출 파일 기준으로 바꿈.'
korean_specific: true
