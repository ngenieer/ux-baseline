id: AI-006
category: AI
title: 신뢰도 표시 형식
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 'AI 결과의 신뢰도를 숫자(예: 80%)로 보여줄 때는 그 숫자가 무엇을 뜻하는지 설명을 함께 표시하고, 범주(높음·보통·낮음)로 보여줄 때는 범주마다 사용자가 할 행동을 함께 표시한다.'
measurement:
  criteria: '(1) 숫자 신뢰도 표시 요소마다 그 숫자의 의미를 설명하는 텍스트가 보이거나 aria-describedby·툴팁 버튼으로 연결돼 있다. (2) 범주 신뢰도 표시는 정의된 각 범주에
    대해 권장 행동 텍스트(예: ''낮음 — 원문을 확인하세요'')가 있다. (3) 범주 표시(배지 등)가 보이는 모든 화면 상태(스트리밍·생성 중, 중단, 완료)에서 다음 중 하나가 참이다: (가)
    그 범주의 행동 텍스트가 범주 표시와 같은 항목 요소 안에 보인다. (나) 행동 텍스트(범례 등)가 같은 문서에 보이고(hidden·display:none 아님) 범주 표시 요소가 aria-describedby로
    그 텍스트를 가리킨다. 범주 표시는 보이는데 행동 텍스트가 숨겨진 상태(예: 완료 뒤에만 범례를 보임)가 하나라도 있으면 실패.'
  method: 신뢰도 표시 컴포넌트의 모든 값(숫자·각 범주)과, 범주 표시가 나타나는 모든 화면 상태(스트리밍 중·중단·완료)를 렌더링해 (1)~(3)을 확인한다.
automation:
  feasibility: none
  checks: []
  note: 자동 검사 어려움. 4단계 컴포넌트 규격(신뢰도 배지에 설명 slot 필수)으로 강제.
rationale: 확률 숫자는 사용자가 높은지 낮은지 판단하기 어렵고, 범주는 무엇을 해야 하는지 알려 주지 않으면 결정에 도움이 되지 않는다.
sources:
- ref: PAIR_GUIDEBOOK
  locator: Explainability + Trust — Decide how best to show model confidence (Categorical, Numeric)
  note: 'Numeric: ''Make sure to give enough context for users to understand what the percentage means'', Categorical:
    ''Clearly indicate what action a user should take under each category of confidence'''
scope:
  level: component
  targets:
  - 신뢰도 배지
  - AI 결과 신뢰도 표시
exceptions:
- 신뢰도가 사용자 결정에 영향을 주지 않거나 오해·과신을 부를 수 있으면 신뢰도를 표시하지 않는 것을 고려한다(PAIR — 이 룰은 표시하는 경우에만 적용).
relations: []
examples:
  good:
  - lang: html
    code: '<p>일치도 <strong>높음</strong> — 그대로 써도 됩니다.</p>

      <p>일치도 <strong>낮음</strong> — 원문 문서를 확인하세요.</p>'
    note: 신뢰도 범주마다 사용자가 할 행동을 함께 적었다.
  - lang: html
    code: '<li>신청 기한은 30일입니다. <span class="badge badge--warning" aria-describedby="lg-low">확인 필요</span></li>

      <!-- 범례는 스트리밍 중에도 보인다 -->

      <dl class="confidence-legend"><dt>확인 필요</dt><dd id="lg-low">AI 확신이 낮은 항목입니다. 근거 원문과 비교해 확인하세요.</dd></dl>'
    note: 범주 배지가 보이는 모든 상태에서 범례의 행동 텍스트가 보이고, 배지가 aria-describedby로 그 텍스트를 가리킨다.
  bad:
  - lang: html
    code: <span class="badge">87.3%</span> <!-- 무엇의 87%인지 설명 없음 -->
    note: 숫자만 있고 무엇의 87.3%인지 설명이 없다.
  - lang: html
    code: '<li>신청 기한은 30일입니다. <span class="badge badge--warning">확인 필요</span></li>

      <!-- 생성이 끝난 뒤에만 hidden 을 지운다 -->

      <dl class="confidence-legend" hidden><dt>확인 필요</dt><dd>근거 원문과 비교해 확인하세요.</dd></dl>'
    note: 스트리밍 중에는 배지만 보이고 범주별 행동 텍스트는 완료 뒤에만 보인다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(PAIR Explainability+Trust 장 curl): Numeric ''Make sure to give enough context
  for users to understand what the percentage means'', Categorical ''Clearly indicate what action a user should
  take under each category of confidence'', ''You might choose not to indicate model confidence if: The confidence
  level isn''t impactful …'' 확인. 참고 사례(reference_system) + 명령형 → SHOULD. (2026-10-18 T5 검토 반영) 범주 배지는 스트리밍 중에 보이는데
  범주별 행동 설명(범례)은 완료 뒤에만 보여, 둘이 동시에 보여야 하는지 판정이 갈렸다 → 측정 기준 (3)을 추가해 범주 표시가 보이는 모든 상태에서 행동 텍스트가 같은 항목 안에 보이거나, 같은
  문서에 보이는 텍스트를 aria-describedby로 가리키게 했다. 검토 제안의 ''aria-describedby 연결만으로 충족''은 화면을 보는 사용자에게 행동이 보이지 않아 PAIR ''Clearly
  indicate what action'' 보다 약해지므로 연결하는 텍스트도 보이도록 했다.'
korean_specific: false
tags:
- research-ai
