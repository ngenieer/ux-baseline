id: AI-017
category: AI
title: AI 기능 전역 제어
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 사용자가 요청하지 않아도 동작하는 AI 기능(자동 제안·자동 요약·자동 실행 등)은 설정 화면에서 끄고 켤 수 있게 하고, 끈 설정을 다시 켤 때까지 유지한다.
measurement:
  criteria: (1) 사용자가 직접 호출하지 않아도 나타나는 각 AI 기능에 대해 설정 화면에 끄기·켜기 컨트롤(개별 또는 전체)이 있다. (2) 끄면 해당 기능의 UI·자동 동작이 나타나지 않고,
    로그아웃·재로그인 뒤에도 꺼진 상태가 유지된다.
  method: AI 기능 목록을 만들어 설정에서 각 기능을 끈 뒤 해당 화면과 재로그인 후 동작을 확인한다.
automation:
  feasibility: none
  checks: []
  note: '자동 검사 어려움(설정 화면 존재 여부 리뷰). 4단계: 기능 플래그별 E2E.'
rationale: 원치 않는 AI 동작을 매번 무시해야 하면 과업이 방해받는다. 사용자가 AI의 동작 범위를 전역으로 정할 수 있어야 한다.
sources:
- ref: HAX_GUIDELINES_POSTER
  locator: G17 Provide global controls
  note: '''Allow the user to globally customize what the AI system monitors and how it behaves.'''
- ref: HAX_GUIDELINES_POSTER
  locator: G8 Support efficient dismissal
  note: '''Make it easy to dismiss or ignore undesired system services.'''
scope:
  level: situation
  targets:
  - 자동 제안
  - 자동 요약
  - AI 자동 실행
  - 설정 화면
exceptions:
- '사용자가 직접 호출해야만 동작하는 AI 기능(예: AI 채팅 서비스 자체)은 이 룰의 대상이 아니다.'
relations: []
examples:
  good:
  - lang: html
    code: "<fieldset><legend>AI 기능</legend>\n  <label><input type=\"checkbox\" role=\"switch\" checked> 입력 중 자동\
      \ 제안</label>\n  <label><input type=\"checkbox\" role=\"switch\" checked> 문서 자동 요약</label>\n</fieldset>"
    note: 설정 화면에서 자동 동작하는 AI 기능을 기능별로 끄고 켤 수 있다.
  bad:
  - lang: html
    code: "<div class=\"ai-suggest\" role=\"status\">\n  자동 제안: 「신청서 제목을 이렇게 바꿔 보세요」\n  <button type=\"button\"\
      >닫기</button>\n</div>\n<!-- 설정 화면에 끄기 컨트롤이 없어 다음 입력 때 다시 나타남 -->"
    note: 자동 제안을 그때그때 닫을 수만 있고 설정에서 끌 수 없다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(HAX 포스터 PDF curl): G17 ''Allow the user to globally customize what the AI system
  monitors and how it behaves.'', G8 ''Make it easy to dismiss or ignore undesired system services.'' 확인. 1단계 메모의
  ''핵심 기능 자체가 AI인 서비스'' 문제는 적용 대상을 ''사용자가 요청하지 않아도 동작하는 기능''으로 한정해 해결(예외 칸). ''재로그인 뒤 유지''는 ''전역 설정''의 해석.'
korean_specific: false
tags:
- research-ai
