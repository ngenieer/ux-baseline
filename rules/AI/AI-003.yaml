id: AI-003
category: AI
title: 반출 AI 생성물 표시
stage: platformed
status:
  value: confirmed
type: rule
strength: MUST
statement: AI 생성 결과물을 다운로드·공유로 서비스 밖으로 내보낼 때는 결과물 자체에 사람이 인식할 수 있는 표시(가시 로고·머리말·음성 안내)나 기계 판독 표시(메타데이터·워터마크)를 넣고,
  기계 판독 표시만 쓰면 AI 생성 사실을 알리는 안내 문구를 내보내기 화면에 1회 이상 보여준다.
measurement:
  criteria: '(0) 판정 대상: 결과물을 파일로 저장하게 하는 기능(다운로드·내보내기)과 서비스 밖 수신자에게 보내는 기능(공유 링크·메일·메신저 전송). 이용자가 클립보드(복사·붙여넣기,
    복사 버튼 포함)로 텍스트 결과물을 옮기는 것은 대상이 아니다(가이드라인 15쪽). (1) 내보낸 파일마다 보이는 AI 표시가 있거나 기계 판독 표시(예: C2PA 매니페스트, XMP 메타데이터)가
    들어 있다. (2) 기계 판독 표시만 있는 경우 다운로드·공유 버튼을 누른 뒤 파일이 저장·전송되기 전 화면에 AI 생성 사실을 알리는 텍스트가 1회 이상 보인다. (3) 딥페이크 결과물은 (1)의
    기계 판독 표시만으로 통과하지 않는다 — AI-004로 판정한다(예술적·창의적 표현물 예외 제외).'
  method: 내보내기 기능마다 산출 파일을 열어 표시·메타데이터를 확인하고, 내보내기 흐름에서 안내 문구 노출을 확인한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 커스텀: 테스트에서 내보낸 파일의 메타데이터(C2PA·XMP) 존재를 검사하고 E2E로 안내 문구 노출을 검사. 파일 표시 삽입은 백엔드 요구라 UI 검사 범위 밖.'
rationale: 서비스 밖으로 나간 결과물은 화면 레이블이 따라가지 않으므로 결과물 자체에 표시가 있어야 받은 사람도 AI 생성 사실을 알 수 있다.
sources:
- ref: KR_AI_BASIC_ACT
  locator: 제31조 제2항
- ref: KR_AI_BASIC_ACT_DECREE
  locator: 제23조 제2항
  note: '''기계가 판독할 수 있는 방법. 이 경우 … 생성되었다는 사실을 1회 이상 안내 문구·음성 등으로 제공해야 한다'''
- ref: EU_AI_ACT_ART50
  locator: Art.50(2)
  note: 합성 오디오·이미지·영상·텍스트 출력의 기계 판독·탐지 가능 표시 의무(제공자). 표준 편집 보조 기능 등 예외
- ref: MSIT_AI_TRANSPARENCY_GUIDE
  locator: 표시 방법 — 외부 반출 시 표시 방법 예시 1) 텍스트 생성물, 적용대상 (15쪽)
  note: '''문자･부호로 구성된 텍스트 결과물 다운로드･공유 등 기능 제공 시 ※ 이용자가 클립보드(Copy & Paste) 기능을 이용하는 경우는 해당하지 않음'''
scope:
  level: situation
  targets:
  - 다운로드 버튼
  - 공유 버튼
  - AI 생성 파일 내보내기
exceptions:
- 서비스명·결과물 표시 문구 등으로 생성형 AI 활용 사실이 명백한 경우(한국 시행령 제23조 제4항 제1호).
- AI가 표준 편집 보조 기능만 하거나 입력 데이터·의미를 실질적으로 바꾸지 않는 경우(EU 50(2) — EU 제공 서비스).
- 딥페이크(실제와 구분하기 어려운 결과물)는 기계 판독 표시만으로 대신하지 않고 사람이 인식할 수 있는 표시를 넣는다(AI-004). 단, 예술적·창의적 표현물인 딥페이크는 전시·향유를 저해하지 않는
  완화된 방법(시간적으로 주요 콘텐츠와 차이를 두어 표시하거나 비가시적인 표시 방법 적용 등)을 쓸 수 있다(AI-004 예외).
- 이용자가 클립보드(Copy & Paste) 기능으로 텍스트 결과물을 옮기는 경우 — 서비스의 '복사' 버튼도 클립보드 기능으로 본다(과기정통부 가이드라인 '외부 반출 시 표시 방법 예시 1) 텍스트
  생성물' 적용대상 주석).
relations:
- type: refines
  id: AI-002
  note: 제31조 제2항 표시 의무를 서비스 밖 반출에 적용.
- type: depends
  id: AI-004
  note: 딥페이크 반출은 사람이 인식할 수 있는 표시만(AI-004).
examples:
  good:
  - lang: html
    code: "<dialog open aria-labelledby=\"ex-t\">\n  <h2 id=\"ex-t\">이미지 저장</h2>\n  <p>이 이미지는 AI로 생성됐으며, 파일에 AI\
      \ 생성 정보(메타데이터)가 포함됩니다.</p>\n  <button>저장</button>\n</dialog>"
    note: 기계 판독 표시를 쓰면서 저장 전 대화상자에 AI 생성 안내 문구를 보여준다.
  bad:
  - lang: html
    code: "<dialog open aria-labelledby=\"ex-t\">\n  <h2 id=\"ex-t\">이미지 저장</h2>\n  <button>저장</button>\n</dialog>\n\
      <!-- 파일에 메타데이터만 넣고 AI 생성 사실은 어디에도 안내하지 않음 -->"
    note: 기계 판독 표시만 넣고 AI 생성 안내 문구를 보여주지 않는다.
needs_verification: false
verification_note: '2026-10-18 원문 대조: 한국 AI 기본법은 law.go.kr lsInfoR.do?lsiSeq=282791(법률 제21311호, 2026-01-20 일부개정,
  시행 2026-07-21), 시행령은 lsiSeq=288781(대통령령 제36580호, 시행 2026-08-20)을 curl로 받아 조문을 직접 읽음. 시행령 제23조 제2항 제2호 ''1회 이상
  안내 문구·음성 등으로 제공'' 확인 — 안내 시점을 ''내보내기 화면''으로 정한 것은 체계 선택(원문에 시점 없음). EU AI Act 원문은 EU 출판국 공식 사본(publications.europa.eu
  cellar dc8116a1-3fe6-11ef-865a-01aa75ed71a1, OJ L 2024/1689 영문 HTML)을 curl로 받아 Article 50을 직접 읽음 — 50(2) 기계 판독
  표시·예외 확인. 1단계 statement의 ''복사''는 출처(MSIT 보도)가 다운로드·공유만 언급해 뺐다. MSIT 매체별 방식은 원문 미확인(보조 출처, statement에 수치 없음). registry의
  EU_AI_ACT_ART50·KR_AI_BASIC_ACT·KR_AI_BASIC_ACT_DECREE는 아직 verified=false — 갱신 제안은 제안 파일 notes. 2026-10-18 확정
  시 미검증 출처 MSIT_AI_TRANSPARENCY_GUIDE 제외(나머지 검증된 출처로 근거 성립). (2026-10-18 T5 검토 반영) ''다운로드·공유로 서비스 밖으로 내보낼 때''에 클립보드
  복사가 드는지 판정이 갈렸다 → 가이드라인 PDF(registry 의 sha256 f3c9206f… 와 일치하는 사본)를 다시 열어 15쪽 텍스트 생성물 적용대상 주석 ''이용자가 클립보드(Copy
  & Paste) 기능을 이용하는 경우는 해당하지 않음''을 확인했다. 측정 기준 (0)과 예외로 텍스트 클립보드 복사를 대상에서 뺐다. 검토 제안(''복사 텍스트 첫 줄·끝에 AI 생성 표시'' 요구)은
  원문 범위를 넘어 채택하지 않았다 — 복사 텍스트에 표시를 넣는 것은 금지가 아니며 이 룰의 판정과 무관하다. 출처 목록에 MSIT_AI_TRANSPARENCY_GUIDE(현재 verified=true)를
  다시 넣었다. ''복사 버튼''을 클립보드 기능으로 본 것은 해석.'
korean_specific: true
