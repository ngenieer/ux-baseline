id: COPY-003
category: COPY
title: 설명적인 제목과 레이블
stage: platformed
status:
  value: confirmed
type: rule
strength: MUST
statement: 제목(h1~h6, role=heading)과 폼 컨트롤·컴포넌트의 레이블은 그 영역의 주제나 컨트롤의 목적을 밝히는 말로 쓴다.
measurement:
  criteria: (1) 제목과 레이블 텍스트가 비어 있지 않다. (2) '제목', '내용', '항목 1', '입력', '선택', '기타', '섹션', '메뉴' 같은 자리표시어만으로 된 제목·레이블이
    0건이다. (3) 각 제목은 바로 아래 영역의 내용과, 각 레이블은 연결된 컨트롤이 받는 값과 같은 대상을 가리킨다(점검자가 제목·레이블만 읽고 영역·입력값을 예측해 실제와 대조).
  method: 제목 목록(헤딩 구조)과 레이블 목록을 뽑아 (1)(2)를 확인하고, (3)은 제목·레이블만 보고 내용을 예측한 뒤 실제 영역·입력값과 대조하는 수동 점검으로 판정한다.
automation:
  feasibility: none
  checks: []
  note: 'WCAG 추출본 기준 2.4.6에 매핑된 axe 규칙 없음. 4단계 커스텀 검사: 제목·레이블 텍스트가 자리표시어 사전과 일치하면 실패. (3)은 수동.'
rationale: 제목과 레이블이 내용을 설명해야 사용자가 페이지 구조를 훑어 원하는 영역을 찾고, 입력할 값을 예측할 수 있다. 보조기술 사용자는 제목 목록으로 페이지를 탐색한다.
sources:
- ref: WCAG22
  locator: SC 2.4.6 Headings and Labels (Level AA)
  note: https://www.w3.org/TR/WCAG22/#headings-and-labels
- ref: WCAG22_UNDERSTANDING
  locator: https://www.w3.org/WAI/WCAG22/Understanding/headings-and-labels.html
- ref: KWCAG22
  locator: 검사항목 6.4.2
- ref: KRDS
  locator: 컴포넌트 (여러 페이지) (가이드라인 PDF 2025.08 587·607·530·275·544·730쪽; 음성지원 항목은 PDF에 없음)
  note: '같은 요구를 다루는 KRDS 컴포넌트: 단계 표시기, 도움 패널, 라디오 버튼, 메인 메뉴, 음성지원, 체크박스, 화면 크기 조정 — 상세는 sources/extracts/KRDS-components.yaml'
- ref: WEBDEV_OFFLINE
  locator: Use plain language — avoid 'offline' for non-technical users
  note: '관련 요구(같은 요구 아님, 별도 룰 후보): 비기술 사용자에게 ''offline'' 같은 기술 용어 대신 쉬운 말.'
scope:
  level: global
  targets:
  - h1
  - h2
  - h3
  - h4
  - h5
  - h6
  - '[role=heading]'
  - label
  - legend
  - '[aria-label]'
  - '[aria-labelledby]'
exceptions: []
relations:
- type: depends
  id: FORM-004
  note: 레이블의 존재는 FORM-004(WCAG 3.3.2). 이 룰은 레이블 문구가 목적을 설명하는지.
- type: depends
  id: A11Y-007
  note: 제목의 마크업은 A11Y-007(WCAG 1.3.1).
examples:
  good:
  - lang: html
    code: '<h2>신청 자격</h2>

      <label for="birth">생년월일</label><input id="birth" name="birth">

      '
    note: 제목·레이블이 영역 주제와 입력값(생년월일)을 밝힌다
  bad:
  - lang: html
    code: '<h2>내용</h2>

      <label for="f1">입력</label><input id="f1" name="birth">

      '
    note: '''내용''·''입력'' 같은 자리표시어라 무엇을 담는지 알 수 없다'
needs_verification: false
verification_note: '2026-10-18 원문 대조(sources/extracts/WCAG22-A-AA.yaml): SC 2.4.6 ''Headings and labels describe
  topic or purpose.'' 확인. 원문은 제목·레이블이 있을 때의 문구 요구이며 존재 자체는 요구하지 않는다(존재는 FORM-004·A11Y-007). KWCAG 2.2 대응 항목 번호는
  비공식 HTML 판 기준 매핑 — 공식 원문 대조 전(registry KWCAG22 verified=false). 룰의 요구는 WCAG 원문만으로 성립. KR_ADMIN_REG·WEBDEV_OFFLINE
  출처는 1단계에서 ''약어·전문용어 풀어 쓰기'' 후보를 이 룰로 병합한 것인데, 2.4.6과 같은 요구가 아니다 — 별도 룰 후보로 제안 파일 notes에 적음(출처는 지우지 않고 관련 요구로 표시).
  확정 시 미검증 출처 KR_ADMIN_REG 제외(2026-10-18).'
korean_specific: false
tags:
- wcag22
- level-aa
- new-in-2.0
- kwcag22
- krds
