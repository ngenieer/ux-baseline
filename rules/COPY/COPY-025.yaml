id: COPY-025
category: COPY
title: 링크·버튼 이미지는 기능과 일치
stage: platformed
status:
  value: confirmed
type: guide
strength: MAY
statement: 링크·버튼이거나 그 일부인 이미지에는 그 링크·버튼의 용도·목적·기능과 일치하는 이미지·상징을 쓴다.
measurement:
  criteria: '점검 질문: 링크·버튼 안 이미지(아이콘 포함)가 표현하는 대상이 링크 목적지나 버튼 동작과 같은가? 예: 내려받기 버튼에 ''내려받기'' 상징, 인쇄 버튼에 프린터 상징.'
  method: 링크·버튼 안 이미지 목록을 뽑아 이미지 의미와 링크·버튼 기능을 나란히 비교한다.
automation:
  feasibility: none
  checks: []
  note: 의미 일치 판단은 사람이 한다.
rationale: 이미지 상징과 기능이 어긋나면 사용자가 동작을 잘못 예측한다(KRDS 이미지).
sources:
- ref: KRDS
  locator: 컴포넌트 > 이미지 > 사용성 가이드라인 (가이드라인 PDF 2025.08 419쪽)
  note: https://www.krds.go.kr/html/site/component/component_04_08.html
scope:
  level: component
  targets:
  - a img
  - button img
  - a svg
  - button svg
exceptions: []
relations:
- type: depends
  id: COPY-004
  note: 같은 기능에는 같은 아이콘(COPY-004)
examples:
  good:
  - lang: html
    code: '<button type="button"><svg aria-hidden="true"><!-- 프린터 --></svg>인쇄</button>

      '
    note: 인쇄 버튼에 프린터 상징을 쓴다
  bad:
  - lang: html
    code: '<button type="button"><svg aria-hidden="true"><!-- 별(즐겨찾기) --></svg>인쇄</button>

      '
    note: 인쇄 버튼에 즐겨찾기(별) 상징을 쓴다
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): 이미지(component_04_08) ''이미지 자체가 링크나 버튼으로
  사용되거나 링크, 버튼의 일부로 포함될 경우 링크, 버튼의 용도, 목적, 기능과 일치하는 이미지, 상징을 사용하는 것이 중요하다'' 확인. ''중요하다''는 ''해야 한다''가 아닌 권고 표현으로
  보아 MAY. 의미 일치 판단이 필요해 type: guide.'
korean_specific: false
tags:
- krds
- krds-component
