id: COPY-057
category: COPY
title: 시각 표기(쌍점·24시각제)
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 시각을 숫자로 쓸 때는 시와 분 사이에 쌍점을 앞뒤 붙여 쓰고('14:30', '오전 10:20'), 공공 서비스 화면에서는 24시각제로 쓴다.
measurement:
  criteria: '(1) 화면의 숫자 시각이 정규식 \d{1,2}:\d{2}(:\d{2})? 형식이고 쌍점 앞뒤에 공백이 없다(''14 : 30'' 0건). (2) 공공 서비스에서는 시 값이 0~23이고
    ''오전·오후''를 붙이지 않는다.'
  method: 시각 포맷 함수 출력과 화면 텍스트를 정규식으로 검사한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 커스텀 검사: 시각 포맷 함수 단위 테스트(hour12=false, ''HH:mm''), 렌더링 텍스트에서 ''\d+ +: *\d+|\d+ *: +\d+'' 검출.'
rationale: 한글 맞춤법은 시와 분을 구별할 때 쌍점을 쓰고 앞뒤를 붙여 쓴다. 공문서 작성 규정은 시·분을 24시각제로 쓰도록 한다.
sources:
- ref: KR_HANGUL_ORTHO
  locator: 문장 부호 6. 쌍점 (3) 시와 분 구별, [붙임] 앞뒤 붙여 씀
- ref: KR_ADMIN_REG
  locator: 제7조 제5항(시·분은 24시각제, 쌍점)
scope:
  level: global
  targets:
  - 화면에 표시되는 시각 텍스트
  - time
exceptions:
- 공공 서비스가 아니면 12시각제('오전 10:20')를 쓸 수 있다 — 한글 맞춤법 예시가 '오전 10:20'을 쓴다.
relations:
- type: depends
  id: COPY-056
  note: 날짜와 함께 쓸 때 날짜 표기는 COPY-056
examples:
  good:
  - lang: html
    code: '<p>점검 시간: <time datetime="2026-10-20T02:00">2026. 10. 20. 02:00</time>~<time datetime="2026-10-20T06:00">06:00</time></p>

      '
    note: 24시각제로 쌍점 앞뒤를 붙여 쓴다
  bad:
  - lang: html
    code: '<p>점검 시간: 2026. 10. 20. 새벽 2시 ~ 오전 6 : 00</p>

      '
    note: '''새벽 2시''와 ''오전 6 : 00''처럼 표기가 섞이고 쌍점 앞뒤를 띄웠다'
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 국립국어원 한글 맞춤법 문장 부호 페이지를 받아 읽음): 쌍점 (3) ''시와 분, 장과 절 등을 구별할 때 쓴다. 예 오전
  10:20'', 띄어쓰기 ''(3)과 (4)에서는 쌍점의 앞뒤를 붙여 쓴다'' 확인 — 쌍점 부분은 확인 완료. 24시각제 요구는 KR_ADMIN_REG(행정업무규정 제7조 제5항, 공문서 대상)
  근거인데 law.go.kr 원문을 열지 못함(registry verified=false) → needs_verification: true. 공문서 규정을 웹 UI에 적용하는 것은 유추라 공공 서비스로
  범위를 한정하고 그 밖에는 12시각제 허용(어문 규범 예시). 강도 SHOULD. 2026-10-18 law.go.kr 원문(lsiSeq=290525, 시행 2026-10-02) 제7조 제5항 ''시ㆍ분은
  24시각제에 따라 숫자로 표기하되, 시ㆍ분의 글자는 생략하고 그 사이에 쌍점을 찍어 구분한다'' 확인.'
korean_specific: true
tags:
- research-state_copy_resp
