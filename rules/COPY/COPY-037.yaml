id: COPY-037
category: COPY
title: 두 언어 전환 링크의 레이블
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 두 언어를 오가는 링크형 언어 변경은 각 화면에서 전환될 상대 언어의 이름을 표시하고, 레이블을 한 언어로 고정하거나 현재 언어 이름을 표시하지 않는다.
measurement:
  criteria: '언어 A 화면의 언어 변경 링크 텍스트가 언어 B의 자기 이름이고, 언어 B 화면의 링크 텍스트가 언어 A의 자기 이름이다(예: 한국어 화면 ''English'', 영어 화면 ''한국어'').'
  method: 각 언어 화면에서 언어 변경 링크 텍스트와 href의 언어를 확인한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 E2E 검사: 각 언어 페이지에서 언어 변경 링크의 hreflang과 텍스트가 상대 언어의 자기 이름인지 비교.'
rationale: 링크 레이블을 반대로 주거나 한 언어로 고정하면, 현재 언어를 읽지 못하는 사용자가 자기 언어로 가는 링크를 찾지 못한다(KRDS 언어 변경).
sources:
- ref: KRDS
  locator: 컴포넌트 > 언어 변경 > 사용성 가이드라인 (가이드라인 PDF 2025.08 720쪽)
  note: https://www.krds.go.kr/html/site/component/component_10_01.html
scope:
  level: component
  targets:
  - 언어 변경(링크 유형)
exceptions: []
relations:
- type: depends
  id: COPY-015
  note: 언어 이름은 그 언어로(COPY-015)
examples:
  good:
  - lang: html
    code: '<!-- 한국어 화면 --><a href="/en/" hreflang="en" lang="en">English</a>

      <!-- 영어 화면 --><a href="/ko/" hreflang="ko" lang="ko">한국어</a>

      '
    note: 각 화면에서 전환될 상대 언어 이름을 그 언어로 표시한다
  bad:
  - lang: html
    code: '<!-- 한국어 화면 --><a href="/en/" hreflang="en" lang="en">English</a>

      <!-- 영어 화면: 전환될 언어가 아니라 현재 언어 이름을 표시 --><a href="/ko/" hreflang="ko" lang="en">English</a>

      '
    note: 영어 화면에서도 현재 언어 이름 'English'를 그대로 표시한다
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): 언어 변경(component_10_01) ''링크 유형의 언어 변경
  방식을 사용할 때, 두 언어 간 링크 레이블을 반대로 제공하거나 하나의 언어로만 고정하여 제공하지 않도록 유의해야 한다 ... 한국어 화면에서 링크 레이블은 English, 영어 화면에서 링크 레이블은
  한국어'' 확인. 강도: ''유의해야 한다'' → SHOULD + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
