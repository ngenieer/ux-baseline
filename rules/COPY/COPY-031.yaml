id: COPY-031
category: COPY
title: 태그 레이블 2단어
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 태그 레이블은 2단어(띄어쓰기로 나뉜 어절 2개) 이내로 쓰고 줄바꿈이 생기지 않게 한다.
measurement:
  criteria: 태그 레이블 텍스트를 공백으로 나눈 어절 수 ≤ 2이고, 지원 화면 너비마다 태그 요소의 줄 수가 1이다.
  method: 태그 텍스트를 공백 기준으로 세고, 중단점별로 줄 수를 측정한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 커스텀 검사: 태그 컴포넌트 textContent.trim().split(/\s+/).length ≤ 2, getClientRects().length == 1.'
rationale: 태그는 주제를 빠르게 훑어보게 하는 요소라 간결해야 하고 줄바꿈되면 태그 경계가 흐려진다(KRDS 태그).
sources:
- ref: KRDS
  locator: 컴포넌트 > 태그 > 사용성 가이드라인 (가이드라인 PDF 2025.08 563쪽)
  note: https://www.krds.go.kr/html/site/component/component_06_04.html
scope:
  level: component
  targets:
  - 태그
exceptions: []
relations: []
examples:
  good:
  - lang: html
    code: '<ul class="tags"><li class="tag">주거 지원</li><li class="tag">청년</li></ul>

      '
    note: 태그 레이블이 2어절 이하다
  bad:
  - lang: html
    code: '<ul class="tags"><li class="tag">만 19세 이상 34세 이하 무주택 청년</li></ul>

      '
    note: 태그 레이블이 6어절이라 줄바꿈된다
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): 태그(component_06_04) ''레이블은 2단어 이내로 구성하고
  텍스트 줄 바꿈이 발생하지 않도록 해야 한다'' 확인. 강도: KRDS ''해야 한다·않는다'' 표현 → SHOULD + public-sector-must(정책 2). 원문은 ''단어''를 정의하지
  않음 — 한국어에서는 띄어쓰기 단위(어절)로 세기로 정함(이 체계의 해석).'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
