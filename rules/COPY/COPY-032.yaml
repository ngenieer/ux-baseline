id: COPY-032
category: COPY
title: 토글 레이블 품사
stage: platformed
status:
  value: confirmed
type: guide
strength: SHOULD
statement: '토글 스위치 레이블은 명사형으로 쓰고(예: ''알림 수신''), 명사형으로는 켜고 끄는 대상이 드러나지 않으면 동사형으로 쓰거나 도움말을 붙인다.'
measurement:
  criteria: '점검 질문: (1) 레이블이 명사(구)인가? (2) 레이블만 읽고 스위치를 켜면 무엇이 바뀌는지 말할 수 있는가? (2)가 아니면 동사형 레이블 또는 도움말이 있는가?'
  method: 토글 레이블 목록을 놓고 점검 질문에 답한다. (2)는 서비스를 모르는 점검자가 판단한다.
automation:
  feasibility: none
  checks: []
  note: 의미 전달 판단은 사람이 한다.
rationale: 토글은 켜짐·꺼짐 상태를 고르는 컨트롤이라 대상을 명사로 밝히는 레이블이 상태와 함께 읽히기 쉽다. 명사로 의미가 불분명하면 무엇이 바뀌는지 직관적으로 알 수 있게 보완한다(KRDS
  토글 스위치).
sources:
- ref: KRDS
  locator: 컴포넌트 > 토글 스위치 > 사용성 가이드라인 (가이드라인 PDF 2025.08 574쪽)
  note: https://www.krds.go.kr/html/site/component/component_06_07.html
scope:
  level: component
  targets:
  - '[role=switch]'
  - 토글 스위치
exceptions: []
relations:
- type: depends
  id: FORM-043
  note: 레이블 하나로 설명하기 어려우면 라디오 버튼 2개로(FORM-043)
examples:
  good:
  - lang: html
    code: '<label><input type="checkbox" role="switch" checked> 야간 알림 수신</label>

      '
    note: 명사형 레이블로 켜고 끄는 대상(야간 알림 수신)을 밝힌다
  bad:
  - lang: html
    code: '<label><input type="checkbox" role="switch" checked> 켜기</label>

      '
    note: '''켜기''만으로는 무엇을 켜는지 알 수 없다'
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): 토글 스위치(component_06_07) ''레이블은 가능한 명사형으로
  작성한다. 명사형으로 작성하였을 때 의미가 명확하지 않다면 동사형으로 변경하거나, 부가적인 도움말을 제공'' 확인. 원문의 ''가능한''은 statement에서 뺐다(조건 ''명사형으로 대상이 드러나지
  않으면''으로 대체). 의미 명확성 판단이 필요해 type: guide. 강도: KRDS 단정형 서술(''~한다'') → SHOULD. ''해야 한다'' 표현이 아니므로 public-sector-must
  태그는 붙이지 않음.'
korean_specific: false
tags:
- krds
- krds-component
