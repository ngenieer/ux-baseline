id: COPY-030
category: COPY
title: 셀렉트 옵션 텍스트 길이
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 셀렉트 옵션 텍스트는 컨테이너와 옵션 목록 너비 안에 다 보이는 길이로 쓰고, 넘칠 수밖에 없으면 마우스 호버와 키보드 초점 모두에서 전체 내용을 보여주는 툴팁을 제공하며 title
  속성만으로 대신하지 않는다.
measurement:
  criteria: (1) 셀렉트 컨테이너(선택값 표시 영역)와 옵션 목록의 각 옵션 요소에서 scrollWidth ≤ clientWidth다. (2) 넘치는 옵션이 있으면 그 옵션에 호버했을 때와
    키보드로 이동했을 때 모두 전체 텍스트가 툴팁으로 보인다. (3) 전체 텍스트를 title 속성으로만 제공하지 않는다.
  method: 지원 화면 너비마다 셀렉트를 열어 옵션 넘침을 측정하고, 넘치는 옵션에서 호버·키보드 이동으로 툴팁 표시를 확인한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 커스텀 검사: 커스텀 셀렉트의 [role=option] scrollWidth > clientWidth 검출 후 툴팁 연결(aria-describedby) 여부 확인. 네이티브 select의
    option은 브라우저가 그리므로 넘침 측정 대상에서 제외하고 수동 확인.'
rationale: 옵션 텍스트가 잘리면 사용자가 선택하려는 옵션의 정확한 내용을 알 수 없다(KRDS 셀렉트). 잘린 텍스트는 전체를 볼 수단이 있어야 하며, title 속성은 키보드·터치에서 보이지
  않는다(WCAG Understanding 1.4.10 예시).
sources:
- ref: KRDS
  locator: 컴포넌트 > 셀렉트 > 사용성 가이드라인 (가이드라인 PDF 2025.08 555쪽)
  note: https://www.krds.go.kr/html/site/component/component_06_03.html
- ref: WCAG22_UNDERSTANDING
  locator: 'SC 1.4.10 Reflow — Examples: Alternative presentations to truncating content'
  note: '잘린 콘텐츠는 전체가 보이는 페이지 링크나 잘린 내용을 드러내는 수단을 제공하는 예 — 같은 요구: text-overflow: ellipsis나 line-clamp로 잘라 표시한 텍스트에는
    전체 텍스트를 볼 수 있는 수단(펼치기 버튼, 전체 내용 링크, 키보드 초점과 호버 모두에서 뜨는 툴팁 중 하나)을 제공하고 title 속성만으로 대신하지 않는다.'
scope:
  level: component
  targets:
  - select
  - '[role=listbox]'
  - '[role=option]'
  - 셀렉트
exceptions: []
relations:
- type: depends
  id: A11Y-010
  note: 툴팁은 호버·초점 추가 콘텐츠 요구(A11Y-010, WCAG 1.4.13)를 따른다
- type: depends
  id: A11Y-053
  note: title 속성 대신 툴팁 컴포넌트(A11Y-053)
examples:
  good:
  - lang: html
    code: '<li role="option" id="o3" aria-describedby="o3-tip">국민건강보험공단 서울강남지사…</li>

      <div role="tooltip" id="o3-tip">국민건강보험공단 서울강남지사 민원실(역삼동)</div>

      '
    note: 넘치는 옵션에 호버·초점 모두에서 보이는 툴팁으로 전체 텍스트를 제공한다
  bad:
  - lang: html
    code: '<li role="option" title="국민건강보험공단 서울강남지사 민원실(역삼동)">국민건강보험공단 서울강남지사…</li>

      '
    note: 전체 텍스트를 title 속성으로만 제공해 키보드 초점에서는 보이지 않는다
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): 셀렉트(component_06_03) ''옵션 텍스트는 컨테이너와 옵션
  목록 영역에 표현될 수 있는 ... 길이로 제공해야 한다 ... 불가피한 경우 해당 옵션에 툴팁을 제공하여 옵션에 마우스 또는 키보드가 접근했을 때 전체 내용이 표시되도록 해야 한다'' 확인. 강도:
  KRDS ''해야 한다·않는다'' 표현 → SHOULD + public-sector-must(정책 2). WCAG22_UNDERSTANDING(1.4.10 잘린 콘텐츠의 대안 표시 예) 출처는 1단계
  병합 기록대로 유지 — 해당 Understanding 페이지는 이번에 다시 열지 않았다(룰의 요구는 KRDS 원문만으로 성립).'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
