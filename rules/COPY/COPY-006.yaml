id: COPY-006
category: COPY
title: 확인 버튼에 동작명
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: '확인 대화상자의 실행 버튼 레이블에는 ''확인''·''예''·''네''·''OK'' 대신 실행할 동작을 동사로 쓴다(예: ''삭제'', ''신청 취소'', ''제출'').'
measurement:
  criteria: 확인 대화상자(role=alertdialog 또는 실행·취소 버튼을 가진 dialog) 안의 실행 버튼 텍스트가 '확인', '예', '네', 'OK', '동의'만으로 되어 있지 않고,
    대화상자 제목·본문이 묻는 동작을 가리키는 동사(구)다.
  method: 확인 대화상자를 띄우는 동작마다 대화상자를 열어 실행 버튼 텍스트를 금지어 목록과 대조하고, 본문의 동작과 같은 동작인지 확인한다.
automation:
  feasibility: partial
  checks:
  - tool: html-validate
    rule: ux-baseline/dialog-action-verb
    method: 버튼이 2개 이상인 dialog·alertdialog 안 버튼 텍스트가 확인·예·네·OK 인지 검사 (lint/plugins/html-ux-baseline.mjs)
  note: '4단계 커스텀 검사: [role=alertdialog] 및 확인 대화상자 규격 안 button 텍스트가 금지어(''확인'',''예'',''네'',''OK'') 중 하나와 완전히 일치하면
    실패.'
rationale: 버튼 레이블만 읽고도 무엇이 실행되는지 알면 본문을 읽지 않은 사용자도 결과를 예측해 잘못된 선택을 줄인다(KRDS 확인 패턴).
sources:
- ref: KRDS
  locator: 기본 패턴 > 확인 > 버튼 레이블 (가이드라인 PDF 2025.08 881쪽)
  note: https://www.krds.go.kr/html/site/global/global_11.html
- ref: KRDS
  locator: 컴포넌트 (여러 페이지) (가이드라인 PDF 2025.08 394·516쪽)
  note: '같은 요구를 다루는 KRDS 컴포넌트: 모달, 버튼 — 상세는 sources/extracts/KRDS-components.yaml'
scope:
  level: component
  targets:
  - '[role=alertdialog] button'
  - 확인 대화상자의 실행 버튼
exceptions: []
relations:
- type: depends
  id: STATE-003
  note: 확인 대화상자를 쓰는 조건·본문 구성은 STATE-003.
examples:
  good:
  - lang: html
    code: "<dialog role=\"alertdialog\" aria-labelledby=\"t\"><h2 id=\"t\">신청을 취소할까요?</h2>\n  <button type=\"button\"\
      >신청 취소</button><button type=\"button\">돌아가기</button></dialog>\n"
    note: 실행 버튼이 묻는 동작을 동사구 '신청 취소'로 쓴다
  bad:
  - lang: html
    code: "<dialog role=\"alertdialog\" aria-labelledby=\"t\"><h2 id=\"t\">신청을 취소할까요?</h2>\n  <button type=\"button\"\
      >예</button><button type=\"button\">아니요</button></dialog>\n"
    note: 실행 버튼이 '예'라 무엇이 실행되는지 버튼만 보고 알 수 없다
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): 확인 패턴(global_11) ''버튼의 레이블에 행동을 구체적으로
  설명한다'', 모달(component_04_05) ''버튼 레이블은 실행하고자 하는 기능, 확정하고자 하는 행동을 반영해야 한다'' 확인. 원문은 ''확인/예 금지''를 직접 쓰지 않음 — 금지어
  목록은 ''행동을 구체적으로 설명''을 판정 가능하게 바꾼 해석(확인·예는 행동을 설명하지 않음). 강도: KRDS ''해야 한다·않는다'' 표현 → SHOULD + public-sector-must(정책
  2). 코치마크 단일 단계의 ''확인'' 레이블(KRDS 코치마크)은 확인 대화상자가 아니므로 범위 밖.'
korean_specific: false
tags:
- krds
- public-sector-must
