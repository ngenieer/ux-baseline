id: COPY-041
category: COPY
title: 도움 패널 첫 화면
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 도움 패널을 처음 표시할 때는 패널의 용도와 활용 방법을 짧게 안내하는 기본 상태를 보여주고, 사용자가 아이콘 버튼을 누르기 전에는 상세 도움 정보를 표시하지 않는다. 도움 패널과
  따라하기 패널을 함께 제공하면 도움 패널 탭을 선택한 상태로 연다.
measurement:
  criteria: 페이지 로드 직후(사용자 조작 없음) (1) 도움 패널 본문이 기본 상태 콘텐츠(패널 용도·사용 방법 안내)다. (2) 특정 섹션의 상세 도움 콘텐츠가 표시되지 않는다. (3) 따라하기
    패널이 함께 있으면 도움 패널 탭이 aria-selected=true다.
  method: 도움 패널이 있는 페이지를 새로 열어 패널 본문과 탭 선택 상태를 확인한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 E2E 검사: 로드 직후 패널 본문의 data-state=default, 도움 패널 탭 aria-selected=true 확인.'
rationale: 사용자가 의도하지 않은 상황에서 상세 도움 정보가 나오지 않게 하고, 패널의 용도를 먼저 알려 이용을 유도한다(KRDS 도움 패널).
sources:
- ref: KRDS
  locator: 컴포넌트 > 도움 패널 > 사용성 가이드라인 (가이드라인 PDF 2025.08 603쪽)
  note: https://www.krds.go.kr/html/site/component/component_08_01.html
scope:
  level: component
  targets:
  - 도움 패널
exceptions: []
relations:
- type: depends
  id: NAV-059
  note: 로드 시 패널을 펼친 상태로 두는 요구는 NAV-059. 이 룰은 펼쳐진 패널의 첫 내용.
- type: depends
  id: STATE-024
  note: 다시 열 때 마지막 본 콘텐츠를 보이는 요구는 STATE-024
examples:
  good:
  - lang: html
    code: '<aside class="help-panel" aria-labelledby="hp"><h2 id="hp">도움말</h2>

      <p data-state="default">본문의 <span aria-hidden="true">ⓘ</span> 버튼을 누르면 해당 항목의 도움말이 여기에 표시됩니다.</p></aside>

      '
    note: 처음 열 때 패널 용도·사용 방법만 안내하는 기본 상태를 보여준다
  bad:
  - lang: html
    code: '<aside class="help-panel"><h2>소득 인정액 산정 방법</h2><p>…상세 계산식…</p></aside>

      '
    note: 조작 전부터 특정 항목의 상세 도움말을 표시한다
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): 도움 패널(component_08_01) ''도움 패널의 첫 화면은
  기본 상태로 제공한다. 도움 패널과 따라하기 패널이 함께 제공되어야 하는 경우, 도움 패널이 선택되어 있어야 한다. 콘텐츠는 도움 패널의 용도와 활용 방법을 간략하게 안내하여 ... 상세 도움 정보가
  제공되지 않도록 해야 한다'' 확인 — 탭 선택 조건을 statement에 넣음. 강도: KRDS ''해야 한다·않는다'' 표현 → SHOULD + public-sector-must(정책 2). 패널
  초기 상태 규칙이라 카테고리 재검토(STATE 제안).'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
