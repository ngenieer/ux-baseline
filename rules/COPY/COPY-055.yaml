id: COPY-055
category: COPY
title: 한 문장 한 내용
stage: platformed
status:
  value: confirmed
type: guide
strength: SHOULD
statement: 한 문장에는 하나의 내용만 쓰고, 조건·예외가 붙는 문장은 조건 문장과 결과 문장으로 나눈다.
measurement:
  criteria: '점검 질문(문장 = . ? ! 또는 종결어미로 끝나는 단위): (1) 대등 연결어미(-고, -며, -(으)나, -지만)로 서술어 2개 이상을 이어 서로 다른 행동·사실을 한 문장에
    넣지 않았는가? 넣었으면 실패. ''-거나''로 대안을 나열한 것(예: ''다시 생성을 누르거나 원문을 확인하세요'')은 행동 1개로 센다. 보조용언 구성(-고 있다, -고 싶다)과 인용(-다고,
    -라고)은 연결로 세지 않는다. (2) 종속절(이유 -(으)니·-(으)므로·-아서/-어서, 조건 -(으)면·-려면·-는 경우, 시간 -ㄴ 뒤·-기 전에, 양보 -아도/-어도, 배경 -는데)이 문장당
    1개 이하인가? 2개 이상이면 실패 — 조건 문장과 결과 문장으로 나눈다. (1)·(2)를 모두 통과하면 이 룰을 지킨 것이다. 예: ''AI 요약은 틀릴 수 있으니 근거 원문과 함께 확인하세요''(이유절
    1개 + 행동 1개)는 통과.'
  method: 안내·도움말·오류 문구를 문장 단위로 나누고 (1)·(2)의 연결어미에 표시한 뒤 개수를 센다. 형태소 분석으로 후보를 뽑을 수 있으나 연결어미의 기능(대등·종속·보조용언·인용) 구분은
    사람이 확인한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 보조 검사 후보: 형태소 분석으로 대등 연결어미(-고, -며, -(으)나, -지만)가 1개 이상이거나 종속 연결어미가 2개 이상인 문장을 검토 목록으로 뽑는다. 보조용언 구성·인용은
    사람이 걸러 낸다.'
rationale: 종속절과 예외가 많은 긴 문장은 요점을 흐리고 이해를 어렵게 한다. 생각을 나눠 각각 한 문장으로 쓰면 처리하기 쉽다(미국 연방 쉬운 언어 지침).
sources:
- ref: US_FPLG
  locator: III.b.1 Write short sentences (p.50)
- ref: DIGITALGOV_PL
  locator: Clear and short — Write short sentences
scope:
  level: global
  targets:
  - 안내 문구
  - 도움말
  - 오류 메시지
  - 본문
exceptions: []
relations: []
examples:
  good:
  - lang: html
    code: '<p>신청서를 제출하면 수정할 수 없습니다. 수정하려면 신청을 취소하세요. 취소한 뒤에는 다시 신청할 수 있습니다.</p>

      '
    note: 문장마다 종속절 1개 이하, 대등 연결 없음 — 조건 문장과 결과 문장을 나눴다
  - lang: html
    code: '<p>AI 요약은 틀릴 수 있으니 근거 원문과 함께 확인하세요.</p>

      '
    note: 이유절 1개가 행동 1개를 꾸민다 — 통과
  bad:
  - lang: html
    code: '<p>신청서는 제출 후 수정이 불가하며 수정이 필요한 경우에는 신청 취소 후 재신청하되 마감일이 지난 경우에는 재신청이 불가합니다.</p>

      '
    note: 조건·예외 절 3개를 한 문장에 이었다
  - lang: html
    code: '<p>메뉴 이름만 복사된 것은 아닌지 확인하고, 안내 문서의 본문 전체를 붙여 넣어 주세요.</p>

      '
    note: '''-고''로 서로 다른 행동 2개(확인하기, 붙여 넣기)를 한 문장에 이었다'
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 digital.gov ''Clear and short''를 받아 읽음): ''Express only one idea in each
  sentence'', ''Sentences loaded with dependent clauses and exceptions confuse the audience ... Break up your idea
  into parts and make each one the subject of its own sentence'', ''if 절을 별도 문장으로'' 예시 확인. US_FPLG PDF는 이번에 다시 열지
  않음(registry verified=true, 같은 문장). 문장 길이 수치(GOV.UK 25단어, 문단 150단어)는 영어 기준·관행이라 측정 기준에 쓰지 않음 — 국립국어원 ''쉬운 공공언어
  쓰기'' 수치는 원문 미확인. 판정에 사람 판단이 필요해 type: guide. 정부 가이드의 명령형 → SHOULD. (2026-10-18 T5 검토 반영) 점검 질문 (1)을 엄격히 읽으면 ''사실+이유+행동''
  문장(예: ''AI 요약은 틀릴 수 있으니 … 확인하세요'')도 ''서로 다른 행동·사실 2개''로 걸려 판정이 갈렸다 → 연결어미의 기능으로 판정하도록 고쳤다: 대등 연결(-고·-며·-(으)나·-지만)로
  이은 서술어 2개 이상은 실패, 종속절은 문장당 1개까지 허용, ''-거나'' 대안 나열은 행동 1개. digital.gov ''Express only one idea in each sentence'',
  ''Sentences loaded with dependent clauses and exceptions confuse'' 를 판정 가능한 조건으로 옮긴 것이며 ''종속절 1개까지''는 출처 수치가 아닌
  체계 판정 기준이다. 기존 좋은 예 둘째 문장(''취소하고 다시 신청하세요'')이 새 기준 (1)에 걸려 문장을 나눴다. 사람의 연결어미 기능 판단이 필요해 type: guide 유지.'
korean_specific: false
