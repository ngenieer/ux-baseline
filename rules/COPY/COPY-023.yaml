id: COPY-023
category: COPY
title: 모달 본문은 현재 과업 내용만
stage: platformed
status:
  value: confirmed
type: guide
strength: SHOULD
statement: 모달 본문에는 모달을 연 현재 과업·흐름에 관한 내용만 넣고, 홍보·다른 서비스 안내 같은 무관한 내용을 넣지 않는다.
measurement:
  criteria: '점검 질문: 모달 본문의 각 문단·요소가 모달 제목이 밝힌 목적(실행할 기능·확인할 정보)에 관한 것인가? 홍보 배너·다른 서비스 링크·설문 요청이 섞여 있지 않은가?'
  method: 모달마다 제목과 본문 요소를 나란히 놓고 각 요소가 제목의 목적에 필요한지 검토한다.
automation:
  feasibility: none
  checks: []
  note: 관련성 판단은 사람이 한다.
rationale: 모달은 사용자의 흐름을 막고 주의를 독점하므로 과업과 무관한 내용이 섞이면 목적을 파악하기 어렵다(KRDS 모달).
sources:
- ref: KRDS
  locator: 컴포넌트 > 모달 > 사용성 가이드라인 (가이드라인 PDF 2025.08 394쪽)
  note: https://www.krds.go.kr/html/site/component/component_04_05.html
scope:
  level: component
  targets:
  - dialog
  - '[role=dialog]'
  - 모달
exceptions: []
relations: []
examples:
  good:
  - lang: html
    code: '<dialog aria-labelledby="m"><h2 id="m">주소 검색</h2><p>도로명이나 건물명을 입력하세요.</p>…</dialog>

      '
    note: 모달 본문이 제목의 목적(주소 검색)에 관한 안내뿐이다
  bad:
  - lang: html
    code: '<dialog aria-labelledby="m"><h2 id="m">주소 검색</h2><p>지금 앱을 설치하면 더 편리합니다!</p><a href="/app">앱 설치</a>…</dialog>

      '
    note: 주소 검색 모달에 앱 설치 홍보를 섞었다
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): 모달(component_04_05) ''본문에는 현재 플로(Flow)나
  과업과 상관없는 내용을 포함하지 않아야 한다'' 확인. 강도: ''않아야 한다'' → SHOULD + public-sector-must. 관련성 판단이 필요해 type: guide.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
