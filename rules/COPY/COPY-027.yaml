id: COPY-027
category: COPY
title: 목록 항목 어투 통일
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 같은 수준의 목록 항목은 같은 어투로 쓴다. 첫 항목을 서술식(종결어미로 끝나는 문장)으로 썼으면 같은 수준의 모든 항목을 서술식으로, 개조식(명사·명사형으로 끝남)으로 썼으면 모두
  개조식으로 쓴다.
measurement:
  criteria: '판정 대상: [data-ai-output] 밖에 있는 ul·ol(사람이 쓴 정적 목록). [data-ai-output] 안의 AI 생성 목록과 그 안의 중단된 항목(''…''로
    끝남)은 대상이 아니다. 판정 텍스트: 각 li 에서 중첩 목록(ul·ol)과 인용(q·blockquote)을 뺀 텍스트. 같은 ul/ol 의 같은 수준 li 판정 텍스트의 마지막 어절(끝의 문장
    부호·괄호·쌍점 제외)이 모두 서술식(종결어미: …다, …요, …니다)이거나 모두 개조식(명사·''-음/-기'' 명사형)이다.'
  method: 대상 목록마다 각 li 판정 텍스트의 마지막 어절을 뽑아 서술식/개조식으로 분류하고 한 목록 안에 두 형태가 섞였는지 확인한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 커스텀 검사 후보: 형태소 분석기로 li 마지막 어절의 품사(종결어미 vs 명사·명사형 전성어미)를 판정해 혼용 검출.'
rationale: 같은 수준 항목의 어투가 다르면 항목 간 관계를 이해하기 어렵고 훑어 읽기 흐름이 끊긴다(KRDS 텍스트 목록).
sources:
- ref: KRDS
  locator: 컴포넌트 > 텍스트 목록 > 사용성 가이드라인
  note: https://www.krds.go.kr/html/site/component/component_04_13.html
- ref: GOVUK_ERROR_MESSAGE
  locator: (간접) 같은 메시지를 일관되게
  note: 직접 근거 아님 — 1단계에서 '서비스 전체 UI 문구의 높임 등급 통일' 후보를 병합하며 붙은 간접 출처. 이 룰(목록 항목 어투)의 근거는 KRDS. 별도 룰 후보로 제안.
scope:
  level: component
  targets:
  - ul > li
  - ol > li
  - 텍스트 목록
  - '[data-ai-output] 밖의 목록'
exceptions: []
relations:
- type: depends
  id: COPY-028
  note: 어투에 따른 종결 부호는 COPY-028
examples:
  good:
  - lang: html
    code: '<ul><li>신청서 작성</li><li>증빙서류 제출</li><li>심사 결과 확인</li></ul>

      '
    note: 같은 수준 항목을 모두 개조식으로 쓴다
  bad:
  - lang: html
    code: '<ul><li>신청서 작성</li><li>증빙서류를 제출합니다.</li><li>결과는 문자로 알려 드립니다.</li></ul>

      '
    note: 개조식과 서술식 항목이 섞여 있다
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): 텍스트 목록(component_04_13) ''동일한 수준의 항목은
  일관된 어투로 작성한다. 만약 첫 번째 항목이 서술식으로 작성되었다면 ... 일관되게 서술식으로 작성한다'' 확인. 강도: KRDS 단정형 서술(''~한다'') → SHOULD. ''해야 한다''
  표현이 아니므로 public-sector-must 태그는 붙이지 않음. GOVUK_ERROR_MESSAGE 출처는 1단계에서 ''서비스 전체 문장 종결 어미를 하나의 높임 등급으로 통일'' 후보를
  병합하며 ''직접 근거 아님''으로 붙인 것 — 이 룰(목록 수준의 어투)과 같은 요구가 아니다. 서비스 전체 높임 등급 통일은 별도 룰 후보로 제안 파일 notes에 적음. (2026-10-18
  T5 검토 반영) AI 생성 목록(li 안에 p+q)과 중단 항목(''…''로 끝남)이 판정 대상인지, li 안에 블록·인용이 있을 때 어느 텍스트의 끝을 보는지 판정이 갈렸다 → 판정 대상을 [data-ai-output]
  밖의 사람이 쓴 목록으로, 판정 텍스트를 ''li 에서 중첩 목록과 인용을 뺀 텍스트''로 정했다. KRDS 텍스트 목록 지침은 서비스가 작성하는 목록 문구에 대한 것이고, 모델이 생성하는 문장은
  화면 작성자가 문장 끝을 정할 수 없어 대상에서 뺐다(AI 출력 문구는 AI 카테고리에서 다룬다 — 체계 판단). 검토 제안의 ''li 직속 텍스트''는 li > p 처럼 텍스트가 블록 안에만 있는
  목록을 판정에서 빠뜨려 쓰지 않았다.'
korean_specific: false
tags:
- krds
- krds-component
