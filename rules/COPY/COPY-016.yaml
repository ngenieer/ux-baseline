id: COPY-016
category: COPY
title: 헤더 아이콘에 텍스트 레이블
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 헤더의 아이콘 버튼·링크에는 눈에 보이는 텍스트 레이블을 함께 표시하고, 검색·로그인처럼 대부분의 사용자가 의미를 아는 단순한 아이콘만 텍스트 레이블을 생략한다.
measurement:
  criteria: 헤더(header, [role=banner]) 안의 아이콘이 있는 button·a 중 보이는 텍스트가 없는 것은 검색·로그인 아이콘뿐이다.
  method: 헤더 안 button·a를 모두 뽑아 보이는 텍스트(시각적으로 숨긴 텍스트 제외) 유무와 아이콘 기능을 표로 확인한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 커스텀 검사: header button/a 중 innerText(시각적으로 보이는 텍스트)가 비어 있고 data-icon이 search·login이 아닌 요소가 있으면 실패.'
rationale: 아이콘의 의미가 명확하지 않거나 해석에 시간이 드는 사용자는 아이콘만으로 기능을 이해하지 못한다(KRDS 헤더).
sources:
- ref: KRDS
  locator: 컴포넌트 > 헤더 > 사용성 가이드라인 (가이드라인 PDF 2025.08 240쪽)
  note: https://www.krds.go.kr/html/site/component/component_02_03.html
scope:
  level: component
  targets:
  - header button
  - header a
  - '[role=banner] button'
exceptions:
- 검색·로그인처럼 대부분의 사용자가 의미를 이해하고 아이콘이 간결한 경우 텍스트 레이블 생략 가능(KRDS 원문 예외).
relations:
- type: refines
  id: COPY-020
  note: 아이콘 단독 버튼 허용 범위(COPY-020)를 헤더에 적용 — 헤더 예외 목록은 검색·로그인
- type: depends
  id: A11Y-054
  note: 아이콘만 남는 버튼에는 툴팁(A11Y-054)
examples:
  good:
  - lang: html
    code: "<header>\n  <button type=\"button\"><svg aria-hidden=\"true\">…</svg>전체 메뉴</button>\n  <button type=\"\
      button\" aria-label=\"검색\"><svg aria-hidden=\"true\">…</svg></button>\n</header>\n"
    note: 목록 밖 아이콘(전체 메뉴)에 보이는 텍스트를 붙이고 검색 아이콘만 텍스트를 생략한다
  bad:
  - lang: html
    code: "<header>\n  <button type=\"button\" aria-label=\"알림 설정\"><svg aria-hidden=\"true\">…</svg></button>\n\
      </header>\n"
    note: 알림 설정 아이콘을 보이는 텍스트 없이 aria-label로만 표시한다
needs_verification: false
verification_note: '2026-10-18 원문 대조(curl로 KRDS 페이지 HTML을 받아 텍스트로 직접 읽음): 헤더(component_02_03) ''아이콘 버튼/링크에 텍스트 레이블을
  제공한다 ... 검색, 로그인처럼 ... 텍스트 레이블을 생략할 수 있다'' 확인. 강도: KRDS 단정형 서술(''~한다'') → SHOULD. ''해야 한다'' 표현이 아니므로 public-sector-must
  태그는 붙이지 않음.'
korean_specific: false
tags:
- krds
- krds-component
