id: TYPO-016
category: TYPO
title: 표 숫자 오른쪽 정렬
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 표에서 양적 데이터(개수·퍼센트·용량 등) 셀은 오른쪽 정렬하고, 텍스트와 명목 데이터(날짜·우편번호·전화번호·IP 주소 등) 셀은 왼쪽 정렬한다.
measurement:
  criteria: 양적 데이터 열의 td 계산값 text-align이 right(가로쓰기 LTR에서 end 포함), 텍스트·명목 데이터 열의 td가 left(LTR에서 start 포함).
  method: '수동+스크립트: 열마다 데이터 유형(양적/명목/텍스트)을 사람이 표시하고, 스크립트로 해당 열 셀의 계산값 text-align을 확인한다.'
automation:
  feasibility: none
  note: '열의 데이터 유형 판단이 사람 몫. 컴포넌트에 열 유형 속성(예: data-type=number)을 두면 4단계에서 자동화 가능.'
rationale: 숫자를 오른쪽 정렬하면 자릿수와 단위 기호(, % KB 등)가 같은 위치에 놓여 비교가 쉽고, 텍스트·명목 데이터는 왼쪽 정렬해야 일정한 위치에서 읽기를 시작할 수 있다(KRDS 표).
sources:
- ref: KRDS
  locator: 컴포넌트 > 표 > 사용성 가이드라인 (가이드라인 PDF 2025.08 462·464~465쪽)
  note: https://www.krds.go.kr/html/site/component/component_04_11.html
scope:
  level: component
  targets:
  - table td
exceptions: []
relations: []
examples:
  good:
  - lang: html
    code: '<td class="num">1,234</td><td>2026. 10. 18.</td>

      <style>td.num{text-align:right}</style>'
    note: 양적 데이터는 오른쪽, 날짜(명목 데이터)는 왼쪽 정렬이다
  bad:
  - lang: html
    code: '<td class="num">1,234</td><td>2026. 10. 18.</td>

      <style>td.num{text-align:center}</style>'
    note: 양적 데이터를 가운데 정렬해 자릿수 비교가 어렵다
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS https://www.krds.go.kr/html/site/component/component_04_11.html HTML을
  curl로 받아 본문 확인): ''양적 데이터를 전달하기 위한 숫자는 오른쪽으로 정렬한다'', ''개수, 퍼센트, 용량 … 오른쪽으로 정렬하여 … 해야 한다'', ''텍스트 데이터, 명목 데이터(예
  - 날짜, 우편번호, 핸드폰 번호, IP주소 등)는 왼쪽으로 정렬'' 확인 → SHOULD + public-sector-must. 카테고리 재검토: LAYOUT(표 규격)에 가까움.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
