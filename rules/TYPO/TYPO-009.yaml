id: TYPO-009
category: TYPO
title: 본문은 고딕 계열
stage: platformed
status:
  value: confirmed
type: rule
strength: MAY
statement: 본문과 제목에는 고딕(산세리프) 계열 서체를 쓰고, 고딕 계열이 아닌 자체 서체는 디스플레이·배너 영역에만 쓴다.
measurement:
  criteria: body와 h1~h6의 font-family 목록에 나열된 각 서체가 산세리프(고딕) 분류이고 목록이 sans-serif로 끝난다. 고딕이 아닌 서체는 디스플레이·배너용 셀렉터에서만
    선언된다.
  method: '수동: font-family 선언을 모아 각 서체의 분류를 서체 배포처 정보로 확인한다.'
automation:
  feasibility: none
  note: 서체 분류 판정은 사람 확인 필요. sans-serif 마지막 배치는 TYPO-030 검사로 일부 확인.
rationale: KRDS는 가독성을 위해 본문·제목에 고딕 계열 서체를 권장하고, 고딕이 아니거나 가독성이 낮은 자체 서체는 디스플레이·배너에 한정한다.
sources:
- ref: KRDS
  locator: 디자인 스타일 > 타이포그래피 > 서체 (가이드라인 PDF 2025.08 103·125쪽)
  note: https://www.krds.go.kr/html/site/style/style_03.html
scope:
  level: situation
  targets:
  - KRDS 확장형 스타일 적용 서비스
  - body
  - h1, h2, h3, h4, h5, h6
exceptions: []
relations: []
examples:
  good:
  - lang: css
    code: 'body,h1,h2,h3{font-family:"Noto Sans KR","Nanum Gothic",sans-serif}

      .banner-title{font-family:"OrgBrand",sans-serif}'
    note: 본문·제목은 고딕 계열, 자체 서체는 배너에만 쓴다
  bad:
  - lang: css
    code: body{font-family:"Nanum Myeongjo",serif}
    note: 본문에 명조(세리프) 계열을 썼다
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS https://www.krds.go.kr/html/site/style/style_03.html HTML을 curl로 받아 본문
  확인): ''확장형 스타일은 가독성이 높은 고딕 계열 서체를 권장한다'', ''본문과 제목에는 가독성을 위해 고딕 계열 서체를 사용한다'', 자체 개발 폰트는 ''디스플레이나 배너에만 사용하는 것이
  좋다'' 확인. 강도 표현이 ''권장''·''좋다'' → MAY. ''가독성이 검증된''은 판정 불가라 statement에서 뺐다. KRDS 추천 고딕: 노토 산스, 나눔 고딕, 스포카 한 산스.
  표준형은 TYPO-010(Pretendard GOV).'
korean_specific: true
tags:
- krds
- system-choice
