id: TYPO-003
category: TYPO
title: 본문 최소 글자 크기
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 본문 텍스트의 글자 크기를 브라우저 기본 글자 크기가 16px일 때 계산값 16px(1rem) 이상으로 한다.
measurement:
  criteria: '브라우저 기본 글자 크기 16px, 확대 100% 상태에서 (1) 본문 텍스트 요소(main 안의 p, li, td, dd, 본문 영역의 span 등)의 getComputedStyle().fontSize
    가 16px 이상. (2) 부가 설명·주석 텍스트는 (1) 대신 13px(KRDS body xsmall, 0.8125rem) 이상으로 판정한다. 부가 설명 = KRDS body small 용도(''덜
    중요한 정보나 부가적인 설명 문구''): 입력 컴포넌트의 도움말(*__hint, *__description)과 필드 아래 시스템 메시지(*__message — KRDS 키트 form-hint-invalid,
    도움말과 같은 hint 계열), 글자 수·개수(*__count), 처리 중 상태 텍스트(spinner__text), 캡션(caption, figcaption, *__caption), 파일 크기
    같은 메타 정보(*__meta). 주석 = KRDS body xsmall 용도(''주석, 보조 설명 또는 부가적인 정보''): 각주(small), 출처·저작권 표기. 이 목록에 들지 않는 텍스트(안내
    문단, 표 셀 데이터, 목록 항목, 대화상자 본문 등)는 (1)로 판정한다.'
  method: Playwright 등으로 본문 영역 텍스트 노드의 부모 요소 계산 글자 크기를 수집해, (2)의 부가 설명·주석 셀렉터에 해당하면 13px 미만, 그 밖은 16px 미만 요소를 보고한다.
    본문 여부는 main 안의 문단·목록·표 셀로 판정.
automation:
  feasibility: none
  note: '기존 검사기 규칙 없음. 4단계: 계산 스타일 수집 스크립트(커스텀)로 자동화 가능. 토큰 단계에서는 body 계열 font-size 토큰 ≥ 1rem 검사.'
rationale: KRDS는 디지털 취약계층을 포함한 모든 사용자가 읽을 수 있도록 본문 최소 크기를 16px로 정한다.
sources:
- ref: KRDS
  locator: 디자인 스타일 > 타이포그래피 > 기본 사이즈 (가이드라인 PDF 2025.08 107쪽)
  note: 'https://www.krds.go.kr/html/site/style/style_03.html — ''본문 폰트 크기는 … 최소 16px 이상으로 설정한다.'' 계층별 사용 표: medium(17px)
    ''본문 텍스트에 사용되는 표준 크기'', small(15px) ''덜 중요한 정보나 부가적인 설명 문구'', xsmall(13px) ''가장 작은 크기로, 주석, 보조 설명 또는 부가적인 정보''.'
scope:
  level: global
  targets:
  - main p
  - main li
  - main td
  - main dd
exceptions:
- 부가 설명·주석 텍스트(측정 기준 (2)의 목록)는 KRDS 글자 스케일의 body small(15px)·xsmall(13px)을 쓸 수 있다 — KRDS 타이포그래피 '계층별 사용' 표.
relations: []
examples:
  good:
  - lang: css
    code: |-
      :root{font-size:100%}
      body{font-size:1.0625rem} /* 기본 16px에서 17px */
    note: 본문 계산값이 16px 이상이다
  - lang: css
    code: .text-field__hint{font-size:var(--font-size-body-small)} /* 15px 부가 설명 — (2)로 판정, 13px 이상 */
    note: 입력 도움말은 부가 설명이라 15px 를 쓸 수 있다
  bad:
  - lang: css
    code: body{font-size:0.8125rem} /* 기본 16px에서 13px */
    note: 본문이 13px로 16px 미만이다
  - lang: css
    code: .notice p{font-size:var(--font-size-body-small)} /* 안내 문단을 15px 로 */
    note: 부가 설명 목록에 없는 안내 문단은 본문이라 16px 이상이어야 한다
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS https://www.krds.go.kr/html/site/style/style_03.html HTML을 curl로 받아 본문
  확인): ''본문 폰트 크기는 … 최소 16px 이상으로 설정한다'' 확인. px 표기를 TYPO-027(상대 단위)과 맞추려고 계산값 기준으로 바꿨다. KRDS body small(15px)·xsmall(13px)은
  부가 설명·주석용으로 이 룰의 ''본문'' 범위 밖으로 본다. (2026-10-18 시험 4 검토 반영) select·spinner 등 규격이 도움말·처리 중 텍스트에 15px(--font-size-body-small)을
  쓰는데 측정 대상에 보조 텍스트 예외가 없어 규격이 룰을 어기는 것처럼 판정됐다 → KRDS 타이포그래피 페이지(2026-10-18 curl 재확인)의 ''계층별 사용'' 표에서 small·xsmall
  용도를 확인하고 측정 기준 (2)·exceptions 로 옮겼다. 13px 하한은 KRDS 글자 스케일의 가장 작은 body 값이다. 필드 아래 시스템 메시지를 부가 설명에 넣은 근거는 KRDS 키트
  클래스(form-hint-invalid)가 도움말과 같은 hint 계열이라는 점뿐이다 — KRDS 가 오류 메시지 크기를 문장으로 정한 곳은 찾지 못함.'
korean_specific: false
tags:
- krds
- public-sector-must
