id: TYPO-015
category: TYPO
title: 표 셀 텍스트 3줄 이하
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 표 데이터 셀(td)의 텍스트는 3줄 이하로 표시되게 쓴다.
measurement:
  criteria: 서비스가 지원하는 각 레이아웃 기준 너비에서 모든 td의 텍스트 줄 수(내용 높이 ÷ 계산값 line-height, 반올림) ≤ 3.
  method: 커스텀 스크립트로 표 셀 줄 수를 계산한다.
automation:
  feasibility: none
  note: 커스텀 검사로 자동화 가능. 데이터에 따라 달라지므로 대표 데이터로 검사.
rationale: 셀 텍스트가 길면 행 높이가 커져 한 화면에서 비교할 수 있는 데이터가 줄어든다(KRDS 표).
sources:
- ref: KRDS
  locator: 컴포넌트 > 표 > 사용성 가이드라인 (가이드라인 PDF 2025.08 464쪽)
  note: https://www.krds.go.kr/html/site/component/component_04_11.html
scope:
  level: component
  targets:
  - table td
exceptions: []
relations: []
examples:
  good:
  - lang: html
    code: <td>2026. 10. 18. 접수</td>
    note: 핵심만 담아 한 줄로 표시된다
  bad:
  - lang: html
    code: <td>2026년 10월 18일에 접수되어 담당 부서에서 서류를 검토하고 있으며 추가 서류가 필요한 경우 별도로 연락드릴 예정입니다.</td>
    note: 셀 텍스트가 3줄을 넘는다
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS https://www.krds.go.kr/html/site/component/component_04_11.html HTML을
  curl로 받아 본문 확인): ''데이터 셀을 구성하는 텍스트는 가능한 3줄을 넘어가지 않도록 하고 행과 행 사이의 간격을 적절하게 제공하여 … 해야 한다'' 확인 → SHOULD + public-sector-must.
  원문의 ''행 간격''은 수치가 없어 이 룰에서 뺐다. 카테고리 재검토: 표 내용 분량은 COPY에 가까움.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
