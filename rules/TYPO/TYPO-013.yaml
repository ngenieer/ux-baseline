id: TYPO-013
category: TYPO
title: 인라인 링크 글자 크기
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 문장 안에 들어가는 인라인 링크 텍스트는 주변 본문과 같은 글자 크기로 쓴다.
measurement:
  criteria: p, li, td, dd 안에서 텍스트 노드와 형제로 놓인 a[href]의 계산값 font-size가 부모 요소의 계산값 font-size와 같다.
  method: 커스텀 DOM 스크립트로 비교.
automation:
  feasibility: none
  note: 커스텀 검사로 자동화 가능.
rationale: 링크만 크기가 다르면 문장 흐름이 끊기고 시각적 위계가 어긋난다(KRDS 링크).
sources:
- ref: KRDS
  locator: 컴포넌트 > 링크 > 사용성 가이드라인 (가이드라인 PDF 2025.08 499~500쪽)
  note: https://www.krds.go.kr/html/site/component/component_05_01.html
scope:
  level: component
  targets:
  - p a[href]
  - li a[href]
  - td a[href]
  - dd a[href]
exceptions: []
relations: []
examples:
  good:
  - lang: html
    code: <p>자세한 내용은 <a href="/guide">신청 안내</a>를 확인해 주세요.</p>
    note: 링크가 주변 본문과 같은 크기다
  bad:
  - lang: html
    code: '<p>자세한 내용은 <a href="/guide" class="link-sm">신청 안내</a>를 확인해 주세요.</p>

      <style>.link-sm{font-size:0.875em}</style>'
    note: 인라인 링크만 작게 표시했다
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS https://www.krds.go.kr/html/site/component/component_05_01.html HTML을
  curl로 받아 본문 확인): ''링크가 인라인으로 사용될 때 링크 텍스트를 주변 텍스트와 동일한 크기로 제공한다'' 확인 → SHOULD + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
