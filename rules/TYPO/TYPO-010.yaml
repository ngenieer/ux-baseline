id: TYPO-010
category: TYPO
title: 공공 표준형 기본 서체·크기
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: KRDS 표준형 스타일을 적용하는 서비스는 국문·영문 모두 Pretendard GOV를 기본 서체로, 17px(브라우저 기본 16px 기준 1.0625rem)을 본문 기본 크기로 쓴다.
measurement:
  criteria: body의 계산값 font-family 첫 항목이 "Pretendard GOV"이고, 브라우저 기본 글자 크기 16px에서 본문(body medium) 계산값 font-size가
    17px.
  method: 계산 스타일 수집 스크립트 또는 토큰 검사(본문 기본 크기 토큰 = 17px 상당).
automation:
  feasibility: none
  note: '기존 규칙 없음. 4단계: 토큰 값 검사로 자동화 가능.'
rationale: KRDS 표준형은 공공기관 접근성·가독성에 맞춘 Pretendard GOV를 쓰며, 이 서체가 다른 서체보다 작아 보이므로 기본 크기를 17px로 정했다.
sources:
- ref: KRDS
  locator: 디자인 스타일 > 타이포그래피 > 서체 / 기본 사이즈 (가이드라인 PDF 2025.08 103·107·113쪽)
  note: https://www.krds.go.kr/html/site/style/style_03.html
scope:
  level: situation
  targets:
  - KRDS 표준형 스타일 적용 공공 서비스
exceptions:
- KRDS 표준형을 적용하지 않는 서비스(확장형·일반 프로젝트)에는 적용하지 않는다
relations:
- type: refines
  id: TYPO-003
  note: 표준형에서 본문 최소 16px을 17px로 구체화.
- type: conflicts
  id: PERF-005
  note: 'KRDS 표준형 서비스는 font-display: optional 대신 PERF-005의 두 번째 방법(폴백 글꼴 메트릭 맞춤)을 쓴다.'
  decision: CF-014
examples:
  good:
  - lang: css
    code: body{font-family:"Pretendard GOV",sans-serif;font-size:1.0625rem} /* 17px */
    note: 표준형 기본 서체와 17px 본문 크기
  bad:
  - lang: css
    code: body{font-family:"Pretendard GOV",sans-serif;font-size:1rem} /* 16px */
    note: 표준형인데 본문이 16px이다
needs_verification: false
verification_note: '2026-10-18 원문 대조(KRDS https://www.krds.go.kr/html/site/style/style_03.html HTML을 curl로 받아 본문
  확인): ''표준형 스타일은 국문과 영문 모두 Pretendard GOV 서체를 기본으로 사용한다'', ''Pretendard GOV는 … 상대적으로 크기가 작아 17px을 기본 크기로 사용한다''
  확인. Body medium(본문 표준) 17px·400·150% 표 확인. 1단계 메모: krds-uiux v1.1.0 토큰과 수치 대조함.'
korean_specific: true
tags:
- krds
- public-sector
- public-sector-must
