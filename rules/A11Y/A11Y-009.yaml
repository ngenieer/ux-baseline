id: A11Y-009
category: A11Y
title: 자동 재생 오디오 제어
stage: platformed
status:
  value: confirmed
type: rule
strength: MUST
statement: 페이지가 열리거나 바뀔 때 자동으로 재생하는 소리는 3초 안에 끝나게 하고, 3초 이상 이어지는 소리를 자동으로 재생하면 시스템 음량과 별개인 멈춤·일시정지·음량 조절 수단과 지정
  키(Esc)로 멈추는 기능을 함께 제공한다.
measurement:
  criteria: 페이지를 열거나 화면이 바뀔 때 사용자 조작 없이 나는 소리(<audio>·<video>·임베드의 autoplay + muted 아님, 스크립트 play() 포함)마다 다음 중 하나를
    충족한다. (1) 소리가 3초 안에 끝난다. (2) 3초 이상 이어지면 (가) 시스템 음량과 별개로 그 소리만 멈추거나 일시정지하거나 음량을 조절하는 컨트롤이 페이지 안에 있고 키보드로 조작할
    수 있으며, (나) Esc 키를 누르면 소리가 멈춘다. (나)의 지정 키 필수는 KWCAG 5.4.2 해설(3초 내 멈춤의 대안)보다 엄격한 체계 선택이다(CF-021).
  method: html-validate no-autoplay·axe-core no-autoplay-audio로 자동 재생 요소를 찾고, 페이지를 열어 조작 없이 소리가 나는지와 소리 길이를 수동 확인한다.
    3초 이상 이어지는 자동 재생은 (2)의 컨트롤을 키보드로 조작해 보고 Esc 키를 눌러 소리가 멈추는지 확인한다.
automation:
  feasibility: partial
  checks:
  - tool: axe-core
    rule: no-autoplay-audio
    method: axe-core 실행 결과 위반 0건
  - tool: html-validate
    rule: no-autoplay
    method: audio·video autoplay (정적 HTML 검사, lint/.htmlvalidate.json)
  note: no-autoplay-audio는 autoplay 미디어 요소의 길이·controls를 본다. 스크립트·Web Audio로 재생하는 소리와 임베드 플레이어는 수동.
rationale: 자동 재생 소리는 스크린 리더 음성을 덮어 페이지 전체를 쓸 수 없게 만든다(비간섭 요건).
sources:
- ref: WCAG22
  locator: SC 1.4.2 Audio Control (Level A)
  note: https://www.w3.org/TR/WCAG22/#audio-control
- ref: WCAG22_UNDERSTANDING
  locator: https://www.w3.org/WAI/WCAG22/Understanding/audio-control.html
- ref: KWCAG22
  locator: 검사항목 5.4.2
- ref: KRDS
  locator: 기본 패턴 > 상세 정보 확인 > 접근성 가이드라인 (가이드라인 PDF 2025.08 825쪽)
  note: https://www.krds.go.kr/html/site/global/global_06.html — 멀티미디어 자동 재생 금지 — KWCAG 5.4.2와 같은 방향, conflicts/BACKLOG.md
- ref: KRDS
  locator: 컴포넌트 (여러 페이지)
  note: '같은 요구를 다루는 KRDS 컴포넌트: 음성지원 — 상세는 sources/extracts/KRDS-components.yaml'
scope:
  level: global
  targets:
  - audio
  - video
  - iframe
exceptions: []
relations: []
examples:
  good:
  - lang: html
    code: '<video src="promo.mp4" controls muted></video>

      '
    note: 자동 재생하지 않고 컨트롤을 제공
  - lang: html
    code: "<video id=\"intro-video\" src=\"intro.mp4\" autoplay controls></video>\n<p>안내 영상의 소리가 자동으로 재생됩니다. Esc\
      \ 키를 누르면 멈춥니다.</p>\n<script>\n  document.addEventListener('keydown', (e) => {\n    if (e.key === 'Escape')\
      \ document.getElementById('intro-video').pause();\n  });\n</script>\n"
    note: 3초 이상 자동 재생하는 소리에 플레이어 컨트롤(멈춤·음량)과 Esc 키 멈춤을 함께 제공한다(측정 기준 (2)).
  bad:
  - lang: html
    code: '<audio src="bgm.mp3" autoplay loop></audio>

      '
    note: 페이지를 열면 3초 넘게 이어지는 배경음이 자동 재생되고 멈춤·음량 컨트롤과 Esc 키 멈춤이 없다.
needs_verification: false
verification_note: '2026-10-18 원문 대조(sources/extracts/WCAG22-A-AA.yaml): statement·수치가 SC 원문과 일치함을 확인. KWCAG 2.2
  대응 항목 번호는 비공식 HTML 판 기준 매핑 — 공식 원문 대조 전(registry KWCAG22 verified=false). 룰의 요구·수치는 WCAG 원문만으로 성립. 1단계에 이 룰로 병합된
  KRDS 컴포넌트 항목(sources/extracts/KRDS-components.yaml)은 개별 페이지를 다시 열지 않았다 — 룰의 요구는 WCAG 원문 기준. KWCAG 5.4.2는 ''자동으로
  소리가 재생되지 않아야 한다''로 더 엄격할 수 있음 — conflicts/BACKLOG.md, 3단계(KWCAG 공식 원문 대조 후). 2026-10-18 측정 기준을 3단계 결정(statement
  변경)에 맞춰 고침. 2026-10-18 독립 검토(review) 반영: KWCAG 5.4.2 원문 ''단, 3초 미만의 소리는 허용한다. 3초 이상 재생되는 소리는 제어할 수 있는 수단(멈춤, 일시정지,
  음량 조절 등)을 함께 제공해야 한다'' 확인 — ''자동 재생 자체 금지''로 요약했던 이전 statement 를 원문 구조(WCAG 1.4.2와 같음)로 고침. 2026-10-18 재검증: KWCAG
  5.4.2 해설 ''자동으로 재생되는 소리는 3초 내에 멈추거나, 지정된 키(예: esc키)를 누르면 재생을 멈추도록 구현'' 확인 — statement·측정 기준을 (1) 3초 안에 끝남 또는 (2)
  제어 수단 + 지정 키 구조로 고침(CF-021).'
korean_specific: false
