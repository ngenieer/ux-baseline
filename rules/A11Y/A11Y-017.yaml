id: A11Y-017
category: A11Y
title: 포인터 제스처 대체
stage: platformed
status:
  value: confirmed
type: rule
strength: MUST
statement: 다중 포인터(핀치·두 손가락) 또는 경로 기반 제스처(스와이프·그리기)로 하는 모든 기능을 경로 없는 단일 포인터 조작(탭·클릭)으로도 할 수 있게 한다.
measurement:
  criteria: 스와이프·핀치·두 손가락 탭·경로 드로잉으로 실행되는 기능마다 같은 결과를 내는 단일 탭·클릭 컨트롤(이전/다음 버튼, 확대/축소 버튼 등)이 있다.
  method: 터치·포인터 제스처 핸들러(touchstart/touchmove, pointer 이벤트, 제스처 라이브러리)를 쓰는 기능을 목록화하고, 각 기능을 버튼 클릭만으로 수행해 본다.
automation:
  feasibility: none
  checks: []
  note: 검사기 규칙 없음.
rationale: 손 떨림·운동 장애가 있거나 헤드 포인터를 쓰는 사용자는 정밀한 제스처를 할 수 없다.
sources:
- ref: WCAG22
  locator: SC 2.5.1 Pointer Gestures (Level A)
  note: https://www.w3.org/TR/WCAG22/#pointer-gestures
- ref: WCAG22_UNDERSTANDING
  locator: https://www.w3.org/WAI/WCAG22/Understanding/pointer-gestures.html
- ref: KWCAG22
  locator: 검사항목 6.5.1
- ref: KRDS
  locator: 컴포넌트 (여러 페이지) (가이드라인 PDF 2025.08 437쪽)
  note: '같은 요구를 다루는 KRDS 컴포넌트: 캐러셀 — 상세는 sources/extracts/KRDS-components.yaml'
scope:
  level: situation
  targets:
  - 캐러셀
  - 지도
  - 이미지 뷰어
exceptions:
- 다중 포인터 또는 경로 기반 제스처가 본질적인 경우.
- 사용자 에이전트·보조기술을 조작하는 동작은 대상이 아니다.
relations: []
examples:
  good:
  - lang: html
    code: '<button type="button" aria-label="이전 슬라이드">‹</button>

      <button type="button" aria-label="다음 슬라이드">›</button>

      '
    note: 스와이프 기능을 이전·다음 버튼으로도 실행
  bad:
  - lang: html
    code: '<!-- 슬라이드 전환이 스와이프로만 가능 -->

      '
    note: 슬라이드 전환이 스와이프로만 가능
needs_verification: false
verification_note: '2026-10-18 원문 대조(sources/extracts/WCAG22-A-AA.yaml): statement·수치가 SC 원문과 일치함을 확인. KWCAG 2.2
  대응 항목 번호는 비공식 HTML 판 기준 매핑 — 공식 원문 대조 전(registry KWCAG22 verified=false). 룰의 요구·수치는 WCAG 원문만으로 성립. 1단계에 이 룰로 병합된
  KRDS 컴포넌트 항목(sources/extracts/KRDS-components.yaml)은 개별 페이지를 다시 열지 않았다 — 룰의 요구는 WCAG 원문 기준.'
korean_specific: false
tags:
- wcag22
- level-a
- new-in-2.1
- kwcag22
- krds
