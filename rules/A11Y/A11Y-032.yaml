id: A11Y-032
category: A11Y
title: 비대화형 이미지는 초점·클릭 없음
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 링크·버튼이 아니거나 그 일부가 아닌 이미지는 키보드 초점을 받지 않고 마우스 클릭에 반응하지 않게 한다.
measurement:
  criteria: 'a·button 밖에 있는 img·[role=img]·figure에 0 이상의 tabindex가 없고, click 핸들러가 없으며, cursor: pointer가 지정되지 않았다.'
  method: Tab으로 이동하며 이미지에 초점이 가지 않는지 확인하고, 이미지를 클릭해 반응이 없는지 확인한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 커스텀 검사: img:not(a img):not(button img)[tabindex]:not([tabindex^=''-'']) 0건, 이벤트 리스너 검사(Playwright getEventListeners).'
rationale: 이미지는 대화형 콘텐츠가 아니므로 초점·클릭 반응을 주면 조작할 수 있다고 오해하고 탭 순서만 길어진다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 이미지 > 상호작용 가이드라인 (가이드라인 PDF 2025.08 423쪽)
  note: https://www.krds.go.kr/html/site/component/component_04_08.html
scope:
  level: component
  targets:
  - img
  - '[role=img]'
  - 이미지
exceptions: []
relations:
- type: refines
  id: A11Y-015
examples:
  good:
  - lang: html
    code: '<figure><img src="map.png" alt="센터 위치: 시청역 3번 출구 앞"><figcaption>찾아오는 길</figcaption></figure>

      '
    note: 비대화형 이미지에 tabindex·click 핸들러가 없음
  bad:
  - lang: html
    code: '<img src="map.png" alt="센터 위치" tabindex="0" onclick="zoom()">

      '
    note: 링크·버튼이 아닌 이미지가 초점을 받고 클릭에 반응
needs_verification: false
verification_note: '2026-10-18 원문 대조(WebFetch로 KRDS 페이지 재조회, 요약 모델 인용 확인): 상호작용 가이드라인 ''이미지 자체는 대화형 콘텐츠가 아니므로 키보드
  초점이 접근하지 않아야 하며, 마우스 클릭에 반응하지 않아야 한다.'' 확인. ''않아야'' → SHOULD + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
