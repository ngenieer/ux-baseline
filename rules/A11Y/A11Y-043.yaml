id: A11Y-043
category: A11Y
title: 자막 가림·흐림 금지
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 자막이 주변 요소에 가려지거나 흐리게 표시되지 않게 하고, 화면의 중요한 시각 요소와 겹치면 자막 위치를 옮긴다.
measurement:
  criteria: (1) 재생 중 자막 영역이 플레이어 컨트롤·로고·다른 오버레이에 가려지지 않는다. (2) 자막 텍스트·배경에 opacity 1 미만이나 blur 필터가 적용되지 않는다. (3)
    영상 안 텍스트·화자 얼굴처럼 중요한 시각 요소와 겹치는 구간에서 자막 위치가 바뀐다(WebVTT line·position 설정 등).
  method: 각 영상을 재생하며 컨트롤 표시 상태와 겹침 구간에서 자막을 확인한다.
automation:
  feasibility: none
  checks: []
  note: 자동 검사 불가(재생 화면 확인). 4단계에서 플레이어 CSS의 ::cue opacity·filter 정적 검사만 가능.
rationale: 가려지거나 흐린 자막은 읽을 수 없어 자막을 제공하지 않은 것과 같다. 자막 가독성 스타일은 COLOR-020.
sources:
- ref: KRDS
  locator: 컴포넌트 > 접근 가능한 미디어 > 접근성 (가이드라인 PDF 2025.08 745쪽)
  note: https://www.krds.go.kr/html/site/component/component_11_01.html
scope:
  level: component
  targets:
  - video::cue
  - 영상 자막
exceptions: []
relations:
- type: refines
  id: A11Y-003
examples:
  good:
  - lang: css
    code: "::cue {\n  color: var(--color-text-inverse-static);\n  background: var(--color-alpha-inverse75); /* 불투명\
      \ 배경 */\n}\n"
    note: 자막 텍스트·배경을 흐림 없이 표시
  bad:
  - lang: css
    code: "::cue {\n  color: var(--color-text-inverse-static);\n  background: var(--color-alpha-inverse75);\n  opacity:\
      \ .5; /* 자막을 반투명으로 흐림 */\n}\n"
    note: 자막에 opacity 1 미만을 적용
needs_verification: false
verification_note: '2026-10-18 원문 대조(WebFetch로 KRDS 페이지 재조회, 요약 모델 인용 확인): 사용성 가이드라인 ''자막은 주변 요소에 가려지거나 흐리게 표시되어서는
  안 된다.''와 ''자막을 화면의 중요한 시각적 요소와 겹치지 않도록 배치하고, 필요한 경우 자막의 위치를 조정한다.'' 확인. ''안 된다'' → SHOULD + public-sector-must.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
