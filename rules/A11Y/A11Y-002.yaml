id: A11Y-002
category: A11Y
title: 오디오 전용·비디오 전용 대체 수단
stage: platformed
status:
  value: confirmed
type: rule
strength: MUST
statement: 사전 녹음된 오디오 전용 콘텐츠에는 같은 정보를 담은 대본을, 사전 녹음된 비디오 전용 콘텐츠에는 같은 정보를 담은 대본 또는 오디오 트랙을 제공한다.
measurement:
  criteria: (1) 사전 녹음된 오디오 전용 콘텐츠(<audio>, 팟캐스트 등)마다 같은 정보를 담은 텍스트 대본이 같은 페이지에 있거나 바로 옆 링크로 연결된다. (2) 사전 녹음된 비디오
    전용(소리 없는) 콘텐츠마다 화면 정보를 설명하는 텍스트 대본 또는 같은 정보를 전달하는 오디오 트랙이 있다.
  method: 페이지의 오디오·비디오를 목록화하고, 각 항목에 대본(또는 오디오 트랙)이 있는지 확인한 뒤 대본 내용이 미디어의 정보를 빠짐없이 담는지 재생하며 대조한다.
automation:
  feasibility: none
  checks: []
  note: 'axe-core audio-caption은 <audio>의 track 요소만 보며 대본 유무를 판정하지 못한다(4.14 태그 매핑만 됨). 4단계 커스텀 검사: <audio>·소리 없는
    <video> 주변에 대본 링크/영역(data-transcript 등 프로젝트 규약)이 있는지 검사.'
rationale: 소리를 듣지 못하는 사용자는 오디오 정보를, 화면을 보지 못하는 사용자는 무음 영상의 정보를 대본이나 오디오로만 얻을 수 있다.
sources:
- ref: WCAG22
  locator: SC 1.2.1 Audio-only and Video-only (Prerecorded) (Level A)
  note: https://www.w3.org/TR/WCAG22/#audio-only-and-video-only-prerecorded
- ref: WCAG22_UNDERSTANDING
  locator: https://www.w3.org/WAI/WCAG22/Understanding/audio-only-and-video-only-prerecorded.html
- ref: KWCAG22
  locator: 검사항목 5.2.1
- ref: KRDS
  locator: 컴포넌트 (여러 페이지) (가이드라인 PDF 2025.08 738쪽)
  note: '같은 요구를 다루는 KRDS 컴포넌트: 접근 가능한 미디어 — 상세는 sources/extracts/KRDS-components.yaml'
scope:
  level: component
  targets:
  - audio
  - video(무음)
  - 팟캐스트·녹음 파일
exceptions:
- 오디오·비디오가 텍스트의 미디어 대체물이고 그렇다고 명확히 표시된 경우.
relations: []
examples:
  good:
  - lang: html
    code: '<audio controls src="briefing.mp3"></audio>

      <a href="briefing-transcript.html">브리핑 대본 보기</a>

      '
    note: 오디오 전용 콘텐츠 바로 옆에 대본 링크가 있음
  bad:
  - lang: html
    code: '<audio controls src="briefing.mp3"></audio>

      <!-- 대본 없음 -->

      '
    note: 오디오 전용 콘텐츠에 대본이 없음
needs_verification: false
verification_note: '2026-10-18 원문 대조(sources/extracts/WCAG22-A-AA.yaml): statement·수치가 SC 원문과 일치함을 확인. KWCAG 2.2
  대응 항목 번호는 비공식 HTML 판 기준 매핑 — 공식 원문 대조 전(registry KWCAG22 verified=false). 룰의 요구·수치는 WCAG 원문만으로 성립. 1단계에 이 룰로 병합된
  KRDS 컴포넌트 항목(sources/extracts/KRDS-components.yaml)은 개별 페이지를 다시 열지 않았다 — 룰의 요구는 WCAG 원문 기준.'
korean_specific: false
tags:
- wcag22
- level-a
- new-in-2.0
- kwcag22
- krds
