id: A11Y-008
category: A11Y
title: 의미 있는 읽기 순서
stage: platformed
status:
  value: confirmed
type: rule
strength: MUST
statement: 읽는 순서가 의미에 영향을 주는 콘텐츠는 DOM 순서를 시각적 읽기 순서와 같게 한다.
measurement:
  criteria: 'CSS를 끈 상태 또는 스크린 리더 선형 읽기에서 콘텐츠 순서가 화면의 의미 순서와 같다. CSS order·flex-direction: *-reverse·grid 배치·position으로
    시각 순서만 바꿔 의미가 달라지는 곳이 없다. 팝오버·패널 콘텐츠는 DOM에서 여는 버튼 바로 다음에 있다.'
  method: 브라우저에서 스타일을 끄거나 스크린 리더로 처음부터 끝까지 읽어 화면 순서와 비교한다.
automation:
  feasibility: none
  checks: []
  note: '검사기 규칙 없음. 4단계 커스텀 검사: stylelint로 order·*-reverse 사용 위치를 표시해 수동 점검 대상을 좁힌다.'
rationale: 보조기술은 DOM 순서로 읽는다. 시각 순서와 다르면 의미가 바뀌거나 이해할 수 없다.
sources:
- ref: WCAG22
  locator: SC 1.3.2 Meaningful Sequence (Level A)
  note: https://www.w3.org/TR/WCAG22/#meaningful-sequence
- ref: WCAG22_UNDERSTANDING
  locator: https://www.w3.org/WAI/WCAG22/Understanding/meaningful-sequence.html
- ref: KWCAG22
  locator: 검사항목 5.3.2
- ref: KRDS
  locator: 컴포넌트 (여러 페이지) (가이드라인 PDF 2025.08 314·336·397·608·617·632·647·661쪽)
  note: '같은 요구를 다루는 KRDS 컴포넌트: 구조화 목록, 도움 패널, 따라하기 패널, 맥락적 도움말, 모달, 코치마크, 콘텐츠 내 탐색, 툴팁, 페이지네이션 — 상세는 sources/extracts/KRDS-components.yaml'
scope:
  level: global
  targets: []
exceptions: []
relations: []
examples:
  good:
  - lang: html
    code: '<h2>1단계: 본인 확인</h2><p>…</p>

      <h2>2단계: 서류 제출</h2><p>…</p>

      '
    note: DOM 순서가 화면의 단계 순서와 같음
  bad:
  - lang: html
    code: "<div style=\"display:flex;flex-direction:column-reverse\">\n  <p>2단계: 서류 제출</p><p>1단계: 본인 확인</p>\n</div>\n"
    note: column-reverse로 화면 순서만 바꿔 DOM 순서와 의미 순서가 다름
needs_verification: false
verification_note: '2026-10-18 원문 대조(sources/extracts/WCAG22-A-AA.yaml): statement·수치가 SC 원문과 일치함을 확인. KWCAG 2.2
  대응 항목 번호는 비공식 HTML 판 기준 매핑 — 공식 원문 대조 전(registry KWCAG22 verified=false). 룰의 요구·수치는 WCAG 원문만으로 성립. 1단계에 이 룰로 병합된
  KRDS 컴포넌트 항목(sources/extracts/KRDS-components.yaml)은 개별 페이지를 다시 열지 않았다 — 룰의 요구는 WCAG 원문 기준. BACKLOG 출처 내부 불일치(KRDS
  모달 닫기 ''X''를 DOM 마지막에 두라는 항목 B:49)는 4단계 모달 규격에서 처리.'
korean_specific: false
tags:
- wcag22
- level-a
- new-in-2.0
- kwcag22
- krds
decisions:
