id: A11Y-053
category: A11Y
title: 툴팁과 title 속성 병용 금지
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 툴팁 컴포넌트를 단 요소에 title 속성을 함께 쓰지 않는다.
measurement:
  criteria: 툴팁 트리거(aria-describedby로 role="tooltip"을 참조하는 요소 또는 프로젝트 툴팁 컴포넌트)에 title 속성이 없다.
  method: 툴팁 트리거 요소의 속성을 검사한다.
automation:
  feasibility: none
  checks: []
  note: '4단계 커스텀 검사: [aria-describedby] 중 참조 대상이 role=tooltip인 요소에 [title]이 있으면 오류.'
rationale: title 속성 툴팁과 툴팁 컴포넌트가 겹쳐 두 개가 표시되거나 스크린 리더가 같은 설명을 두 번 읽는다. title 툴팁은 키보드·터치로 볼 수 없어 보조 설명은 툴팁 컴포넌트를
  우선 쓴다(KRDS '좋다' 수준 — 별도 MAY 룰 후보).
sources:
- ref: KRDS
  locator: 컴포넌트 > 툴팁 > 사용성 가이드라인 (가이드라인 PDF 2025.08 652·653·658쪽)
  note: https://www.krds.go.kr/html/site/component/component_08_05.html
scope:
  level: component
  targets:
  - 툴팁
exceptions: []
relations:
- type: refines
  id: A11Y-010
examples:
  good:
  - lang: html
    code: '<button type="button" aria-describedby="t1">?</button>

      <div role="tooltip" id="t1">주민등록번호 앞 6자리</div>

      '
    note: 툴팁 트리거에 title 속성이 없음
  bad:
  - lang: html
    code: '<button type="button" aria-describedby="t1" title="주민등록번호 앞 6자리">?</button>

      <div role="tooltip" id="t1">주민등록번호 앞 6자리</div>

      '
    note: 툴팁과 title을 함께 써 같은 설명이 두 번 노출됨
needs_verification: false
verification_note: '2026-10-18 원문 대조(WebFetch로 KRDS 페이지 재조회, 요약 모델 인용 확인): 사용성 가이드라인 ''툴팁 컴포넌트와 title 속성을 중첩하여 사용하지
  않는다.''(금지 → SHOULD + public-sector-must)와 ''가능한 툴팁 컴포넌트를 사용하는 것이 좋다''(권장) 확인. 강도가 다른 두 요구가 한 문장에 있어 statement를
  금지 부분으로 좁혔다 — ''title 대신 툴팁 컴포넌트 우선''(MAY)은 새 룰 후보로 notes에 제안.'
korean_specific: false
tags:
- krds
- krds-component
- public-sector-must
decisions:
- CF-043
