id: A11Y-012
category: A11Y
title: 키보드 함정 금지
stage: platformed
status:
  value: confirmed
type: rule
strength: MUST
statement: 키보드 초점이 들어갈 수 있는 모든 컴포넌트에서 키보드만으로 초점을 빼낼 수 있게 하고, 수정자 없는 방향키·Tab 같은 표준 방법이 아니면 빠져나오는 방법을 안내한다.
measurement:
  criteria: 모든 초점 가능 컴포넌트(임베드 플레이어·에디터·모달·커스텀 위젯 포함)에서 Tab·Shift+Tab·방향키·Esc 중 하나로 초점이 컴포넌트 밖으로 나간다. 다른 키가 필요하면
    그 방법이 컴포넌트 진입 전 또는 진입 시 텍스트로 안내된다. 모달은 Esc 또는 모달을 닫는 버튼(닫기·취소·수락·거절) 중 하나를 키보드로 실행해 빠져나올 수 있다(CF-035).
  method: Tab으로 페이지 끝까지 이동하며 각 컴포넌트에서 나갈 수 있는지 확인하는 수동 점검.
automation:
  feasibility: partial
  checks:
  - tool: ux-baseline-check
    rule: dialog-escape-return
    method: 'ux-baseline check: 대화상자에서 Esc 로 빠져나올 수 있다'
  note: '검사기 규칙 없음. 4단계 커스텀 검사: Playwright로 Tab을 N회 눌러 초점이 같은 요소 집합에 갇히는지 감지(모달 열림 상태는 제외 후 Esc 확인).'
rationale: 초점이 갇히면 키보드 사용자는 페이지의 나머지를 쓸 수 없다(비간섭 요건).
sources:
- ref: WCAG22
  locator: SC 2.1.2 No Keyboard Trap (Level A)
  note: https://www.w3.org/TR/WCAG22/#no-keyboard-trap
- ref: WCAG22_UNDERSTANDING
  locator: https://www.w3.org/WAI/WCAG22/Understanding/no-keyboard-trap.html
- ref: KWCAG22
  locator: 검사항목 6.1.2
- ref: KRDS
  locator: 컴포넌트 (여러 페이지) (가이드라인 PDF 2025.08 398·557·608·617·633쪽)
  note: '같은 요구를 다루는 KRDS 컴포넌트: 도움 패널, 따라하기 패널, 맥락적 도움말, 모달, 셀렉트 — 상세는 sources/extracts/KRDS-components.yaml'
scope:
  level: global
  targets: []
exceptions: []
relations: []
examples:
  good:
  - lang: html
    code: "<div role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"t\">\n  <h2 id=\"t\">삭제 확인</h2>\n  <button\
      \ type=\"button\">삭제</button>\n  <button type=\"button\">닫기</button><!-- Esc로도 닫힘 -->\n</div>\n"
    note: 모달을 닫기 버튼과 Esc로 빠져나올 수 있음
  bad:
  - lang: html
    code: '<!-- 임베드 에디터가 Tab을 들여쓰기로 가로채고 빠져나오는 방법을 안내하지 않음 -->

      '
    note: 에디터가 Tab을 가로채고 빠져나오는 방법을 안내하지 않음
needs_verification: false
verification_note: '2026-10-18 원문 대조(sources/extracts/WCAG22-A-AA.yaml): statement·수치가 SC 원문과 일치함을 확인. KWCAG 2.2
  대응 항목 번호는 비공식 HTML 판 기준 매핑 — 공식 원문 대조 전(registry KWCAG22 verified=false). 룰의 요구·수치는 WCAG 원문만으로 성립. 1단계에 이 룰로 병합된
  KRDS 컴포넌트 항목(sources/extracts/KRDS-components.yaml)은 개별 페이지를 다시 열지 않았다 — 룰의 요구는 WCAG 원문 기준. KWCAG 6.1.2(초점 이동과
  표시) 안의 ''함정 또는 오류 방지'' 부분.'
korean_specific: false
tags:
- wcag22
- level-a
- new-in-2.0
- kwcag22
- krds
decisions:
- CF-035
