id: A11Y-041
category: A11Y
title: 미디어 유형 분류(커버 이미지·배경음)
stage: platformed
status:
  value: confirmed
type: rule
strength: SHOULD
statement: 화면이 단순 커버 이미지뿐인 비디오는 오디오 전용 콘텐츠로, 소리가 단순 배경음뿐인 비디오는 비디오 전용 콘텐츠로 분류해 그 유형의 대체 수단(A11Y-002)을 제공한다.
measurement:
  criteria: (1) 재생 내내 화면이 정지 이미지(커버)인 비디오에는 오디오 전용 대체 수단(대본)이 있다. (2) 정보 없는 배경음만 있는 비디오에는 비디오 전용 대체 수단(대본 또는 오디오
    트랙)이 있다.
  method: 각 영상을 재생해 화면·소리에 정보가 있는지 분류하고, 분류에 맞는 대체 수단이 있는지 확인한다.
automation:
  feasibility: none
  checks: []
  note: 자동 검사 불가(콘텐츠 판단).
rationale: 형식상 비디오여도 정보가 한 감각 채널에만 있으면 그 채널에 맞는 대체 수단이 필요하다.
sources:
- ref: KRDS
  locator: 컴포넌트 > 접근 가능한 미디어 > 접근성 (가이드라인 PDF 2025.08 738쪽)
  note: https://www.krds.go.kr/html/site/component/component_11_01.html
scope:
  level: component
  targets:
  - video
  - 접근 가능한 미디어
exceptions: []
relations:
- type: refines
  id: A11Y-002
examples:
  good:
  - lang: html
    code: '<video controls src="lecture-audio.mp4" poster="cover.jpg"></video>

      <a href="lecture-transcript.html">강연 대본</a>

      '
    note: 커버 이미지뿐인 영상을 오디오 전용으로 보고 대본 제공
  bad:
  - lang: html
    code: '<video controls src="lecture-audio.mp4" poster="cover.jpg"></video>

      <!-- 커버 이미지뿐인 강연 녹음, 대본 없음 -->

      '
    note: 커버 이미지뿐인 강연 영상에 대본이 없음
needs_verification: false
verification_note: '2026-10-18 원문 대조(WebFetch로 KRDS 페이지 재조회, 요약 모델 인용 확인): 유형 > 콘텐츠 ''만약 비디오가 포함되었다고 하더라도 해당 비디오가
  단순 커버 이미지인 경우, 오디오 콘텐츠로 간주한다.''와 ''…단순 배경음인 경우, 비디오 콘텐츠로 간주한다.'' 확인 — 1단계 메모의 ''문맥상 확인 필요''를 해소하고 두 번째 분류를 statement에
  추가. 분류 서술 → SHOULD.'
korean_specific: false
tags:
- krds
- krds-component
- krds-descriptive
