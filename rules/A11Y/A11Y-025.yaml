  note: axe-core는 이름·역할·ARIA 문법을 판정한다. 상태가 실제 동작에 맞춰 바뀌는지(aria-expanded 갱신 등)와 이름의 의미는 수동.
rationale: 보조기술은 접근성 트리의 이름·역할·상태로 컨트롤을 알려 주고 조작한다. 표준 HTML 컨트롤은 명세대로 쓰면 이미 충족한다.
sources:
- ref: WCAG22
  locator: SC 4.1.2 Name, Role, Value (Level A)
  note: https://www.w3.org/TR/WCAG22/#name-role-value
- ref: WCAG22_UNDERSTANDING
  locator: https://www.w3.org/WAI/WCAG22/Understanding/name-role-value.html
- ref: KWCAG22
  locator: 검사항목 8.2.1
- ref: KRDS
  locator: 컴포넌트 (여러 페이지) (가이드라인 PDF 2025.08 277·304·305·333·351·385·414·457·508·518·519·536·549·556·566·579·588·631·660·675·684·695·712쪽)
  note: '같은 요구를 다루는 KRDS 컴포넌트: 날짜 입력 필드, 단계 표시기, 디스클로저, 라디오 버튼, 링크, 맥락적 도움말, 메인 메뉴, 버튼, 사이드 메뉴, 셀렉트, 아코디언, 체크박스,
    태그, 탭, 탭바, 텍스트 영역, 텍스트 입력 필드, 토글 스위치, 툴팁, 파일 업로드, 페이지네이션 — 상세는 sources/extracts/KRDS-components.yaml'
scope:
  level: global
  targets:
  - a[href]
  - button
  - input
  - select
  - textarea
  - '[role]'
  - iframe
exceptions: []
relations: []
examples:
  good:
  - lang: html
    code: '<button type="button" aria-expanded="false" aria-controls="sec1">신청 자격</button>

      <div id="sec1" hidden>…</div>

      '
    note: 네이티브 button에 aria-expanded로 펼침 상태를 노출
  bad:
  - lang: html
    code: '<button type="button" aria-controls="sec1">신청 자격</button>

      <div id="sec1" hidden>…</div>

      <!-- 펼쳐도 aria-expanded가 없어 상태가 전달되지 않음 -->

      '
    note: 펼침 상태가 보조기술에 전달되지 않음
needs_verification: false
verification_note: '2026-10-18 원문 대조(sources/extracts/WCAG22-A-AA.yaml): statement·수치가 SC 원문과 일치함을 확인. KWCAG 2.2
  대응 항목 번호는 비공식 HTML 판 기준 매핑 — 공식 원문 대조 전(registry KWCAG22 verified=false). 룰의 요구·수치는 WCAG 원문만으로 성립. 1단계에 이 룰로 병합된
  KRDS 컴포넌트 항목(sources/extracts/KRDS-components.yaml)은 개별 페이지를 다시 열지 않았다 — 룰의 요구는 WCAG 원문 기준. BACKLOG 출처 내부 불일치(KRDS
  aria-current 값 ''page''/''true'', 열린 드롭다운에 aria-current 사용)는 4단계 컴포넌트 규격에서 처리 — 이 룰은 ARIA 용법(aria-expanded)을 따른다.'
