id: A11Y-025
category: A11Y
title: 이름·역할·값
stage: platformed
status:
  value: confirmed
type: rule
strength: MUST
statement: 모든 UI 컴포넌트(폼 요소·링크·스크립트로 만든 위젯)의 이름과 역할을 프로그램으로 판별할 수 있게 하고, 사용자가 설정하는 상태·속성·값과 그 변경을 보조기술에 전달한다.
measurement:
  criteria: (1) 모든 링크·버튼·입력·셀렉트·커스텀 위젯이 비어 있지 않은 접근 가능한 이름을 가진다. (2) 커스텀 위젯은 맞는 role을 가진다(div 버튼에 role="button"
    등). (3) 펼침·선택·체크·현재 위치·눌림 상태를 aria-expanded·aria-selected·aria-checked·aria-current·aria-pressed 또는 네이티브 상태로
    노출하고, 상태가 바뀌면 값도 바뀐다. (4) ARIA 속성·역할이 유효하고 허용된 조합이다. (5) 대화형 요소를 중첩하지 않는다. (6) iframe에 title이 있다.
  method: axe-core 실행 후, 커스텀 위젯을 스크린 리더로 조작하며 이름·역할·상태 변경이 읽히는지 수동 확인한다.
