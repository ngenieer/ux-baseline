criteria:
- sc: 1.1.1
  level: A
  handle: Non-text Content
  guideline: 1.1 Text Alternatives
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#non-text-content
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/non-text-content.html
  text:
  - All non-text content that is presented to the user has a text alternative that serves the equivalent purpose, except for
    the situations listed below.
  - If non-text content is a control or accepts user input, then it has a name that describes its purpose. (Refer to Success
    Criterion 4.1.2 for additional requirements for controls and content that accepts user input.)
  - If non-text content is time-based media, then text alternatives at least provide descriptive identification of the non-text
    content. (Refer to Guideline 1.2 for additional requirements for media.)
  - If non-text content is a test or exercise that would be invalid if presented in text, then text alternatives at least
    provide descriptive identification of the non-text content.
  - If non-text content is primarily intended to create a specific sensory experience, then text alternatives at least provide
    descriptive identification of the non-text content.
  - If the purpose of non-text content is to confirm that content is being accessed by a person rather than a computer, then
    text alternatives that identify and describe the purpose of the non-text content are provided, and alternative forms of
    CAPTCHA using output modes for different types of sensory perception are provided to accommodate different disabilities.
  - If non-text content is pure decoration, is used only for visual formatting, or is not presented to users, then it is implemented
    in a way that it can be ignored by assistive technology.
  notes: []
  axe_rules:
  - aria-meter-name
  - aria-progressbar-name
  - image-alt
  - input-image-alt
  - object-alt
  - role-img-alt
  - svg-img-alt
- sc: 1.2.1
  level: A
  handle: Audio-only and Video-only (Prerecorded)
  guideline: 1.2 Time-based Media
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#audio-only-and-video-only-prerecorded
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/audio-only-and-video-only-prerecorded.html
  text:
  - 'For prerecorded audio-only and prerecorded video-only media, the following are true, except when the audio or video is
    a media alternative for text and is clearly labeled as such:'
  - An alternative for time-based media is provided that presents equivalent information for prerecorded audio-only content.
  - Either an alternative for time-based media or an audio track is provided that presents equivalent information for prerecorded
    video-only content.
  notes: []
  axe_rules:
  - audio-caption
- sc: 1.2.2
  level: A
  handle: Captions (Prerecorded)
  guideline: 1.2 Time-based Media
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#captions-prerecorded
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/captions-prerecorded.html
  text:
  - Captions are provided for all prerecorded audio content in synchronized media, except when the media is a media alternative
    for text and is clearly labeled as such.
  notes: []
  axe_rules:
  - video-caption
- sc: 1.2.3
  level: A
  handle: Audio Description or Media Alternative (Prerecorded)
  guideline: 1.2 Time-based Media
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#audio-description-or-media-alternative-prerecorded
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/audio-description-or-media-alternative-prerecorded.html
  text:
  - An alternative for time-based media or audio description of the prerecorded video content is provided for synchronized
    media, except when the media is a media alternative for text and is clearly labeled as such.
  notes: []
  axe_rules: []
