- sc: 1.3.2
  level: A
  handle: Meaningful Sequence
  guideline: 1.3 Adaptable
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#meaningful-sequence
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/meaningful-sequence.html
  text:
  - When the sequence in which content is presented affects its meaning, a correct reading sequence can be programmatically
    determined.
  notes: []
  axe_rules: []
- sc: 1.3.3
  level: A
  handle: Sensory Characteristics
  guideline: 1.3 Adaptable
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#sensory-characteristics
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/sensory-characteristics.html
  text:
  - Instructions provided for understanding and operating content do not rely solely on sensory characteristics of components
    such as shape, color, size, visual location, orientation, or sound.
  notes:
  - For requirements related to color, refer to Guideline 1.4.
  axe_rules: []
- sc: 1.3.4
  level: AA
  handle: Orientation
  guideline: 1.3 Adaptable
  new_in: '2.1'
  url: https://www.w3.org/TR/WCAG22/#orientation
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/orientation.html
  text:
  - Content does not restrict its view and operation to a single display orientation, such as portrait or landscape, unless
    a specific display orientation is essential.
  notes:
  - Examples where a particular display orientation may be essential are a bank check, a piano application, slides for a projector
    or television, or virtual reality content where content is not necessarily restricted to landscape or portrait display
    orientation.
  axe_rules:
  - css-orientation-lock
- sc: 1.3.5
  level: AA
  handle: Identify Input Purpose
  guideline: 1.3 Adaptable
  new_in: '2.1'
  url: https://www.w3.org/TR/WCAG22/#identify-input-purpose
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/identify-input-purpose.html
  text:
  - 'The purpose of each input field collecting information about the user can be programmatically determined when:'
  - The input field serves a purpose identified in the Input Purposes for user interface components section; and
  - The content is implemented using technologies with support for identifying the expected meaning for form input data.
  notes: []
  axe_rules:
  - autocomplete-valid
- sc: 1.4.1
  level: A
  handle: Use of Color
  guideline: 1.4 Distinguishable
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#use-of-color
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/use-of-color.html
  text:
  - Color is not used as the only visual means of conveying information, indicating an action, prompting a response, or distinguishing
    a visual element.
  notes:
  - This success criterion addresses color perception specifically. Other forms of perception are covered in Guideline 1.3
    including programmatic access to color and other visual presentation coding.
  axe_rules:
  - link-in-text-block
- sc: 1.4.2
  level: A
  handle: Audio Control
  guideline: 1.4 Distinguishable
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#audio-control
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/audio-control.html
  text:
  - If any audio on a web page plays automatically for more than 3 seconds, either a mechanism is available to pause or stop
    the audio, or a mechanism is available to control audio volume independently from the overall system volume level.
  notes:
  - 'Since any content that does not meet this success criterion can interfere with a user''s ability to use the whole page,
    all content on the web page (whether or not it is used to meet other success criteria) must meet this success criterion.
    See Conformance Requirement 5: Non-Interference.'
  axe_rules:
  - no-autoplay-audio
- sc: 1.4.3
  level: AA
  handle: Contrast (Minimum)
  guideline: 1.4 Distinguishable
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#contrast-minimum
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/contrast-minimum.html
  text:
  - 'The visual presentation of text and images of text has a contrast ratio of at least 4.5:1, except for the following:'
  - Large-scale text and images of large-scale text have a contrast ratio of at least 3:1;
  - Text or images of text that are part of an inactive user interface component, that are pure decoration, that are not visible
    to anyone, or that are part of a picture that contains significant other visual content, have no contrast requirement.
  - Text that is part of a logo or brand name has no contrast requirement.
  notes: []
  axe_rules:
  - color-contrast
- sc: 1.4.4
  level: AA
  handle: Resize Text
  guideline: 1.4 Distinguishable
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#resize-text
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/resize-text.html
  text:
  - Except for captions and images of text, text can be resized without assistive technology up to 200 percent without loss
    of content or functionality.
  notes: []
  axe_rules:
  - meta-viewport
- sc: 1.4.5
  level: AA
  handle: Images of Text
  guideline: 1.4 Distinguishable
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#images-of-text
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/images-of-text.html
  text:
  - 'If the technologies being used can achieve the visual presentation, text is used to convey information rather than images
    of text except for the following:'
  - The image of text can be visually customized to the user's requirements;
  - A particular presentation of text is essential to the information being conveyed.
  notes:
  - Logotypes (text that is part of a logo or brand name) are considered essential.
  axe_rules: []
- sc: 1.4.10
  level: AA
  handle: Reflow
  guideline: 1.4 Distinguishable
  new_in: '2.1'
  url: https://www.w3.org/TR/WCAG22/#reflow
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/reflow.html
  text:
  - 'Content can be presented without loss of information or functionality, and without requiring scrolling in two dimensions
    for:'
  - Vertical scrolling content at a width equivalent to 320 CSS pixels;
  - Horizontal scrolling content at a height equivalent to 256 CSS pixels.
  - Except for parts of the content which require two-dimensional layout for usage or meaning.
  notes:
  - 320 CSS pixels is equivalent to a starting viewport width of 1280 CSS pixels wide at 400% zoom. For web content which
    is designed to scroll horizontally (e.g., with vertical text), 256 CSS pixels is equivalent to a starting viewport height
    of 1024 CSS pixels at 400% zoom.
  - Examples of content which requires two-dimensional layout are images required for understanding (such as maps and diagrams),
    video, games, presentations, data tables (not individual cells), and interfaces where it is necessary to keep toolbars
    in view while manipulating content. It is acceptable to provide two-dimensional scrolling for such parts of the content.
  axe_rules: []
- sc: 1.4.11
  level: AA
  handle: Non-text Contrast
  guideline: 1.4 Distinguishable
  new_in: '2.1'
  url: https://www.w3.org/TR/WCAG22/#non-text-contrast
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/non-text-contrast.html
  text:
  - 'The visual presentation of the following have a contrast ratio of at least 3:1 against adjacent color(s):'
  - 'User Interface Components: Visual information required to identify user interface components and states, except for inactive
    components or where the appearance of the component is determined by the user agent and not modified by the author;'
  - 'Graphical Objects: Parts of graphics required to understand the content, except when a particular presentation of graphics
    is essential to the information being conveyed.'
  notes: []
  axe_rules: []
- sc: 1.4.12
  level: AA
  handle: Text Spacing
  guideline: 1.4 Distinguishable
  new_in: '2.1'
  url: https://www.w3.org/TR/WCAG22/#text-spacing
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/text-spacing.html
  text:
  - 'In content implemented using markup languages that support the following text style properties, no loss of content or
    functionality occurs by setting all of the following and by changing no other style property:'
  - Line height (line spacing) to at least 1.5 times the font size;
  - Spacing following paragraphs to at least 2 times the font size;
  - Letter spacing (tracking) to at least 0.12 times the font size;
  - Word spacing to at least 0.16 times the font size.
  - 'Exception: Human languages and scripts that do not make use of one or more of these text style properties in written
    text can conform using only the properties that exist for that combination of language and script.'
  notes:
  - Content is not required to use these text spacing values. The requirement is to ensure that when a user overrides the
    authored text spacing, content or functionality is not lost.
  - Writing systems for some languages use different text spacing settings, such as paragraph start indent. Authors are encouraged
    to follow locally available guidance for improving readability and legibility of text in their writing system.
  axe_rules:
  - avoid-inline-spacing
- sc: 1.4.13
  level: AA
  handle: Content on Hover or Focus
  guideline: 1.4 Distinguishable
  new_in: '2.1'
  url: https://www.w3.org/TR/WCAG22/#content-on-hover-or-focus
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/content-on-hover-or-focus.html
  text:
  - 'Where receiving and then removing pointer hover or keyboard focus triggers additional content to become visible and then
    hidden, the following are true:'
  - 'Dismissible: A mechanism is available to dismiss the additional content without moving pointer hover or keyboard focus,
    unless the additional content communicates an input error or does not obscure or replace other content;'
  - 'Hoverable: If pointer hover can trigger the additional content, then the pointer can be moved over the additional content
    without the additional content disappearing;'
  - 'Persistent: The additional content remains visible until the hover or focus trigger is removed, the user dismisses it,
    or its information is no longer valid.'
  - 'Exception: The visual presentation of the additional content is controlled by the user agent and is not modified by the
    author.'
  notes:
  - Examples of additional content controlled by the user agent include browser tooltips created through use of the HTML title
    attribute [[HTML]].
  - Custom tooltips, sub-menus, and other nonmodal popups that display on hover and focus are examples of additional content
    covered by this criterion.
  - This criterion applies to content that appears in addition to the triggering component itself. Since hidden components
    that are made visible on keyboard focus (such as links used to skip to another part of a page) do not present additional
    content they are not covered by this criterion.
  axe_rules: []
- sc: 2.1.1
  level: A
  handle: Keyboard
  guideline: 2.1 Keyboard Accessible
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#keyboard
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/keyboard.html
  text:
  - All functionality of the content is operable through a keyboard interface without requiring specific timings for individual
    keystrokes, except where the underlying function requires input that depends on the path of the user's movement and not
    just the endpoints.
  notes:
  - This exception relates to the underlying function, not the input technique. For example, if using handwriting to enter
    text, the input technique (handwriting) requires path-dependent input but the underlying function (text input) does not.
  - This does not forbid and should not discourage providing mouse input or other input methods in addition to keyboard operation.
  axe_rules:
  - frame-focusable-content
  - scrollable-region-focusable
  - server-side-image-map
- sc: 2.1.2
  level: A
  handle: No Keyboard Trap
  guideline: 2.1 Keyboard Accessible
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#no-keyboard-trap
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/no-keyboard-trap.html
  text:
  - If keyboard focus can be moved to a component of the page using a keyboard interface, then focus can be moved away from
    that component using only a keyboard interface, and, if it requires more than unmodified arrow or tab keys or other standard
    exit methods, the user is advised of the method for moving focus away.
  notes:
  - 'Since any content that does not meet this success criterion can interfere with a user''s ability to use the whole page,
    all content on the web page (whether it is used to meet other success criteria or not) must meet this success criterion.
    See Conformance Requirement 5: Non-Interference.'
  axe_rules: []
- sc: 2.1.4
  level: A
  handle: Character Key Shortcuts
  guideline: 2.1 Keyboard Accessible
  new_in: '2.1'
  url: https://www.w3.org/TR/WCAG22/#character-key-shortcuts
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/character-key-shortcuts.html
  text:
  - 'If a keyboard shortcut is implemented in content using only letter (including upper- and lower-case letters), punctuation,
    number, or symbol characters, then at least one of the following is true:'
  - 'Turn off: A mechanism is available to turn the shortcut off;'
  - 'Remap: A mechanism is available to remap the shortcut to include one or more non-printable keyboard keys (e.g., Ctrl,
    Alt);'
  - 'Active only on focus: The keyboard shortcut for a user interface component is only active when that component has focus.'
  notes: []
  axe_rules: []
- sc: 2.2.1
  level: A
  handle: Timing Adjustable
  guideline: 2.2 Enough Time
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#timing-adjustable
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/timing-adjustable.html
  text:
  - 'For each time limit that is set by the content, at least one of the following is true:'
  - The user is allowed to turn off the time limit before encountering it; or
  - The user is allowed to adjust the time limit before encountering it over a wide range that is at least ten times the length
    of the default setting; or
  - The user is warned before time expires and given at least 20 seconds to extend the time limit with a simple action (for
    example, "press the space bar"), and the user is allowed to extend the time limit at least ten times; or
  - The time limit is a required part of a real-time event (for example, an auction), and no alternative to the time limit
    is possible; or
  - The time limit is essential and extending it would invalidate the activity; or
  - The time limit is longer than 20 hours.
  notes:
  - This success criterion helps ensure that users can complete tasks without unexpected changes in content or context that
    are a result of a time limit. This success criterion should be considered in conjunction with Success Criterion 3.2.1,
    which puts limits on changes of content or context as a result of user action.
  axe_rules:
  - meta-refresh
- sc: 2.2.2
  level: A
  handle: Pause, Stop, Hide
  guideline: 2.2 Enough Time
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#pause-stop-hide
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/pause-stop-hide.html
  text:
  - 'For moving, blinking, scrolling, or auto-updating information, all of the following are true:'
  - For any moving, blinking or scrolling information that (1) starts automatically, (2) lasts more than five seconds, and
    (3) is presented in parallel with other content, there is a mechanism for the user to pause, stop, or hide it unless the
    movement, blinking, or scrolling is part of an activity where it is essential; and
  - For any auto-updating information that (1) starts automatically and (2) is presented in parallel with other content, there
    is a mechanism for the user to pause, stop, or hide it or to control the frequency of the update unless the auto-updating
    is part of an activity where it is essential.
  notes:
  - For requirements related to flickering or flashing content, refer to Guideline 2.3.
  - 'Since any content that does not meet this success criterion can interfere with a user''s ability to use the whole page,
    all content on the web page (whether it is used to meet other success criteria or not) must meet this success criterion.
    See Conformance Requirement 5: Non-Interference.'
  - Content that is updated periodically by software or that is streamed to the user agent is not required to preserve or
    present information that is generated or received between the initiation of the pause and resuming presentation, as this
    may not be technically possible, and in many situations could be misleading to do so.
  - An animation that occurs as part of a preload phase or similar situation can be considered essential if interaction cannot
    occur during that phase for all users and if not indicating progress could confuse users or cause them to think that content
    was frozen or broken.
  axe_rules:
  - blink
  - marquee
- sc: 2.3.1
  level: A
  handle: Three Flashes or Below Threshold
  guideline: 2.3 Seizures and Physical Reactions
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#three-flashes-or-below-threshold
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/three-flashes-or-below-threshold.html
  text:
  - Web pages do not contain anything that flashes more than three times in any one second period, or the flash is below the
    general flash and red flash thresholds.
  notes:
  - 'Since any content that does not meet this success criterion can interfere with a user''s ability to use the whole page,
    all content on the web page (whether it is used to meet other success criteria or not) must meet this success criterion.
    See Conformance Requirement 5: Non-Interference.'
  axe_rules: []
- sc: 2.4.1
  level: A
  handle: Bypass Blocks
  guideline: 2.4 Navigable
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#bypass-blocks
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/bypass-blocks.html
  text:
  - A mechanism is available to bypass blocks of content that are repeated on multiple web pages.
  notes: []
  axe_rules:
  - bypass
- sc: 2.4.2
  level: A
  handle: Page Titled
  guideline: 2.4 Navigable
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#page-titled
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/page-titled.html
  text:
  - Web pages have titles that describe topic or purpose.
  notes: []
  axe_rules:
  - document-title
- sc: 2.4.3
  level: A
  handle: Focus Order
  guideline: 2.4 Navigable
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#focus-order
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/focus-order.html
  text:
  - If a web page can be navigated sequentially and the navigation sequences affect meaning or operation, focusable components
    receive focus in an order that preserves meaning and operability.
  notes: []
  axe_rules: []
- sc: 2.4.4
  level: A
  handle: Link Purpose (In Context)
  guideline: 2.4 Navigable
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#link-purpose-in-context
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/link-purpose-in-context.html
  text:
  - The purpose of each link can be determined from the link text alone or from the link text together with its programmatically
    determined link context, except where the purpose of the link would be ambiguous to users in general.
  notes: []
  axe_rules:
  - area-alt
  - link-name
- sc: 2.4.5
  level: AA
  handle: Multiple Ways
  guideline: 2.4 Navigable
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#multiple-ways
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/multiple-ways.html
  text:
  - More than one way is available to locate a web page within a set of web pages except where the web page is the result
    of, or a step in, a process.
  notes: []
  axe_rules: []
- sc: 2.4.6
  level: AA
  handle: Headings and Labels
  guideline: 2.4 Navigable
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#headings-and-labels
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/headings-and-labels.html
  text:
  - Headings and labels describe topic or purpose.
  notes: []
  axe_rules: []
- sc: 2.4.7
  level: AA
  handle: Focus Visible
  guideline: 2.4 Navigable
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#focus-visible
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/focus-visible.html
  text:
  - Any keyboard operable user interface has a mode of operation where the keyboard focus indicator is visible.
  notes: []
  axe_rules: []
- sc: 2.4.11
  level: AA
  handle: Focus Not Obscured (Minimum)
  guideline: 2.4 Navigable
  new_in: '2.2'
  url: https://www.w3.org/TR/WCAG22/#focus-not-obscured-minimum
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/focus-not-obscured-minimum.html
  text:
  - When a user interface component receives keyboard focus, the component is not entirely hidden due to author-created content.
  notes:
  - Where content in a configurable interface can be repositioned by the user, then only the initial positions of user-movable
    content are considered for testing and conformance of this success criterion.
  - Content opened by the user may obscure the component receiving focus. If the user can reveal the focused component without
    advancing the keyboard focus, the component with focus is not considered visually hidden due to author-created content.
  axe_rules: []
- sc: 2.5.1
  level: A
  handle: Pointer Gestures
  guideline: 2.5 Input Modalities
  new_in: '2.1'
  url: https://www.w3.org/TR/WCAG22/#pointer-gestures
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/pointer-gestures.html
  text:
  - All functionality that uses multipoint or path-based gestures for operation can be operated with a single pointer without
    a path-based gesture, unless a multipoint or path-based gesture is essential.
  notes:
  - This requirement applies to web content that interprets pointer actions (i.e., this does not apply to actions that are
    required to operate the user agent or assistive technology).
  axe_rules: []
- sc: 2.5.2
  level: A
  handle: Pointer Cancellation
  guideline: 2.5 Input Modalities
  new_in: '2.1'
  url: https://www.w3.org/TR/WCAG22/#pointer-cancellation
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/pointer-cancellation.html
  text:
  - 'For functionality that can be operated using a single pointer, at least one of the following is true:'
  - 'No Down-Event: The down-event of the pointer is not used to execute any part of the function;'
  - 'Abort or Undo: Completion of the function is on the up-event, and a mechanism is available to abort the function before
    completion or to undo the function after completion;'
  - 'Up Reversal: The up-event reverses any outcome of the preceding down-event;'
  - 'Essential: Completing the function on the down-event is essential.'
  notes:
  - Functions that emulate a keyboard or numeric keypad key press are considered essential.
  - This requirement applies to web content that interprets pointer actions (i.e., this does not apply to actions that are
    required to operate the user agent or assistive technology).
  axe_rules: []
- sc: 2.5.3
  level: A
  handle: Label in Name
  guideline: 2.5 Input Modalities
  new_in: '2.1'
  url: https://www.w3.org/TR/WCAG22/#label-in-name
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/label-in-name.html
  text:
  - For user interface components with labels that include text or images of text, the name contains the text that is presented
    visually.
  notes:
  - A best practice is to have the text of the label at the start of the name.
  axe_rules:
  - label-content-name-mismatch
- sc: 2.5.4
  level: A
  handle: Motion Actuation
  guideline: 2.5 Input Modalities
  new_in: '2.1'
  url: https://www.w3.org/TR/WCAG22/#motion-actuation
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/motion-actuation.html
  text:
  - 'Functionality that can be operated by device motion or user motion can also be operated by user interface components
    and responding to the motion can be disabled to prevent accidental actuation, except when:'
  - 'Supported Interface: The motion is used to operate functionality through an accessibility supported interface;'
  - 'Essential: The motion is essential for the function and doing so would invalidate the activity.'
  notes: []
  axe_rules: []
- sc: 2.5.7
  level: AA
  handle: Dragging Movements
  guideline: 2.5 Input Modalities
  new_in: '2.2'
  url: https://www.w3.org/TR/WCAG22/#dragging-movements
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/dragging-movements.html
  text:
  - All functionality that uses a dragging movement for operation can be achieved by a single pointer without dragging, unless
    dragging is essential or the functionality is determined by the user agent and not modified by the author.
  notes:
  - This requirement applies to web content that interprets pointer actions (i.e., this does not apply to actions that are
    required to operate the user agent or assistive technology).
  axe_rules: []
- sc: 2.5.8
  level: AA
  handle: Target Size (Minimum)
  guideline: 2.5 Input Modalities
  new_in: '2.2'
  url: https://www.w3.org/TR/WCAG22/#target-size-minimum
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/target-size-minimum.html
  text:
  - 'The size of the target for pointer inputs is at least 24 by 24 CSS pixels, except when:'
  - 'Spacing: Undersized targets (those less than 24 by 24 CSS pixels) are positioned so that if a 24 CSS pixel diameter circle
    is centered on the bounding box of each, the circles do not intersect another target or the circle for another undersized
    target;'
  - 'Equivalent: The function can be achieved through a different control on the same page that meets this criterion;'
  - 'Inline: The target is in a sentence or its size is otherwise constrained by the line-height of non-target text;'
  - 'User Agent Control: The size of the target is determined by the user agent and is not modified by the author;'
  - 'Essential: A particular presentation of the target is essential or is legally required for the information being conveyed.'
  notes:
  - Targets that allow for values to be selected spatially based on position within the target are considered one target for
    the purpose of the success criterion. Examples include sliders, color pickers displaying a gradient of colors, or editable
    areas where you position the cursor.
  - For inline targets the line-height should be interpreted as perpendicular to the flow of text. For example, in a language
    displayed vertically, the line-height would be horizontal.
  axe_rules:
  - target-size
- sc: 3.1.1
  level: A
  handle: Language of Page
  guideline: 3.1 Readable
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#language-of-page
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/language-of-page.html
  text:
  - The default human language of each web page can be programmatically determined.
  notes: []
  axe_rules:
  - html-has-lang
  - html-lang-valid
  - html-xml-lang-mismatch
- sc: 3.1.2
  level: AA
  handle: Language of Parts
  guideline: 3.1 Readable
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#language-of-parts
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/language-of-parts.html
  text:
  - The human language of each passage or phrase in the content can be programmatically determined except for proper names,
    technical terms, words of indeterminate language, and words or phrases that have become part of the vernacular of the
    immediately surrounding text.
  notes: []
  axe_rules:
  - valid-lang
- sc: 3.2.1
  level: A
  handle: On Focus
  guideline: 3.2 Predictable
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#on-focus
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/on-focus.html
  text:
  - When any user interface component receives focus, it does not initiate a change of context.
  notes: []
  axe_rules: []
- sc: 3.2.2
  level: A
  handle: On Input
  guideline: 3.2 Predictable
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#on-input
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/on-input.html
  text:
  - Changing the setting of any user interface component does not automatically cause a change of context unless the user
    has been advised of the behavior before using the component.
  notes: []
  axe_rules: []
- sc: 3.2.3
  level: AA
  handle: Consistent Navigation
  guideline: 3.2 Predictable
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#consistent-navigation
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/consistent-navigation.html
  text:
  - Navigational mechanisms that are repeated on multiple web pages within a set of web pages occur in the same relative order
    each time they are repeated, unless a change is initiated by the user.
  notes: []
  axe_rules: []
- sc: 3.2.4
  level: AA
  handle: Consistent Identification
  guideline: 3.2 Predictable
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#consistent-identification
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/consistent-identification.html
  text:
  - Components that have the same functionality within a set of web pages are identified consistently.
  notes: []
  axe_rules: []
- sc: 3.2.6
  level: A
  handle: Consistent Help
  guideline: 3.2 Predictable
  new_in: '2.2'
  url: https://www.w3.org/TR/WCAG22/#consistent-help
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/consistent-help.html
  text:
  - 'If a web page contains any of the following help mechanisms, and those mechanisms are repeated on multiple web pages
    within a set of web pages, they occur in the same order relative to other page content, unless a change is initiated by
    the user:'
  - Human contact details;
  - Human contact mechanism;
  - Self-help option;
  - A fully automated contact mechanism.
  notes:
  - Help mechanisms may be provided directly on the page, or may be provided via a direct link to a different page containing
    the information.
  - For this success criterion, "the same order relative to other page content" can be thought of as how the content is ordered
    when the page is serialized. The visual position of a help mechanism is likely to be consistent across pages for the same
    page variation (e.g., CSS break-point). The user can initiate a change, such as changing the page's zoom or orientation,
    which may trigger a different page variation. This criterion is concerned with relative order across pages displayed in
    the same page variation (e.g., same zoom level and orientation).
  axe_rules: []
- sc: 3.3.1
  level: A
  handle: Error Identification
  guideline: 3.3 Input Assistance
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#error-identification
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/error-identification.html
  text:
  - If an input error is automatically detected, the item that is in error is identified and the error is described to the
    user in text.
  notes: []
  axe_rules: []
- sc: 3.3.2
  level: A
  handle: Labels or Instructions
  guideline: 3.3 Input Assistance
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#labels-or-instructions
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/labels-or-instructions.html
  text:
  - Labels or instructions are provided when content requires user input.
  notes: []
  axe_rules:
  - form-field-multiple-labels
- sc: 3.3.3
  level: AA
  handle: Error Suggestion
  guideline: 3.3 Input Assistance
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#error-suggestion
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/error-suggestion.html
  text:
  - If an input error is automatically detected and suggestions for correction are known, then the suggestions are provided
    to the user, unless it would jeopardize the security or purpose of the content.
  notes: []
  axe_rules: []
- sc: 3.3.4
  level: AA
  handle: Error Prevention (Legal, Financial, Data)
  guideline: 3.3 Input Assistance
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#error-prevention-legal-financial-data
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/error-prevention-legal-financial-data.html
  text:
  - 'For web pages that cause legal commitments or financial transactions for the user to occur, that modify or delete user-controllable
    data in data storage systems, or that submit user test responses, at least one of the following is true:'
  - 'Reversible: Submissions are reversible.'
  - 'Checked: Data entered by the user is checked for input errors and the user is provided an opportunity to correct them.'
  - 'Confirmed: A mechanism is available for reviewing, confirming, and correcting information before finalizing the submission.'
  notes: []
  axe_rules: []
- sc: 3.3.7
  level: A
  handle: Redundant Entry
  guideline: 3.3 Input Assistance
  new_in: '2.2'
  url: https://www.w3.org/TR/WCAG22/#redundant-entry
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/redundant-entry.html
  text:
  - 'Information previously entered by or provided to the user that is required to be entered again in the same process is
    either:'
  - auto-populated, or
  - available for the user to select.
  - 'Except when:'
  - re-entering the information is essential,
  - the information is required to ensure the security of the content, or
  - previously entered information is no longer valid.
  notes: []
  axe_rules: []
- sc: 3.3.8
  level: AA
  handle: Accessible Authentication (Minimum)
  guideline: 3.3 Input Assistance
  new_in: '2.2'
  url: https://www.w3.org/TR/WCAG22/#accessible-authentication-minimum
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/accessible-authentication-minimum.html
  text:
  - 'A cognitive function test (such as remembering a password or solving a puzzle) is not required for any step in an authentication
    process unless that step provides at least one of the following:'
  - 'Alternative: Another authentication method that does not rely on a cognitive function test.'
  - 'Mechanism: A mechanism is available to assist the user in completing the cognitive function test.'
  - 'Object Recognition: The cognitive function test is to recognize objects.'
  - 'Personal Content: The cognitive function test is to identify non-text content the user provided to the website.'
  notes:
  - '"Object recognition" and "Personal content" may be represented by images, video, or audio.'
  - support for password entry by password managers to reduce memory need, and
  - copy and paste to reduce the cognitive burden of re-typing.
  axe_rules: []
- sc: 4.1.2
  level: A
  handle: Name, Role, Value
  guideline: 4.1 Compatible
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#name-role-value
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/name-role-value.html
  text:
  - 'For all user interface components (including but not limited to: form elements, links and components generated by scripts),
    the name and role can be programmatically determined; states, properties, and values that can be set by the user can be
    programmatically set; and notification of changes to these items is available to user agents, including assistive technologies.'
  notes:
  - This success criterion is primarily for web authors who develop or script their own user interface components. For example,
    standard HTML controls already meet this success criterion when used according to specification.
  axe_rules:
  - area-alt
  - aria-allowed-attr
  - aria-braille-equivalent
  - aria-command-name
  - aria-conditional-attr
  - aria-deprecated-role
  - aria-hidden-body
  - aria-hidden-focus
  - aria-input-field-name
  - aria-prohibited-attr
  - aria-required-attr
  - aria-roledescription
  - aria-roles
  - aria-tab-name
  - aria-toggle-field-name
  - aria-tooltip-name
  - aria-valid-attr
  - aria-valid-attr-value
  - button-name
  - duplicate-id-aria
  - frame-title
  - frame-title-unique
  - input-button-name
  - input-image-alt
  - label
  - link-name
  - nested-interactive
  - select-name
  - summary-name
- sc: 4.1.3
  level: AA
  handle: Status Messages
  guideline: 4.1 Compatible
  new_in: '2.1'
  url: https://www.w3.org/TR/WCAG22/#status-messages
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/status-messages.html
  text:
  - In content implemented using markup languages, status messages can be programmatically determined through role or properties
    such that they can be presented to the user by assistive technologies without receiving focus.
  notes: []
  axe_rules: []
