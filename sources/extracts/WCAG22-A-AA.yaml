- sc: 1.3.1
  level: A
  handle: Info and Relationships
  guideline: 1.3 Adaptable
  new_in: '2.0'
  url: https://www.w3.org/TR/WCAG22/#info-and-relationships
  understanding: https://www.w3.org/WAI/WCAG22/Understanding/info-and-relationships.html
