    url: https://www.krds.go.kr/
    verified: true
    accessed: '2026-10-18'
    note: '리소스 목록: https://www.krds.go.kr/html/site/outline/outline_05.html . 공공 프로젝트용 기준. 사이트의 디자인 스타일·기본 패턴 페이지를
      읽었다(2026-10-18). 가이드라인 PDF 원본과의 대조는 아래 기록. 수치 대조용 토큰: github.com/KRDS-uiux/krds-uiux v1.1.0 (커밋 d6bb184). 저작권정책(2026-10-19 확인, https://www.krds.go.kr/html/site/utility/utility_06.html 2025-05-13 갱신분): 공공누리 제1유형 — 출처 표시, 상업적 이용·변경·2차적 저작물 배포 허용, 공공기관 후원·특수관계 오인 표시 금지. 출처 표기 문구는 NOTICE.md. 2026-10-18 가이드라인 PDF
      원본(디지털 정부서비스 UIUX 가이드라인(2025.08).pdf, 1181쪽, 40,468,910바이트, sha256 ea63bc306b510085b7b5e5fa26c4fbf49e3871387d850f253d6626bbabf9aec7,
      krds.go.kr 공지 nttId=9 첨부)을 내려받아 레이아웃·형태·선명한 화면 모드 절을 대조했다. 원본은 저장소에 넣지 않는다. 2026-10-18 KRDS 를 출처로 쓴 확정 룰 전체(약 400개)를 이 PDF 와 대조해 각 locator 끝에 (가이드라인 PDF 2025.08 N쪽)을 붙였다(N = PDF 쪽 번호). 원문과 다른 룰 9개를 고쳤다. PDF 에 없는 컴포넌트(토스트·스낵바·바텀시트·범위 슬라이더·수량 토글·플로팅 버튼·음성지원·뒤로가기 버튼·파비콘)를 근거로 한 룰은 웹 페이지만 근거라 쪽 번호가 없다. PDF 와 웹 수치가 다르면 더 늦은 날짜의 판을 따른다(예: NAV-021 은 2026-01-13 웹 수정분).'
