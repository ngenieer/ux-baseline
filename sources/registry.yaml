# 출처 레지스트리. 룰은 sources[].ref 로 여기의 id를 참조한다.
#
# type:
#   standard          표준 (WCAG, KWCAG, KRDS 등) — 최우선
#   research          검증된 연구 (원 논문·보고서까지 확인한 것만)
#   guide             표준 기관의 해설·작성 가이드 (WCAG Understanding, APG 등)
#   reference_system  유명 디자인 시스템 (Material, HIG 등) — 참고 사례, 그대로 정답으로 삼지 않음
#   experience        실무 경험 — 근거를 note에 적는다
#   preference        근거 없는 관행·취향 — 표준 기반 룰과 구분용
#
# verified: 공식 원문(발행처가 게시한 문서)을 직접 열어 URL·버전을 확인했을 때만 true.
#           비공식 사본으로만 확인했으면 false.
#           확정(confirmed) 룰은 verified: true 인 출처만 인용할 수 있다.
#           룰이 인용한 내용이 원문과 맞는지는 각 룰의 needs_verification 으로 따로 관리한다.
sources:
