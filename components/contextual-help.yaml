kit_differences:
- KRDS 키트는 링크·닫기 버튼이 든 팝오버에 role="tooltip" 을 쓴다 — 툴팁에는 대화형 요소를 넣을 수 없으므로 이 규격은 role="group" + aria-labelledby 로
  바꾼다(A11Y-055, A11Y-025).
- KRDS 키트 첫 예시 버튼에는 aria-expanded 가 없고 어느 예시에도 aria-controls 가 없다 — 이 규격은 둘 다 넣는다(A11Y-025).
- KRDS 키트는 닫기 버튼을 팝오버의 마지막 요소로 두고 오른쪽 위에 배치한다 — 모달 규격과 같은 이유로 이 규격은 제목 바로 다음에 둔다(A11Y-008).
- KRDS 키트 '바로가기' 링크는 href="#;" 이고 새 창 표시가 없다 — 이 규격은 실제 주소와 새 창 아이콘·숨긴 텍스트 '(새 창 열림)'을 쓴다(NAV-012, NAV-013).
notes:
- 팝오버 너비 22.5rem 은 KRDS 키트 contextual-help popover-width(36rem, 루트 62.5% 기준 360px)를 16px 루트로 옮긴 값이다. 버튼 배경 action-secondary·아이콘
  icon-information 도 키트 값이다.
- 팝오버 제목 수준(h3)은 도움 대상 레이블(h2) 아래 수준으로 맞춘다. 레이블이 label·h3 이면 한 단계씩 조정한다.
- 도움 아이콘 버튼에 툴팁으로 이름을 보이는 것은 A11Y-054(아이콘 단독 기능 버튼) 적용이다. COPY-048 이 금지하는 것은 도움 콘텐츠를 여는 정보·물음표 아이콘 툴팁이며, 이름 툴팁은
  해당하지 않는다고 보았다(아래 보고의 룰 문제 참고).
