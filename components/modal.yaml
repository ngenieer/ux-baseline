kit_differences:
- KRDS 키트는 닫기(X) 버튼을 DOM 의 마지막(푸터 뒤)에 두고 CSS 로 오른쪽 위에 배치한다 — 이 규격은 헤더 안 제목 바로 다음에 둔다. 시각 위치(우상단)와 DOM·Tab 순서가 달라지면
  A11Y-008(MUST)·A11Y-015(MUST)를 위반하기 때문이다. KRDS 가 든 우려(스크린 리더 사용자가 본문을 놓침)는 초점을 닫기 버튼이 아니라 첫 입력 필드·취소 버튼으로 보내고(autofocus)
  본문을 aria-describedby 로 연결해 해결한다.
- KRDS 키트는 section[role=dialog] 에 aria-modal 이 없고 모달 밖을 막지 않는다 — 이 규격은 dialog.showModal() 로 열어 모달 밖을 inert 로 만든다(A11Y-029).
- KRDS 키트 예시 버튼은 '예'·'아니요' 다 — 이 규격은 실행할 동작 동사('삭제')와 '취소'를 쓴다(COPY-006, STATE-003).
- KRDS 키트는 모달 본문 스크롤바를 ::-webkit-scrollbar 로 다시 그린다 — 이 규격은 스크롤바를 숨기지 않는 범위에서만 꾸민다(LAYOUT-035).
notes:
- KRDS '닫기 X를 DOM 마지막에' 권고와 A11Y-008·015의 관계는 CF-062로 결정했다 — 닫기 버튼은 제목 바로 다음, 초기 초점은 첫 입력 필드·취소 버튼.
- 너비 35rem(560px)는 KRDS 키트 medium 크기(56rem, 루트 62.5% 기준 560px)를 16px 루트로 옮긴 값이다. small 25rem·large 47.5rem 도 같은
  방식으로 옮긴다.
