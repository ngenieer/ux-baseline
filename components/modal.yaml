id: modal
title: 모달
status: confirmed
summary: 현재 과업을 잠시 멈추고 사용자가 확인·결정·짧은 입력을 해야 할 때 기본 창 위에 띄우는 대화상자다.
use_instead:
- when: 2단계 이상 이어지는 입력·선택 절차
  use: 별도 화면(단계 표시기 사용)
  rule: STATE-013
- when: 사용자 행동의 결과를 한 줄로 알리기만 하면 되는 경우
  use: 토스트
  rule: COPY-050
- when: 확인할 필요 없는 결과 알림에 되돌리기·재시도 같은 행동 1개를 붙이는 경우
  use: 스낵바
  rule: STATE-039
- when: 현재 화면을 유지한 채 하는 옵션 선택·부가 정보 확인(모바일)
  use: 바텀시트
  rule: STATE-035
krds:
  page: component_04_05.html
  kit: html/code/modal.html
  kit_classes:
    modal: krds-modal modal-dialog modal-content
    modal__header: modal-header
    modal__title: modal-title
    modal__close: btn-close
    modal__body: modal-conts conts-area
    modal__footer: modal-btn btn-wrap
    modal__action: krds-btn
anatomy:
- part: 루트(대화상자)
  class: modal
  element: dialog
  required: true
  note: dialog.showModal() 로 연다. 브라우저가 모달 밖을 inert 로 만들고 ::backdrop 딤드를 한 겹 그린다(A11Y-029, SHAPE-005). aria-labelledby
    로 제목을, 확인 대화상자는 aria-describedby 로 결과 설명 문단을 연결한다.
- part: 헤더
  class: modal__header
  element: div
  required: true
  note: 제목 → 닫기(X) 순서로 마크업한다. 화면에서 제목은 왼쪽, 닫기 버튼은 오른쪽 위에 있으므로 DOM 순서와 시각 순서가 같다(A11Y-008, A11Y-015).
- part: 제목
  class: modal__title
  element: h2
  required: true
  note: 모달이 실행할 기능·확인할 정보를 밝힌다(COPY-003). 페이지 제목 계층에 맞춰 h2 를 기본으로 한다.
- part: 닫기 버튼
  class: modal__close
  element: button
  note: 접근 가능한 이름 '닫기'(aria-label). 승인 요청 모달(modal--approval)에는 넣지 않는다(STATE-012). 제출·확정 모달에서는 취소와 같은 동작을 한다(STATE-011).
- part: 본문
  class: modal__body
  element: div
  required: true
  note: 모달 목적과 관련된 내용과 입력폼 컨트롤만 둔다(COPY-023, LAYOUT-034). 입력 컴포넌트는 5개 이하, 탭·아코디언·단계 표시기는 넣지 않는다(FORM-011). 세로로 넘치면
    이 영역만 스크롤한다(LAYOUT-035).
- part: 푸터
  class: modal__footer
  element: div
  required: true
  note: 확정·취소 액션 버튼은 항상 여기에 둔다. 본문 스크롤과 관계없이 보인다(LAYOUT-034, LAYOUT-035).
- part: 액션 버튼
  class: modal__action
  element: button
  required: true
  note: 실행 버튼 레이블은 '확인·예' 대신 동작 동사로 쓴다(COPY-006). 강조 버튼은 modal__action--primary.
markup: |-
  <button class="modal__trigger" type="button" aria-haspopup="dialog" aria-controls="draft-delete-modal">임시 저장 글 삭제</button>
  <dialog class="modal" id="draft-delete-modal" aria-labelledby="draft-delete-title" aria-describedby="draft-delete-desc" open>
    <div class="modal__header">
      <h2 class="modal__title" id="draft-delete-title">임시 저장 글을 삭제할까요?</h2>
      <button class="modal__close" type="button" aria-label="닫기">
        <svg class="modal__close-icon" aria-hidden="true" focusable="false" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="modal__body">
      <p id="draft-delete-desc">'전입 신고' 임시 저장 글 1건을 삭제합니다. 삭제한 글은 되돌릴 수 없습니다.</p>
    </div>
    <div class="modal__footer">
      <button class="modal__action" type="button" autofocus>취소</button>
      <button class="modal__action modal__action--primary" type="button">삭제</button>
    </div>
  </dialog>
css: |-
  .modal__trigger {
    min-block-size: var(--size-height-6);
    padding-inline: var(--space-padding-6);
    border: var(--border-width-variable-regular) solid var(--color-button-tertiary-border);
    border-radius: var(--radius-medium3);
    background-color: var(--color-button-tertiary-fill);
    color: var(--color-text-basic);
    font-size: var(--font-size-label-medium);
  }
  .modal {
    inline-size: min(35rem, 100% - var(--layout-screen-margin-small) * 2);
    max-block-size: calc(100dvh - var(--space-scale-10) * 2);
    padding: 0;
    border: var(--border-width-variable-regular) solid var(--color-border-gray);
    border-radius: var(--radius-xlarge1);
    background-color: var(--color-surface-white-subtler);
    box-shadow: var(--shadow-4);
    color: var(--color-text-basic);
  }
  .modal[open] {
    display: flex;
    flex-direction: column;
  }
  .modal::backdrop {
    background-color: var(--color-background-dim);
  }
  .modal__header {
    display: flex;
    align-items: flex-start;
    gap: var(--space-gap-5);
    padding: var(--space-padding-10) var(--space-padding-10) 0;
  }
  .modal__title {
    flex: 1;
    margin: 0;
    font-size: var(--font-size-heading-medium);
    font-weight: var(--font-weight-bold);
    line-height: var(--font-line-height-base);
  }
  .modal__close {
    display: inline-flex;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
    min-inline-size: var(--size-height-6);
    min-block-size: var(--size-height-6);
    padding: 0;
    border: 0;
    border-radius: var(--radius-medium3);
    background-color: transparent;
    color: var(--color-icon-gray);
  }
  .modal__close-icon {
    inline-size: var(--size-height-4);
    block-size: var(--size-height-4);
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
  }
  .modal__body {
    flex: 1;
    min-block-size: 0;
    overflow-y: auto;
    padding: var(--space-padding-6) var(--space-padding-10) var(--space-padding-3);
    font-size: var(--font-size-body-medium);
    line-height: var(--font-line-height-base);
  }
  .modal__body--overflow::after {
    content: "";
    position: sticky;
    inset-block-end: 0;
    display: block;
    block-size: var(--space-scale-12);
    background-image: linear-gradient(transparent, var(--color-surface-white-subtler));
    pointer-events: none;
  }
  .modal__footer {
    display: flex;
    flex-shrink: 0;
    flex-wrap: wrap;
    justify-content: flex-end;
    gap: var(--space-gap-3);
    padding: var(--space-padding-6) var(--space-padding-10) var(--space-padding-10);
  }
  .modal__action {
    min-block-size: var(--size-height-6);
    padding-inline: var(--space-padding-6);
    border: var(--border-width-variable-regular) solid var(--color-button-tertiary-border);
    border-radius: var(--radius-medium3);
    background-color: var(--color-button-tertiary-fill);
    color: var(--color-text-basic);
    font-size: var(--font-size-label-medium);
  }
  .modal__action--primary {
    border-color: var(--color-button-primary-fill);
    background-color: var(--color-button-primary-fill);
    color: var(--color-text-basic-inverse);
  }
  .modal__trigger:focus-visible,
  .modal__close:focus-visible,
  .modal__action:focus-visible {
    outline: var(--space-scale-2) solid var(--color-border-primary);
    outline-offset: var(--space-scale-1);
  }
  @media (prefers-reduced-motion: no-preference) {
    .modal[open] {
      animation-name: modal-enter;
      animation-duration: var(--motion-duration-fast);
      animation-timing-function: var(--motion-easing-enter);
    }
  }
  @keyframes modal-enter {
    from {
      opacity: 0;
      transform: translateY(var(--space-scale-5));
    }
  }
states:
- name: 열림
  markup_change: 열기 버튼을 누르면 dialog.showModal() 을 호출한다(open 속성이 붙는다). 예시 markup 의 open 속성은 검사용 정적 표현이며 실제로는 showModal()
    로만 연다 — open 속성만 붙이면 비모달로 열려 초점 가두기·딤드가 없다.
  rule: A11Y-029
- name: 본문 넘침
  markup_change: 본문 scrollHeight > clientHeight 이면 modal__body 에 modal__body--overflow 를 붙여 하단 흐림을 표시한다. 본문 안에 초점
    가능한 요소가 없으면 tabindex="0" 과 aria-labelledby(제목 id)를 붙여 키보드로 스크롤할 수 있게 한다.
  rule: LAYOUT-035
- name: 승인 요청(modal--approval)
  markup_change: 루트에 modal--approval, modal__close 버튼을 넣지 않는다. 푸터에 수락·거절 버튼을 각각 1개 둔다. Esc 로 닫지 않는다(cancel 이벤트에서
    preventDefault).
  rule: STATE-012
- name: 입력 모달
  markup_change: 본문에 form 컨트롤 5개 이하를 넣고, 푸터의 제출 버튼을 form 속성으로 그 form 에 연결한다. 첫 입력 필드에 autofocus.
  rule: FORM-011
keyboard:
- key: Tab / Shift+Tab
  action: 모달 안의 다음·이전 상호작용 요소로 초점을 옮긴다. 마지막 요소에서 Tab 은 첫 요소로, 첫 요소에서 Shift+Tab 은 마지막 요소로 순환한다(A11Y-029). 순서는 제목
    옆 닫기 → 본문 → 푸터 버튼으로 화면 순서와 같다(A11Y-015).
- key: Esc
  action: 닫기 버튼이 있는 모달을 닫는다(닫기 버튼과 같은 동작). 승인 요청 모달은 Esc 로 닫지 않는다(CF-035).
- key: Enter / Space
  action: 초점이 있는 버튼을 실행한다.
- key: ↑ / ↓
  action: 본문이 스크롤되면 본문을 위아래로 스크롤한다.
behavior:
- 모달은 사용자의 버튼·링크 실행 결과로만 연다. 페이지를 열 때 자동으로 띄우지 않는다(A11Y-058, A11Y-024).
- 연 직후 초점은 본문의 첫 입력 필드, 입력이 없는 확인 대화상자는 되돌릴 수 없는 동작이 아닌 쪽(취소) 버튼으로 간다(autofocus). 닫히거나 취소되면 초점을 모달을 연 버튼으로 돌려놓는다(A11Y-015).
- 모달이 열린 동안 모달 밖은 초점·가상 커서가 닿지 않는다. showModal() 을 쓰지 않는 구현은 형제 영역에 inert 를 붙인다(A11Y-029).
- 닫기(X)·Esc·취소는 같은 동작이다. 제출·확정 모달에서 이 동작은 입력·선택 내용을 적용하지 않고 서버 요청을 보내지 않는다(STATE-011).
- 확인 대화상자는 되돌릴 수 없거나 결과·부작용을 알아야 하는 동작에만 쓰고, 본문에 실행될 내용과 결과를 쓰며 실행·취소 버튼을 함께 둔다(STATE-003, COPY-006).
- 모달 안에서 다단계 절차·탭·아코디언을 진행하지 않는다. 입력은 5개 이하로 둔다(STATE-013, FORM-011).
- 본문이 넘쳐도 푸터는 항상 보이고, 스크롤바를 숨기지 않는다(LAYOUT-035, LAYOUT-034).
- 모달 위에서 다른 모달을 열어야 하면 딤드는 맨 위 모달 아래 한 겹만 보인다 — showModal() 은 맨 위 dialog 의 ::backdrop 만 그리므로 아래 모달의 ::backdrop 을
  숨긴다(SHAPE-005).
- 브라우저 뒤로가기(history.back)로 모달 안 뒤로가기 버튼과 같은 결과가 나오게 한다 — 모달을 열 때 history 항목을 추가했다면 뒤로가기는 모달만 닫는다(NAV-066).
- 반복 인증 실패(같은 절차에서 연속 2회 이상) 알림은 토스트가 아닌 이 모달로 띄운다(STATE-036).
