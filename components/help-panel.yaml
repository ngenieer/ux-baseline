kit_differences:
- KRDS 키트는 role="tab" 을 li 에 두고 그 안에 button 을 넣으며 화살표 키 이동이 없다 — 이 규격은 button 자체를 role="tab" 으로 쓰고 APG 탭 키보드(←→·Home·End)를
  따른다(A11Y-025, A11Y-011).
- KRDS 키트는 선택 상태를 sr-only 텍스트 '선택됨'으로도 알린다 — aria-selected 와 중복이므로 이 규격은 aria-selected 만 쓴다(A11Y-025).
- KRDS 키트는 새 창 링크를 title="새 창 열림" 으로만 알린다 — 이 규격은 새 창 아이콘과 링크 안 숨긴 텍스트 '(새 창 열림)'으로 알린다(NAV-012, CF-043).
- KRDS 키트는 열기 버튼(패널 밖)과 '접어두기' 버튼(패널 안 마지막)을 따로 두고 열기 버튼에 aria-expanded 가 없다 — 이 규격은 aria-expanded 를 가진 토글 버튼 하나를
  패널 제목(h2) 안에 둔다. 닫은 뒤 초점이 여는 버튼에 있게 하는 A11Y-050 을 버튼 하나로 만족한다.
- KRDS 키트는 섹션 제목 안에 span.krds-btn 로 만든 가짜 도움말 아이콘을 둔다(초점·역할 없음) — 이 규격은 도움 대상 옆에 실제 button 을 둔다(LAYOUT-056, A11Y-025).
- KRDS 키트 패널은 position fixed 로 본문 위에 겹친다 — 이 규격은 본문 옆에 나란히 두어 초점 받은 본문 요소를 가리지 않는다(LAYOUT-001).
notes:
- 패널 너비 24.375rem 은 KRDS 키트 PC 너비(39rem, 루트 62.5% 기준 390px)를 16px 루트로 옮긴 값이다.
- markup 의 help-panel-layout 래퍼와 본문 예시는 패널과 본문을 나란히 놓는 배치를 보이기 위한 것이다. 따라하기 탭 패널 내용은 tutorial-panel 규격을 넣는다.
