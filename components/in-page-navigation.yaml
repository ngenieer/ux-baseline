id: in-page-navigation
title: 콘텐츠 내 탐색
status: confirmed
summary: 계층 구조가 있는 긴 본문(h2 섹션 3개 이상 또는 뷰포트 높이 3배 초과)에서 같은 페이지 안 섹션으로 바로 이동하는 목차를 둘 때 쓴다.
use_instead:
- when: 서비스 정보 구조(다른 페이지) 탐색
  use: 사이드 메뉴(side-navigation)
  rule: NAV-039
- when: 무한 스크롤 페이지, 필터 목록
  use: 콘텐츠 내 탐색을 쓰지 않는다
  rule: NAV-039
krds:
  page: component_03_05.html
  kit: html/code/in_page_navigation.html
  kit_classes:
    in-page-navigation: krds-in-page-navigation-area
    in-page-navigation__title: in-page-navigation-header quick-caption
    in-page-navigation__list: in-page-navigation-list ul
    in-page-navigation__link: in-page-navigation-list a
anatomy:
- part: 루트
  class: in-page-navigation
  element: nav
  required: true
  note: aria-labelledby 로 제목을 가리킨다. DOM 에서는 본문 제목(h1) 다음, 본문 첫 섹션 앞에 둔다(NAV-014, A11Y-008).
- part: 제목
  class: in-page-navigation__title
  element: h2
  required: true
  note: 문구는 '이 페이지의 구성'. h1 을 쓰지 않는다(A11Y-028). 서비스 전체에서 같은 문구를 쓴다(COPY-004).
- part: 목차 목록
  class: in-page-navigation__list
  element: ul
  required: true
  note: 중첩은 3단계 이하(NAV-040).
- part: 하위 목차 목록
  class: in-page-navigation__sublist
  element: ul
  note: 섹션 안 하위 제목(h3)으로 가는 목록.
- part: 목차 링크
  class: in-page-navigation__link
  element: a
  required: true
  note: href 는 같은 페이지 안 섹션 id(#…)뿐이다(NAV-039). 화면에 보이는 현재 섹션 링크에 aria-current="true".
markup: |-
  <nav class="in-page-navigation" aria-labelledby="in-page-navigation-title">
    <h2 class="in-page-navigation__title" id="in-page-navigation-title">이 페이지의 구성</h2>
    <ul class="in-page-navigation__list">
      <li><a class="in-page-navigation__link" href="#section-overview" aria-current="true">서비스 개요</a></li>
      <li>
        <a class="in-page-navigation__link" href="#section-detail">서비스 상세</a>
        <ul class="in-page-navigation__sublist">
          <li><a class="in-page-navigation__link" href="#section-detail-target">지원 대상</a></li>
          <li><a class="in-page-navigation__link" href="#section-detail-amount">지원 금액</a></li>
        </ul>
      </li>
      <li><a class="in-page-navigation__link" href="#section-apply">신청 방법 및 절차</a></li>
      <li><a class="in-page-navigation__link" href="#section-documents">제출 서류</a></li>
    </ul>
  </nav>
css: |-
  .in-page-navigation {
    display: flex;
    flex-direction: column;
    gap: var(--space-gap-5);
  }
  .in-page-navigation__title {
    color: var(--color-text-bolder);
    font-size: var(--font-size-heading-xsmall);
    font-weight: var(--font-weight-bold);
  }
  .in-page-navigation__list,
  .in-page-navigation__sublist {
    display: flex;
    flex-direction: column;
    gap: var(--space-gap-2);
  }
  .in-page-navigation__sublist {
    margin-block-start: var(--space-gap-2);
    padding-inline-start: var(--space-padding-5);
  }
  .in-page-navigation__link {
    display: block;
    min-block-size: var(--layout-target-min);
    padding-block: var(--space-padding-2);
    padding-inline: var(--space-padding-3);
    border-inline-start: var(--border-width-static-medium) solid transparent;
    border-radius: var(--radius-small3);
    background-color: var(--color-action-secondary);
    color: var(--color-text-subtle);
    font-size: var(--font-size-navigation-depth-small);
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  .in-page-navigation__link:hover {
    background-color: var(--color-action-secondary-hover);
  }
  .in-page-navigation__link:active {
    background-color: var(--color-action-secondary-pressed);
  }
  .in-page-navigation__link[aria-current="true"] {
    border-inline-start-color: var(--color-action-secondary-active);
    background-color: var(--color-action-secondary-selected);
    color: var(--color-text-secondary);
    font-weight: var(--font-weight-bold);
  }
  .in-page-navigation__link:focus-visible {
    outline: var(--space-scale-2) solid var(--color-border-primary);
    outline-offset: calc(var(--space-scale-2) * -1);
  }
  @media (min-width: 1024px) {
    .in-page-navigation {
      position: sticky;
      inset-block-start: var(--space-scale-10);
      inline-size: var(--layout-in-page-navigation-width);
    }
  }
states:
- name: 현재 섹션
  markup_change: 화면에 보이는 섹션의 링크에 aria-current="true", 이전 링크에서는 제거. 식별자 막대·굵기로도 표시한다(COLOR-001).
  rule: COLOR-001
- name: 1단 레이아웃(1024px 미만)
  markup_change: 마크업 변화 없음. 고정(sticky)하지 않고 DOM 위치 그대로 본문 제목과 본문 사이에 보인다(NAV-014).
  rule: NAV-014
keyboard:
- key: Tab
  action: 목차 링크를 위에서 아래로 이동한다(A11Y-015).
- key: Enter
  action: 해당 섹션으로 이동한다. 다음 Tab 은 그 섹션 안의 첫 초점 요소로 간다(A11Y-015).
behavior:
- 목차 링크는 같은 페이지 섹션 앵커(href="#id")만 가리킨다. 다른 페이지 탐색·필터·무한 스크롤 목록에는 쓰지 않는다(NAV-039).
- 다단 레이아웃 구간에서는 본문 오른쪽 열에 sticky 로 고정하고, 1단 구간에서는 고정하지 않고 본문 제목과 본문 첫 섹션 사이에 둔다. DOM 순서는 두 구간 모두 h1 → 목차 → 본문이다(NAV-014,
  A11Y-008). 예시 CSS 의 전환 너비 1024px 는 레이아웃의 다단→1단 전환 브레이크포인트로 바꾼다.
- 목차 너비는 모든 페이지에서 같은 고정값으로 두고, 기본 글자 크기에서 가장 긴 항목이 한 줄에 들어가는 값으로 정한다. 사용자가 텍스트를 확대하면 항목을 자르지 않고 줄바꿈한다(LAYOUT-018).
- 스크롤 위치에 따라 현재 섹션 링크에 aria-current="true" 를 옮긴다. 링크를 실행하면 브라우저 기본 앵커 이동으로 순차 탐색 시작점을 그 섹션으로 옮기고, 스크롤을 스크립트로 처리하면
  섹션 제목에 tabindex="-1" 을 주고 focus() 한다(A11Y-015, A11Y-011).
- 목차 제목과 링크에 h1 을 쓰지 않는다(A11Y-028). 제목 문구 '이 페이지의 구성'은 모든 페이지에서 같다(COPY-004).
- 목차 중첩은 3단계 이하다(NAV-040). h2 섹션이 3개 이상이거나 본문이 뷰포트 높이의 3배를 넘는 계층 구조 본문에 둔다(NAV-038).
- 링크의 포인터 대상 높이는 24 CSS px 이상이다(LAYOUT-002).
rules:
- A11Y-007
- A11Y-008
- A11Y-011
- A11Y-015
- A11Y-016
- A11Y-025
- A11Y-028
- COLOR-001
- COPY-004
- LAYOUT-002
- LAYOUT-018
- NAV-014
- NAV-038
- NAV-039
- NAV-040
kit_differences:
- KRDS 키트는 목차 제목('이 페이지의 구성')과 페이지 이름을 p 로 쓴다 — 이 규격은 제목을 h2 로 마크업한다(A11Y-007).
- KRDS 키트는 현재 섹션을 active 클래스로만 표시한다 — 이 규격은 aria-current="true" 로 보조기술에도 알린다(A11Y-025).
- KRDS 키트는 목차를 position fixed 로 화면 오른쪽에 띄우고 nav 를 목록에만 감싼다 — 이 규격은 레이아웃 열 안에서 sticky 로 두고 제목까지 nav 안에 넣는다(NAV-014).
notes:
- KRDS 키트의 하단 실행 영역(온라인 신청하기 버튼, 함께 신청 정보)은 룰 근거가 없어 표준 마크업에서 뺐다.
- 목차 너비는 토큰 --layout-in-page-navigation-width(10rem = KRDS 키트 160px)로 모든 페이지에서 같다(LAYOUT-018). 이 너비에서 프로젝트의 가장 긴
  목차 항목이 기본 글자 크기로 한 줄에 들어가는지 확인한다 — 넘치면 항목 문구를 줄인다.
