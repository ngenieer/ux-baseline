id: file-upload
title: 파일 업로드
status: confirmed
summary: 업무 처리에 꼭 필요한 서류·사진 파일을 폼과 함께 제출받을 때 쓴다.
use_instead:
- when: 파일이 없어도 업무를 처리할 수 있는 경우
  use: 파일 요청을 빼거나 선택 항목으로 바꾼다
  rule: FORM-058
- when: 서로 관련 없는 서류 여러 개(예 신분증 사본과 재직증명서)를 받는 경우
  use: 서류마다 섹션을 나눈 단일 파일 업로드(multiple 없음)
  rule: FORM-065
krds:
  page: component_09_04.html
  kit: html/code/file_upload.html
  kit_classes:
    file-upload: krds-file-upload
    file-upload__dropzone: file-upload
    file-upload__button: krds-btn (file-upload-btn-wrap)
    file-upload__count: total
    file-upload__list: upload-list
    file-item: li (file-info)
    file-item__name: file-name
    file-item__message: file-hint-invalid
anatomy:
- part: 루트
  class: file-upload
  element: div
  required: true
  note: text-field 와 같은 순서로 레이블 → 부가 설명(제한 사항) → 드롭 영역 → 시스템 메시지 → 파일 목록을 쌓는다(FORM-009).
- part: 레이블
  class: file-upload__label
  element: label
  required: true
  note: for 로 input[type=file] 과 연결하고 올릴 파일의 용도를 쓴다(FORM-004, COPY-003).
- part: 부가 설명
  class: file-upload__hint
  element: p
  required: true
  note: 허용 형식, 파일당 최대 크기와 단위, 최대 개수를 쓴다(FORM-059). input 의 aria-describedby 로 연결한다.
- part: 드롭 영역
  class: file-upload__dropzone
  element: div
  required: true
  note: 끌어다 놓기 안내 문구와 파일 선택 버튼을 담는다. 끌어다 놓기는 파일 선택 버튼의 대안일 뿐이다(A11Y-021).
- part: 버튼 틀
  class: file-upload__control
  element: div
  required: true
  note: input 과 보이는 버튼을 같은 격자 칸에 겹쳐 같은 위치·크기로 둔다(CF-051). top·left·text-indent 를 쓰지 않는다(A11Y-048).
- part: 파일 입력
  class: file-upload__input
  element: input[type=file]
  required: true
  note: 'opacity: 0 으로만 숨긴 네이티브 입력. 초점·클릭·보조기술 노출을 그대로 받는다(CF-051). hidden·display:none 을 쓰지 않는다(A11Y-046). accept
    는 확장자 변형을 모두 담는 MIME 타입으로 쓴다(FORM-060).'
- part: 파일 선택 버튼(보이는 모양)
  class: file-upload__button
  element: span
  required: true
  note: aria-hidden="true". 입력이 초점을 받으면 이 요소에 초점 표시를 그린다(A11Y-016). 같은 화면의 제출 버튼보다 낮은 강조(윤곽선) 스타일이다(FORM-064). 높이
    56px(size-height-8)(LAYOUT-002).
- part: 개수
  class: file-upload__count
  element: p
  note: '''현재 개수 / 최대 개수''. role="status" 로 파일을 더하거나 지울 때 바뀐 개수가 읽힌다(STATE-001).'
- part: 시스템 메시지(오류)
  class: file-upload__message
  element: p
  note: 컴포넌트 전체 오류(필수 파일 없음, 최대 개수 초과)만 쓴다. input 의 aria-describedby 에 id 를 더한다(FORM-003).
- part: 파일 목록
  class: file-upload__list
  element: ul
  note: 다중 업로드는 ul/li, 단일 업로드는 file-item 하나를 p 대신 div 로 둔다(A11Y-007).
- part: 파일 항목
  class: file-item
  element: li
  required: true
  note: 하위 블록. 파일 이름·형식과 크기·상태·삭제 버튼을 담는다.
- part: 파일 이름
  class: file-item__name
  element: span
  required: true
  note: '한 줄로 표시하고 넘치면 말줄임표로 줄인다 — white-space: nowrap, overflow: hidden, text-overflow: ellipsis(LAYOUT-055, 린트
    ux-baseline/file-name-ellipsis 기본 대상). 전체 이름은 DOM 에 남아 스크린 리더가 읽는다.'
- part: 형식·크기
  class: file-item__meta
  element: span
  note: '''[PDF, 1.2MB]'' 형식. 이름이 잘려도 이 부분은 줄이지 않는다.'
- part: 삭제 버튼
  class: file-item__delete
  element: button
  note: 텍스트 '삭제' 에 aria-describedby 로 파일 이름을 연결한다(A11Y-025). 높이 40px(size-height-6)(LAYOUT-002).
- part: 항목 오류
  class: file-item__message
  element: p
  note: 그 파일의 형식·크기 오류. 파일 이름·문제·고치는 방법을 쓴다(COPY-005, FORM-005).
markup: |-
  <div class="file-upload">
    <label class="file-upload__label" for="site-photos">현장 사진 (필수)</label>
    <p class="file-upload__hint" id="site-photos-hint">JPG, PNG 파일 / 파일당 최대 10MB / 최대 5개</p>
    <div class="file-upload__dropzone">
      <p class="file-upload__dropzone-text">사진 파일을 여기에 끌어다 놓거나 파일 선택 버튼을 눌러 주세요.</p>
      <div class="file-upload__control">
        <input class="file-upload__input" type="file" id="site-photos" name="site_photos" accept="image/jpeg,image/png" multiple aria-describedby="site-photos-hint">
        <span class="file-upload__button" aria-hidden="true">파일 선택</span>
      </div>
    </div>
    <p class="file-upload__count" role="status">2개 / 최대 5개</p>
    <ul class="file-upload__list" role="list">
      <li class="file-item">
        <span class="file-item__name" id="site-photos-file-1" tabindex="0">2026년 10월 현장 점검 북측 출입구 전경 사진.jpg</span>
        <span class="file-item__meta">[JPG, 3.4MB]</span>
        <button class="file-item__delete" type="button" aria-describedby="site-photos-file-1">삭제</button>
      </li>
      <li class="file-item file-item--error">
        <span class="file-item__name" id="site-photos-file-2" tabindex="0">남측 주차장 드론 촬영 원본.png</span>
        <span class="file-item__meta">[PNG, 24MB]</span>
        <button class="file-item__delete" type="button" aria-describedby="site-photos-file-2">삭제</button>
        <p class="file-item__message">남측 주차장 드론 촬영 원본.png 파일이 10MB를 넘습니다. 이 파일을 삭제하고 10MB 이하로 줄인 파일을 선택해 주세요.</p>
      </li>
    </ul>
  </div>
css: |-
  .file-upload {
    display: flex;
    flex-direction: column;
    gap: var(--space-gap-3);
  }
  .file-upload__label {
    color: var(--color-text-basic);
    font-size: var(--font-size-label-medium);
    font-weight: var(--font-weight-bold);
  }
  .file-upload__hint {
    color: var(--color-text-subtle);
    font-size: var(--font-size-body-small);
  }
  .file-upload__dropzone {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-gap-4);
    padding: var(--space-padding-8);
    border: var(--space-scale-1) dashed var(--color-border-gray-dark);
    border-radius: var(--radius-large1);
    background-color: var(--color-surface-gray-subtler);
    text-align: center;
  }
  .file-upload__dropzone--active {
    border-color: var(--color-border-primary);
    background-color: var(--color-surface-primary-subtler);
  }
  .file-upload__dropzone-text {
    color: var(--color-text-basic);
    font-size: var(--font-size-body-medium);
  }
  .file-upload__control {
    display: grid;
  }
  .file-upload__input,
  .file-upload__button {
    grid-area: 1 / 1;
  }
  .file-upload__input {
    z-index: 1;
    inline-size: 100%;
    block-size: 100%;
    opacity: 0;
    cursor: pointer;
  }
  .file-upload__button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-block-size: var(--size-height-8);
    padding-inline: var(--space-padding-7);
    border: var(--space-scale-1) solid var(--color-button-secondary-border);
    border-radius: var(--radius-medium3);
    background-color: var(--color-button-secondary-fill);
    color: var(--color-text-primary);
    font-size: var(--font-size-label-medium);
    font-weight: var(--font-weight-bold);
  }
  .file-upload__input:hover + .file-upload__button {
    background-color: var(--color-button-secondary-fill-hover);
  }
  .file-upload__input:focus-visible + .file-upload__button {
    outline: var(--space-scale-2) solid var(--color-input-border-active);
    outline-offset: var(--space-scale-1);
  }
  .file-upload__count {
    align-self: flex-end;
    color: var(--color-text-subtle);
    font-size: var(--font-size-body-small);
  }
  .file-upload__message {
    color: var(--color-text-danger);
    font-size: var(--font-size-body-small);
  }
  .file-upload__list {
    display: flex;
    flex-direction: column;
    gap: var(--space-gap-3);
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .file-item {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-gap-2) var(--space-gap-3);
    padding: var(--space-padding-4) var(--space-padding-6);
    border: var(--space-scale-1) solid var(--color-border-gray-light);
    border-radius: var(--radius-medium3);
  }
  .file-item--error {
    border-color: var(--color-border-danger);
  }
  .file-item__name {
    flex: 1 1 0;
    min-inline-size: 0;
    overflow: hidden;
    color: var(--color-text-basic);
    font-size: var(--font-size-body-medium);
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .file-item__meta {
    flex: none;
    color: var(--color-text-subtle);
    font-size: var(--font-size-body-small);
  }
  .file-item__delete {
    flex: none;
    min-block-size: var(--size-height-6);
    padding-inline: var(--space-padding-4);
    border: 0;
    border-radius: var(--radius-medium3);
    background-color: var(--color-button-text-fill);
    color: var(--color-text-basic);
    font-size: var(--font-size-label-small);
    text-decoration: underline;
    cursor: pointer;
  }
  .file-item__delete:hover {
    background-color: var(--color-button-text-fill-hover);
  }
  .file-item__delete:focus-visible {
    outline: var(--space-scale-2) solid var(--color-input-border-active);
    outline-offset: var(--space-scale-1);
  }
  .file-item__message {
    flex-basis: 100%;
    color: var(--color-text-danger);
    font-size: var(--font-size-body-small);
  }
states:
- name: 끌어다 놓는 중
  markup_change: 파일을 드롭 영역 위로 끌면 드롭 영역에 file-upload__dropzone--active. 놓은 파일은 파일 선택과 같은 처리를 거친다.
  rule: A11Y-021
- name: 항목 오류(형식·크기)
  markup_change: 항목에 file-item--error 와 file-item__message 를 넣는다. 파일 이름·문제·고치는 방법(허용 형식, 최대 크기)을 쓴다(COPY-005, FORM-005).
    개수 영역(role="status")에도 '파일 1개를 올릴 수 없습니다. 목록의 오류 문구를 확인해 주세요.' 를 함께 넣어 초점 이동 없이 알린다(STATE-001).
  rule: FORM-003
- name: 최대 개수 초과
  markup_change: 파일 선택 버튼·드롭 영역은 그대로 쓸 수 있게 두고(disabled·aria-disabled 없음), 최대 개수에 도달한 상태에서 파일을 더 선택하거나 드롭하면 추가 파일은
    목록에 넣지 않고(목록과 file-upload__count 의 개수는 그대로) file-upload__message 에 '현장 사진은 최대 5개까지 올릴 수 있습니다. 파일을 삭제한 뒤 다시 선택해
    주세요.' 를 넣고 input 의 aria-describedby 에 더한다. 선택·드롭 직후 표시한다(FORM-063, CF-040, FORM-080 예외).
  rule: FORM-063
- name: 필수 파일 없음(제출 시)
  markup_change: 제출 버튼을 눌렀을 때 파일이 없으면 input 에 aria-invalid="true", file-upload__message 에 '현장 사진을 1개 이상 선택해 주세요.'
    를 넣는다(FORM-080, FORM-003).
  rule: FORM-080
- name: 제출 후 전송 중
  markup_change: 폼을 제출한 뒤 1초가 지나도 전송이 끝나지 않으면 항목마다 진행 표시와 '전송 중' 텍스트를 보인다. 항목별 진행 표시는 스피너 개수 제한의 예외다(STATE-002,
    STATE-023).
  rule: STATE-002
- name: 단일 파일
  markup_change: input 에서 multiple 을 빼고 개수 영역을 두지 않는다. 고른 파일은 ul 대신 div.file-item 하나로 보인다.
  rule: FORM-065
keyboard:
- key: Tab / Shift+Tab
  action: 파일 입력(보이는 '파일 선택' 버튼 위치에 초점 표시) → 각 파일의 삭제 버튼 순서로 옮긴다(A11Y-016).
- key: Enter / Space
  action: 파일 입력에서는 운영체제 파일 선택 창을 연다. 삭제 버튼에서는 그 파일을 목록에서 뺀다.
behavior:
- 파일을 고르기만 해서는 서버로 보내거나 저장하지 않는다. 폼 제출 버튼을 눌렀을 때 보낸다(FORM-002).
- 파일을 고르면 브라우저에서 형식(accept 와 같은 목록)·크기·개수를 확인해 목록에 넣고, 문제가 있는 파일은 항목 오류로 표시한다. 파일을 고른 동작의 결과이므로 고른 직후에 보여 주고, 필수
  파일 누락은 제출 때 보여 준다(FORM-080, FORM-003).
- 파일을 더하거나 지우면 file-upload__count 의 개수를 바꾼다(role="status", STATE-001).
- 삭제 버튼으로 파일을 지우면 초점을 다음 항목의 삭제 버튼(없으면 파일 입력)으로 옮긴다 — 지워진 버튼에 있던 초점이 사라지지 않게 한다(A11Y-011).
- 파일을 올린 뒤에도, 최대 개수에 도달한 뒤에도 파일 입력과 드롭 영역을 사용 가능한 상태로 둔다(FORM-063).
- 드롭 영역에 놓은 파일은 파일 입력으로 고른 파일과 같은 확인을 거친다. 드롭 영역이 없어도 모든 기능을 쓸 수 있다(A11Y-021).
- 이미지 파일에 크기 제한을 두면 제한 이하로 줄이는 자동 압축을 제공하거나, 제공하지 않는 이유를 기록한다(FORM-062). 크기 제한값은 제출 파일 표본의 일반 크기보다 작게 정하지 않는다(FORM-061).
- 오류를 표시한 뒤에도 정상 파일은 목록에서 지우지 않는다(FORM-016).
- 모달 안에서는 입력 컴포넌트를 5개 이하로 두고 다중 파일 업로드를 넣지 않는다(FORM-011).
- 이름이 잘린 파일 항목(scrollWidth > clientWidth)은 파일명에 초점이 가거나 마우스를 올리면 전체 이름을 툴팁으로 보여 준다(title 속성만 쓰지 않는다). 잘리지 않은 항목은
  tabindex 를 빼도 된다(LAYOUT-055, RESP-002, CF-061).
