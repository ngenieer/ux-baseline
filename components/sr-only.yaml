id: sr-only
title: 숨긴 콘텐츠(스크린 리더 전용 텍스트)
status: confirmed
summary: 화면에는 보이지 않고 스크린 리더만 읽는 텍스트로, 비텍스트 콘텐츠의 복잡한 설명·조작 방법 안내·상태 변화 알림을 전할 때 쓰는 유틸리티 클래스다.
use_instead:
- when: 짧은 이미지 설명이나 버튼·링크·입력의 이름을 전하는 경우
  use: alt·label·aria-label·aria-labelledby
  rule: A11Y-045
- when: 작업을 마치는 데 반드시 알아야 하는 정보인 경우
  use: 화면에 보이는 본문 텍스트
  rule: COPY-009
- when: 커스텀 라디오·체크박스·파일 선택처럼 대화형 요소(input)를 시각적으로 숨기는 경우
  use: 'opacity: 0 으로 숨긴 네이티브 입력을 보이는 대체 요소와 같은 위치·크기로 겹치고 대체 요소에 초점 표시(예 file-upload__input)'
  rule: A11Y-048
krds:
  page: component_11_02.html
  kit_classes:
    sr-only: sr-only (KRDS 페이지 예시 클래스 hidden-text)
anatomy:
- part: 숨긴 텍스트
  class: sr-only
  element: span · p (텍스트 요소)
  required: true
  note: 'clip·1px 크기로 숨긴다. display:none·visibility:hidden·hidden 속성을 이 요소와 조상에 쓰지 않고(A11Y-046), width·height·font-size·line-height 0 을 쓰지 않는다(A11Y-047). 린트 ux-baseline/sr-only-no-display-none·sr-only-no-zero-size 의 기본 대상 클래스다.'
- part: 초점 시 보이는 변형
  class: sr-only--focusable
  element: a
  note: 건너뛰기 링크처럼 초점을 받는 요소에만 쓴다. 초점을 받으면 원래 자리에 나타나고 초점 표시가 보인다(A11Y-016). top·left·text-indent 로 화면 밖에 두지 않는다(A11Y-048).
markup: |-
  <figure>
    <img src="/images/complaints-2026-q1.png" alt="2026년 1분기 월별 민원 접수 건수 막대 그래프" aria-describedby="complaints-chart-desc">
    <p class="sr-only" id="complaints-chart-desc">1월 120건, 2월 95건, 3월 140건입니다. 3월이 가장 많고 2월이 가장 적습니다.</p>
    <figcaption>2026년 1분기 민원 접수 건수</figcaption>
  </figure>
  <p class="sr-only" role="status">목록을 접수일 최신순으로 정렬했습니다.</p>
css: |-
  .sr-only {
    position: absolute;
    inline-size: 1px;
    block-size: 1px;
    margin: calc(var(--space-scale-1) * -1);
    padding: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }
  .sr-only--focusable:focus {
    position: static;
    inline-size: auto;
    block-size: auto;
    margin: 0;
    overflow: visible;
    clip: auto;
    clip-path: none;
    white-space: normal;
    outline: var(--space-scale-2) solid var(--color-input-border-active);
    outline-offset: var(--space-scale-1);
  }
states:
- name: 상태 알림
  markup_change: 초점을 옮기지 않고 상태 변화를 알릴 때는 숨긴 텍스트에 role="status"(긴급하면 role="alert")를 주고, 요소는 미리 두고 텍스트만 바꾼다(STATE-001).
  rule: STATE-001
- name: 초점을 받는 숨긴 링크
  markup_change: a 에 sr-only 와 sr-only--focusable 을 함께 준다. 초점을 받으면 원래 자리에 보이고 초점 표시가 나타난다(A11Y-016).
  rule: A11Y-016
behavior:
- 서비스 언어를 바꾸면 숨긴 텍스트와 aria-label 도 같은 언어로 바꾼다. 숨긴 텍스트를 번역 리소스 키로 관리하고 하드코딩하지 않는다(A11Y-049).
- 숨긴 텍스트를 쓰기 전에 주변 텍스트나 화면에 보이는 표시로 해결할 수 있는지 먼저 확인한다. 과업에 필요한 정보는 보이는 본문에 둔다(COPY-009).
- 숨긴 텍스트의 조상 요소를 display:none·visibility:hidden·hidden 으로 숨기면 스크린 리더도 읽지 않는다 — 상태를 바꿀 때 조상을 숨기지 않는다(A11Y-046).
rules:
- A11Y-016
- A11Y-045
- A11Y-046
- A11Y-047
- A11Y-048
- A11Y-049
- COPY-009
- SPACE-001
- STATE-001
kit_differences:
- KRDS 페이지 예시(hidden-text)는 margin -1px 를 직접 쓴다 — 이 규격은 토큰으로 계산한 값(calc(var(--space-scale-1) * -1))을 쓴다(SPACE-001).
- KRDS 페이지의 대화형 요소 숨김 예시(hidden-control)는 20px 크기·1px 글자로 숨긴다 — 이 규격은 대화형 요소에 sr-only 를 쓰지 않고 opacity 0 겹치기와 대체 요소의 초점 표시를 쓴다(CF-051, A11Y-048, A11Y-016).
notes:
- KRDS HTML 키트에는 이 컴포넌트의 마크업 파일이 없다. KRDS 페이지(component_11_02.html)의 코드 예시와 위 확정 룰로 작성했다.
- 체계의 다른 규격(text-area 한도 도달 알림, calendar 선택 불가 이유, language-switcher 새 창 알림)은 이 클래스를 그대로 쓴다.
