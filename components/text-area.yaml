kit_differences:
- KRDS 키트는 글자 수(textarea-count)를 textarea 와 aria-describedby 로 연결하지 않는다 — 이 규격은 연결해 스크린 리더 사용자도 한도를 알 수 있게 한다(A11Y-025,
  FORM-052).
- KRDS 키트 예시는 플레이스홀더에 '플레이스홀더' 문구를 넣는다 — 이 규격은 안내를 부가 설명에 쓰고 플레이스홀더를 쓰지 않는다(FORM-017).
- KRDS 페이지 본문은 '남은 글자 수'를, 키트는 '0/100' 을 보인다 — 이 규격은 '현재/최대' 형식 하나로 통일한다(CF-039).
notes:
- rows 값은 예시다(500자 → rows 8, 200자 → rows 4). 실제 값은 각 필드의 예상 최대 입력 길이로 정한다(FORM-051).
- 한도 도달 알림(text-area__status)은 .sr-only 유틸리티(components/sr-only.yaml)를 쓴다.
