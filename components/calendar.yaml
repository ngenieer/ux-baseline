css: |-
  .calendar {
    display: flex;
    flex-direction: column;
    gap: var(--space-gap-4);
    inline-size: 100%;
    padding: var(--padding-card-small);
    border: var(--space-scale-1) solid var(--color-border-gray);
    border-radius: var(--radius-large1);
    background-color: var(--color-surface-white);
    box-shadow: var(--shadow-2);
    color: var(--color-text-basic);
  }
  .calendar__header {
    display: flex;
    align-items: center;
    gap: var(--space-gap-1);
  }
  .calendar__title {
    flex: 1 1 auto;
    margin: 0;
    font-size: var(--font-size-heading-xxsmall);
    font-weight: var(--font-weight-bold);
    text-align: center;
  }
  .calendar__nav {
    display: inline-flex;
    flex: none;
    align-items: center;
    justify-content: center;
    inline-size: var(--size-height-6);
    block-size: var(--size-height-6);
    padding: 0;
    border: 0;
    border-radius: var(--radius-medium3);
    background-color: var(--color-button-tertiary-fill);
    color: var(--color-icon-gray);
    cursor: pointer;
  }
  .calendar__nav:hover {
    background-color: var(--color-button-tertiary-fill-hover);
  }
  .calendar__icon {
    inline-size: var(--space-scale-10);
    block-size: var(--space-scale-10);
    fill: currentColor;
  }
  .calendar__grid {
    inline-size: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  .calendar__weekday {
    padding-block: var(--space-padding-2);
    color: var(--color-text-subtle);
    font-size: var(--font-size-label-small);
    font-weight: var(--font-weight-regular);
  }
  .calendar__day {
    block-size: var(--size-height-6);
    min-inline-size: var(--size-height-6);
    padding: 0;
    border-radius: var(--radius-medium3);
    color: var(--color-text-basic);
    font-size: var(--font-size-body-medium);
    text-align: center;
    cursor: pointer;
  }
  .calendar__day:hover {
    background-color: var(--color-button-tertiary-fill-hover);
  }
  .calendar__day--outside {
    cursor: default;
  }
  .calendar__day--today {
    font-weight: var(--font-weight-bold);
    text-decoration: underline;
    text-decoration-thickness: var(--space-scale-2);
    text-underline-offset: var(--space-scale-3);
  }
  .calendar__day--selected,
  .calendar__day--range-start,
  .calendar__day--range-end {
    background-color: var(--color-button-primary-fill);
    color: var(--color-text-inverse-static);
    font-weight: var(--font-weight-bold);
  }
  .calendar__day--selected:hover,
  .calendar__day--range-start:hover,
  .calendar__day--range-end:hover {
    background-color: var(--color-button-primary-fill-hover);
  }
  .calendar__day--in-range {
    border-radius: 0;
    background-color: var(--color-surface-primary-subtler);
  }
  .calendar__day--disabled {
    color: var(--color-text-disabled);
    text-decoration: line-through;
    cursor: not-allowed;
  }
  .calendar__day--disabled:hover {
    background-color: transparent;
  }
  .calendar__day:focus-visible,
  .calendar__nav:focus-visible,
  .calendar__button:focus-visible {
    outline: var(--space-scale-2) solid var(--color-input-border-active);
    outline-offset: var(--space-scale-1);
  }
  .calendar__legend {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-gap-4);
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: var(--font-size-body-small);
  }
  .calendar__legend-item {
    display: flex;
    align-items: center;
    gap: var(--space-gap-2);
  }
  .calendar__legend-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    inline-size: var(--size-height-4);
    block-size: var(--size-height-4);
    border-radius: var(--radius-small3);
    font-size: var(--font-size-label-xsmall);
  }
  .calendar__help {
    color: var(--color-text-subtle);
    font-size: var(--font-size-body-small);
  }
  .calendar__footer {
    display: flex;
    justify-content: flex-end;
    gap: var(--space-gap-3);
  }
  .calendar__button {
    min-block-size: var(--size-height-6);
    padding-inline: var(--space-padding-6);
    border: var(--space-scale-1) solid var(--color-button-tertiary-border);
    border-radius: var(--radius-medium3);
    background-color: var(--color-button-tertiary-fill);
    color: var(--color-text-basic);
    font-size: var(--font-size-label-medium);
    cursor: pointer;
  }
  .calendar__button--primary {
    border-color: var(--color-button-primary-fill);
    background-color: var(--color-button-primary-fill);
    color: var(--color-text-inverse-static);
    font-weight: var(--font-weight-bold);
  }
states:
- name: 오늘
  markup_change: 오늘 칸에 calendar__day--today 와 aria-current="date". 굵게·밑줄로 표시한다(COLOR-001).
  rule: COLOR-001
- name: 선택
  markup_change: 선택한 칸에 calendar__day--selected, aria-selected="true", tabindex="0". 채움 배경·흰 글자·굵게로 표시한다.
  rule: A11Y-025
- name: 선택 불가
  markup_change: 칸에 calendar__day--disabled 와 aria-disabled="true", 이유를 .sr-only 텍스트로 칸 안에 덧붙인다(예 ' 휴관일'). 초점은 받되 Enter·클릭으로 고를 수 없다. 취소선으로 표시하고 범례에 뜻을 쓴다(COLOR-001, A11Y-001).
  rule: COLOR-001
- name: 범위 선택(calendar--range)
  markup_change: 시작 칸에 calendar__day--range-start, 끝 칸에 calendar__day--range-end, 사이 칸에 calendar__day--in-range 를 주고 범위 안 모든 칸에 aria-selected="true". 시작·끝 칸 안에 .sr-only 로 ' 시작일'·' 종료일'을 덧붙인다. 첫 Enter 가 시작일, 두 번째 Enter 가 종료일을 정한다.
  rule: NAV-010
- name: 일정 표시
  markup_change: 이벤트가 있는 칸에 표식과 .sr-only ' 일정 있음' 을 넣고 범례에 뜻을 쓴다. 이벤트 텍스트가 칸에서 잘리면 같은 달 이벤트 전체를 보여 주는 목록·표를 같은 페이지에 두거나 주·일 보기로 바꿀 수 있게 한다(LAYOUT-030).
  rule: LAYOUT-030
keyboard:
- key: Tab / Shift+Tab
  action: 이동 버튼 → 날짜 그리드(초점을 가진 칸 하나) → 취소 → 선택 순서로 옮기고, 끝에서 처음으로 돈다(A11Y-029).
- key: ← / →
  action: 하루 전·후 칸으로 초점을 옮긴다. 달 경계를 넘으면 이전·다음 달을 보여 준다.
- key: ↑ / ↓
  action: 같은 요일의 한 주 전·후 칸으로 초점을 옮긴다.
- key: Home / End
  action: 그 주의 첫 칸(일요일)·마지막 칸(토요일)으로 옮긴다.
- key: PageUp / PageDown
  action: 이전·다음 달의 같은 날(없으면 그 달 마지막 날)로 옮긴다.
- key: Shift+PageUp / Shift+PageDown
  action: 이전·다음 해의 같은 달·같은 날로 옮긴다.
- key: Enter / Space
  action: 날짜 칸에서는 그 날짜를 고르고 대화상자를 닫아 입력 박스에 값을 채운다(aria-disabled 칸은 무시). 버튼에서는 그 버튼을 실행한다.
- key: Esc
  action: 값을 바꾸지 않고 대화상자를 닫고, 초점을 달력 열기 버튼으로 돌려준다.
behavior:
- 열 때 선택된 날짜(없으면 오늘)의 칸에 초점을 둔다. 닫으면 초점을 연 버튼(date-input__picker)으로 돌려준다.
- 초점을 옮길 때 이전 칸은 tabindex="-1", 새 칸은 tabindex="0" 으로 바꾼다. 달이 바뀌면 제목 텍스트를 바꿔 aria-live 로 읽히게 한다(STATE-001).
- 날짜를 고르는 것만으로 제출·페이지 이동을 하지 않는다. 고른 값은 입력 박스에만 채운다(FORM-002).
- 모든 기능을 마우스·키보드·터치로 실행할 수 있게 한다. 드래그로 범위를 고르는 기능을 넣으면 Enter 두 번(시작·종료)으로도 고를 수 있어야 한다(A11Y-011, A11Y-021).
- 날짜 상태와 범례는 서비스의 모든 달력에서 같은 모양·같은 문구로 쓴다(COPY-004).
- 이벤트를 보여 주는 달력에서 칸 안 텍스트가 잘리면 그 달 이벤트 전체를 목록·표로 함께 제공한다(LAYOUT-030).
rules:
- A11Y-001
- A11Y-007
- A11Y-011
- A11Y-012
- A11Y-016
