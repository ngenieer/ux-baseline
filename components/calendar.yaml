id: calendar
title: 달력
status: confirmed
summary: 날짜 입력 필드의 달력 열기 버튼으로 여는 날짜 선택 대화상자로, 요일·인접 날짜를 보며 날짜 하나 또는 시작·종료 범위를 고를 때 쓴다.
use_instead:
- when: 정기적으로 갱신되지 않는 정보이거나 한 달 이벤트가 2개 이하인 일정을 보여 주는 경우
  use: 날짜순 목록
  rule: LAYOUT-031
- when: 생년월일처럼 사용자가 이미 아는 날짜를 받는 경우
  use: date-input(년·월·일 분할, 달력 버튼 없음)
  rule: FORM-021
- when: '''5일 이내''처럼 기준일에서 상대적인 날짜를 받는 경우'
  use: 짧은 숫자 입력 또는 상대 날짜 옵션 셀렉트
  rule: FORM-050
krds:
  page: component_04_03.html
  kit: html/code/calendar.html, html/code/calendar_range.html
  kit_classes:
    calendar: calendar-wrap
    calendar__header: calendar-head
    calendar__nav: btn-cal-move
    calendar__title: calendar-switch-wrap (btn-cal-switch)
    calendar__grid: calendar-tbl
    calendar__day: td (button.btn-set-date)
    calendar__day--today: today
    calendar__day--disabled: disabled
    calendar__day--range-start: period start
    calendar__day--range-end: period end
    calendar__day--in-range: period
    calendar__footer: calendar-footer
anatomy:
- part: 루트(대화상자)
  class: calendar
  element: div
  required: true
  note: role="dialog" aria-modal="true", aria-labelledby 로 달·연 제목을 이름으로 준다(WAI-ARIA APG Date Picker Dialog). 열려 있는 동안 초점은 대화상자 안에서만 돈다(A11Y-029).
- part: 머리
  class: calendar__header
  element: div
  required: true
  note: 이전 해·이전 달·제목·다음 달·다음 해 순서. 먼 과거·미래 날짜로 빨리 옮길 수 있게 해 단위 이동 버튼을 둔다(FORM-049).
- part: 이동 버튼
  class: calendar__nav
  element: button
  required: true
  note: 아이콘 버튼이므로 aria-label 로 '이전 달' 등 이름을 준다(A11Y-025). 모든 페이지의 달력에서 같은 이름·아이콘을 쓴다(COPY-004). 크기 40px(size-height-6)(LAYOUT-002).
- part: 아이콘
  class: calendar__icon
  element: svg
  note: aria-hidden="true"(A11Y-001).
- part: 제목
  class: calendar__title
  element: h2
  required: true
  note: '보이는 달을 ''2026년 10월''로 쓴다. aria-live="polite" 로 달이 바뀌면 읽힌다(STATE-001).'
- part: 날짜 그리드
  class: calendar__grid
  element: table
  required: true
  note: role="grid", aria-labelledby 로 제목과 연결한다. 요일 머리는 th scope="col" 이고 abbr 에 요일 전체 이름을 쓴다(A11Y-007).
- part: 요일
  class: calendar__weekday
  element: th
  required: true
- part: 날짜 칸
  class: calendar__day
  element: td
  required: true
  note: 칸 하나가 초점을 받는다(roving tabindex — 선택한 날짜 또는 오늘이 tabindex="0", 나머지 "-1"). 상태는 aria-selected·aria-current="date"·aria-disabled 로 노출하고(A11Y-025), 색 외에 굵기·밑줄·취소선을 함께 쓴다(COLOR-001). 다른 달 칸은 비운다. 칸 크기 40px 이상(LAYOUT-002).
- part: 범례
  class: calendar__legend
  element: ul
  note: 날짜 상태를 텍스트로 풀어 쓴다. 서비스의 모든 달력에서 같은 표현·구조를 쓴다(COPY-004, COLOR-001).
- part: 범례 표식
  class: calendar__legend-mark
  element: span
  note: 날짜 칸과 같은 상태 클래스를 함께 줘 같은 모양으로 보인다. 옆 텍스트가 뜻을 전하므로 aria-hidden="true"(A11Y-001).
- part: 조작 안내
  class: calendar__help
  element: p
  note: 방향키 조작을 대화상자의 aria-describedby 로 연결한다(A11Y-012).
- part: 바닥
  class: calendar__footer
  element: div
  required: true
- part: 버튼
  class: calendar__button
  element: button
  required: true
  note: '''취소''와 실행할 동작인 ''선택''을 둔다. ''확인''만 쓰지 않는다(COPY-006).'
