kit_differences:
- KRDS 키트는 말풍선 제목을 h6(그 앞에 sr-only h5 '따라하기 가이드')로 써서 페이지 제목 계층을 건너뛴다 — 이 규격은 놓이는 위치에 맞는 제목 수준을 쓰고 dialog 의 aria-labelledby
  로 연결한다(A11Y-025).
- KRDS 키트 진행 표시는 sr-only '현재 단계'·'총 단계'와 숫자 '1'·'4'를 나눠 둔다 — 이 규격은 '4단계 중 1단계'를 보이는 텍스트 하나로 쓴다.
- KRDS 키트 '다음으로' 버튼은 tertiary(채움) 버튼이다 — 이 규격은 고스트 버튼으로 쓴다(COLOR-021).
- KRDS 키트 말풍선은 word-break break-all 이다 — 이 규격은 한국어 어절 단위 줄바꿈(전역 keep-all)을 따른다(CF-049).
notes:
- 너비 22.5rem 은 KRDS 키트 popover-max-width(36rem, 루트 62.5% 기준 360px)를 16px 루트로 옮긴 값이다. 대상 강조(border-primary 1px +
  border-primary-light 바깥 띠)는 키트의 outline 1rem(10px)을 같은 10px 인 space-scale-6 토큰으로 옮겼다. 강조는 대상을 감싸는 컨테이너에 붙이므로 그
  안 입력 필드의 초점 표시와 겹치지 않는다.
- 다음 버튼만 고스트, 나머지는 텍스트 버튼으로 강조를 낮춘 것은 COLOR-021 에 따른 것이고 색 값은 KRDS 키트 tertiary 테두리 토큰을 썼다.
