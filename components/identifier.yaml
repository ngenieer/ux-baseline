id: identifier
title: 운영기관 식별자
status: confirmed
summary: 공식 디지털 정부 서비스의 푸터 하단에서 서비스를 운영하는 기관을 로고와 안내 문구로 밝힐 때 쓴다.
use_instead:
- when: 운영 주체가 정부기관이 아닌 사이트
  use: 운영기관 식별자를 쓰지 않는다
  rule: COPY-014
- when: 서비스 자체 로고를 보여줄 때
  use: 푸터의 서비스 로고(footer__logo)
  rule: LAYOUT-010
krds:
  page: component_02_02.html
  kit: html/code/identifier.html
  kit_classes:
    identifier: krds-identifier
    identifier__logo: logo
    identifier__text: ban-txt
anatomy:
- part: 루트
  class: identifier
  element: div
  required: true
  note: 푸터(footer) 안 저작권 정보 다음, 푸터의 마지막 요소로 둔다.
- part: 운영기관 로고
  class: identifier__logo
  element: img
  required: true
  note: 서비스 로고가 아니라 운영 기관의 로고다. alt 는 기관명이다(LAYOUT-010, A11Y-001). width·height 속성으로 공간을 예약한다.
- part: 안내 문구
  class: identifier__text
  element: p
  required: true
  note: 문구는 '이 누리집은 [운영기관명]에서 운영하는 누리집입니다.' 형식에서 기관명만 바꾼다. 기관이 여럿이면 쉼표로 구분한다(COPY-013).
markup: |-
  <div class="identifier">
    <img class="identifier__logo" src="/images/org-logo.svg" alt="보건복지부" width="136" height="32">
    <p class="identifier__text">이 누리집은 보건복지부에서 운영하는 누리집입니다.</p>
  </div>
css: |-
  .identifier {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-gap-2);
    inline-size: 100%;
    min-block-size: var(--size-height-6);
    padding-block: var(--space-padding-3);
    padding-inline: var(--space-padding-6);
    border-radius: var(--radius-medium1);
    background-color: var(--color-surface-white);
  }
  .identifier__logo {
    flex: none;
    inline-size: auto;
    block-size: var(--size-height-3);
  }
  .identifier__text {
    color: var(--color-text-basic);
    font-size: var(--font-size-body-xsmall);
    word-break: keep-all;
    overflow-wrap: anywhere;
  }
  @media (min-width: 768px) {
    .identifier {
      flex-direction: row;
      align-items: center;
      gap: var(--space-gap-3);
    }
    .identifier__logo {
      block-size: var(--size-height-4);
    }
    .identifier__text {
      font-size: var(--font-size-body-small);
    }
  }
behavior:
- 요소 순서는 운영기관 로고 → 안내 문구로 두고 바꾸지 않는다(COPY-013). 좁은 화면(768px 미만)에서는 세로로 쌓되 같은 순서를 유지한다.
- 안내 문구는 정규식 ^이 누리집은 .+에서 운영하는 누리집입니다\.$ 와 일치하게 쓴다(COPY-013).
- 로고 이미지는 운영 기관 로고이고 대체 텍스트는 기관명이다. 서비스 로고는 푸터의 서비스 로고 자리에 둔다(LAYOUT-010, A11Y-001).
- 글자 크기는 본문 작은 글자 이하로 두어 푸터의 연락처·링크보다 주목도를 낮춘다(COLOR-013). 글자와 배경 대비는 4.5:1 이상이다(COLOR-002).
- 이미지 크기를 CSS 로 바꿀 때 한 축은 auto 로 두어 비율을 유지한다(PERF-009).
- 공식 정부 서비스가 아닌 사이트에서는 쓰지 않는다(COPY-014).
rules:
- A11Y-001
- COLOR-002
- COLOR-013
- COPY-013
- COPY-014
- LAYOUT-010
- PERF-009
- TYPO-017
kit_differences:
- KRDS 키트 예시 문구는 '이 누리집은 보건복지부 누리집입니다.' 이다 — 이 규격은 '이 누리집은 보건복지부에서 운영하는 누리집입니다.' 형식을 쓴다(COPY-013).
- KRDS 키트는 로고를 CSS 배경 이미지 + 숨긴 텍스트(sr-only)로 넣는다 — 이 규격은 alt 가 기관명인 img 로 넣는다(A11Y-001, LAYOUT-010).
- KRDS 키트는 좁은 화면에서 문구에 word-break break-all 을 쓴다 — 이 규격은 keep-all + overflow-wrap anywhere 를 쓴다(TYPO-017).
notes:
- img 의 src·width·height 는 예시 값이다. 실제 기관 로고 파일의 크기로 바꾼다.
