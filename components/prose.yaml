notes:
- KRDS 에 대응하는 컴포넌트 이름이 없다. 적용 룰은 rules/TYPO 를 직접 읽어 골랐다.
- 문단·제목 간격은 KRDS gap-layout-* 토큰 대신 --space-gap-* 를 썼다 — SPACE-001 이 간격 값을 var(--space-*) 로 정한다.
- TYPO-010(Pretendard GOV·17px)은 KRDS 표준형 서비스에 적용된다. 이 블록은 서체를 직접 지정하지 않고 상위(body)의 --font-family-base 를 물려받는다.
