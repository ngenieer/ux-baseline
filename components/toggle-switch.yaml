id: toggle-switch
title: 토글 스위치
status: confirmed
summary: 켜짐·꺼짐 두 상태를 바꾸고 그 결과가 제출 없이 바로 반영되는 설정(알림 수신 등)에 쓴다.
use_instead:
- when: 제출·적용 버튼을 눌러야 반영되는 선택
  use: checkbox 또는 radio-group
  rule: FORM-041
- when: 상호 배타 옵션이 3개 이상이거나 부울이 아닌 선택
  use: radio-group
  rule: FORM-041
- when: 상위 항목이 하위 항목들을 함께 켜고 끄는 계층 선택
  use: 중간 상태를 쓰는 checkbox 목록
  rule: FORM-042
- when: 레이블 하나로 두 상태의 뜻을 설명할 수 없는 경우
  use: 각자 레이블을 가진 radio-group 옵션 2개
  rule: FORM-043
- when: 아직 선택하지 않음 상태가 필요한 질문
  use: radio-group
  rule: FORM-044
krds:
  page: component_06_07.html
  kit: html/code/toggle_switch.html
  kit_classes:
    toggle-switch: krds-form-toggle-switch large
    toggle-switch__input: krds-form-toggle-switch input[type=checkbox]
    toggle-switch__track: switch-toggle
    toggle-switch__thumb: switch-toggle > i
    toggle-switch__label: krds-form-toggle-switch label
anatomy:
- part: 루트
  class: toggle-switch
  element: div
  required: true
  note: 스위치와 레이블을 바로 옆에 붙여 둔다(LAYOUT-050). 한 화면의 토글 항목은 모두 같은 배열(스위치 왼쪽·레이블 오른쪽)을 쓴다(LAYOUT-051).
- part: 네이티브 입력
  class: toggle-switch__input
  element: input[type=checkbox][role=switch]
  required: true
  note: 처음부터 켜짐(checked) 또는 꺼짐 상태를 가진다(FORM-044). opacity 0 으로 숨기고 트랙과 같은 칸·같은 크기(40×24px)로 겹친다. display none·visibility hidden·top/left 이동으로 숨기지 않는다(CF-051, A11Y-048).
- part: 트랙
  class: toggle-switch__track
  element: span
  required: true
  note: aria-hidden 장식. 켜짐은 주조색, 꺼짐은 회색. 인접 배경과 3:1 이상(COLOR-003). 키보드 초점 표시를 트랙에 그린다(A11Y-016).
- part: 핸들
  class: toggle-switch__thumb
  element: span
  required: true
  note: 켜짐이면 오른쪽, 꺼짐이면 왼쪽. 위치로 상태를 전달한다(COPY-033).
- part: 레이블
  class: toggle-switch__label
  element: label
  required: true
  note: for 로 입력과 연결해 레이블을 눌러도 바뀐다(FORM-034). 명사형으로 쓰고(COPY-032) 상태가 바뀌어도 바꾸지 않는다(COPY-033).
- part: 도움말
  class: toggle-switch__hint
  element: p
  note: 무엇이 켜지고 꺼지는지 레이블만으로 부족할 때 쓴다. 입력의 aria-describedby 로 연결한다(COPY-032, A11Y-007).
- part: 상태 텍스트
  class: toggle-switch__state
  element: span
  note: 선택. '켜짐'·'꺼짐'을 레이블과 분리된 별도 텍스트로 스위치 바로 옆에 둔다(COPY-034). 한 항목에 넣으면 화면의 모든 토글에 넣는다(LAYOUT-051). 상태는 role=switch 가 전달하므로 aria-hidden 으로 둔다.
markup: |-
  <div class="toggle-switch">
    <input class="toggle-switch__input" type="checkbox" role="switch" id="notify-sms" name="notify-sms" checked aria-describedby="notify-sms-hint">
    <span class="toggle-switch__track" aria-hidden="true"><span class="toggle-switch__thumb"></span></span>
    <label class="toggle-switch__label" for="notify-sms">문자 알림 수신</label>
    <p class="toggle-switch__hint" id="notify-sms-hint">신청 처리 결과를 휴대전화 문자로 받습니다. 바꾸면 바로 저장됩니다.</p>
  </div>
  <div class="toggle-switch">
    <input class="toggle-switch__input" type="checkbox" role="switch" id="notify-email" name="notify-email">
    <span class="toggle-switch__track" aria-hidden="true"><span class="toggle-switch__thumb"></span></span>
    <label class="toggle-switch__label" for="notify-email">이메일 알림 수신</label>
  </div>
css: |-
  .toggle-switch {
    display: grid;
    grid-template-columns: auto 1fr;
    align-items: center;
    column-gap: var(--space-gap-3);
    row-gap: var(--space-gap-1);
    justify-items: start;
  }
  .toggle-switch__input,
  .toggle-switch__track {
    grid-area: 1 / 1;
    inline-size: var(--space-scale-14);
    block-size: var(--size-height-4);
    margin: 0;
  }
  .toggle-switch__input {
    position: relative;
    z-index: 1;
    opacity: 0;
    cursor: pointer;
  }
  .toggle-switch__track {
    display: flex;
    align-items: center;
    box-sizing: border-box;
    border-radius: var(--radius-max);
    background-color: var(--color-element-gray);
    transition: background-color var(--motion-duration-fast) var(--motion-easing-standard);
  }
  .toggle-switch__thumb {
    box-sizing: border-box;
    inline-size: var(--size-height-4);
    block-size: var(--size-height-4);
    border: var(--border-width-variable-medium) solid var(--color-element-gray);
    border-radius: var(--radius-max);
    background-color: var(--color-element-inverse);
    transition: transform var(--motion-duration-fast) var(--motion-easing-standard);
  }
  .toggle-switch__input:checked + .toggle-switch__track {
    background-color: var(--color-element-primary);
  }
  .toggle-switch__input:checked + .toggle-switch__track .toggle-switch__thumb {
    border-color: var(--color-element-primary);
    transform: translateX(var(--space-scale-8));
  }
  .toggle-switch__input:focus-visible + .toggle-switch__track {
    outline: var(--space-scale-2) solid var(--color-border-primary);
    outline-offset: var(--space-scale-1);
  }
  .toggle-switch__input:disabled + .toggle-switch__track {
    background-color: var(--color-element-disabled-light);
  }
  .toggle-switch__input:disabled + .toggle-switch__track .toggle-switch__thumb {
    border-color: var(--color-element-disabled-light);
    background-color: var(--color-element-disabled-dark);
  }
  .toggle-switch__input:disabled ~ .toggle-switch__label {
    color: var(--color-text-disabled);
  }
  .toggle-switch__label {
    grid-area: 1 / 2;
    color: var(--color-text-basic);
    font-size: var(--font-size-label-medium);
    cursor: pointer;
  }
  .toggle-switch__hint {
    grid-area: 2 / 2;
    margin: 0;
    color: var(--color-text-subtle);
    font-size: var(--font-size-body-small);
  }
  .toggle-switch__state {
    color: var(--color-text-subtle);
    font-size: var(--font-size-label-small);
  }
  @media (prefers-reduced-motion: reduce) {
    .toggle-switch__track,
    .toggle-switch__thumb {
      transition: none;
    }
  }
states:
- name: 켜짐
  markup_change: 입력이 checked 가 된다. 트랙이 주조색이 되고 핸들이 오른쪽으로 간다 — 색과 핸들 위치 두 단서로 구분한다(COLOR-001). 레이블 텍스트는 바꾸지 않는다(COPY-033).
  rule: COPY-033
- name: 비활성
  markup_change: 입력에 disabled. 바꿀 수 없는 이유를 도움말에 쓴다. 비활성 색은 불투명 토큰을 쓴다(COLOR-006).
  rule: COLOR-006
- name: 상태 텍스트 사용
  markup_change: 트랙 바로 뒤에 span.toggle-switch__state(aria-hidden="true")를 두고 상태에 맞춰 '켜짐'·'꺼짐'으로 바꾼다. 화면의 모든 토글에 같은 방식으로 넣는다(COPY-034, LAYOUT-051).
  rule: COPY-034
- name: 목록형 설정 화면
  markup_change: 행 전체를 클릭 영역으로 만든 설정 목록에서는 레이블을 왼쪽 끝, 스위치를 오른쪽 끝에 둘 수 있다(CF-013). 그 밖에는 바로 옆에 붙인다(LAYOUT-050).
  rule: LAYOUT-050
keyboard:
- key: Tab / Shift+Tab
  action: 스위치로 초점을 옮긴다. 초점 표시는 트랙 위에 보인다(A11Y-016).
- key: Space
  action: 켜짐·꺼짐을 바꾼다(A11Y-035). 네이티브 체크박스가 처리한다.
behavior:
- input[type=checkbox] 에 role="switch" 를 주어 스위치 역할과 켜짐·꺼짐 상태를 보조기술에 전달한다(A11Y-025). 키보드 동작은 스크립트로 다시 만들지 않는다.
- 커스텀 트랙을 쓸 때 네이티브 입력은 opacity 0 으로 숨기고 트랙과 같은 위치·크기에 겹치며, 트랙에 초점 표시를 그린다(CF-051, A11Y-016, A11Y-048).
- 상태를 바꾸면 제출 버튼 없이 바로 저장·반영하고, 저장 결과(실패 포함)를 role="status" 영역으로 알린다(FORM-041, STATE-001). 저장에 실패하면 스위치를 이전 상태로 되돌린다.
- 상태 변경으로 페이지 이동·새 창 열기를 하지 않는다(FORM-002).
- 레이블 텍스트를 눌러도 상태가 바뀐다(FORM-034).
- 레이블은 명사형('문자 알림 수신')으로 쓰고, 켜면 무엇이 바뀌는지 드러나지 않으면 도움말을 붙인다(COPY-032).
- '핸들 이동은 transform 으로만 움직이고, prefers-reduced-motion: reduce 에서는 전환 효과를 끈다(MOTION-004, MOTION-012).'
- 트랙·핸들은 인접 배경과 3:1 이상 대비를 가진다(COLOR-003).
