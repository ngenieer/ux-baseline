id: range-slider
title: 범위 슬라이드
status: confirmed
summary: 소리 크기·밝기처럼 정확한 수치보다 범위 안의 상대적인 값이 중요한 설정을 고를 때 쓰는 단일 값 슬라이더다.
use_instead:
- when: 정확한 수치·단위를 입력해야 하는 값
  use: text-field (inputmode="numeric")
  rule: FORM-071
- when: ON/OFF, 낮음/보통/높음처럼 이름 붙은 선택지 중 하나를 고르는 값
  use: radio-group 또는 toggle-switch
  rule: FORM-071
- when: 기준 값을 포함해 11단계 이내의 수량을 고르는 경우
  use: quantity-stepper
krds:
  page: component_12_01.html
anatomy:
- part: 루트
  class: range-slider
  element: div
  required: true
  note: 머리줄(레이블·선택 값) → 슬라이더 → 범위 값 순서로 쌓는다.
- part: 머리줄
  class: range-slider__header
  element: div
  required: true
  note: 레이블을 왼쪽, 선택 값을 오른쪽에 두어 선택 값이 핸들보다 위에 오게 한다(FORM-067).
- part: 레이블
  class: range-slider__label
  element: label
  required: true
  note: for 로 슬라이더와 연결한다(FORM-004). 무엇을 고르는지 밝힌다(COPY-003).
- part: 선택 값
  class: range-slider__value
  element: span
  required: true
  note: 현재 값을 텍스트로 늘 보인다(FORM-068). 핸들 아래에 두지 않는다(FORM-067). 보조기술에는 슬라이더의 aria-valuetext 가 같은 값을 전하므로 aria-hidden 으로 중복 낭독을 막는다.
- part: 슬라이더
  class: range-slider__input
  element: input[type=range]
  required: true
  note: 브라우저 기본 range 입력. 핸들 끌기와 트랙 클릭(단일 포인터) 모두로 값을 바꾼다(A11Y-021). 높이 24px 이상(LAYOUT-002).
- part: 범위 값
  class: range-slider__range
  element: div
  required: true
  note: 최솟값을 트랙 왼쪽 끝 아래, 최댓값을 오른쪽 끝 아래에 텍스트로 둔다. 값은 input 의 min·max 와 같다(FORM-069).
markup: |-
  <div class="range-slider">
    <div class="range-slider__header">
      <label class="range-slider__label" for="alert-volume">알림 소리 크기</label>
      <span class="range-slider__value" aria-hidden="true">50%</span>
    </div>
    <input class="range-slider__input" type="range" id="alert-volume" name="alert-volume" min="0" max="100" step="10" value="50" aria-valuetext="50%">
    <div class="range-slider__range">
      <span class="range-slider__min">0%</span>
      <span class="range-slider__max">100%</span>
    </div>
  </div>
css: |-
  .range-slider {
    display: flex;
    flex-direction: column;
    gap: var(--space-gap-3);
  }
  .range-slider__header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: var(--space-gap-4);
  }
  .range-slider__label {
    color: var(--color-text-basic);
    font-size: var(--font-size-label-medium);
    font-weight: var(--font-weight-bold);
  }
  .range-slider__value {
    color: var(--color-text-primary);
    font-size: var(--font-size-label-medium);
    font-weight: var(--font-weight-bold);
  }
  .range-slider__input {
    inline-size: 100%;
    min-block-size: var(--size-height-4);
    margin: 0;
    accent-color: var(--color-element-primary);
    cursor: pointer;
  }
  .range-slider__input:focus-visible {
    outline: var(--space-scale-2) solid var(--color-border-primary);
    outline-offset: var(--space-scale-1);
  }
  .range-slider__input:disabled {
    accent-color: var(--color-element-disabled-dark);
    cursor: not-allowed;
  }
  .range-slider__range {
    display: flex;
    justify-content: space-between;
    color: var(--color-text-subtle);
    font-size: var(--font-size-body-small);
  }
states:
- name: 조절 중
  markup_change: input 이벤트마다 선택 값 텍스트와 aria-valuetext 를 현재 값(단위 포함)으로 바꾼다. 선택 값 요소를 숨기거나 투명하게 하지 않는다(FORM-068).
  rule: FORM-068
- name: 비활성
  markup_change: 슬라이더에 disabled. 바꿀 수 없는 이유를 레이블 근처에 텍스트로 쓴다.
keyboard:
- key: Tab / Shift+Tab
  action: 슬라이더로 초점을 옮긴다. 초점 표시가 보인다(A11Y-016).
- key: ← / ↓ , → / ↑
  action: step 만큼 줄이거나 늘린다(브라우저 기본 range 동작).
- key: Home / End
  action: 최솟값·최댓값으로 옮긴다.
- key: PageUp / PageDown
  action: 브라우저가 정한 큰 단위로 늘리거나 줄인다.
behavior:
- 브라우저 기본 input[type=range] 를 쓰고 키보드·포인터 동작을 스크립트로 다시 만들지 않는다(A11Y-011, A11Y-025). 커스텀 슬라이더(role=slider)는 이 규격 밖이다.
- 핸들 끌기 없이 트랙 클릭·탭만으로도 값을 바꿀 수 있다(A11Y-021) — 기본 range 입력이 제공한다.
- 값을 조절하는 동안 선택 값 텍스트와 aria-valuetext 를 계속 갱신한다(FORM-068).
- 선택 값은 핸들 위(머리줄 오른쪽)에 두고 핸들 아래에 두지 않는다(FORM-067).
- 최솟값·최댓값을 텍스트로 표시하고 input 의 min·max 와 같게 한다(FORM-069).
- step 은 (max − min) 의 10~20% 로 정한다(FORM-070). 예시는 0~100 에서 step 10(10%).
- 값을 바꾸는 것만으로 제출·페이지 이동을 하지 않는다(FORM-002).
- 정확한 수치나 이름 붙은 선택지를 받는 데 쓰지 않는다(FORM-071).
rules:
- A11Y-011
- A11Y-016
- A11Y-021
- A11Y-025
- COLOR-003
- COPY-003
- FORM-002
- FORM-004
- FORM-067
- FORM-068
- FORM-069
- FORM-070
- FORM-071
- LAYOUT-002
notes:
- KRDS HTML 키트 v1.1.0 에는 범위 슬라이드 마크업 파일이 없어 KRDS 범위 슬라이드 페이지(구조 — 레이블·슬라이더·핸들·선택 값·범위 값)와 확정 룰로 규격을 만들었다.
- 트랙·핸들 모양은 브라우저 기본에 accent-color(주조색)만 입혔다. 채워지지 않은 트랙 색은 브라우저가 정하므로 COLOR-003 의 3:1 은 브라우저 기본 모양 예외에 기대고 있다. 트랙·핸들을 ::-webkit-slider-thumb 등으로 직접 그리면 3:1 대비를 실제 브라우저에서 확인해야 한다.
- 범위를 두 핸들로 고르는(최소~최대) 이중 슬라이더는 KRDS 페이지에 없어 이 규격에 넣지 않았다.
