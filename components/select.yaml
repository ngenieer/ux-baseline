id: select
title: 셀렉트
status: confirmed
summary: 사용자가 익숙한 7~20개 옵션 목록(시·도, 연도 등)에서 하나를 고를 때 쓰는 브라우저 기본 select 다.
use_instead:
- when: 옵션이 6개 이하이거나 옵션을 서로 비교해야 고를 수 있는 단일 선택
  use: radio-group
  rule: FORM-029
- when: 단일 선택 옵션이 20개를 넘는 경우
  use: 입력으로 옵션을 걸러 주는 콤보 상자, 또는 셀렉트 여러 개로 단계 나누기
  rule: FORM-037
- when: 여러 값을 한 번에 골라야 하는 경우
  use: checkbox 그룹
  rule: FORM-038
krds:
  page: component_06_03.html
  kit: html/code/select.html
  kit_classes:
    select: form-group
    select__label: form-tit label
    select__control: krds-form-select
    select__hint: form-hint
    select__message: form-hint-invalid
    select--sort: krds-form-select-sort
anatomy:
- part: 루트
  class: select
  element: div
  required: true
  note: 레이블 → 부가 설명 → 선택 박스 → 시스템 메시지 순서로 쌓는다(텍스트 입력 필드와 같은 배열).
- part: 레이블
  class: select__label
  element: label
  required: true
  note: for 로 select id 와 연결한다(FORM-004). 무엇을 고르는지 밝힌다(COPY-003).
- part: 부가 설명
  class: select__hint
  element: p
  note: select 의 aria-describedby 로 연결한다.
- part: 선택 박스 틀
  class: select__field
  element: div
  required: true
  note: select 와 화살표 아이콘을 같은 그리드 칸에 겹친다(위치 이동 없이 배치).
- part: 선택 박스
  class: select__control
  element: select
  required: true
  note: 브라우저 기본 select 를 쓴다(FORM-039). appearance none 으로 기본 화살표만 지우고 키보드·옵션 목록은 브라우저에 맡긴다. 주소 같은 본인 정보는 autocomplete 값을 준다(FORM-001).
- part: 화살표 아이콘
  class: select__arrow
  element: svg
  required: true
  note: aria-hidden 장식. pointer-events none 으로 클릭이 select 에 가게 한다. 인접 색과 3:1 이상 대비(COLOR-003).
- part: 시스템 메시지(오류)
  class: select__message
  element: p
  note: 제출 시 오류가 있을 때만 넣고 aria-describedby 에 id 를 더한다(FORM-003).
markup: |-
  <div class="select">
    <label class="select__label" for="residence-region">거주 지역 (필수)</label>
    <p class="select__hint" id="residence-region-hint">주민등록상 주소지의 시·도를 선택해 주세요.</p>
    <div class="select__field">
      <select class="select__control" id="residence-region" name="region" autocomplete="address-level1" required aria-describedby="residence-region-hint">
        <option value="">시·도 선택</option>
        <option>강원특별자치도</option>
        <option>경기도</option>
        <option>경상남도</option>
        <option>경상북도</option>
        <option>광주광역시</option>
        <option>대구광역시</option>
        <option>대전광역시</option>
        <option>부산광역시</option>
        <option>서울특별시</option>
        <option>세종특별자치시</option>
        <option>울산광역시</option>
        <option>인천광역시</option>
        <option>전라남도</option>
        <option>전북특별자치도</option>
        <option>제주특별자치도</option>
        <option>충청남도</option>
        <option>충청북도</option>
      </select>
      <svg class="select__arrow" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg>
    </div>
  </div>
  <div class="select select--error">
    <label class="select__label" for="birth-month">태어난 달 (필수)</label>
    <div class="select__field">
      <select class="select__control" id="birth-month" name="birth-month" autocomplete="bday-month" required aria-invalid="true" aria-describedby="birth-month-error">
        <option value="">월 선택</option>
        <option value="1">1월</option>
        <option value="2">2월</option>
        <option value="3">3월</option>
        <option value="4">4월</option>
        <option value="5">5월</option>
        <option value="6">6월</option>
        <option value="7">7월</option>
        <option value="8">8월</option>
        <option value="9">9월</option>
        <option value="10">10월</option>
        <option value="11">11월</option>
        <option value="12">12월</option>
      </select>
      <svg class="select__arrow" aria-hidden="true" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg>
    </div>
    <p class="select__message" id="birth-month-error">태어난 달을 선택해 주세요.</p>
  </div>
css: |-
  .select {
    display: flex;
    flex-direction: column;
    gap: var(--space-gap-3);
  }
  .select__label {
    color: var(--color-text-basic);
    font-size: var(--font-size-label-medium);
    font-weight: var(--font-weight-bold);
  }
  .select__hint {
    margin: 0;
    color: var(--color-text-subtle);
    font-size: var(--font-size-body-small);
  }
  .select__field {
    display: grid;
    align-items: center;
  }
  .select__control,
  .select__arrow {
    grid-area: 1 / 1;
  }
  .select__control {
    appearance: none;
    inline-size: 100%;
    min-block-size: var(--size-height-8);
    margin: 0;
    padding-inline: var(--space-padding-6) var(--space-padding-10);
    border: var(--border-width-variable-regular) solid var(--color-input-border);
    border-radius: var(--radius-medium3);
    background-color: var(--color-input-surface);
    color: var(--color-text-basic);
    font-size: var(--font-size-body-medium);
    cursor: pointer;
  }
  .select__control:focus-visible {
    outline: var(--space-scale-2) solid var(--color-input-border-active);
    outline-offset: var(--space-scale-1);
  }
  .select__control:disabled {
    border-color: var(--color-input-border-disabled);
    background-color: var(--color-input-surface-disabled);
    color: var(--color-text-disabled);
    cursor: not-allowed;
  }
  .select__arrow {
    justify-self: end;
    inline-size: var(--size-height-3);
    block-size: var(--size-height-3);
    margin-inline-end: var(--space-padding-6);
    fill: none;
    stroke: var(--color-icon-gray);
    stroke-width: 2;
    pointer-events: none;
  }
  .select__control:disabled + .select__arrow {
    stroke: var(--color-icon-disabled);
  }
  .select--error .select__control {
    border-color: var(--color-input-border-error);
  }
  .select__message {
    margin: 0;
    color: var(--color-text-danger);
    font-size: var(--font-size-body-small);
  }
  .select--sort .select__control {
    inline-size: auto;
    min-block-size: var(--size-height-6);
    padding-inline: var(--space-padding-1) var(--space-padding-9);
    border-color: transparent;
    font-size: var(--font-size-label-small);
  }
  .select--sort .select__arrow {
    margin-inline-end: var(--space-padding-1);
  }
states:
- name: 오류
  markup_change: 루트에 select--error, select 에 aria-invalid="true", 시스템 메시지 p 를 넣고 그 id 를 aria-describedby 에 더한다. 메시지는 항목 이름과 할 일을 담는다(FORM-003, COPY-005).
  rule: FORM-003
- name: 비활성
  markup_change: select 에 disabled. 값을 바꿀 수 없는 이유를 부가 설명에 쓴다. 비활성 색은 불투명 토큰을 쓴다(COLOR-006).
  rule: COLOR-006
- name: 정렬형
  markup_change: 루트에 select--sort. 목록 위 정렬 기준 선택에 쓰고 보이는 레이블('정렬')을 그대로 둔다(FORM-004). 정렬을 바꾸는 것만으로 페이지를 이동하거나 폼을 제출하지 않는다(FORM-002).
  rule: FORM-002
keyboard:
- key: Tab / Shift+Tab
  action: 선택 박스로 초점을 옮기고 다시 빼낸다(A11Y-012). 초점 표시가 보인다(A11Y-016).
- key: ↑ / ↓ / Home / End / 글자 입력
  action: 브라우저 기본 select 동작으로 옵션을 바꾼다. 스크립트로 다시 만들지 않는다.
- key: Alt+↓ / Space / Enter
  action: 브라우저가 옵션 목록을 펼친다(운영체제별 기본 동작).
behavior:
- 값을 바꾸는 것만으로 폼 제출·페이지 이동·새 창 열기를 하지 않는다. 정렬·필터는 같은 화면 안에서 목록을 다시 그리거나(URL·초점 변화 없음) 함께 둔 적용 버튼으로 실행한다(FORM-002).
- 옵션은 7개 이상 20개 이하일 때 쓴다(FORM-036). 20개를 넘으면 콤보 상자나 단계별 셀렉트로 바꾼다(FORM-037). 6개 이하이거나 비교가 필요한 선택은 라디오 버튼을 검토한다(FORM-029, FORM-030).
- 여러 값을 고르는 데 select[multiple] 을 쓰지 않는다(FORM-038).
- 옵션 텍스트는 선택 박스 너비 안에 다 보이는 길이로 쓴다(COPY-030).
- 첫 옵션은 값이 빈 안내 옵션('시·도 선택')으로 두어 아무것도 고르지 않은 상태를 구분한다. 오류는 제출 때 표시한다(FORM-080).
- 커스텀 드롭다운(role=combobox·listbox)을 만들지 않는다. 브라우저 기본 select 로 표현할 수 없는 요구가 있으면 A11Y-036·037·038·040 을 따르는 별도 규격으로 만든다(FORM-039).
- 선명한 화면 모드에서는 테두리 두께 토큰이 굵어진다 — 테두리 두께를 border-width 토큰으로만 지정한다(COLOR-011).
