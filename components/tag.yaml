id: tag
title: 태그
status: confirmed
summary: 사용자가 적용한 필터·정렬 옵션을 짧은 레이블로 보여주고 하나씩 해제하게 하거나, 관련 키워드 화면으로 이동하는 짧은 링크 묶음에 쓴다.
use_instead:
- when: 상호작용 없이 데이터의 분류·속성만 강조하는 경우
  use: 배지
  rule: NAV-052
krds:
  page: component_06_04.html
  kit: html/code/tag.html
  kit_classes:
    tag-group: krds-tag-wrap
    tag: krds-btn-tag
    tag__remove: btn-delete
    tag--link: krds-btn-tag link
anatomy:
- part: 루트(태그 하나)
  class: tag
  element: span(삭제형) 또는 a(링크형)
  required: true
  note: 레이블은 2어절 이내, 한 줄로 쓴다(COPY-031). 한 화면의 태그는 한 가지 색을 기본으로 쓴다(COLOR-019).
- part: 태그 레이블
  class: tag__label
  element: span
  note: 삭제형 태그의 보이는 텍스트.
- part: 삭제 버튼
  class: tag__remove
  element: button
  note: 접근 가능한 이름에 태그 레이블과 동작을 함께 쓴다(예 '서울특별시 필터 삭제'). 24×24px(LAYOUT-002).
- part: 태그 그룹
  class: tag-group
  element: div
  required: true
  note: 태그 목록과 일괄 액션 버튼을 담는다. 한 그룹 안에 삭제형(대화형)과 표시형(비대화형) 태그를 섞지 않는다(FORM-040).
- part: 태그 목록
  class: tag-group__list
  element: ul
  required: true
  note: aria-label 로 목록 이름을 주고 tabindex="-1" 을 둔다 — 마지막 태그를 지웠을 때 초점을 받는다(A11Y-039).
- part: 태그 항목
  class: tag-group__item
  element: li
  required: true
- part: 일괄 액션 버튼
  class: tag-group__clear
  element: button
  note: 그룹 전체에 동작하는 버튼(전체 삭제 등)은 태그 그룹 오른쪽에 둔다(LAYOUT-049).
markup: |-
  <div class="tag-group">
    <ul class="tag-group__list" role="list" id="applied-filters" aria-label="적용한 필터" tabindex="-1">
      <li class="tag-group__item">
        <span class="tag"><span class="tag__label">서울특별시</span><button type="button" class="tag__remove" aria-label="서울특별시 필터 삭제"><svg class="tag__icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"></path></svg></button></span>
      </li>
      <li class="tag-group__item">
        <span class="tag"><span class="tag__label">청년 지원</span><button type="button" class="tag__remove" aria-label="청년 지원 필터 삭제"><svg class="tag__icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M7 7l10 10M17 7L7 17"></path></svg></button></span>
      </li>
    </ul>
    <button type="button" class="tag-group__clear">필터 전체 삭제</button>
  </div>
  <div class="tag-group">
    <ul class="tag-group__list" role="list" aria-label="관련 키워드">
      <li class="tag-group__item"><a class="tag tag--link" href="/search?keyword=%EC%A3%BC%EA%B1%B0">주거</a></li>
      <li class="tag-group__item"><a class="tag tag--link" href="/search?keyword=%EC%B7%A8%EC%97%85">취업</a></li>
    </ul>
  </div>
css: |-
  .tag-group {
    display: flex;
    align-items: flex-start;
    gap: var(--space-gap-4);
  }
  .tag-group__list {
    display: flex;
    flex: 1 1 auto;
    flex-wrap: wrap;
    gap: var(--space-gap-3);
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .tag-group__list:focus-visible {
    outline: var(--space-scale-2) solid var(--color-border-primary);
    outline-offset: var(--space-scale-1);
  }
  .tag {
    display: inline-flex;
    align-items: center;
    gap: var(--space-gap-1);
    min-block-size: var(--size-height-5);
    padding-inline: var(--space-padding-4);
    border: var(--border-width-variable-regular) solid var(--color-border-gray-light);
    border-radius: var(--radius-max);
    background-color: var(--color-action-white);
    color: var(--color-text-basic);
    font-size: var(--font-size-label-small);
    line-height: var(--font-line-height-none);
    white-space: nowrap;
  }
  .tag:has(.tag__remove) {
    padding-inline-end: var(--space-padding-2);
  }
  .tag__remove {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    inline-size: var(--size-height-4);
    block-size: var(--size-height-4);
    padding: 0;
    border-style: none;
    border-radius: var(--radius-max);
    background-color: transparent;
    color: var(--color-icon-gray);
    cursor: pointer;
  }
  .tag__remove:hover {
    background-color: var(--color-action-secondary-hover);
  }
  .tag__remove:active {
    background-color: var(--color-action-secondary-pressed);
  }
  .tag__remove:focus-visible,
  .tag--link:focus-visible,
  .tag-group__clear:focus-visible {
    outline: var(--space-scale-2) solid var(--color-border-primary);
    outline-offset: var(--space-scale-1);
  }
  .tag__icon {
    inline-size: var(--size-height-2);
    block-size: var(--size-height-2);
    fill: none;
    stroke: currentColor;
    stroke-width: 2.5;
  }
  .tag--link {
    text-decoration-line: none;
  }
  .tag--link:hover {
    background-color: var(--color-action-secondary-hover);
    text-decoration-line: underline;
  }
  .tag--link:active {
    background-color: var(--color-action-secondary-pressed);
  }
  .tag-group__clear {
    flex: 0 0 auto;
    min-block-size: var(--size-height-5);
    padding-inline: var(--space-padding-1);
    border-style: none;
    background-color: var(--color-button-text-fill);
    color: var(--color-text-basic);
    font-size: var(--font-size-label-small);
    cursor: pointer;
  }
  .tag-group__clear:hover {
    background-color: var(--color-button-text-fill-hover);
  }
states:
- name: 선택형(토글 필터)
  markup_change: 태그를 button.tag 로 만들고 aria-pressed="true|false" 로 선택 상태를 준다. 선택 상태는 색만이 아니라 체크 아이콘이나 굵기로도 구분한다(COLOR-001,
    A11Y-025).
  rule: A11Y-025
- name: 삭제 후
  markup_change: 해당 li 를 지운다. 초점은 이전 태그의 삭제 버튼으로, 이전 태그가 없으면 다음 태그의 삭제 버튼으로 — 남은 태그가 없으면 목록(ul, tabindex="-1")으로
    옮긴다(A11Y-039).
  rule: A11Y-039
keyboard:
- key: Tab / Shift+Tab
  action: 삭제 버튼·링크 태그·일괄 액션 버튼을 화면 순서대로 지난다(A11Y-015).
- key: Enter / Space
  action: 초점이 있는 삭제 버튼으로 태그를 지운다. 링크 태그는 Enter 로 이동한다.
behavior:
- 태그를 지우면 초점을 이전 태그로, 남은 태그가 없으면 태그 목록 컨테이너로 옮긴다(A11Y-039). 삭제는 클릭(up 이벤트)·키 입력 완료 때 실행한다(A11Y-018).
- 필터 태그를 지우거나 선택을 바꾼 뒤 결과를 즉시 반영하면 초점을 그 태그 자리(위 규칙)에 두고 문서 처음으로 옮기지 않는다(NAV-009).
- 한 그룹 안에 대화형 태그와 비대화형 태그를 섞지 않는다(FORM-040).
- 태그 레이블은 2어절 이내로 쓰고 줄바꿈하지 않는다(COPY-031). 처음에는 꼭 필요한 태그만 둔다(LAYOUT-048).
- 태그 색은 한 가지를 기본으로 쓰고, 색으로만 의미를 전달하지 않는다(COLOR-019, COLOR-001).
- 태그 레이블과 아이콘은 배경과 대비를 지키고(텍스트 4.5:1, 아이콘 3:1), 태그끼리는 테두리로 구분한다(COLOR-002, COLOR-003, LAYOUT-003).
- 일괄 액션 버튼은 태그 그룹 오른쪽에 둔다(LAYOUT-049).
- 사용자가 설정한 필터·정렬 옵션을 보여주고 해제하게 할 때 태그를 쓰고, 상호작용 없는 분류 표시는 배지를 쓴다(NAV-052).
rules:
- A11Y-011
- A11Y-015
- A11Y-016
- A11Y-018
- A11Y-025
- A11Y-039
- COLOR-001
- COLOR-002
