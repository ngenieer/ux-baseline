id: critical-alert
title: 긴급 공지
status: confirmed
summary: 재난·재해, 예고 없는 서비스 장애·이용 중단, 이용 중단 사전 예고처럼 대부분의 사용자가 지금 알아야 하는 상황을 본문 맨 위에 한 줄로 알릴 때 쓴다.
use_instead:
- when: 홍보 콘텐츠, 일반 공지의 전달·강조
  use: 공지 목록·본문 안내 영역
  rule: STATE-006
- when: 입력 검증 결과·완료 상태 같은 피드백 메시지
  use: 인라인 메시지·알림 메시지
  rule: STATE-006
krds:
  page: component_04_02.html
  kit: html/code/critical_alerts.html
  kit_classes:
    critical-alert: main-urgent-wrap krds-critical-alerts
    critical-alert__banner: critical-ban
    critical-alert__level: critical-badge
    critical-alert__text: critical-txt
    critical-alert__link: krds-btn medium link basic
anatomy:
- part: 루트(전체 너비 컨테이너)
  class: critical-alert
  element: section
  required: true
  note: main(본문 영역)의 첫 자식으로 두고 화면 전체 너비를 차지한다(LAYOUT-029). aria-label 로 영역 이름을 준다. 한 화면에 1개만 둔다(COPY-010).
- part: 공지 상자
  class: critical-alert__banner
  element: div
  required: true
  note: 내용은 스크린 마진 안에 둔다. 그림자는 shadow-2 를 쓴다(SHAPE-004).
- part: 긴급도 레이블
  class: critical-alert__level
  element: span
  required: true
  note: 텍스트로 '긴급도 상·중·하' 를 쓴다(STATE-007). 색은 보조 단서다(COLOR-001). 레이블 옆 아이콘을 쓰면 aria-hidden="true" 로 숨긴다(A11Y-001,
    CF-031).
- part: 공지 문장
  class: critical-alert__text
  element: p
  required: true
  note: 1줄로 쓰고 좁은 화면에서만 2줄까지 허용한다(COPY-021).
- part: 상세 링크
  class: critical-alert__link
  element: a
  note: 공지 내용과 직접 관련된 상세 화면 링크 1개 이하(COPY-022). 링크 텍스트만으로 목적지를 알 수 있게 쓴다(COPY-002).
markup: |-
  <section class="critical-alert critical-alert--high" aria-label="긴급 공지">
    <div class="critical-alert__banner">
      <span class="critical-alert__level">긴급도 상</span>
      <p class="critical-alert__text">시스템 장애로 10월 18일 14:00부터 전자 민원 신청이 중단되었습니다.</p>
      <a class="critical-alert__link" href="/notices/outage-20261018">장애 복구 안내 보기</a>
    </div>
  </section>
  <section class="critical-alert critical-alert--medium" aria-label="긴급 공지 (중 예시)">
    <div class="critical-alert__banner">
      <span class="critical-alert__level">긴급도 중</span>
      <p class="critical-alert__text">10월 25일 02:00~06:00에 정기 점검으로 서비스를 이용할 수 없습니다.</p>
      <a class="critical-alert__link" href="/notices/maintenance-20261025">점검 일정 안내 보기</a>
    </div>
  </section>
css: |-
  .critical-alert {
    inline-size: 100%;
    padding-block: var(--space-padding-7);
    padding-inline: var(--space-padding-6);
    background-color: var(--color-surface-gray-subtler);
  }
  @media (min-width: 768px) {
    .critical-alert {
      padding-inline: var(--space-padding-8);
    }
  }
  .critical-alert__banner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-gap-5);
    max-inline-size: var(--layout-content-max);
    margin-inline: auto;
    padding: var(--space-padding-6);
    border: var(--border-width-static-regular) solid var(--color-border-gray-light);
    border-radius: var(--radius-large2);
    background-color: var(--color-surface-white-subtle);
    box-shadow: var(--shadow-2);
  }
  .critical-alert__level {
    display: inline-flex;
    align-items: center;
    min-block-size: var(--size-height-7);
    padding-inline: var(--space-padding-4);
    border-radius: var(--radius-medium2);
    background-color: var(--color-element-information);
    color: var(--color-text-inverse-static);
    font-size: var(--font-size-body-medium);
    font-weight: var(--font-weight-bold);
  }
  .critical-alert--high .critical-alert__level {
    background-color: var(--color-element-danger);
    color: var(--color-text-inverse-static);
  }
  .critical-alert--medium .critical-alert__level {
    background-color: var(--color-element-warning);
    color: var(--color-text-static);
  }
  .critical-alert__text {
    flex: 1 1 0;
    min-inline-size: 0;
    margin: 0;
    color: var(--color-text-basic);
    font-size: var(--font-size-body-medium);
    font-weight: var(--font-weight-bold);
    overflow-wrap: anywhere;
  }
  .critical-alert__link {
    display: inline-flex;
    align-items: center;
    min-block-size: var(--layout-target-min);
    color: var(--color-link-default);
    font-size: var(--font-size-body-medium);
    text-decoration: underline;
  }
  .critical-alert__link:focus-visible {
    outline: var(--space-scale-2) solid var(--color-border-primary);
    outline-offset: var(--space-scale-1);
  }
states:
- name: 긴급도 상
  markup_change: 루트에 critical-alert--high, 레이블 텍스트 '긴급도 상'. 재난·재해 대응, 예고 없는 장애·이용 중단(STATE-007).
  rule: STATE-007
- name: 긴급도 중
  markup_change: 루트에 critical-alert--medium, 레이블 텍스트 '긴급도 중'. 이용 중단 사전 예고(STATE-007).
  rule: STATE-007
- name: 긴급도 하
  markup_change: 변형 클래스 없이 기본(information 색), 레이블 텍스트 '긴급도 하'. 대부분의 사용자가 알아야 하지만 이용에 중대한 영향은 없는 상황(STATE-007).
  rule: STATE-007
keyboard:
- key: Tab
  action: 상세 링크로 초점을 옮긴다. 초점 표시가 보인다(A11Y-016).
behavior:
- 긴급 공지는 메인 메뉴 아래 본문 영역(main)의 첫 요소, 히어로 영역보다 앞에 둔다(LAYOUT-029). 한 화면에 1개만 둔다(COPY-010) — markup 의 두 번째 공지는 긴급도
  '중' 상태를 보이기 위한 예시다.
- 긴급도 상·중·하에 해당하는 내용에만 쓴다. 홍보, 일반 공지 강조, 폼 검증 결과·완료 메시지에 쓰지 않는다(STATE-006).
- 게시 데이터에 종료 일시를 두고, 종료 일시가 지나면 렌더링하지 않는다(STATE-008).
- 닫기·숨기기 버튼이나 접기 기능을 두지 않는다(STATE-009).
- 공지 문장은 가장 넓은 레이아웃에서 1줄, 좁은 화면에서도 2줄 이하로 쓴다(COPY-021). 상세 내용은 링크 1개로 연결한다(COPY-022).
- 링크 텍스트는 목적지를 밝힌다('자세히 보기' 단독 금지). 좁은 화면에서도 링크 텍스트를 숨기지 않는다(COPY-002).
- 컨테이너 배경은 전체 너비로, 공지 상자는 스크린 마진(768px 미만 16px, 이상 24px) 안에 둔다(LAYOUT-004).
- 시각은 24시각제 '14:00' 형식으로 쓴다(COPY-057).
rules:
- A11Y-001
- A11Y-007
- A11Y-016
- COLOR-001
- COLOR-002
- COPY-002
- COPY-010
- COPY-021
- COPY-022
- COPY-057
- LAYOUT-004
- LAYOUT-029
- SHAPE-004
- STATE-006
- STATE-007
- STATE-008
- STATE-009
kit_differences:
- KRDS 키트는 긴급 공지 3개를 한 목록(ul)에 넣는다 — 이 규격은 한 화면에 1개만 둔다(COPY-010).
- KRDS 키트는 좁은 화면에서 링크 텍스트 '자세히 보기' 를 숨겨(m-hide) 아이콘만 남기고, 텍스트도 목적지를 밝히지 않는다 — 이 규격은 목적지를 밝힌 링크 텍스트를 항상 보인다(COPY-002).
- KRDS 키트의 레이블은 '긴급·안전·안내' 이고 '안전(ok)' 은 긴급도 분류에 없다 — 이 규격은 '긴급도 상·중·하' 레이블을 쓴다(STATE-007).
- KRDS 가이드 초안은 긴급 공지 섹션에 role="banner" 를 주라고 한다 — banner 랜드마크는 페이지 머리글용이고 본문(main) 안에 두면 랜드마크 구조가 어긋나므로, 이 규격은 section
  에 aria-label 로 이름을 준다(A11Y-007).
notes:
- 긴급도 '중' 레이블은 경고색 배경(element-warning) 위 흰 글자 대비가 4.5:1 미만이라 어두운 글자(text-static)를 쓴다(COLOR-002).
- 긴급 공지 그림자는 shadow-2 다(SHAPE-004, CF-060).
