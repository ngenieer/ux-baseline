kit_differences:
- KRDS 키트 마크업은 페이지네이션을 빈 div(swiper-pagination)로 두고 스크립트에 맡겨, 식별자의 역할·선택 상태·방향키 이동을 정의하지 않는다 — 이 규격은 tablist·tab·aria-selected
  와 방향키 이동을 쓴다(A11Y-033, A11Y-025).
- KRDS 키트 마크업은 보이지 않는 슬라이드를 초점·스크린 리더에서 빼는 속성(hidden·aria-hidden·tabindex)을 정의하지 않는다 — 이 규격은 현재 슬라이드 외에는 hidden
  으로 숨긴다(A11Y-015).
- KRDS 키트 예시의 슬라이드에는 전체 수·현재 위치를 보조기술에 전달하는 속성이 없다 — 이 규격은 슬라이드에 aria-roledescription="slide" 와 'n / 전체' 이름을 준다(NAV-048,
  A11Y-025).
- KRDS 키트의 '더 보기' 링크(href="#")는 목적지를 밝히지 않는 숨긴 텍스트뿐이다 — 이 규격은 슬라이드마다 목적지를 밝힌 링크를 둔다(COPY-002).
- KRDS 키트 슬라이드 제목의 강제 줄바꿈(br.w-hide)은 쓰지 않는다. 줄 수는 문구 길이로 맞춘다(COPY-026).
notes:
- 규격은 WAI-ARIA APG 의 탭형 캐러셀(Tabbed Carousel) 패턴을 따른다.
- 예시는 h1 아래에 놓인 경우라 슬라이드 제목에 h2 를 쓴다.
