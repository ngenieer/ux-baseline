id: tutorial-panel
title: 따라하기 패널
status: confirmed
summary: 여러 세부 단계나 복잡한 입력이 필요한 작업을 과업·단계 목록으로 안내하고, 코치마크로 화면 위에서 따라 하게 하는 패널이다.
use_instead:
- when: 한두 문장으로 끝나는 간단한 안내
  use: 맥락적 도움말
  rule: COPY-044
- when: 화면 단위 도움말·관련 서비스 안내
  use: 도움 패널
  rule: COPY-043
krds:
  page: component_08_02.html
  kit: html/code/tutorial_panel.html
  kit_classes:
    tutorial-panel: tab-conts(따라하기) help-conts-area-inner
    tutorial-panel__title: help-title
    tutorial-panel__tasks: coach-help-process
    tutorial-panel__task-title: tit
    tutorial-panel__expand: btn-conts-expand
    tutorial-panel__steps: krds-info-list decimal
    tutorial-panel__stop: coach-btn-stop
anatomy:
- part: 루트
  class: tutorial-panel
  element: section
  required: true
  note: 단독으로 쓰거나 도움 패널의 '따라하기' 탭 패널 안에 넣는다. 도움 패널과 함께 쓰면 처음에는 '도움' 탭이 선택된다(NAV-060). 제목 수준은 놓이는 위치에 맞춘다.
- part: 제목
  class: tutorial-panel__title
  element: h2
  required: true
  note: 안내하는 작업 이름(COPY-003).
- part: 과업 목록
  class: tutorial-panel__tasks
  element: ol
  required: true
  note: 과업을 실제 수행 순서대로 나열한다. DOM 순서 = 시각 순서(A11Y-008).
- part: 과업 항목
  class: tutorial-panel__task
  element: li
  required: true
  note: 진행 중인 과업에 tutorial-panel__task--current 와 aria-current="step".
- part: 과업 제목
  class: tutorial-panel__task-title
  element: h3
  required: true
- part: 세부 단계 펼침 버튼
  class: tutorial-panel__expand
  element: button
  required: true
  note: aria-expanded·aria-controls. Enter·Space 로 펼치고 접으며 초점은 버튼에 남는다(A11Y-031).
- part: 세부 단계 목록
  class: tutorial-panel__steps
  element: ol
  required: true
- part: 따라하기 실행 버튼
  class: tutorial-panel__start
  element: button
  required: true
  note: 누르면 그 과업의 코치마크를 시작한다. 같은 레이블이 과업마다 있으므로 aria-describedby 로 과업 제목을 연결한다. 코치마크의 '그만보기'를 누르면 초점이 이 버튼으로 돌아온다(A11Y-052).
- part: 중단 버튼
  class: tutorial-panel__stop
  element: button
  required: true
  note: 레이블 '따라하기 중단하기'. 이 버튼을 누르기 전까지 따라하기 절차를 끝내거나 내용을 바꾸지 않는다(STATE-025).
markup: |-
  <section class="tutorial-panel" aria-labelledby="tutorial-title">
    <h2 class="tutorial-panel__title" id="tutorial-title">이사 전 살던 곳 정보 입력하기</h2>
    <ol class="tutorial-panel__tasks" role="list">
      <li class="tutorial-panel__task tutorial-panel__task--current" aria-current="step">
        <h3 class="tutorial-panel__task-title" id="tutorial-task-1-title">1. 이사 전에 살던 곳 주소 확인 <span class="tutorial-panel__status">(진행 중)</span></h3>
        <button class="tutorial-panel__expand" type="button" aria-expanded="true" aria-controls="tutorial-task-1-steps">세부 단계 2개</button>
        <ol class="tutorial-panel__steps" id="tutorial-task-1-steps">
          <li>주소 조회</li>
          <li>조회 결과 확인</li>
        </ol>
        <button class="tutorial-panel__start" type="button" aria-describedby="tutorial-task-1-title">따라하기 실행</button>
      </li>
      <li class="tutorial-panel__task">
        <h3 class="tutorial-panel__task-title" id="tutorial-task-2-title">2. 이사 갈 가족 구성원 선택</h3>
        <button class="tutorial-panel__expand" type="button" aria-expanded="false" aria-controls="tutorial-task-2-steps">세부 단계 1개</button>
        <ol class="tutorial-panel__steps" id="tutorial-task-2-steps" hidden>
          <li>가족 구성원 선택</li>
        </ol>
        <button class="tutorial-panel__start" type="button" aria-describedby="tutorial-task-2-title">따라하기 실행</button>
      </li>
    </ol>
    <button class="tutorial-panel__stop" type="button">따라하기 중단하기</button>
  </section>
css: |-
  .tutorial-panel {
    display: flex;
    flex-direction: column;
    gap: var(--gap-layout-title-body-small);
    color: var(--color-text-basic);
  }
  .tutorial-panel__title {
    margin: 0;
    color: var(--color-text-bolder);
    font-size: var(--font-size-heading-xsmall);
    font-weight: var(--font-weight-bold);
  }
  .tutorial-panel__tasks {
    display: flex;
    flex-direction: column;
    gap: var(--space-gap-5);
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .tutorial-panel__task {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: var(--space-gap-3);
    padding-block-end: var(--space-padding-6);
    border-block-end: var(--border-width-variable-regular) solid var(--color-divider-gray);
  }
  .tutorial-panel__task-title {
    margin: 0;
    font-size: var(--font-size-body-medium);
    font-weight: var(--font-weight-bold);
  }
  .tutorial-panel__task--current .tutorial-panel__task-title {
    color: var(--color-text-primary);
  }
  .tutorial-panel__status {
    font-weight: var(--font-weight-regular);
  }
  .tutorial-panel__expand,
  .tutorial-panel__start,
  .tutorial-panel__stop {
    min-block-size: var(--size-height-5);
    padding-inline: var(--space-padding-4);
    border: var(--border-width-variable-regular) solid var(--color-button-tertiary-border);
    border-radius: var(--radius-medium1);
    background-color: var(--color-button-tertiary-fill);
    color: var(--color-text-basic);
    font-size: var(--font-size-label-small);
  }
  .tutorial-panel__steps {
    margin: 0;
    padding-inline-start: var(--space-padding-8);
    font-size: var(--font-size-body-small);
    line-height: var(--font-line-height-base);
  }
  .tutorial-panel__stop {
    align-self: stretch;
    min-block-size: var(--size-height-6);
    border-color: var(--color-button-secondary-border);
    background-color: var(--color-button-secondary-fill);
    color: var(--color-text-primary);
    font-size: var(--font-size-label-medium);
  }
  .tutorial-panel__expand:focus-visible,
  .tutorial-panel__start:focus-visible,
  .tutorial-panel__stop:focus-visible {
    outline: var(--space-scale-2) solid var(--color-border-primary);
    outline-offset: var(--space-scale-1);
  }
states:
- name: 세부 단계 펼침
  markup_change: tutorial-panel__expand 의 aria-expanded 를 true 로, tutorial-panel__steps 의 hidden 을 지운다. 초점은 펼침 버튼에
    남는다(A11Y-031).
  rule: A11Y-031
- name: 진행 중 과업
  markup_change: 해당 li 에 tutorial-panel__task--current 와 aria-current="step", 과업 제목에 '(진행 중)' 텍스트. 색 외에 텍스트로도 구분한다.
  rule: COLOR-001
- name: 따라하기 중
  markup_change: 따라하기 실행 버튼을 누르면 코치마크(coach-mark)가 화면에 표시된다. 패널 내용은 '따라하기 중단하기'를 누를 때까지 그대로다(STATE-025).
  rule: STATE-025
keyboard:
- key: Enter / Space
  action: 펼침 버튼에서 세부 단계를 펼치거나 접는다. 초점은 버튼에 남는다(A11Y-031). 따라하기 실행·중단 버튼을 실행한다.
- key: Tab / Shift+Tab
  action: 패널 안의 버튼 사이를 화면 순서대로 이동하고 패널 밖으로 나갈 수 있다(A11Y-012).
behavior:
- 따라하기 패널은 2단계 이상의 순서 있는 절차나 여러 입력 항목을 채우는 작업에만 쓴다(COPY-044).
- 사용자가 '따라하기 중단하기'를 누르기 전까지 다른 조작(다른 링크·버튼 사용, 도움 패널로 전환, 패널 닫기)을 해도 따라하기 절차와 내용을 유지한다(STATE-025).
- 패널을 닫았다 열거나 도움 탭으로 갔다 돌아오면 마지막으로 보던 과업·단계를 표시한다(STATE-024).
- 패널을 닫기 버튼으로 닫으면 초점을 패널을 연 버튼으로 옮긴다(A11Y-050).
- 코치마크의 '그만보기'를 실행하면 코치마크를 숨기고 초점을 그 과업의 '따라하기 실행' 버튼으로 옮긴다(A11Y-052).
- 각 과업·단계 설명은 패널 기본 크기에서 세로 스크롤 없이 보이는 짧은 문장으로 쓴다(COPY-042).
- 패널 안 관련 화면·리소스 링크는 새 탭으로 열고 링크 컴포넌트와 같은 새 창 아이콘(svg, aria-hidden="true")과 링크 안 숨긴 텍스트(.sr-only ' (새 창 열림)')을 넣는다(NAV-013,
  NAV-012, CF-002).
- 도움 패널과 한 패널에서 전환해 제공하면 처음에는 '도움' 탭을 선택한다(NAV-060).
rules:
- A11Y-008
- A11Y-011
- A11Y-012
- A11Y-016
- A11Y-025
- A11Y-031
- A11Y-050
- A11Y-052
- COLOR-001
- COPY-003
- COPY-042
- COPY-044
- LAYOUT-002
- NAV-012
- NAV-013
- NAV-060
- STATE-024
- STATE-025
kit_differences:
- KRDS 키트 따라하기 탭 제목은 href="#;" 링크에 title="이전으로 돌아가기"를 단 형태다 — 이 규격은 제목을 일반 제목으로 두고, 이전 화면 이동이 필요하면 별도 버튼으로 둔다(A11Y-025,
  COPY-003).
- KRDS 키트 펼침 버튼('전체 2단계')에 aria-expanded·aria-controls 가 없다 — 이 규격은 넣는다(A11Y-025, A11Y-031).
- KRDS 키트는 진행 중 과업을 class="current" 색으로만 표시한다 — 이 규격은 aria-current="step" 과 '(진행 중)' 텍스트를 함께 쓴다(COLOR-001, A11Y-025).
- KRDS 키트에는 '따라하기 실행' 버튼이 없지만 KRDS 코치마크 페이지는 '그만보기' 뒤 초점을 따라하기 실행 버튼으로 옮기라고 한다 — 이 규격은 과업마다 실행 버튼을 둔다(A11Y-052).
- KRDS 키트 중단 버튼 레이블은 '그만 따라하기'다 — 이 규격은 STATE-025 의 '중단하기'와 맞춰 '따라하기 중단하기'로 쓴다.
notes:
- 버튼 스타일(보조·중단 버튼)은 KRDS 키트의 tertiary·secondary 버튼 색 토큰을 따랐다.
