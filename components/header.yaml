id: header
title: 헤더
status: confirmed
summary: 모든 페이지 상단에 서비스 아이덴티티(로고), 유틸리티 링크, 검색·로그인·전체 메뉴 같은 기능 버튼, 메인 메뉴를 같은 순서로 반복해 둘 때 쓴다.
use_instead:
- when: 정부 공식 서비스임을 알리는 문구
  use: 공식 배너(masthead) — 헤더 요소 밖, 앞에 둔다
  rule: LAYOUT-013
- when: 본문으로 바로 가는 링크
  use: 건너뛰기 링크(skip-link) — 헤더보다 DOM 앞에 둔다
  rule: NAV-001
- when: 1수준 메뉴와 드롭다운
  use: 메인 메뉴(main-menu) — 헤더 안 header__menu 자리에 넣는다
krds:
  page: component_02_03.html
  kit: html/code/header.html
  kit_classes:
    header: '#krds-header'
    header__inner: header-container inner
    header__logo: header-branding logo
    header__utility: header-utility
    header__utility-list: utility-list
    header__dropdown: drop-menu
    header__actions: header-actions
    header__action: btn-navi
anatomy:
- part: 루트
  class: header
  element: header
  required: true
  note: body 의 직계 자식으로 두면 banner 랜드마크가 된다. 건너뛰기 링크·공식 배너 다음에 둔다.
- part: 안쪽 영역
  class: header__inner
  element: div
  required: true
  note: 본문 콘텐츠 최대 너비에 맞춘 flex 줄. 넓은 화면에서는 로고 · 기능 버튼 · 유틸리티 링크를 한 줄에 두어 유틸리티 링크가 첫 행 오른쪽 끝에 온다. 좁은 화면에서는 로고 · 기능 버튼 아래 줄로 유틸리티 링크가 내려간다. 두 경우 모두 DOM 순서와 화면 순서가 같다(A11Y-008).
- part: 서비스 아이덴티티(로고 링크)
  class: header__logo
  element: a
  required: true
  note: 메인 화면으로 가는 링크. 안의 img alt 는 서비스 이름이고 '로고'라는 단어를 넣지 않는다(A11Y-027). DOM 에서 헤더의 첫 요소다(LAYOUT-011).
- part: 로고 이미지
  class: header__logo-image
  element: img
  required: true
  note: width·height 속성으로 공간을 예약한다(PERF-009).
- part: 유틸리티 링크 그룹
  class: header__utility
  element: nav
  required: true
  note: aria-label 로 다른 nav 와 구분한다. 펼쳐 보이는 링크는 4개 이하, 5번째부터는 드롭다운에 넣는다(NAV-016).
- part: 유틸리티 목록
  class: header__utility-list
  element: ul
  required: true
- part: 유틸리티 항목
  class: header__utility-item
  element: li
  required: true
  note: 이웃 항목 사이의 디바이더는 CSS 의사 요소로 그려 보조기술에 읽히지 않는다(NAV-015).
- part: 유틸리티 링크·드롭다운 버튼
  class: header__utility-link
  element: a / button
  required: true
- part: 드롭다운 목록
  class: header__dropdown
  element: ul
  note: 버튼 바로 다음에 두고(A11Y-008) 닫혀 있으면 hidden 속성으로 숨긴다(A11Y-015). WAI-ARIA APG 디스클로저 패턴(버튼 + aria-expanded + aria-controls)을 쓴다.
- part: 드롭다운 링크
  class: header__dropdown-link
  element: a
- part: 기능 버튼 그룹
  class: header__actions
  element: div
  required: true
- part: 기능 버튼·링크
  class: header__action
  element: button / a
  required: true
  note: 보이는 텍스트 레이블을 함께 둔다. 텍스트를 생략할 수 있는 것은 검색·로그인뿐이다(COPY-016).
- part: 메인 메뉴 자리
  class: header__menu
  element: div
  required: true
  note: 메인 메뉴(main-menu 규격)의 nav 를 이 안에 넣는다. 헤더 규격은 메인 메뉴 마크업을 정의하지 않는다.
markup: |-
  <header class="header">
    <div class="header__inner">
      <a class="header__logo" href="/">
        <img class="header__logo-image" src="/images/service-logo.svg" alt="국민복지 안내 누리집" width="160" height="40">
      </a>
      <div class="header__actions">
        <button type="button" class="header__action" aria-haspopup="dialog">통합검색</button>
        <a class="header__action" href="/login">로그인</a>
        <button type="button" class="header__action header__action--menu" aria-expanded="false">전체 메뉴</button>
      </div>
      <nav class="header__utility" aria-label="유틸리티 메뉴">
        <ul class="header__utility-list">
          <li class="header__utility-item"><a class="header__utility-link" href="/sitemap">사이트맵</a></li>
          <li class="header__utility-item"><a class="header__utility-link" href="/en" lang="en" hreflang="en">English</a></li>
          <li class="header__utility-item">
            <button type="button" class="header__utility-link" aria-expanded="true" aria-controls="header-related-sites">관련 누리집</button>
            <ul class="header__dropdown" id="header-related-sites">
              <li><a class="header__dropdown-link" href="https://www.gov.kr/">정부24</a></li>
              <li><a class="header__dropdown-link" href="https://www.bokjiro.go.kr/">복지로</a></li>
            </ul>
          </li>
        </ul>
      </nav>
    </div>
    <div class="header__menu">
      <!-- 메인 메뉴(main-menu 규격)의 nav 가 여기 들어간다 -->
    </div>
  </header>
css: |-
  .header {
    border-block-end: var(--border-width-static-regular) solid var(--color-divider-gray-light);
    background-color: var(--color-surface-white);
  }
  .header--sticky {
    position: sticky;
    inset-block-start: 0;
    z-index: 10;
  }
  .header__inner {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-gap-3);
    max-inline-size: var(--layout-content-max);
    margin-inline: auto;
    padding-block: var(--space-padding-3);
    padding-inline: var(--layout-screen-margin-small);
  }
  .header__logo {
    display: inline-flex;
    align-items: center;
    border-radius: var(--radius-small1);
  }
  .header__logo-image {
    inline-size: auto;
    block-size: var(--size-height-5);
  }
  .header__utility {
    flex-basis: 100%;
  }
  .header__utility-list {
    display: flex;
    align-items: center;
    gap: var(--space-gap-3);
  }
  .header__utility-item {
    position: relative;
    display: flex;
    align-items: center;
    gap: var(--space-gap-3);
  }
  .header__utility-item + .header__utility-item::before {
    content: "";
    inline-size: var(--border-width-static-regular);
    block-size: var(--space-scale-7);
    background-color: var(--color-divider-gray-light);
  }
  .header__utility-link {
    display: inline-flex;
    align-items: center;
    min-block-size: var(--layout-target-min);
    padding-inline: var(--space-padding-1);
    border: 0;
    border-radius: var(--radius-small1);
    background-color: transparent;
    color: var(--color-text-basic);
    font-size: var(--font-size-label-small);
  }
  .header__utility-link:hover {
    background-color: var(--color-action-secondary-hover);
  }
  .header__dropdown {
    position: absolute;
    inset-block-start: 100%;
    inset-inline-end: 0;
    z-index: 20;
    min-inline-size: 100%;
    padding: var(--space-padding-3);
    border: var(--border-width-static-regular) solid var(--color-border-gray-light);
    border-radius: var(--radius-medium1);
    background-color: var(--color-surface-white);
    box-shadow: var(--shadow-2);
  }
  .header__dropdown-link {
    display: flex;
    align-items: center;
    min-block-size: var(--size-height-4);
    padding-inline: var(--space-padding-3);
    border-radius: var(--radius-small1);
    color: var(--color-text-basic);
    font-size: var(--font-size-label-small);
    white-space: nowrap;
  }
  .header__dropdown-link:hover {
    background-color: var(--color-action-secondary-hover);
  }
  .header__actions {
    display: flex;
    margin-inline-start: auto;
    justify-content: flex-end;
    align-items: center;
    gap: var(--space-gap-1);
  }
  .header__action {
    display: inline-flex;
    align-items: center;
    min-block-size: var(--size-height-6);
    padding-inline: var(--space-padding-3);
    border: 0;
    border-radius: var(--radius-medium1);
    background-color: transparent;
    color: var(--color-text-basic);
    font-size: var(--font-size-navigation-depth-small-bold);
    font-weight: var(--font-weight-bold);
  }
  .header__action:hover {
    background-color: var(--color-action-secondary-hover);
  }
  .header__action:active {
    background-color: var(--color-action-secondary-pressed);
  }
  .header__logo:focus-visible,
  .header__utility-link:focus-visible,
  .header__dropdown-link:focus-visible,
  .header__action:focus-visible {
    outline: var(--space-scale-2) solid var(--color-border-primary);
    outline-offset: var(--space-scale-1);
  }
  @media (min-width: 768px) {
    .header__inner {
      padding-inline: var(--layout-screen-margin-medium);
    }
  }
  @media (min-width: 1024px) {
    .header__logo-image {
      block-size: var(--size-height-7);
    }
    .header__utility {
      flex-basis: auto;
    }
    .header__action {
      font-size: var(--font-size-navigation-depth-medium-bold);
    }
    .header__action--menu {
      display: none;
    }
  }
states:
- name: 상단 고정
  markup_change: 루트에 header--sticky. 공식 배너는 헤더 밖에 있어 고정되지 않는다. 문서 루트에 scroll-padding-top 을 헤더 높이 이상으로 주어 초점 요소가 헤더에 가려지지 않게 한다(LAYOUT-013, LAYOUT-001).
  rule: LAYOUT-013
- name: 드롭다운 열림
  markup_change: 드롭다운 버튼 aria-expanded="true", 드롭다운 목록의 hidden 속성 제거. 닫히면 aria-expanded="false" 와 hidden 을 되돌린다(A11Y-025).
  rule: A11Y-025
- name: 좁은 화면(1024px 미만)
  markup_change: 마크업 변화 없음. 유틸리티 링크 그룹이 로고·기능 버튼 아래 줄로 내려가고, '전체 메뉴' 버튼이 보인다. 버튼은 메인 메뉴 레이어를 여닫는다(RESP-005).
  rule: RESP-005
keyboard:
- key: Tab
  action: 로고 → 기능 버튼 → 유틸리티 링크 → 메인 메뉴 순서로 초점이 이동한다. 닫힌 드롭다운 안의 링크에는 초점이 가지 않는다(A11Y-015).
- key: Enter / Space
  action: 드롭다운 버튼에서 목록을 열고 닫는다. 기능 버튼을 실행한다.
- key: Esc
  action: 열린 드롭다운을 닫고 초점을 그 드롭다운 버튼으로 옮긴다(A11Y-040).
behavior:
- 헤더의 DOM 순서는 서비스 아이덴티티(로고) → 기능 버튼 → 유틸리티 링크 → 메인 메뉴이고 화면 순서(왼쪽→오른쪽, 위→아래)와 같으며, 모든 페이지에서 같다(LAYOUT-011, NAV-004, A11Y-008).
- 헤더에는 서비스 아이덴티티·유틸리티 링크·검색·로그인·전체 메뉴·메인 메뉴만 두고 꾸밈 요소·부가 정보를 넣지 않는다(LAYOUT-012).
- 유틸리티 링크 그룹은 넓은 화면에서 첫 행 오른쪽 끝에 두고(좁은 화면에서는 둘째 줄로 내려가며 숨기지 않는다), 펼쳐 보이는 링크는 4개 이하다. 5번째 링크부터는 aria-expanded 버튼으로 여닫는 드롭다운에 넣는다(NAV-015, NAV-016).
- 드롭다운이 열린 상태에서 버튼·목록 밖을 클릭하면 닫고 aria-expanded="false" 로 바꾼다. Esc 로 닫으면 초점을 드롭다운 버튼으로 옮긴다(A11Y-040, A11Y-025).
- 드롭다운은 호버·초점만으로 열지 않고 클릭·Enter·Space 로만 연다. 호버로 여는 변형을 만들면 Esc 닫기·포인터 이동 유지·시간 제한 없음을 지킨다(A11Y-010, A11Y-011).
- 언어 변경 링크는 국기 없이 그 언어의 이름(English)을 쓰고, 그 언어로 lang 속성을 준다(COPY-015, A11Y-023).
- 기능 버튼·링크에는 보이는 텍스트를 둔다. 아이콘을 함께 쓰면 장식으로 aria-hidden 처리하고, 텍스트를 생략할 수 있는 것은 검색·로그인뿐이다(COPY-016, A11Y-001).
- 전체 메뉴 버튼은 메인 메뉴 레이어를 여닫고, 열림 상태를 aria-expanded 로, 대상을 aria-controls(메인 메뉴 nav 의 id)로 알린다(RESP-005, A11Y-025). 1수준 항목이 한 줄에 다 들어가는 너비에서는 버튼을 숨기고 메뉴 막대를 펼친다(RESP-007).
- 헤더를 상단에 고정할 때는 공식 배너를 뺀 헤더 전체를 고정하고, 고정 헤더가 초점 받은 요소를 완전히 가리지 않게 문서 루트에 scroll-padding-top 을 준다(LAYOUT-013, LAYOUT-001).
- 기능 버튼·링크·유틸리티 링크의 포인터 대상은 24×24 CSS px 이상이다(LAYOUT-002).
- 같은 기능의 버튼은 모든 페이지에서 같은 레이블('통합검색', '로그인', '전체 메뉴')을 쓴다(COPY-004).
- 헤더 앞에는 건너뛰기 링크와 공식 배너가 온다(NAV-001, LAYOUT-009).
