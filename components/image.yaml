id: image
title: 이미지
status: confirmed
summary: 사진·그림·도식처럼 내용 이해를 돕는 이미지를 본문에 넣을 때 쓴다. 캡션과 AI 생성 표시를 함께 다룬다.
use_instead:
- when: CSS 로 같은 시각 표현을 낼 수 있는 글자(제목·안내 문구·버튼 문구)
  use: 실제 텍스트
  rule: TYPO-001
- when: 여러 이미지를 차례로 넘겨 보여 주는 경우
  use: carousel
krds:
  page: component_04_08.html
anatomy:
- part: 루트
  class: image
  element: figure
  required: true
  note: 캡션이 없으면 figure 대신 img 하나만 써도 된다. 링크·버튼이 아니면 tabindex·click 핸들러·cursor:pointer 를 주지 않는다(A11Y-032).
- part: 이미지 틀
  class: image__frame
  element: div
  required: true
  note: AI 생성 표시처럼 이미지 위에 겹치는 요소의 기준 위치다.
- part: 이미지
  class: image__media
  element: img
  required: true
  note: alt 를 반드시 쓴다 — 정보 이미지는 이미지가 전하는 정보를, 장식 이미지는 alt=""(A11Y-001). width·height 속성으로 공간을 예약한다(PERF-009).
- part: 캡션
  class: image__caption
  element: figcaption
  note: 출처·설명을 쓴다. 캡션과 alt 에 같은 문장을 되풀이하지 않는다(A11Y-001).
- part: AI 생성 표시
  class: image__ai-label
  element: span
  note: 생성형 AI 결과 이미지에 이미지 위에 겹쳐 보이는 텍스트로 붙인다(AI-002, AI-004).
markup: |-
  <figure class="image">
    <div class="image__frame">
      <img class="image__media" src="/images/riverside-trail-2025.jpg" alt="강변 산책로를 따라 벚꽃이 핀 모습" width="1200" height="800">
    </div>
    <figcaption class="image__caption">시립 강변공원 산책로 (2025년 4월 촬영)</figcaption>
  </figure>
  <figure class="image" data-ai-output>
    <div class="image__frame">
      <img class="image__media" src="/images/ai/park-plan-draft.png" alt="공원 재정비 계획안을 그린 조감도. 중앙 잔디 광장을 둘러싼 산책로와 북쪽 어린이 놀이터" width="1024" height="768" loading="lazy">
      <span class="image__ai-label">AI 생성 이미지</span>
    </div>
    <figcaption class="image__caption">공원 재정비 계획 이해를 돕기 위해 생성형 AI로 만든 조감도이며 실제 설계도가 아닙니다.</figcaption>
  </figure>
css: |-
  .image {
    margin: 0;
  }
  .image__frame {
    position: relative;
  }
  .image__media {
    display: block;
    max-width: 100%;
    height: auto;
    border-radius: var(--radius-large1);
  }
  .image__caption {
    margin-block-start: var(--gap-layout-image-text-small);
    color: var(--color-text-subtle);
    font-size: var(--font-size-body-small);
  }
  .image__ai-label {
    position: absolute;
    inset-block-start: var(--space-scale-5);
    inset-inline-start: var(--space-scale-5);
    padding-block: var(--space-padding-1);
    padding-inline: var(--space-padding-3);
    border-radius: var(--radius-small2);
    background-color: var(--color-surface-inverse-static);
    color: var(--color-text-inverse-static);
    font-size: var(--font-size-label-small);
    font-weight: var(--font-weight-bold);
  }
states:
- name: 장식 이미지
  markup_change: alt="" 를 쓰고 캡션을 두지 않는다. 바로 옆 텍스트가 같은 정보를 전하는 이미지도 장식으로 처리한다(A11Y-001).
  rule: A11Y-001
- name: AI 생성 이미지
  markup_change: figure 에 data-ai-output, 이미지 틀 안에 image__ai-label('AI 생성 이미지')을 넣는다. 실제와 구분하기 어려운 이미지(딥페이크)는 이 표시를 반드시 이미지 위에 보인다(AI-002, AI-004).
  rule: AI-004
- name: 첫 화면 밖 이미지
  markup_change: 페이지 로드 시 뷰포트 밖에 있는 이미지만 loading="lazy" 를 붙인다(PERF-013).
  rule: PERF-013
behavior:
- 모든 img 에 alt 를 쓴다. 대체 텍스트에 '이미지'·'사진' 같은 역할 중복어, 제작자 정보, 인접 텍스트와 같은 설명, 이미지에 없는 정보를 넣지 않는다(A11Y-001).
- 글자를 이미지로 만들지 않는다. 로고·브랜드명만 예외다(TYPO-001). 이미지 위에 텍스트를 올리면 별도 배경을 깔아 4.5:1 대비를 확보한다(COLOR-002).
- 링크·버튼이 아닌 이미지는 초점을 받거나 클릭에 반응하지 않는다(A11Y-032). 링크·버튼 안 이미지는 그 기능과 맞는 상징을 쓴다(COPY-025).
- 모든 img 에 width·height 속성을 쓰고 CSS 는 max-width:100%·height:auto 로 크기를 조정한다(PERF-009).
- loading="lazy" 는 첫 화면 밖 이미지에만 쓰고, LCP 후보 이미지는 초기 HTML 의 img src 로 넣으며 data-src 지연 로딩을 쓰지 않는다. fetchpriority="high" 는 페이지당 2개 이하(PERF-013, PERF-014).
- 확대 보기를 제공하면 핀치 외에 확대·축소 버튼을 함께 둔다(A11Y-017).
- 모바일 레이아웃(1024px 미만)에서는 의미 없는 이미지를 빼고, 남긴 이미지는 화면 너비에 맞게 줄이거나 잘라 쓴다(RESP-012).
- 생성형 AI 결과 이미지는 화면에서 'AI 생성' 표시를 결과물 안이나 바로 옆에 보이고(AI-002), 실제와 구분하기 어려운 이미지는 이미지 위에 보이는 표시를 쓰며 메타데이터만으로 대신하지 않는다(AI-004).
rules:
- A11Y-001
- A11Y-017
- A11Y-032
- AI-002
- AI-004
- COLOR-002
- COPY-025
- PERF-009
- PERF-013
- PERF-014
- RESP-012
- TYPO-001
notes:
- KRDS HTML 키트 v1.1.0 에는 이미지 컴포넌트 마크업 파일이 없어 KRDS 이미지 페이지(component_04_08)와 확정 룰로 작성했다.
- AI 생성 표시는 화면 표시용이다. 다운로드·공유로 서비스 밖에 내보낼 때는 결과물 자체에 표시를 넣는다(AI-003).
- 예시의 이미지 경로와 장소 설명은 마크업 형식을 보이기 위한 가상 예시다.
